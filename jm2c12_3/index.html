<head>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;700&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Noto Sans SC', sans-serif;
            background-color: #03030c;
            color: white;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
        }

        /* 玻璃拟态 UI */
        .glass-panel {
            background: rgba(10, 15, 30, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* 自定义滚动条 */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02); 
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15); 
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3); 
        }

        .fade-in {
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 防盗版水印样式：低调，与底色接近 */
        .watermark-footer {
            position: fixed;
            bottom: 6px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 9px;
            color: rgba(30, 35, 60, 0.85);
            letter-spacing: 0.05em;
            z-index: 1;
            pointer-events: none;
            user-select: none;
            white-space: nowrap;
        }
    </style>
</head>

// 全局状态
const state = {
    activeKey: null,
    processedStars: [],
    processedLines: [],
    bgStars: [],
    hoveredStar: null,
    showLines: true
};

// Canvas 配置
const canvas = document.getElementById('starCanvas');
const ctx = canvas.getContext('2d');
const tooltip = document.getElementById('tooltip');

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    if(state.activeKey) {
        processConstellation(state.activeKey);
    }
    generateBgStars();
    draw();

/**
 * 核心投影转换算法 (带0°跨度修正、余弦天区形变补正、比例保真)
 * //峇株吧辖蔡逸众制作
 */
function processConstellation(key) {
    const data = CONSTELLATIONS[key];
    const starsObj = data.stars;
    const linesArr = data.lines;

    let minRA = Infinity, maxRA = -Infinity;
    let minDec = Infinity, maxDec = -Infinity;

    // 1. 跨零度子午线探测与自动转换
    const raVals = Object.values(starsObj).map(s => s.ra);
    const raSpread = Math.max(...raVals) - Math.min(...raVals);
    const wrapRA = raSpread > 180;

    // 2. 寻找极值边界
    for (const id in starsObj) {
        const s = starsObj[id];
        let ra = s.ra;
        if (wrapRA && ra < 180) {
            ra += 360;
        }

        if (ra < minRA) minRA = ra;
        if (ra > maxRA) maxRA = ra;
        if (s.dec < minDec) minDec = s.dec;
        if (s.dec > maxDec) maxDec = s.dec;
    }

    const raRange = maxRA - minRA || 1;
    const decRange = maxDec - minDec || 1;
    const avgDec = (minDec + maxDec) / 2;
    
    // 3. 采用余弦定理补正天球投影拉伸 (RA scale = cos(dec))
    const raScale = Math.cos(avgDec * Math.PI / 180);
    const trueWidth = raRange * raScale;
    const trueHeight = decRange;
    const maxDim = Math.max(trueWidth, trueHeight);

    // 4. 等比例适配屏幕 (预留 25% 安全边距提供深邃感)
    const paddingX = canvas.width * 0.25;
    const paddingY = canvas.height * 0.25;
    const drawAreaW = canvas.width - paddingX * 2;
    const drawAreaH = canvas.height - paddingY * 2;
    const scale = Math.min(drawAreaW / trueWidth, drawAreaH / trueHeight);
    
    const offsetX = (canvas.width - trueWidth * scale) / 2;
    const offsetY = (canvas.height - trueHeight * scale) / 2;

    state.processedStars = [];
    
    for (const id in starsObj) {
        const s = starsObj[id];
        
        let ra = s.ra;
        if (wrapRA && ra < 180) ra += 360;
        
        const raOffset = (maxRA - ra) * raScale;
        const decOffset = (maxDec - s.dec);

        // 归一化 X Y 坐标 (0.00 ~ 1.00)
        const normX = (raOffset + (maxDim - trueWidth) / 2) / maxDim;
        const normY = (decOffset + (maxDim - trueHeight) / 2) / maxDim;

        // 计算恒星视觉半径 (视星等越小，能量越强，圆越饱满)
        const radius = Math.max(1.8, (6.0 - s.mag) * 2.2);

        state.processedStars.push({
            id: id,
            ...s,
            normX: normX,
            normY: normY,
            x: offsetX + raOffset * scale,
            y: offsetY + decOffset * scale,
            r: radius,
            color: SPECTRAL_COLORS[s.spec] || '#ffffff'
        });
    }

    // 重构连线
    state.processedLines = linesArr.map(line => {
        return [
            state.processedStars.find(s => s.id === line[0]),
            state.processedStars.find(s => s.id === line[1])
        ];
    });

    updateUI(data);
    draw();
}

/**
 * 离屏缓冲微弱背景乱星，增强太空纵深感
 */
function generateBgStars() {
    state.bgStars = [];
    const count = Math.floor((canvas.width * canvas.height) / 3000);
    for (let i = 0; i < count; i++) {
        state.bgStars.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            r: Math.random() * 1.2,
            opacity: Math.random() * 0.4 + 0.05
        });
    }
}

/**
 * 渲染系统
 * //华仁中学蔡逸众制作
 */
function draw() {
    // 清屏与基底
    ctx.fillStyle = '#020208';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 绘制深空紫蓝色发光星云
    const bgGradient = ctx.createRadialGradient(
        canvas.width/2, canvas.height/2, 0, 
        canvas.width/2, canvas.height/2, Math.max(canvas.width, canvas.height)/1.1
    );
    bgGradient.addColorStop(0, '#0a0d24');
    bgGradient.addColorStop(0.5, '#040512');
    bgGradient.addColorStop(1, '#000000');
    ctx.fillStyle = bgGradient;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 渲染遥远的背景恒星
    state.bgStars.forEach(s => {
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(235, 240, 255, ${s.opacity})`;
        ctx.fill();
    });

    if (!state.activeKey) return;

    // 绘制星座星骨（如果开启了显示连线）
    if (state.showLines) {
        ctx.lineWidth = 1.2;
        ctx.shadowBlur = 8;
        ctx.shadowColor = 'rgba(100, 140, 255, 0.3)';
        state.processedLines.forEach(line => {
            if (!line[0] || !line[1]) return;
            ctx.beginPath();
            ctx.moveTo(line[0].x, line[0].y);
            ctx.lineTo(line[1].x, line[1].y);
            
            const grad = ctx.createLinearGradient(line[0].x, line[0].y, line[1].x, line[1].y);
            const opacity = 0.3;
            grad.addColorStop(0, `rgba(${hexToRgb(line[0].color)}, ${opacity})`);
            grad.addColorStop(1, `rgba(${hexToRgb(line[1].color)}, ${opacity})`);
            
            ctx.strokeStyle = grad;
            ctx.stroke();
        });
        ctx.shadowBlur = 0;
    }

    // 绘制实体星座主星
    state.processedStars.forEach(s => {
        const isHovered = state.hoveredStar && state.hoveredStar.id === s.id;
        const currentR = isHovered ? s.r * 1.4 : s.r;

        // 星团发光特效
        const glow = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, currentR * (s.mag < 2.0 ? 5 : 3.5));
        glow.addColorStop(0, s.color);
        glow.addColorStop(0.25, `rgba(${hexToRgb(s.color)}, ${s.mag < 2.0 ? 0.45 : 0.25})`);
        glow.addColorStop(1, 'transparent');
        ctx.beginPath();
        ctx.arc(s.x, s.y, currentR * (s.mag < 2.0 ? 5 : 3.5), 0, Math.PI * 2);
        ctx.fillStyle = glow;
        ctx.fill();

        // 恒星耀眼核心
        ctx.beginPath();
        ctx.arc(s.x, s.y, currentR, 0, Math.PI * 2);
        ctx.fillStyle = s.mag < 2.0 ? '#ffffff' : `rgba(255, 255, 255, 0.9)`;
        ctx.fill();

        // 绘制星名标签
        if (s.mag < 4.2 || isHovered) {
            ctx.font = isHovered ? "bold 13px 'Noto Sans SC'" : "11px 'Noto Sans SC'";
            ctx.fillStyle = isHovered ? '#ffffff' : 'rgba(255, 255, 255, 0.45)';
            ctx.fillText(s.name.split(' ')[0], s.x + currentR + 7, s.y + 4);
        }
    });

    // 在Canvas上绘制隐形水印（与背景高度融合）
    // //Made by ecchua79
    ctx.save();
    ctx.globalAlpha = 0.03;
    ctx.fillStyle = '#8899cc';
    ctx.font = "10px monospace";
    ctx.fillText('ecchua79 | 峇株吧辖华仁中学', 12, canvas.height - 10);
    ctx.restore();
}

/**
 * 辅助函数：十六进制色值转RGB
 */
function hexToRgb(hex) {
    const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
    return result ? 
        `${parseInt(result[1], 16)}, ${parseInt(result[2], 16)}, ${parseInt(result[3], 16)}` : 
        '255, 255, 255';
}

/**
 * 生成星座选择列表并显示日期范围
 */
function initUI() {
    const navBtnContainer = document.getElementById('nav-buttons');
    
    Object.keys(CONSTELLATIONS).forEach(key => {
        const item = CONSTELLATIONS[key];
        const btn = document.createElement('button');
        
        btn.className = 'w-full text-left px-3 py-2 rounded-lg border border-slate-800 hover:border-blue-500/50 hover:bg-blue-500/10 transition-all duration-300 text-slate-300 flex flex-col gap-0.5';
        btn.innerHTML = `
            <span class="text-xs font-semibold text-slate-200 truncate w-full">${item.name}</span>
            <span class="text-[10px] text-slate-400 font-medium tracking-wide">${item.date}</span>
        `;
        
        btn.onclick = () => {
            document.querySelectorAll('#nav-buttons button').forEach(b => {
                b.classList.remove('bg-blue-600/20', 'border-blue-400', 'text-white');
                b.classList.add('border-slate-800', 'text-slate-300');
            });
            btn.classList.add('bg-blue-600/20', 'border-blue-400', 'text-white');
            btn.classList.remove('border-slate-800', 'text-slate-300');
            
            state.activeKey = key;
            processConstellation(key);
            document.getElementById('info-panel').classList.remove('hidden');
        };
        navBtnContainer.appendChild(btn);
    });

    // 绑定隐藏/显示连线的 Switch 按钮
    const toggleBtn = document.getElementById('toggle-lines-btn');
    const toggleDot = document.getElementById('toggle-switch-dot');

    toggleBtn.onclick = () => {
        state.showLines = !state.showLines;
        if (state.showLines) {
            toggleBtn.classList.remove('bg-slate-700');
            toggleBtn.classList.add('bg-blue-600');
            toggleDot.classList.remove('translate-x-0');
            toggleDot.classList.add('translate-x-5');
        } else {
            toggleBtn.classList.remove('bg-blue-600');
            toggleBtn.classList.add('bg-slate-700');
            toggleDot.classList.remove('translate-x-5');
            toggleDot.classList.add('translate-x-0');
        }
        draw();
    };
}

/**
 * 重新加载数据侧边面板列表
 */
function updateUI(data) {
    document.getElementById('info-title').innerText = data.name.split(' ')[1] || data.name;
    
    const count = Object.keys(data.stars).length;
    document.getElementById('star-count-badge').innerText = `${count} 颗恒星`;

    const list = document.getElementById('stars-list');
    list.innerHTML = '';

    const sortedStars = [...state.processedStars].sort((a, b) => a.mag - b.mag);

    sortedStars.forEach(s => {
        const item = document.createElement('div');
        item.className = 'p-2 rounded-lg bg-slate-900/40 border border-slate-800 text-xs hover:bg-slate-800/40 transition-colors cursor-pointer flex justify-between items-center';
        
        const isMinor = s.mag >= 3.8;
        const badgeHTML = isMinor ? `<span class="ml-1.5 text-[8px] bg-slate-700/50 text-slate-400 px-1 rounded">暗星</span>` : '';

        item.innerHTML = `
            <div class="flex items-center gap-2 truncate">
                <div class="w-2.5 h-2.5 rounded-full shadow-[0_0_6px_currentColor] flex-shrink-0" style="background-color: ${s.color}; color: ${s.color}"></div>
                <span class="font-semibold text-slate-200 truncate">${s.name.split(' ')[0]}</span>
                ${badgeHTML}
            </div>
            <div class="text-right text-[11px] flex-shrink-0 ml-1">
                <span class="text-slate-400">星等: <span class="text-yellow-300 font-mono">${s.mag.toFixed(2)}</span></span>
            </div>
        `;
        
        item.onmouseenter = () => highlightStar(s);
        item.onmouseleave = () => highlightStar(null);
        
        list.appendChild(item);
    });
}

/**
 * 碰撞检测鼠标悬停事件
 */
canvas.addEventListener('mousemove', (e) => {
    if (!state.activeKey) return;
    const rect = canvas.getBoundingClientRect();
    const mouseX = e.clientX - rect.left;
    const mouseY = e.clientY - rect.top;

    let found = null;
    for (let i = 0; i < state.processedStars.length; i++) {
        const s = state.processedStars[i];
        const dx = mouseX - s.x;
        const dy = mouseY - s.y;
        const hoverRange = Math.max(12, s.r * 2.5);
        if (dx * dx + dy * dy < hoverRange * hoverRange) {
            found = s;
            break;
        }
    }

    highlightStar(found, mouseX, mouseY);
});

function highlightStar(star, mouseX, mouseY) {
    state.hoveredStar = star;
    
    if (star) {
        document.getElementById('tt-name').innerText = star.name;
        document.getElementById('tt-ra').innerText = `${star.ra.toFixed(2)}°`;
        document.getElementById('tt-dec').innerText = `${star.dec.toFixed(2)}°`;
        document.getElementById('tt-mag').innerText = star.mag.toFixed(2);
        document.getElementById('tt-spec').innerText = star.spec;
        document.getElementById('tt-x').innerText = star.normX.toFixed(4);
        document.getElementById('tt-y').innerText = star.normY.toFixed(4);

        const x = mouseX || star.x;
        const y = mouseY || star.y;

        tooltip.style.left = `${x}px`;
        tooltip.style.top = `${y - 15}px`;
        tooltip.style.opacity = '1';
        canvas.style.cursor = 'crosshair';
    } else {
        tooltip.style.opacity = '0';
        canvas.style.cursor = 'default';
    }
    draw();
}

// 启动程序
initUI();
resizeCanvas();

document.querySelector('#nav-buttons button').click();

</script>
