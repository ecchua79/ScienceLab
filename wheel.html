<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>华仁中学E化系统 - 抽人轮盘</title>
<style>
    :root {
        --bg-950: #020617;
        --bg-900: #0f172a;
        --bg-800: #1e293b;
        --border: #1e293b;
        --indigo: #6366f1;
        --indigo-dark: #4f46e5;
        --purple: #a855f7;
        --pink: #ec4899;
        --amber: #f59e0b;
        --rose: #f43f5e;
        --emerald: #10b981;
        --text: #f1f5f9;
        --text-dim: #94a3b8;
        --text-dimmer: #64748b;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        background: var(--bg-950);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }
    @keyframes pulse-subtle {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.03); }
    }
    .pulse { animation: pulse-subtle 2s infinite ease-in-out; }

    /* Header */
    header {
        border-bottom: 1px solid var(--border);
        background: rgba(15, 23, 42, 0.7);
        backdrop-filter: blur(10px);
        padding: 14px 18px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: sticky;
        top: 0;
        z-index: 30;
    }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .logo-box {
        padding: 9px 10px;
        background: linear-gradient(135deg, var(--indigo), var(--purple));
        border-radius: 12px;
        font-size: 18px;
        box-shadow: 0 4px 16px rgba(99,102,241,0.3);
    }
    .title {
        font-size: 16px;
        font-weight: 800;
        margin: 0;
        background: linear-gradient(90deg, #a5b4fc, #d8b4fe, #f9a8d4);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
    }
    .subtitle { font-size: 11px; color: var(--text-dimmer); margin: 2px 0 0; }
    .badge {
        padding: 5px 12px;
        background: #1e1b4b;
        color: #a5b4fc;
        border: 1px solid #3730a3;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 600;
        white-space: nowrap;
    }

    /* Layout */
    main {
        flex: 1;
        max-width: 1100px;
        width: 100%;
        margin: 0 auto;
        padding: 14px;
        display: grid;
        grid-template-columns: 1fr;
        gap: 16px;
    }
    @media (min-width: 1024px) {
        main { grid-template-columns: 5fr 7fr; padding: 24px; gap: 20px; }
    }

    .panel {
        background: rgba(15, 23, 42, 0.8);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 16px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }
    .panel-title {
        font-weight: 700;
        font-size: 13px;
        margin: 0 0 10px;
        display: flex;
        align-items: center;
        gap: 6px;
        color: #e2e8f0;
    }
    .flex-col { display: flex; flex-direction: column; gap: 12px; }
    .row { display: flex; justify-content: space-between; align-items: center; }
    .row-gap { display: flex; gap: 8px; }

    button {
        font-family: inherit;
        cursor: pointer;
        border: none;
        outline: none;
    }
    .link-btn {
        background: none;
        color: var(--text-dim);
        font-size: 12px;
    }
    .link-btn:hover { color: var(--rose); }

    .btn-primary {
        flex: 1;
        padding: 11px 12px;
        background: var(--indigo);
        color: white;
        border-radius: 14px;
        font-size: 12px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        box-shadow: 0 6px 16px rgba(99,102,241,0.3);
        transition: background .15s, transform .1s;
    }
    .btn-primary:hover { background: var(--indigo-dark); }
    .btn-primary:active { transform: scale(0.96); }

    .btn-secondary {
        padding: 11px 12px;
        background: rgba(168,85,247,0.75);
        color: white;
        border-radius: 14px;
        font-size: 12px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        border: 1px solid rgba(216,180,254,0.3);
        box-shadow: 0 6px 16px rgba(168,85,247,0.25);
        transition: background .15s, transform .1s;
    }
    .btn-secondary:active { transform: scale(0.96); }

    .seg-group {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 6px;
    }
    .seg-btn {
        padding: 6px 8px;
        border-radius: 10px;
        font-size: 11px;
        font-weight: 600;
        border: 1px solid var(--border);
        background: var(--bg-900);
        color: var(--text-dim);
        transition: all .15s;
    }
    .seg-btn.active {
        border-color: var(--indigo);
        background: rgba(99,102,241,0.15);
        color: #c7d2fe;
    }

    textarea {
        width: 100%;
        background: rgba(2,6,23,0.8);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 10px 12px;
        color: var(--text);
        font-size: 12px;
        font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
        line-height: 1.6;
        resize: none;
        outline: none;
    }
    textarea:focus { border-color: var(--indigo); }
    textarea::placeholder { color: var(--text-dimmer); }

    .status-text { font-size: 11px; color: var(--emerald); font-weight: 600; }
    .label-text { font-size: 12px; color: var(--text-dim); }

    .mode-group {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
    }
    .mode-btn {
        padding: 11px 12px;
        border-radius: 14px;
        border: 1px solid var(--border);
        background: var(--bg-950);
        color: var(--text-dim);
        font-size: 12px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        transition: all .15s;
    }
    .mode-btn.active {
        border-color: var(--indigo);
        background: rgba(99,102,241,0.15);
        color: #c7d2fe;
    }

    .toggle-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 12px;
        background: rgba(2,6,23,0.6);
        border: 1px solid var(--border);
        border-radius: 14px;
        cursor: pointer;
        font-size: 12px;
        color: #cbd5e1;
    }
    .toggle-row input { width: 17px; height: 17px; accent-color: var(--indigo); }

    #historyList {
        flex: 1;
        overflow-y: auto;
        max-height: 150px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-family: ui-monospace, monospace;
        font-size: 12px;
        color: #cbd5e1;
    }
    .history-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: var(--bg-950);
        padding: 8px 10px;
        border-radius: 10px;
        border: 1px solid var(--border);
    }
    .history-empty { color: var(--text-dimmer); text-align: center; padding: 16px 0; font-size: 11px; }

    /* Wheel Panel */
    .wheel-panel {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow: hidden;
        min-height: 460px;
    }
    .wheel-wrap {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: auto 0;
        width: 100%;
        max-width: 400px;
        aspect-ratio: 1 / 1;
    }
    .pointer {
        position: absolute;
        top: -14px;
        z-index: 20;
        width: 34px;
        height: 34px;
        filter: drop-shadow(0 4px 8px rgba(244,63,94,0.6));
    }
    .pointer svg { width: 100%; height: 100%; display: block; }
    .wheel-frame {
        padding: 10px;
        background: var(--bg-950);
        border-radius: 50%;
        border: 4px solid var(--bg-800);
        box-shadow: 0 0 60px rgba(99,102,241,0.2);
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    canvas {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        transition: transform 1s ease-out;
    }
    .spin-wrap { margin-top: 22px; width: 100%; max-width: 300px; z-index: 10; }
    .spin-btn {
        width: 100%;
        padding: 15px 22px;
        background: linear-gradient(90deg, var(--indigo), var(--purple), var(--pink));
        color: white;
        font-weight: 800;
        font-size: 16px;
        border-radius: 18px;
        box-shadow: 0 8px 24px rgba(99,102,241,0.35);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border: 1px solid rgba(255,255,255,0.2);
        transition: transform .15s, opacity .15s;
    }
    .spin-btn:active { transform: scale(0.96); }
    .spin-btn.disabled { opacity: 0.5; cursor: not-allowed; }

    /* Footer */
    footer.site-footer {
        position: relative;
        z-index: 30;
        border-top: 1px solid var(--border);
        background: rgba(15,23,42,0.7);
        padding: 12px 16px;
        text-align: center;
    }
    footer.site-footer p { margin: 2px 0; }
    .footer-main { font-size: 11px; color: var(--text-dimmer); }
    .footer-sub { font-size: 10px; color: #475569; }

    /* Modal */
    .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(2,6,23,0.82);
        backdrop-filter: blur(8px);
        z-index: 50;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        opacity: 0;
        pointer-events: none;
        transition: opacity .3s;
    }
    .modal-overlay.show { opacity: 1; pointer-events: auto; }
    .modal-card {
        background: rgba(15,23,42,0.92);
        border: 1px solid rgba(99,102,241,0.4);
        border-radius: 24px;
        padding: 28px 24px;
        max-width: 340px;
        width: 100%;
        text-align: center;
        box-shadow: 0 20px 60px rgba(99,102,241,0.2);
        transform: scale(0.9);
        transition: transform .3s;
    }
    .modal-overlay.show .modal-card { transform: scale(1); }
    .trophy {
        width: 56px; height: 56px;
        background: linear-gradient(135deg, var(--amber), var(--rose));
        border-radius: 18px;
        margin: 0 auto 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        box-shadow: 0 8px 20px rgba(244,63,94,0.3);
        animation: bounce 1s infinite;
    }
    @keyframes bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
    }
    .modal-label { font-size: 11px; font-weight: 700; color: #a5b4fc; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 4px; }
    .winner-name {
        font-size: 26px;
        font-weight: 900;
        background: linear-gradient(90deg, #fcd34d, #fda4af, #a5b4fc);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        padding: 4px 0;
    }
    .modal-close {
        margin-top: 14px;
        width: 100%;
        padding: 11px;
        background: var(--indigo);
        color: white;
        border-radius: 14px;
        font-weight: 700;
        font-size: 13px;
        box-shadow: 0 6px 16px rgba(99,102,241,0.3);
    }
    .modal-close:active { transform: scale(0.96); }

    /* 防盗版平铺水印层 */
    .watermark-layer {
        position: fixed;
        inset: 0;
        z-index: 40;
        pointer-events: none;
        background-repeat: repeat;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='460' height='340'><text x='10' y='40' font-size='13' fill='white' fill-opacity='0.035' font-family='sans-serif' transform='rotate(-22 10 40)'>%E5%B3%87%E6%A0%AA%E5%90%A7%E8%BE%96%E5%8D%8E%E4%BB%81%E4%B8%AD%E5%AD%A6%E8%94%A1%E9%80%B8%E4%BC%97%E5%88%B6%E4%BD%9C</text><text x='230' y='110' font-size='13' fill='white' fill-opacity='0.035' font-family='sans-serif' transform='rotate(-22 230 110)'>Made by ecchua79</text><text x='40' y='190' font-size='13' fill='white' fill-opacity='0.035' font-family='sans-serif' transform='rotate(-22 40 190)'>%E5%8D%8E%E4%BB%81%E4%B8%AD%E5%AD%A6%E8%94%A1%E9%80%B8%E4%BC%97%E5%88%B6%E4%BD%9C</text><text x='250' y='270' font-size='13' fill='white' fill-opacity='0.035' font-family='sans-serif' transform='rotate(-22 250 270)'>%E5%B3%87%E6%A0%AA%E5%90%A7%E8%BE%96%E8%94%A1%E9%80%B8%E4%BC%97%E5%88%B6%E4%BD%9C</text></svg>");
    }

    /* 自制彩带特效（替代外部confetti库） */
    .confetti-piece {
        position: fixed;
        top: -10px;
        width: 8px;
        height: 14px;
        z-index: 60;
        pointer-events: none;
        opacity: 0.95;
        animation-name: confetti-fall;
        animation-timing-function: cubic-bezier(0.25, 0.46, 0.45, 0.94);
        animation-fill-mode: forwards;
    }
    @keyframes confetti-fall {
        0% { transform: translateY(0) rotate(0deg); opacity: 1; }
        100% { transform: translateY(105vh) rotate(540deg); opacity: 0; }
    }
</style>
</head>

<!-- Web Audio Sound Effects (no external dependency) -->
<script>
class SoundEffects {
    constructor() { this.ctx = null; }
    init() {
        if (!this.ctx) {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
    }
    playTick() {
        this.init();
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(500, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(120, this.ctx.currentTime + 0.03);
        gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.03);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.03);
    }
    playWin() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const notes = [261.63, 329.63, 392.00, 523.25];
        notes.forEach((freq, index) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.2, now + index * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.001, now + index * 0.08 + 0.3);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + index * 0.08);
            osc.stop(now + index * 0.08 + 0.3);
        });
    }
}
const sfx = new SoundEffects();

// 自制彩带特效（替代外部 canvas-confetti CDN）
function fireConfetti() {
    const colors = ['#6366f1', '#a855f7', '#ec4899', '#f59e0b', '#10b981', '#f43f5e'];
    const count = 60;
    for (let i = 0; i < count; i++) {
        const piece = document.createElement('div');
        piece.className = 'confetti-piece';
        const left = Math.random() * 100;
        const color = colors[Math.floor(Math.random() * colors.length)];
        const duration = 2 + Math.random() * 1.5;
        const delay = Math.random() * 0.3;
        const rotateDir = Math.random() > 0.5 ? 1 : -1;
        piece.style.left = left + 'vw';
        piece.style.background = color;
        piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
        piece.style.animationDuration = duration + 's';
        piece.style.animationDelay = delay + 's';
        piece.style.transform = `rotate(${rotateDir * 360}deg)`;
        document.body.appendChild(piece);
        setTimeout(() => piece.remove(), (duration + delay) * 1000 + 200);
    }
}
</script>

        .replace(/第四节/g, '')
        .replace(/点名/g, '')
        .replace(/座号/g, '')
        .replace(/学号/g, '')
        .replace(/中文名\s*\/\s*英文名/g, '');

    const results = [];
    const reCombined = /([\u4e00-\u9fa5]{2,6})\s*[\/|\s]\s*([A-Za-z\s]{2,40})/g;

    let match;
    while ((match = reCombined.exec(cleanedText)) !== null) {
        const zh = match[1].trim();
        let en = match[2].replace(/[\r\n]+/g, ' ').replace(/\s+/g, ' ').trim();
        en = en.replace(/\s+(座号|学号|点名|Complete).*$/i, '');

        if (zh && en && en.length >= 2) {
            results.push({ zh: zh, en: en, full: `${zh} / ${en}` });
        }
    }

    if (results.length === 0) {
        const lines = cleanedText.split('\n');
        lines.forEach(line => {
            let clean = line.replace(/^[0-9_\-\.\s\t]+/, '').trim();
            if (clean.length >= 2 && !clean.includes('Complete')) {
                if (clean.includes('/')) {
                    const parts = clean.split('/');
                    const zh = parts[0].trim();
                    const en = parts[1].trim();
                    results.push({ zh: zh, en: en, full: `${zh} / ${en}` });
                } else {
                    results.push({ zh: clean, en: clean, full: clean });
                }
            }
        });
    }

    const uniqueResults = [];
    const seen = new Set();
    results.forEach(item => {
        if (!seen.has(item.full)) {
            seen.add(item.full);
            uniqueResults.push(item);
        }
    });

    return uniqueResults;
}

function shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
}

function shuffleNames() {
    if (parsedStudents.length <= 1) return;
    parsedStudents = shuffleArray(parsedStudents);
    nameInput.value = parsedStudents.map(s => s.full).join('\n');
    drawWheel();
    parseStatus.innerText = '已随机打乱名单顺序！';
    setTimeout(() => parseStatus.innerText = '', 2500);
}

function getActiveNames() {
    return parsedStudents.map(s => {
        if (displayMode === 'zh') return s.zh;
        if (displayMode === 'en') return s.en;
        return s.full;
    });
}

function updateNamesFromInput() {
    parsedStudents = parseSchoolTableText(nameInput.value);
    nameCountBadge.innerText = `当前: ${parsedStudents.length} 人`;
    drawWheel();
}

function drawWheel() {
    const width = canvas.width;
    const height = canvas.height;
    const centerX = width / 2;
    const centerY = height / 2;
    const radius = width / 2 - 12;

    ctx.clearRect(0, 0, width, height);
    const activeNames = getActiveNames();

    if (activeNames.length === 0) {
        ctx.beginPath();
        ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
        ctx.fillStyle = '#0f172a';
        ctx.fill();
        ctx.strokeStyle = '#1e293b';
        ctx.lineWidth = 4;
        ctx.stroke();

        ctx.fillStyle = '#64748b';
        ctx.font = '16px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('请粘贴学校页面表格内容', centerX, centerY);
        return;
    }

    const arcSize = (2 * Math.PI) / activeNames.length;

    ctx.save();
    ctx.translate(centerX, centerY);
    ctx.rotate(currentRotation);

    for (let i = 0; i < activeNames.length; i++) {
        const angle = i * arcSize;

        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, radius, angle, angle + arcSize);
        ctx.fillStyle = sectorColors[i % sectorColors.length];
        ctx.fill();
        ctx.strokeStyle = 'rgba(15, 23, 42, 0.6)';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.save();
        ctx.rotate(angle + arcSize / 2);
        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = 'rgba(0,0,0,0.6)';
        ctx.shadowBlur = 4;

        let displayName = activeNames[i];
        if (displayName.length > 20) displayName = displayName.substring(0, 18) + '..';

        const fontSize = Math.max(11, Math.min(18, 260 / activeNames.length));
        ctx.font = `bold ${fontSize}px sans-serif`;

        ctx.fillText(displayName, radius - 20, 0);
        ctx.restore();
    }

    ctx.restore();

    ctx.beginPath();
    ctx.arc(centerX, centerY, 28, 0, 2 * Math.PI);
    ctx.fillStyle = '#020617';
    ctx.fill();
    ctx.strokeStyle = '#6366f1';
    ctx.lineWidth = 4;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(centerX, centerY, 8, 0, 2 * Math.PI);
    ctx.fillStyle = '#a855f7';
    ctx.fill();
}

function spinWheel() {
    const activeNames = getActiveNames();
    if (isSpinning) return;
    if (activeNames.length === 0) {
        alert('请先粘贴学校表格名单！');
        return;
    }
    if (drawMode === 2 && activeNames.length < 2) {
        alert('抽取2人模式需要至少2个学生名额！');
        return;
    }

    isSpinning = true;
    spinBtn.disabled = true;
    spinBtn.classList.add('disabled');

    sfx.init();

    const winnerIndices = [];
    const firstIdx = Math.floor(Math.random() * activeNames.length);
    winnerIndices.push(firstIdx);

    if (drawMode === 2) {
        let secondIdx;
        do {
            secondIdx = Math.floor(Math.random() * activeNames.length);
        } while (secondIdx === firstIdx);
        winnerIndices.push(secondIdx);
    }

    const arcSize = (2 * Math.PI) / activeNames.length;
    const primaryWinnerIdx = winnerIndices[0];
    const winnerSectorCenter = primaryWinnerIdx * arcSize + arcSize / 2;

    const targetPointerAngle = 1.5 * Math.PI;
    let targetAngle = targetPointerAngle - winnerSectorCenter;

    const extraRounds = (5 + Math.floor(Math.random() * 3)) * 2 * Math.PI;
    const normalizedCurrent = currentRotation % (2 * Math.PI);
    const totalRotationGoal = currentRotation + (extraRounds + (targetAngle - normalizedCurrent));

    const startRotation = currentRotation;
    const startTime = performance.now();
    const duration = 4500;

    let lastSectorIndex = -1;

    function animate(currentTime) {
        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const easeOut = 1 - Math.pow(1 - progress, 3);

        currentRotation = startRotation + (totalRotationGoal - startRotation) * easeOut;
        drawWheel();

        const normalizedAngle = (1.5 * Math.PI - (currentRotation % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
        const currentSectorIndex = Math.floor(normalizedAngle / arcSize);

        if (currentSectorIndex !== lastSectorIndex) {
            sfx.playTick();
            lastSectorIndex = currentSectorIndex;
        }

        if (progress < 1) {
            requestAnimationFrame(animate);
        } else {
            isSpinning = false;
            spinBtn.disabled = false;
            spinBtn.classList.remove('disabled');

            const winningNames = winnerIndices.map(idx => activeNames[idx]);
            showWinnerModal(winningNames);
            addHistoryRecord(winningNames);

            if (removeOnWin.checked) {
                parsedStudents = parsedStudents.filter((_, idx) => !winnerIndices.includes(idx));
                nameInput.value = parsedStudents.map(s => s.full).join('\n');
                nameCountBadge.innerText = `当前: ${parsedStudents.length} 人`;
                setTimeout(() => drawWheel(), 500);
            }
        }
    }

    requestAnimationFrame(animate);
}

function showWinnerModal(winningNames) {
    sfx.playWin();
    fireConfetti();

    winnerDisplay.innerHTML = winningNames.map(name => `<div class="winner-name">${name}</div>`).join('');

    winnerModal.classList.add('show');
}

function closeModal() {
    winnerModal.classList.remove('show');
}

function addHistoryRecord(winningNames) {
    const timeStr = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    const item = document.createElement('div');
    item.className = 'history-item';
    item.innerHTML = `
        <span style="color:#a5b4fc; font-weight:600;">${winningNames.join(' & ')}</span>
        <span style="font-size:10px; color:#64748b;">${timeStr}</span>
    `;
    if (historyList.querySelector('.history-empty')) {
        historyList.innerHTML = '';
    }
    historyList.prepend(item);
}

pasteBtn.addEventListener('click', async () => {
    try {
        const text = await navigator.clipboard.readText();
        if (text) {
            nameInput.value = text;
            updateNamesFromInput();
            parseStatus.innerText = `成功智能提取 ${parsedStudents.length} 人名单！`;
            setTimeout(() => parseStatus.innerText = '', 3500);
        } else {
            alert('剪贴板为空！请先在学校页面复制列表');
        }
    } catch (err) {
        alert('无法访问剪贴板，请直接在下方文本框手动粘贴（Ctrl+V / 长按粘贴）。');
    }
});

shuffleBtn.addEventListener('click', shuffleNames);
nameInput.addEventListener('input', updateNamesFromInput);

clearBtn.addEventListener('click', () => {
    nameInput.value = '';
    updateNamesFromInput();
});

clearHistoryBtn.addEventListener('click', () => {
    historyList.innerHTML = '<p class="history-empty">暂无中奖记录</p>';
});

function setActiveSeg(activeBtn, group) {
    group.forEach(btn => btn.classList.remove('active'));
    activeBtn.classList.add('active');
}

fmtFull.addEventListener('click', () => { displayMode = 'full'; setActiveSeg(fmtFull, [fmtFull, fmtZh, fmtEn]); drawWheel(); });
fmtZh.addEventListener('click', () => { displayMode = 'zh'; setActiveSeg(fmtZh, [fmtFull, fmtZh, fmtEn]); drawWheel(); });
fmtEn.addEventListener('click', () => { displayMode = 'en'; setActiveSeg(fmtEn, [fmtFull, fmtZh, fmtEn]); drawWheel(); });

modeSingle.addEventListener('click', () => {
    drawMode = 1;
    setActiveSeg(modeSingle, [modeSingle, modeDouble]);
});
modeDouble.addEventListener('click', () => {
    drawMode = 2;
    setActiveSeg(modeDouble, [modeSingle, modeDouble]);
});

spinBtn.addEventListener('click', spinWheel);
closeModalBtn.addEventListener('click', closeModal);
winnerModal.addEventListener('click', (e) => {
    if (e.target === winnerModal) closeModal();
});

updateNamesFromInput();
</script>
