<style>
:root{--bg:#0b1220;--pn:#121c30;--ln:#22314d;--cy:#38bdf8;--am:#fbbf24;--tx:#e2e8f0;--mu:#94a3b8}

header p{color:var(--mu);margin:6px 0 12px}
#hero{display:block;width:100%;max-width:920px;margin:0 auto;border-radius:14px;background:#0e1830;touch-action:none}
.wm{text-align:center;font-size:.55rem;color:rgba(56,189,248,.18);margin:4px 0}
nav{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:10px;position:sticky;top:0;background:rgba(11,18,32,.94);z-index:5}

.ctl input[type=range]{width:130px;accent-color:var(--cy)}

<body>
<header><h1>电生磁 · 磁生电</h1><p>初三科学 第6章 互动实验室　拖一拖、试一试，磁与电的秘密就藏在里面</p></header>
<canvas id="hero"></canvas>
<div class="wm">峇株吧辖华仁中学蔡逸众制作</div>
<nav id="nav"></nav>
<main id="box"></main>
<script>
const $=s=>document.querySelector(s),TAU=Math.PI*2,L=(a,b,t)=>a+(b-a)*t,K=(v,a,b)=>Math.min(b,Math.max(a,v)),Z={};
let P={x:0,y:0,d:false,s:''},ctx,fn,hc,hx=320,hy=130;
const say=s=>{const e=$('#st');if(e)e.textContent=s};
function txt(c,s,x,y,col,sz,al){
 c.fillStyle=col||'#94a3b8';c.font=(sz||13)+'px sans-serif';
 c.textAlign=al||'center';c.textBaseline='middle';c.fillText(s,x,y);
}
function cvs(id,h){
 const e=$(id);e.width=1280;e.height=h*2;
 const c=e.getContext('2d');c.scale(2,2);
 const f=v=>{const r=e.getBoundingClientRect();P.x=(v.clientX-r.left)/r.width*640;P.y=(v.clientY-r.top)/r.height*h};
 e.onpointerdown=v=>{f(v);P.d=true;P.s=id;e.setPointerCapture(v.pointerId)};
 e.onpointermove=v=>{f(v);P.s=id};
 e.onpointerleave=()=>{if(!P.d)P.s=''};
 e.onpointerup=()=>{P.d=false};
 return c;
}
function B(ps,x,y){
 let bx=0,by=0;
 for(const p of ps){const dx=x-p.x,dy=y-p.y,d=Math.pow(dx*dx+dy*dy+9,1.5);bx+=p.q*dx/d;by+=p.q*dy/d}
 return[bx,by];
}
function mp(m){return[{x:m.x-m.w/2+10,y:m.y,q:m.f?-m.s:m.s},{x:m.x+m.w/2-10,y:m.y,q:m.f?m.s:-m.s}]}
const polesOf=ms=>ms.flatMap(mp);
function arw(c,x,y,X,Y,col){
 const a=Math.atan2(Y-y,X-x);c.strokeStyle=c.fillStyle=col||'#fbbf24';c.lineWidth=2.5;
 c.beginPath();c.moveTo(x,y);c.lineTo(X,Y);c.stroke();
 c.save();c.translate(X,Y);c.rotate(a);c.beginPath();c.moveTo(0,0);c.lineTo(-9,-5);c.lineTo(-9,5);c.fill();c.restore();
}
function lines(c,ps,n){
 c.strokeStyle=c.fillStyle='rgba(56,189,248,.75)';c.lineWidth=1.2;
 for(const p of ps)if(p.q>0)for(let k=0;k<n;k++){
  const a=(k+.5)/n*TAU;let x=p.x+9*Math.cos(a),y=p.y+9*Math.sin(a),ar=[];
  c.beginPath();c.moveTo(x,y);
  for(let i=0;i<450;i++){
   const[bx,by]=B(ps,x,y),m=Math.hypot(bx,by)||1;x+=bx/m*3;y+=by/m*3;c.lineTo(x,y);
   if(i%70==35)ar.push([x,y,Math.atan2(by,bx)]);
   if(x<-5||x>645||y<-5||y>365||ps.some(s=>s.q<0&&Math.hypot(x-s.x,y-s.y)<7))break;
  }
  c.stroke();
  for(const[x,y,t]of ar){c.save();c.translate(x,y);c.rotate(t);c.beginPath();c.moveTo(5,0);c.lineTo(-4,-3.5);c.lineTo(-4,3.5);c.fill();c.restore()}
 }
}
function fil(c,ps,s){
 c.strokeStyle='rgba(203,213,225,.45)';c.lineWidth=1;c.beginPath();
 for(let x=8;x<640;x+=s)for(let y=8;y<360;y+=s){
  const[bx,by]=B(ps,x,y),m=Math.hypot(bx,by)||1,dx=bx/m*5,dy=by/m*5;c.moveTo(x-dx,y-dy);c.lineTo(x+dx,y+dy);
 }
 c.stroke();
}
function needle(c,x,y,a,r){
 c.save();c.translate(x,y);c.rotate(a);
 c.fillStyle='#ef4444';c.beginPath();c.moveTo(r,0);c.lineTo(0,-r/4);c.lineTo(0,r/4);c.fill();
 c.fillStyle='#3b82f6';c.beginPath();c.moveTo(-r,0);c.lineTo(0,-r/4);c.lineTo(0,r/4);c.fill();
 c.restore();
}
function comp(c,x,y,a){
 c.fillStyle='#0f1d3a';c.strokeStyle='#94a3b8';c.lineWidth=2;
 c.beginPath();c.arc(x,y,22,0,TAU);c.fill();c.stroke();needle(c,x,y,a,18);
}
function magnet(c,m){
 c.fillStyle=m.f?'#2563eb':'#dc2626';c.fillRect(m.x-m.w/2,m.y-m.h/2,m.w/2,m.h);
 c.fillStyle=m.f?'#dc2626':'#2563eb';c.fillRect(m.x,m.y-m.h/2,m.w/2,m.h);
 txt(c,m.f?'S':'N',m.x-m.w/4,m.y,'#fff',18);txt(c,m.f?'N':'S',m.x+m.w/4,m.y,'#fff',18);
}
//峇株吧辖蔡逸众制作
function hero(t){
 if(P.s=='#hero'){hx=L(hx,P.x,.25);hy=L(hy,P.y,.25)}else{hx=320+200*Math.sin(t/1800);hy=130+50*Math.sin(t/1100)}
 hc.clearRect(0,0,640,260);
 const m={x:hx,y:hy,w:120,h:30,f:0,s:2.5},ps=polesOf([m]);
 for(let i=20;i<640;i+=40)for(let j=20;j<260;j+=40){const[bx,by]=B(ps,i,j);needle(hc,i,j,Math.atan2(by,bx),11)}
 magnet(hc,m);
}
const M=[
{t:'6.1 什么是磁体？　6.1.1 磁极和磁极间如何相互作用？',n:'6.1 磁体·磁极',
k:['磁体：具有磁性的物质，能吸引铁、镍、钴。分天然磁体和人造磁体，都属永磁体；钕铁硼是目前磁力最强的永磁体','磁极：磁体吸引能力最强的两端。自由转动的磁体静止时，指北的是N极，指南的是S极','同名磁极相互排斥，异名磁极相互吸引','中国最早记载磁现象（《管子·地数篇》），司南是世界最早的指南针'],
h:'<button class=b onclick="Z.f()">翻转右侧磁体</button><button class=b onclick="Z.c()">切开左侧磁体</button><span>拖动右侧磁体靠近左侧磁体</span>',
r(c){
 const A=[{x:190,y:180,w:140,h:36,f:0,s:2}],Bm={x:470,y:180,w:140,h:36,f:0,s:2};
 Z.f=()=>{Bm.f^=1};
 Z.c=()=>{if(A.length==1){A[0]={x:150,y:180,w:66,h:36,f:0,s:1};A.push({x:230,y:180,w:66,h:36,f:0,s:1})}else{A.length=1;A[0]={x:190,y:180,w:140,h:36,f:0,s:2}}};
 return()=>{
  const R=A[A.length-1];
  if(P.d&&P.s=='#cv')Bm.x=K(P.x,R.x+R.w/2+Bm.w/2+8,600);
  const ms=[...A,Bm],ps=polesOf(ms),pb=mp(Bm);
  lines(c,ps,7);ms.forEach(m=>magnet(c,m));
  let F=0;
  for(const a of A)for(const p of mp(a))for(const q of pb)F+=p.q*q.q*(q.x-p.x)/Math.pow(Math.hypot(q.x-p.x,q.y-p.y),3);
  const l=K(F*3e5,-90,90);if(Math.abs(l)>4)arw(c,Bm.x,Bm.y+44,Bm.x+l,Bm.y+44);
  const same=mp(R)[1].q*pb[0].q>0;
  say('靠近的两端是'+(same?'同名':'异名')+'磁极，相互'+(same?'排斥':'吸引')+(A.length>1?'；切开后，每一小块磁体仍然有N、S两个磁极':''));
 };
}},
//Made by ecchua79
{t:'6.1.2 什么是磁化和去磁？',n:'6.1.2 磁化与去磁',
k:['磁化：原本没有磁性的物体在磁体或电流作用下获得磁性；只有能被磁体吸引的物质才能被磁化','软磁体（如铁）：磁性很快消失；硬磁体（如钢）：磁性长期保持，成为永磁体','磁化方法：①用磁极沿同一方向摩擦钢片；②钢片绕上绝缘导线通直流电','去磁：高温加热、捶打或撞击、交流电去磁法'],
h:'<button class=b onclick="Z.n()">① 靠近磁体</button><button class=b onclick="Z.a()">② 移开磁体</button><button class=b onclick="Z.d(0)">高温加热</button><button class=b onclick="Z.d(1)">捶打撞击</button><button class=b onclick="Z.d(2)">交流电去磁</button>',
r(c){
 const s={n:0,y:0,i:0,t:0,mi:0,mt:0};
 Z.n=()=>{s.n=1;s.i=s.t=1;say('磁体靠近：铁棒和钢棒都被磁化了（只有能被磁体吸引的物质才能磁化）')};
 Z.a=()=>{s.n=0;s.i=0;say('移开磁体：铁棒磁性很快消失（软磁体）；钢棒磁性长期保持（硬磁体）')};
 Z.d=k=>{s.i=s.t=0;say(['高温加热','捶打撞击','交流电去磁'][k]+'：钢棒的磁性也消失了，这就是去磁')};
 say('点击“靠近磁体”，看看铁棒和钢棒有什么不同');
 return()=>{
  s.y=L(s.y,s.n,.08);s.mi=L(s.mi,s.i,.08);s.mt=L(s.mt,s.t,.08);
  [[60,s.mi,'铁棒（软磁体）'],[360,s.mt,'钢棒（硬磁体）']].forEach(([x,m,nm])=>{
   const by=210;c.fillStyle='#64748b';c.fillRect(x,by,220,26);
   c.globalAlpha=m;c.fillStyle='#dc2626';c.fillRect(x,by,110,26);c.fillStyle='#2563eb';c.fillRect(x+110,by,110,26);c.globalAlpha=1;
   if(m>.5){txt(c,'N',x+55,by+13,'#fff',16);txt(c,'S',x+165,by+13,'#fff',16)}
   c.fillStyle='#cbd5e1';for(let k=0;k<Math.round(m*6);k++)c.fillRect(k%2?x+210:x+6,by+30+(k>>1)*9,4,8);
   txt(c,nm,x+110,by+100,'#e2e8f0',14);
   magnet(c,{x:x+110,y:L(40,165,s.y),w:110,h:34,f:0});
  });
 };
}},
//峇株吧辖华仁中学蔡逸众制作
{t:'6.2 什么是磁场？　6.2.1 什么是磁场和磁场线？',n:'6.2.1 磁场与磁场线',
k:['磁体周围存在看不见摸不着的磁场，磁场线能形象地描述磁场','磁体外部磁场线从N极出来回到S极；磁场线是闭合曲线、互不相交；越密磁场越强','异名磁极相对：磁场线汇聚；同名磁极相对：中间没有磁场线','地球是个大磁体：地磁南极在地理北极附近，所以指南针N极指北'],
h:'<select onchange="Z.m(this.value)"><option value=0>条形磁体</option><option value=1>异名磁极相对</option><option value=2>同名磁极相对</option><option value=3>地球的磁场</option></select><label><input type=checkbox id=fl checked> 磁场线</label><label><input type=checkbox id=ff> 铁屑</label>',
r(c){
 let mode=0;const pr={x:490,y:90};Z.m=v=>{mode=+v};
 const MS=[[{x:320,y:180,w:170,h:36,f:0,s:2.5}],[{x:195,y:180,w:130,h:34,f:0,s:2},{x:445,y:180,w:130,h:34,f:0,s:2}],[{x:195,y:180,w:130,h:34,f:0,s:2},{x:445,y:180,w:130,h:34,f:1,s:2}]];
 return()=>{
  const E=mode==3,ms=E?[]:MS[mode],ps=E?[{x:320,y:145,q:-3},{x:320,y:215,q:3}]:polesOf(ms);
  if($('#ff').checked)fil(c,ps,14);
  if($('#fl').checked)lines(c,ps,E?10:8);
  ms.forEach(m=>magnet(c,m));
  if(E){
   c.fillStyle='#1d4ed8';c.strokeStyle='#38bdf8';c.beginPath();c.arc(320,180,55,0,TAU);c.fill();c.stroke();
   txt(c,'地理北极',320,112,'#e2e8f0');txt(c,'地理南极',320,250,'#e2e8f0');txt(c,'地磁S极',320,150,'#fff',12);txt(c,'地磁N极',320,212,'#fff',12);
  }
  if(P.d&&P.s=='#cv'){pr.x=P.x;pr.y=P.y}
  const[bx,by]=B(ps,pr.x,pr.y);comp(c,pr.x,pr.y,Math.atan2(by,bx));
  txt(c,'拖动小磁针',pr.x,pr.y+36,'#fbbf24',12);
  say(E?'地磁南极在地理北极附近，所以指南针的N极指向地理北方':'磁场线：外部从N极出发回到S极，越密磁场越强；小磁针N极指向磁场方向');
 };
}},
//华仁中学蔡逸众制作
{t:'6.3 磁铁在生活及大自然中有哪些应用？',n:'6.3 磁铁的应用',
k:['磁悬浮列车：利用同名磁极相互排斥，使车体与轨道分离，减小摩擦，可以高速行驶','鸽子的生物罗盘：鸽子能感知地磁场来导航；给鸽子绑上小磁铁会干扰它，绑上铜板则没有影响','其他应用：指南针、磁卡、扬声器、电动机、磁共振成像等'],
h:'<label>磁力强度 <input type=range id=m1 min=0 max=10 value=0></label><button class=b onclick="Z.p()">切换：鸽子绑铜板 / 磁铁</button>',
r(c){
 const s={x:40,v:0,lift:0,p:0,g:{x:420,y:300,h:-1.2}};
 Z.p=()=>{s.p^=1};
 return()=>{
  const f=+$('#m1').value;
  s.lift=L(s.lift,f*3.2,.08);s.v=L(s.v,s.lift>12?(f-3)*1.2:0,.02);s.x+=s.v;if(s.x>230)s.x=-130;
  txt(c,'磁悬浮列车',150,30,'#e2e8f0',14);
  c.fillStyle='#475569';c.fillRect(10,262,290,14);
  for(let x=20;x<290;x+=40){c.fillStyle='#dc2626';c.fillRect(x,254,14,8)}
  const ty=250-s.lift-36;
  c.fillStyle='#38bdf8';c.fillRect(s.x+40,ty,120,36);c.fillStyle='#dc2626';c.fillRect(s.x+50,ty+36,100,6);
  txt(c,'N',s.x+100,ty+18,'#04121f',16);
  if(f>0)for(let k=0;k<3;k++)arw(c,s.x+70+k*30,262-6,s.x+70+k*30,Math.max(ty+50,262-6-f*3),'#fbbf24');
  txt(c,f<4?'磁力太小，车体还没有浮起来':'同名磁极相互排斥，车体浮起，摩擦减小，开始前进',150,310,'#fbbf24',12);
  txt(c,'鸽子的生物罗盘',480,30,'#e2e8f0',14);
  const g=s.g,hx=590,hy=70;
  if(s.p){g.h+=(Math.random()-.5)*.5}else{let a=Math.atan2(hy-g.y,hx-g.x)-g.h;a=Math.atan2(Math.sin(a),Math.cos(a));g.h+=a*.06}
  g.x+=Math.cos(g.h)*1.3;g.y+=Math.sin(g.h)*1.3;
  if(g.x<340||g.x>630||g.y<50||g.y>335||Math.hypot(hx-g.x,hy-g.y)<12){g.x=420;g.y=300;g.h=-1.2}
  txt(c,'家',hx,hy,'#4ade80',16);
  c.save();c.translate(g.x,g.y);c.rotate(g.h);c.fillStyle=s.p?'#ef4444':'#e2e8f0';c.beginPath();c.moveTo(12,0);c.lineTo(-8,-7);c.lineTo(-8,7);c.fill();c.restore();
  txt(c,s.p?'绑了小磁铁：地磁场被干扰，鸽子迷失方向':'绑了铜板：不影响地磁场，鸽子顺利回家',480,330,'#fbbf24',12);
  say('同名磁极排斥让列车悬浮；鸽子靠感知地磁场导航（拖动滑块、切换鸽子的“装备”试试）');
 };
}},
{t:'6.4 什么是电生磁？　6.4.1 电流的磁场方向与电流方向之间有什么关系？',n:'6.4.1 电流的磁效应',
k:['1820年奥斯特偶然发现：通电导线能使旁边的磁针偏转——电流的磁效应','通电导体周围存在磁场；电流反向，磁针偏转方向也反向，说明磁场方向与电流方向有关','通电直导线的磁场线是同心圆，离导线越近磁场越强','安培定则1：右手握导线，拇指指向电流方向，弯曲的四指就是磁场方向'],
h:'<button class=b onclick="Z.o()">接通 / 断开电源</button><button class=b onclick="Z.r()">改变电流方向</button><label>电流 <input type=range id=i1 min=1 max=10 value=6></label>',
r(c){
 const s={on:0,dir:1,a:0};Z.o=()=>{s.on^=1};Z.r=()=>{s.dir*=-1};
 return()=>{
  const I=+$('#i1').value*s.on;s.a=L(s.a,s.dir*Math.atan(I/5),.1);
  txt(c,'俯视：磁针在导线正下方，导线沿南北方向',190,30,'#94a3b8',12);
  comp(c,190,200,-Math.PI/2-s.a);
  c.globalAlpha=.6;c.strokeStyle=I?'#fbbf24':'#64748b';c.lineWidth=5;c.beginPath();c.moveTo(190,60);c.lineTo(190,340);c.stroke();c.globalAlpha=1;
  if(I)arw(c,190,170,190,s.dir>0?120:220);
  const cx=470,cy=190,o=s.dir>0;

   const b=add(new T.CylinderGeometry(.08,.08,2*r,12),mat(0xd97706),0,0,q*Lh,coil);b.rotation.z=Math.PI/2;

  for(const z of[2.0,2.5])add(new T.BoxGeometry(.14,.2,.14),mat(0x64748b),0,.36,z);

  const pl=new T.PointLight(0xfde047,0,10);pl.position.set(0,2.7,2.25);sc.add(pl);
  const wire=(a,b)=>{
   const d=new T.Vector3().subVectors(b,a),m=new T.Mesh(new T.CylinderGeometry(.03,.03,d.length(),6),mat(0x94a3b8));
   m.position.copy(a).add(b).multiplyScalar(.5);m.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),d.normalize());sc.add(m);

  let th=.9,ph=1.15,rad=11,a=0,t0=0,raf=0;const pts=new Map();

   p.x=v.clientX;p.y=v.clientY;

   upd();rd.render(sc,cam);
  };

  stop3d=()=>{
   cancelAnimationFrame(raf);removeEventListener('resize',onr);
   sc.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material){[].concat(o.material).forEach(m=>{if(m.map)m.map.dispose();m.dispose()})}});
   rd.dispose();
  };
 });
}
