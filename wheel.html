    <!-- Web Audio API Sound Generator -->
    <script>
        class SoundEffects {
            constructor() { this.ctx = null; }
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }
            playTick() {
                this.init();
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(500, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(120, this.ctx.currentTime + 0.03);
                gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.03);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.03);
            }
            playWin() {
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const notes = [261.63, 329.63, 392.00, 523.25];
                notes.forEach((freq, index) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.2, now + index * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + index * 0.08 + 0.3);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + index * 0.08);
                    osc.stop(now + index * 0.08 + 0.3);
                });
            }
        }
        const sfx = new SoundEffects();
    </script>

    <!-- Main Logic -->
    <script>
        // State
        let parsedStudents = []; // Objects: { raw: '', zh: '', en: '' }
        let displayMode = 'full'; // 'full', 'zh', 'en'
        let drawMode = 1; // 1 or 2
        let isSpinning = false;
        let currentRotation = 0;

        const sectorColors = [
            '#6366f1', '#8b5cf6', '#ec4899', '#3b82f6', 
            '#10b981', '#f59e0b', '#06b6d4', '#d946ef'
        ];

        // DOM Elements
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const nameInput = document.getElementById('nameInput');
        const nameCountBadge = document.getElementById('nameCountBadge');
        const parseStatus = document.getElementById('parseStatus');
        const spinBtn = document.getElementById('spinBtn');
        const pasteBtn = document.getElementById('pasteBtn');
        const shuffleBtn = document.getElementById('shuffleBtn');
        const clearBtn = document.getElementById('clearBtn');
        const modeSingle = document.getElementById('modeSingle');
        const modeDouble = document.getElementById('modeDouble');
        const removeOnWin = document.getElementById('removeOnWin');
        const historyList = document.getElementById('historyList');
        const clearHistoryBtn = document.getElementById('clearHistoryBtn');
        const winnerModal = document.getElementById('winnerModal');
        const winnerDisplay = document.getElementById('winnerDisplay');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const fmtFull = document.getElementById('fmtFull');
        const fmtZh = document.getElementById('fmtZh');
        const fmtEn = document.getElementById('fmtEn');

        lucide.createIcons();

        // Sample Data based on Chinese High School E-system
        const sampleData = `1 
2 
3 
4 
5 `;

        nameInput.value = sampleData;

        // Custom Parser for School E-System Table
        function parseSchoolTableText(text) {
            if (!text) return [];

            let cleanedText = text
                .replace(/班级列表\(class\).*/g, '')
                .replace(/刷新此页/g, '')
                .replace(/Complete success.*/g, '')
                .replace(/第四节/g, '')
                .replace(/点名/g, '')
                .replace(/座号/g, '')
                .replace(/学号/g, '')
                .replace(/中文名\s*\/\s*英文名/g, '');

            const results = [];
            
            const reCombined = /([\u4e00-\u9fa5]{2,6})\s*[\/|\s]\s*([A-Za-z\s]{2,40})/g;
            
            let match;
            while ((match = reCombined.exec(cleanedText)) !== null) {
                const zh = match[1].trim();
                let en = match[2].replace(/[\r\n]+/g, ' ').replace(/\s+/g, ' ').trim();
                en = en.replace(/\s+(座号|学号|点名|Complete).*$/i, '');

                if (zh && en && en.length >= 2) {
                    results.push({
                        zh: zh,
                        en: en,
                        full: `${zh} / ${en}`
                    });
                }
            }

            if (results.length === 0) {
                const lines = cleanedText.split('\n');
                lines.forEach(line => {
                    let clean = line.replace(/^[0-9_\-\.\s\t]+/, '').trim();
                    if (clean.length >= 2 && !clean.includes('Complete')) {
                        if (clean.includes('/')) {
                            const parts = clean.split('/');
                            const zh = parts[0].trim();
                            const en = parts[1].trim();
                            results.push({ zh: zh, en: en, full: `${zh} / ${en}` });
                        } else {
                            results.push({ zh: clean, en: clean, full: clean });
                        }
                    }
                });
            }

            const uniqueResults = [];
            const seen = new Set();
            results.forEach(item => {
                if (!seen.has(item.full)) {
                    seen.add(item.full);
                    uniqueResults.push(item);
                }
            });

            return uniqueResults;
        }

        // Fisher-Yates Shuffle Algorithm
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function shuffleNames() {
            if (parsedStudents.length <= 1) return;
            parsedStudents = shuffleArray(parsedStudents);
            // Update Text Area display order
            nameInput.value = parsedStudents.map(s => s.full).join('\n');
            drawWheel();
            
            parseStatus.innerText = '已随机打乱名单顺序！';
            setTimeout(() => parseStatus.innerText = '', 2500);
        }

        function getActiveNames() {
            return parsedStudents.map(s => {
                if (displayMode === 'zh') return s.zh;
                if (displayMode === 'en') return s.en;
                return s.full;
            });
        }

        function updateNamesFromInput() {
            parsedStudents = parseSchoolTableText(nameInput.value);
            nameCountBadge.innerText = `当前: ${parsedStudents.length} 人`;
            drawWheel();
        }

        // Draw Canvas Wheel
        function drawWheel() {
            const width = canvas.width;
            const height = canvas.height;
            const centerX = width / 2;
            const centerY = height / 2;
            const radius = width / 2 - 12;

            ctx.clearRect(0, 0, width, height);
            const activeNames = getActiveNames();

            if (activeNames.length === 0) {
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
                ctx.fillStyle = '#0f172a';
                ctx.fill();
                ctx.strokeStyle = '#1e293b';
                ctx.lineWidth = 4;
                ctx.stroke();

                ctx.fillStyle = '#64748b';
                ctx.font = '16px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('请粘贴学校页面表格内容', centerX, centerY);
                return;
            }

            const arcSize = (2 * Math.PI) / activeNames.length;

            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(currentRotation);

            for (let i = 0; i < activeNames.length; i++) {
                const angle = i * arcSize;
                
                // Draw Sector
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.arc(0, 0, radius, angle, angle + arcSize);
                ctx.fillStyle = sectorColors[i % sectorColors.length];
                ctx.fill();
                ctx.strokeStyle = 'rgba(15, 23, 42, 0.6)';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Draw Text
                ctx.save();
                ctx.rotate(angle + arcSize / 2);
                ctx.textAlign = 'right';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = '#ffffff';
                ctx.shadowColor = 'rgba(0,0,0,0.6)';
                ctx.shadowBlur = 4;
                
                let displayName = activeNames[i];
                if (displayName.length > 20) displayName = displayName.substring(0, 18) + '..';

                const fontSize = Math.max(11, Math.min(18, 260 / activeNames.length));
                ctx.font = `bold ${fontSize}px sans-serif`;
                
                ctx.fillText(displayName, radius - 20, 0);
                ctx.restore();
            }

            ctx.restore();

            // Center Pin
            ctx.beginPath();
            ctx.arc(centerX, centerY, 28, 0, 2 * Math.PI);
            ctx.fillStyle = '#020617';
            ctx.fill();
            ctx.strokeStyle = '#6366f1';
            ctx.lineWidth = 4;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(centerX, centerY, 8, 0, 2 * Math.PI);
            ctx.fillStyle = '#a855f7';
            ctx.fill();
        }

        // Spin Engine
        function spinWheel() {
            const activeNames = getActiveNames();
            if (isSpinning) return;
            if (activeNames.length === 0) {
                alert('请先粘贴学校表格名单！');
                return;
            }
            if (drawMode === 2 && activeNames.length < 2) {
                alert('抽取2人模式需要至少2个学生名额！');
                return;
            }

            isSpinning = true;
            spinBtn.disabled = true;
            spinBtn.classList.add('opacity-50', 'cursor-not-allowed');

            sfx.init();

            // Select Winners
            const winnerIndices = [];
            const firstIdx = Math.floor(Math.random() * activeNames.length);
            winnerIndices.push(firstIdx);

            if (drawMode === 2) {
                let secondIdx;
                do {
                    secondIdx = Math.floor(Math.random() * activeNames.length);
                } while (secondIdx === firstIdx);
                winnerIndices.push(secondIdx);
            }

            const arcSize = (2 * Math.PI) / activeNames.length;
            const primaryWinnerIdx = winnerIndices[0];
            const winnerSectorCenter = primaryWinnerIdx * arcSize + arcSize / 2;
            
            const targetPointerAngle = 1.5 * Math.PI; 
            let targetAngle = targetPointerAngle - winnerSectorCenter;

            const extraRounds = (5 + Math.floor(Math.random() * 3)) * 2 * Math.PI;
            const normalizedCurrent = currentRotation % (2 * Math.PI);
            const totalRotationGoal = currentRotation + (extraRounds + (targetAngle - normalizedCurrent));

            const startRotation = currentRotation;
            const startTime = performance.now();
            const duration = 4500;

            let lastSectorIndex = -1;

            function animate(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const easeOut = 1 - Math.pow(1 - progress, 3);
                
                currentRotation = startRotation + (totalRotationGoal - startRotation) * easeOut;
                drawWheel();

                const normalizedAngle = (1.5 * Math.PI - (currentRotation % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
                const currentSectorIndex = Math.floor(normalizedAngle / arcSize);
                
                if (currentSectorIndex !== lastSectorIndex) {
                    sfx.playTick();
                    lastSectorIndex = currentSectorIndex;
                }

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    isSpinning = false;
                    spinBtn.disabled = false;
                    spinBtn.classList.remove('opacity-50', 'cursor-not-allowed');

                    const winningNames = winnerIndices.map(idx => activeNames[idx]);
                    showWinnerModal(winningNames);
                    addHistoryRecord(winningNames);

                    // Remove winners if option checked
                    if (removeOnWin.checked) {
                        parsedStudents = parsedStudents.filter((_, idx) => !winnerIndices.includes(idx));
                        nameInput.value = parsedStudents.map(s => s.full).join('\n');
                        nameCountBadge.innerText = `当前: ${parsedStudents.length} 人`;
                        setTimeout(() => drawWheel(), 500);
                    }
                }
            }

            requestAnimationFrame(animate);
        }

        // Winner Modal & Effects
        function showWinnerModal(winningNames) {
            sfx.playWin();
            confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });

            winnerDisplay.innerHTML = winningNames.map(name => `
                <div class="text-2xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-amber-300 via-rose-300 to-indigo-300 py-1">
                    ${name}
                </div>
            `).join('');

            winnerModal.classList.remove('opacity-0', 'pointer-events-none');
            document.getElementById('modalCard').classList.remove('scale-90');
            document.getElementById('modalCard').classList.add('scale-100');
        }

        function closeModal() {
            winnerModal.classList.add('opacity-0', 'pointer-events-none');
            document.getElementById('modalCard').classList.remove('scale-100');
            document.getElementById('modalCard').classList.add('scale-90');
        }

        function addHistoryRecord(winningNames) {
            const timeStr = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            const item = document.createElement('div');
            item.className = 'flex justify-between items-center bg-slate-950 p-2 rounded-lg border border-slate-800 text-xs';
            item.innerHTML = `
                <span class="text-indigo-300 font-semibold">${winningNames.join(' & ')}</span>
                <span class="text-[10px] text-slate-500">${timeStr}</span>
            `;
            if (historyList.querySelector('p')) {
                historyList.innerHTML = '';
            }
            historyList.prepend(item);
        }

        // Clipboard One-Click Read & Clean
        pasteBtn.addEventListener('click', async () => {
            try {
                const text = await navigator.clipboard.readText();
                if (text) {
                    nameInput.value = text;
                    updateNamesFromInput();
                    parseStatus.innerText = `成功智能提取 ${parsedStudents.length} 人名单！`;
                    setTimeout(() => parseStatus.innerText = '', 3500);
                } else {
                    alert('剪贴板为空！请先在学校页面复制列表');
                }
            } catch (err) {
                alert('无法访问剪贴板，请直接在下方文本框手动粘贴（Ctrl+V / 长按粘贴）。');
            }
        });

        // Event Listeners
        shuffleBtn.addEventListener('click', shuffleNames);
        nameInput.addEventListener('input', updateNamesFromInput);
        
        clearBtn.addEventListener('click', () => {
            nameInput.value = '';
            updateNamesFromInput();
        });

        clearHistoryBtn.addEventListener('click', () => {
            historyList.innerHTML = '<p class="text-slate-500 text-center py-4 text-[11px]">暂无中奖记录</p>';
        });

        // Format Switchers
        function setFormatBtnStyle(activeBtn) {
            [fmtFull, fmtZh, fmtEn].forEach(btn => {
                btn.className = 'fmt-btn py-1 px-2 rounded-lg text-[11px] font-medium border border-slate-800 bg-slate-900 text-slate-400 hover:bg-slate-800';
            });
            activeBtn.className = 'fmt-btn py-1 px-2 rounded-lg text-[11px] font-medium border border-indigo-500 bg-indigo-600/20 text-indigo-200';
        }

        fmtFull.addEventListener('click', () => { displayMode = 'full'; setFormatBtnStyle(fmtFull); drawWheel(); });
        fmtZh.addEventListener('click', () => { displayMode = 'zh'; setFormatBtnStyle(fmtZh); drawWheel(); });
        fmtEn.addEventListener('click', () => { displayMode = 'en'; setFormatBtnStyle(fmtEn); drawWheel(); });

        // Draw Modes
        modeSingle.addEventListener('click', () => {
            drawMode = 1;
            modeSingle.className = 'mode-btn py-2.5 px-3 rounded-xl border border-indigo-500 bg-indigo-600/20 text-indigo-200 text-xs font-semibold flex items-center justify-center gap-2 transition';
            modeDouble.className = 'mode-btn py-2.5 px-3 rounded-xl border border-slate-800 bg-slate-950 text-slate-400 text-xs font-semibold flex items-center justify-center gap-2 transition hover:bg-slate-800';
        });

        modeDouble.addEventListener('click', () => {
            drawMode = 2;
            modeDouble.className = 'mode-btn py-2.5 px-3 rounded-xl border border-indigo-500 bg-indigo-600/20 text-indigo-200 text-xs font-semibold flex items-center justify-center gap-2 transition';
            modeSingle.className = 'mode-btn py-2.5 px-3 rounded-xl border border-slate-800 bg-slate-950 text-slate-400 text-xs font-semibold flex items-center justify-center gap-2 transition hover:bg-slate-800';
        });

        spinBtn.addEventListener('click', spinWheel);
        closeModalBtn.addEventListener('click', closeModal);
        winnerModal.addEventListener('click', (e) => {
            if (e.target === winnerModal) closeModal();
        });

        // Initial Exec
        updateNamesFromInput();
    </script>
</body>
</html>
