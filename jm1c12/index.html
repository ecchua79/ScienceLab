<script>
// 峇株吧辖蔡逸众制作
const $=i=>document.getElementById(i),R=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),
sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]]}return a},
sg=n=>n<0?'−'+(-n):''+n,fm=n=>''+Math.round(n*100)/100;

const scr=n=>{SC.forEach(s=>$('s-'+s).classList.toggle('hide',s!=n));scrollTo(0,0)};
let r,tm,best={},toT;
function tos(m){const e=$('to');e.textContent=m;e.classList.remove('hide');clearTimeout(toT);toT=setTimeout(()=>e.classList.add('hide'),2600)}
function pn(s){s=String(s).trim().replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248)).replace(/[，,。．]/g,'.').replace(/[−－–]/g,'-');return /^-?\d*\.?\d+$/.test(s)?parseFloat(s):NaN}
function bp(f){try{const a=bp.a=bp.a||new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=f;g.gain.setValueAtTime(.15,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.25);o.start();o.stop(a.currentTime+.25)}catch(e){}}
// 华仁中学蔡逸众制作
// ===== 题库：玩法①极速判断（对错题，每题限时）=====
const TF=[
['坐在行驶火车里的乘客，<b>以车厢为参照物</b>是静止的。',1,'乘客和车厢的相对位置一直没变，所以以车厢为参照物，乘客是<b>静止</b>的。'],
['坐在行驶火车里的乘客，<b>以窗外的树为参照物</b>也是静止的。',0,'乘客相对树的位置不断变化，所以是<b>运动</b>的。参照物不同，结论就可能不同！'],
['火车驶入车站时，<b>以火车为参照物</b>，车站是运动的。',1,'车站相对火车的位置在变化（越来越近），所以以火车为参照物，车站在运动。'],
['科学上说的「运动」，就是物体的位置随时间发生变化。',1,'这种运动叫<b>机械运动</b>，一般由力的作用引起。'],
['打羽毛球、跑步这种生活里的「运动」，和科学上的机械运动意思完全相同。',0,'生活中的运动指动态休闲活动；科学上的运动特指「位置随时间变化」，两者不同。'],
['判断一个物体是否运动，必须先选一个参照物。',1,'没有比较的标准，就没法说物体是运动还是静止。'],
['参照物只能选地面或静止的物体，运动的物体不能当参照物。',0,'任何物体都能当参照物。例如以行驶的火车为参照物，车里的乘客就是静止的。'],
['汽车在笔直的公路上行驶属于曲线运动。',0,'机械运动分两类：直线运动（直路上的汽车、自由落体）和曲线运动（过山车、海盗船）。']];
function mkTF(){return sh(TF).slice(0,6).map(x=>({t:'tf',c:'参照物与运动',q:x[0],a:x[1],e:x[2],lim:10}))}
// Made by ecchua79
// ===== 玩法②归类（点卡片 → 点框）=====
function mkCls(){return[
{t:'cls',c:'直线/曲线运动',q:'把这些运动放进正确的轨迹类型：',b:['➡️ 直线运动','🌀 曲线运动'],w:['轨迹是直线','轨迹是弯的'],h:'想一想它的轨迹是直的还是弯的',
i:[['汽车在笔直公路上行驶',0],['自由落体的苹果',0],['电动扶梯匀速上行',0],['过山车盘旋',1],['海盗船摆动',1],['汽车绕圆环行驶',1]],
e:'机械运动分两类：轨迹是直线的叫<b>直线运动</b>，轨迹是曲线的叫<b>曲线运动</b>。'},
{t:'cls',c:'有无方向',q:'哪些量<b>只有大小</b>，哪些<b>还要看方向</b>？',b:['📏 只有大小','🧭 大小+方向'],w:['和路程有关，没有方向','和位移有关，有方向'],h:'路程没有方向，位移有方向；速率对应路程，速度对应位移',
i:[['路程',0],['速率',0],['平均速率',0],['位移',1],['速度',1],['瞬时速度',1]],
e:'路程、速率（平均/瞬时）只有大小；位移、速度（平均/瞬时）既有大小又有方向。'}]}
// 峇株吧辖华仁中学蔡逸众制作
// ===== 玩法③数轴小虫（动画 + 填数）=====
function nl(a,b,c,two){const lo=Math.min(0,a,b,c)-1,hi=Math.max(0,a,b,c)+1,x=v=>20+(v-lo)/(hi-lo)*280;
let s='<svg viewBox="0 0 320 120" width="100%"><line x1="10" y1="70" x2="310" y2="70" stroke="#aab" stroke-width="2"/>';
for(let v=Math.ceil(lo);v<=hi;v++)s+=`<line x1="${x(v)}" y1="66" x2="${x(v)}" y2="74" stroke="#aab"/><text x="${x(v)}" y="86" font-size="9" fill="#cdd" text-anchor="middle">${sg(v)}</text>`;
const d=two?`M${x(a)} 70Q${(x(a)+x(b))/2} 30 ${x(b)} 70Q${(x(b)+x(c))/2} 112 ${x(c)} 70`:`M${x(a)} 70Q${(x(a)+x(c))/2} 30 ${x(c)} 70`;
s+=`<path d="${d}" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="5 3"/>`;
[[a,'A'],...(two?[[b,'B']]:[]),[c,'C']].forEach(p=>s+=`<circle cx="${x(p[0])}" cy="70" r="8" fill="#6366f1"/><text x="${x(p[0])}" y="74" font-size="10" fill="#fff" text-anchor="middle">${p[1]}</text>`);
return s+`<text font-size="16">🐛<animateMotion dur="3s" fill="freeze" path="${d}"/></text><text x="12" y="18" font-size="10" fill="#9ab">← 西　　东 →（向东为正）</text></svg>`}
// 峇株吧辖蔡逸众制作
function mkNum(){return[0,1,1].map(q=>{let a,b,c,l1,l2,s;
do{a=R(-4,3);s=R(0,1)?1:-1;l1=R(3,7);l2=R(2,9);b=a+s*l1;c=q?b-s*l2:b}while(q&&(l1==l2||Math.abs(b)>10||Math.abs(c)>10));
const p=q?l1+l2:l1,d=c-a;
return{t:'num',c:'路程与位移',v:nl(a,b,c,q),
q:q?`小虫从 <b>A(${sg(a)} cm)</b> 爬到 <b>B(${sg(b)} cm)</b>，掉头再爬到 <b>C(${sg(c)} cm)</b>。`:`小虫从 <b>A(${sg(a)} cm)</b> 一路爬到 <b>C(${sg(c)} cm)</b>，中途没有回头。`,
f:[['路程','cm',p],['位移','cm',d,1]],
e:`路程 = 实际走过的长度 = ${q?l1+' + '+l2+' = ':''}<b>${p} cm</b>；位移 = 末位置 − 初位置 = ${sg(c)} − (${sg(a)}) = <b>${sg(d)} cm</b>（${d<0?'负号表示向西':'正号表示向东'}）。${q?'中间怎么绕都不影响位移！':'不回头时，路程的数值 = 位移的大小。'}`}})}
// 华仁中学蔡逸众制作
// ===== 玩法④赛道挑战（计算 / 概念 / 读图）=====
function vtSVG(v,t){const X=20+t*26,Y=125-v*11;return`<svg viewBox="0 0 320 150" width="100%"><path d="M20 10V125H305" stroke="#aab" fill="none" stroke-width="2"/><rect x="20" y="${Y}" width="${t*26}" height="${v*11}" fill="#22d3ee55" stroke="#22d3ee"/><text x="${X/2+10}" y="${Y-5}" font-size="12" fill="#fbbf24" text-anchor="middle">v = ${v} m/s</text><text x="${X/2+10}" y="142" font-size="12" fill="#fbbf24" text-anchor="middle">t = ${t} s</text><text x="26" y="20" font-size="10" fill="#9ab">v (m/s)</text><text x="280" y="120" font-size="10" fill="#9ab">t (s)</text></svg>`}
function mkRace(){const t1=[5,8,10,20,25][R(0,4)],v1=R(4,12),k=[18,36,54,72,90,108][R(0,5)],lp=[[400,50],[200,40],[300,60]][R(0,2)],lv=lp[0]/lp[1],vv=R(2,8),vt=R(3,8);
return[
{t:'num',c:'速率计算',q:`小华在直跑道上 <b>${t1} s</b> 跑了 <b>${v1*t1} m</b>，他的平均速率是多少？`,f:[['平均速率','m/s',v1]],e:`速率 = 路程 ÷ 时间 = ${v1*t1} ÷ ${t1} = <b>${v1} m/s</b>。`},
{t:'num',c:'单位换算',q:`测速仪显示 <b>${k} km/h</b>，等于多少 m/s？`,f:[['速率','m/s',k/3.6]],e:`1 m/s = 3.6 km/h，所以 km/h ÷ 3.6 = m/s：${k} ÷ 3.6 = <b>${fm(k/3.6)} m/s</b>。`},
{t:'mcq',c:'平均速率 vs 平均速度',q:`运动员在 ${lp[0]} m 的环形跑道上跑一圈回到起点，用时 ${lp[1]} s。他的平均速率和平均速度分别是？`,o:[[`速率 ${lv} m/s，速度 0 m/s`,1],[`速率 0 m/s，速度 ${lv} m/s`,0],[`速率 ${lv} m/s，速度 ${lv} m/s`,0],['速率 0 m/s，速度 0 m/s',0]],e:`平均速率 = 路程 ÷ 时间 = ${lp[0]} ÷ ${lp[1]} = ${lv} m/s；回到起点，位移 = 0，所以平均速度 = 0 m/s。<b>速率看路程，速度看位移。</b>`},
R(0,1)?{t:'mcq',c:'瞬时速率',q:'高速公路的限速牌写着「限速 100 km/h」，它限制的是哪种速率？',o:[['瞬时速率',1],['平均速率',0],['平均速度',0],['位移',0]],e:'限速管的是<b>每一个瞬间</b>都不能超过的快慢，也就是<b>瞬时速率</b>（车上速度计显示的就是它）。'}
:{t:'mcq',c:'平均速率',q:'爸爸开车上班，用全程路程除以总时间，得到的是什么？',o:[['平均速率',1],['瞬时速率',0],['位移',0],['瞬时速度',0]],e:'全程路程 ÷ 总时间 = <b>平均速率</b>。路上有快有慢，它只是一个平均值。'},
{t:'num',c:'v-t 图像',v:vtSVG(vv,vt),q:'这是物体的 v-t 图（速度—时间）。阴影面积表示物体走过的距离，是多少 m？',f:[['距离','m',vv*vt]],e:`v-t 图中，线下方的矩形面积 = 速度 × 时间 = ${vv} × ${vt} = <b>${vv*vt} m</b>。`}]}
// Made by ecchua79
function mkFinal(){return[2,2,3,3,3].map(n=>{let v,t,ty,D,T;
do{v=[];t=[];ty=[];for(let i=0;i<n;i++){v.push(R(3,12));t.push(R(2,8));ty.push(R(0,1))}D=v.reduce((a,x,i)=>a+x*t[i],0);T=t.reduce((a,x)=>a+x,0)}while(D%T||new Set(v).size<n||!ty.includes(0)||!ty.includes(1));
const A=D/T,nm=['上坡','下坡','平路'],seg=v.map((x,i)=>(ty[i]?`${nm[i]}时以 <b>${x} m/s</b> 的速率走了 <b>${x*t[i]} m</b>`:`${nm[i]}时以 <b>${x} m/s</b> 的速率走了 <b>${t[i]} s</b>`));
return{t:'num',c:'终极：分段平均速率',q:`小华${seg.join('，')}。求他这整段路程的平均速率。<br><small>（提示：有的路段给时间、有的给路程，先补全缺的量；也不能直接把速率相加再平均哦）</small>`,f:[['平均速率','m/s',A]],
e:`平均速率 = 总路程 ÷ 总时间。各段：${v.map((x,i)=>ty[i]?`${nm[i]}已知路程 ${x*t[i]} m，时间 = 路程 ÷ 速率 = ${x*t[i]} ÷ ${x} = ${t[i]} s`:`${nm[i]}路程 = 速率 × 时间 = ${x} × ${t[i]} = ${x*t[i]} m`).join('；')}。总路程 = <b>${D} m</b>；总时间 = ${t.join(' + ')} = <b>${T} s</b>。所以平均速率 = ${D} ÷ ${T} = <b>${A} m/s</b>。`}})}
const LV=[
{n:'⚡ 极速判断',d:'每题 10 秒，快判「对 / 错」',h:3,mk:mkTF},
{n:'🧲 运动归类',d:'点卡片再点框，给概念分类',h:4,mk:mkCls},
{n:'🐛 数轴小虫',d:'看动画，算路程与位移',h:3,mk:mkNum},
{n:'🏁 赛道挑战',d:'速率计算 · 单位换算 · v-t 图',h:3,mk:mkRace},
{n:'👑 终极挑战',d:'分段路程的平均速率（通关前 4 关解锁）',h:3,mk:mkFinal}];
function hub(){clearInterval(tm);
$('hl').innerHTML=LV.map((l,i)=>{const b=best[i],lk=i==4&&![0,1,2,3].every(k=>best[k]);return`<button class="opt" style="${i==4?'border-color:#fbbf24':''}" onclick="${lk?'tos(\'先通关前面 4 关，终极挑战才会解锁！\')':'start('+i+')'}"><b>${l.n}</b>　${b?'★'.repeat(b.st)+'☆'.repeat(3-b.st)+' 最高 '+b.s:lk?'🔒 未解锁':'未通关'}<br><small>${l.d} · ❤️×${l.h}</small></button>`}).join('');
$('hc').innerHTML=Object.keys(best).length==LV.length?'<button class="btn p" onclick="scr(\'cert\')">🎓 领取荣誉证书</button>':'<small>通关全部 4 关并完成终极挑战，才能领取荣誉证书（可重复挑战，刷高分和星星）</small>';scr('hub')}
// 峇株吧辖华仁中学蔡逸众制作
// ===== 游戏引擎：生命、分数、连击、解析 =====
function start(i){r={i,L:LV[i],T:LV[i].mk(),k:0,h:LV[i].h,s:0,c:0,mc:0,ok:0,n:0,fast:0,t0:Date.now(),miss:[]};scr('play');hud();next()}
function hud(){$('ln').textContent=r.L.n;$('hh').textContent='❤️'.repeat(r.h)+'🖤'.repeat(r.L.h-r.h);$('sc').textContent='⭐'+r.s+(r.c>1?' 🔥×'+r.c:'')}
function next(){clearInterval(tm);r.lock=0;if(r.k>=r.T.length)return end();
const t=r.T[r.k];r.st=Date.now();$('fb').classList.add('hide');$('cp').textContent=t.c+'　'+(r.k+1)+' / '+r.T.length;
$('vis').innerHTML=t.v||'';$('q').innerHTML=t.q;const b=$('bd');b.innerHTML='';RD[t.t](t,b);
if(t.lim){let l=t.lim;$('tm').textContent='⏰'+l;tm=setInterval(()=>{$('tm').textContent='⏰'+--l;if(l<=0)ans(0,'⏰ 时间到！')},1000)}else $('tm').textContent=''}
function judge(ok){const sec=(Date.now()-r.st)/1000;r.st=Date.now();r.n++;bp(ok?660:200);
