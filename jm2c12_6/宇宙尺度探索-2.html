<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>宇宙尺度探索 - 从地月系到总星系</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #fff;
            user-select: none;
            -webkit-user-select: none;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .header {
            padding: 15px 20px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.85), transparent);
        }
        h1 {
            margin: 0;
            font-size: 22px;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
        }
        .subtitle {
            font-size: 11px;
            color: #aaa;
            margin-top: 3px;
        }
        
        /* 导航控制栏 */
        .controls {
            padding: 15px 20px;
            display: flex;
            gap: 10px;
            overflow-x: auto;
            white-space: nowrap;
            pointer-events: auto;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .controls::-webkit-scrollbar {
            display: none;
        }
        
        button {
            background: rgba(20, 40, 80, 0.6);
            border: 1px solid rgba(100, 150, 255, 0.3);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
            flex-shrink: 0;
            -webkit-tap-highlight-color: transparent;
        }
        button:hover, button.active {
            background: rgba(40, 100, 200, 0.85);
            border-color: #fff;
            box-shadow: 0 0 12px rgba(100, 150, 255, 0.5);
        }

        /* 可折叠信息面板 */
        #info-panel {
            position: absolute;
            right: 20px;
            top: 80px;
            width: 280px;
            max-width: calc(100% - 40px);
            background: rgba(10, 15, 30, 0.85);
            border: 1px solid rgba(100, 150, 255, 0.2);
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            pointer-events: auto;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            overflow: hidden;
            z-index: 20;
        }
        
        #info-panel.collapsed {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(20, 40, 80, 0.8);
            border-color: rgba(100, 150, 255, 0.5);
        }

        .toggle-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 24px;
            height: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            transition: background 0.3s;
            z-index: 21;
        }
        .toggle-btn:hover {
            background: rgba(255,255,255,0.25);
        }

        .toggle-icon {
            width: 12px;
            height: 12px;
            stroke: white;
            stroke-width: 2;
            fill: none;
            transition: transform 0.4s;
        }
        .collapsed .toggle-icon {
            transform: rotate(45deg);
        }

        .info-content {
            padding: 18px;
            transition: opacity 0.3s;
        }
        .collapsed .info-content {
            opacity: 0;
            pointer-events: none;
        }

        #info-title {
            font-size: 18px;
            font-weight: bold;
            color: #4a90e2;
            margin-top: 0;
            margin-bottom: 10px;
            padding-right: 25px;
        }
        #info-desc {
            font-size: 13px;
            line-height: 1.5;
            color: #ddd;
            margin-bottom: 0;
        }
        #info-data {
            font-size: 11.5px;
            line-height: 1.6;
            color: #8fd8ff;
            background: rgba(74, 144, 226, 0.12);
            border: 1px solid rgba(100, 180, 255, 0.3);
            border-radius: 6px;
            padding: 7px 10px;
            margin: 10px 0 12px 0;
            letter-spacing: 0.2px;
        }
        
        .collapsed-hint {
            position: absolute;
            top: 0;
            left: 0;
            width: 44px;
            height: 44px;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            color: #4a90e2;
            pointer-events: none;
        }
        .collapsed .collapsed-hint {
            display: flex;
        }

        /* 极客相机控制浮窗 */
        #camera-settings {
            position: absolute;
            right: 20px;
            bottom: 90px;
            background: rgba(10, 15, 30, 0.85);
            border: 1px solid rgba(100, 150, 255, 0.3);
            border-radius: 20px;
            padding: 5px;
            display: flex;
            gap: 5px;
            pointer-events: auto;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            z-index: 20;
        }
        .cam-btn {
            background: transparent;
            border: none;
            color: #888;
            padding: 6px 12px;
            font-size: 11px;
            cursor: pointer;
            border-radius: 15px;
            transition: all 0.3s;
            flex-shrink: 0;
            box-shadow: none;
        }
        .cam-btn.active {
            background: rgba(100, 150, 255, 0.3);
            color: #fff;
            text-shadow: 0 0 5px rgba(255,255,255,0.5);
        }

        .loader {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 16px;
            z-index: 100;
            pointer-events: none;
            transition: opacity 1s;
            letter-spacing: 1px;
        }

        /* 版权水印 */
        .watermark {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 0.5px;
            margin-top: 4px;
            user-select: none;
        }

        @media (max-width: 768px) {
            h1 { font-size: 18px; }
            #info-panel {
                top: auto;
                bottom: 140px; /* 为下方相机设置区留出空位 */
                right: 15px;
                width: calc(100% - 30px);
                max-width: 340px;
            }
            #info-panel.collapsed {
                width: 40px;
                height: 40px;
                bottom: 140px;
                right: 15px;
            }
            #camera-settings {
                bottom: 90px;
                right: 15px;
                width: calc(100% - 30px);
                max-width: 340px;
                justify-content: space-around;
            }
            .collapsed-hint {
                width: 40px;
                height: 40px;
                font-size: 16px;
            }
            .toggle-btn {
                top: 8px;
                right: 8px;
            }
        }
    </style>
    <!-- 引入 Three.js 和 OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- 引入 GSAP 动画库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>

    <div id="loading" class="loader">正在构建嵌套宇宙空间...</div>

    <div id="canvas-container"></div>

    <div id="ui-layer">
        <div class="header">
            <h1>宏观宇宙尺度演示</h1>
            <div class="subtitle">滑动下方菜单或双指缩放探索嵌套宇宙</div>
            <div class="watermark">华仁中学 科学实验室 · 蔡逸众 (ecchua79) 制作</div>
        </div>

        <!-- 可折叠信息面板 -->
        <div id="info-panel">
            <div class="collapsed-hint">ℹ</div>
            <div class="toggle-btn" onclick="toggleInfoPanel(event)">
                <svg class="toggle-icon" viewBox="0 0 12 12">
                    <line id="line1" x1="2" y1="2" x2="10" y2="10" />
                    <line id="line2" x1="10" y1="2" x2="2" y2="10" />
                </svg>
            </div>
            
            <div class="info-content">
                <h2 id="info-title">地月系</h2>
                <div id="info-data">🛰️ 地月平均距离 38.4万 km ≈ 1.28 光秒　·　月球公转周期 27.3 天</div>
                <p id="info-desc">地球与月球组成的引力系统。在标准视角下，月球沿逆时针方向公转。</p>
            </div>
        </div>

        <!-- 相机模式控制浮窗 -->
        <div id="camera-settings">
            <button class="cam-btn active" id="cam-track" onclick="setCameraMode('track')">🛰️ 轨道锁定追踪</button>
            <button class="cam-btn" id="cam-static" onclick="setCameraMode('static')">🔭 星系静态俯瞰</button>
        </div>

        <div class="controls">
            <button onclick="zoomTo(0)" class="active" id="btn-0">1. 地月系</button>
            <button onclick="zoomTo(1)" id="btn-1">2. 太阳系</button>
            <button onclick="zoomTo(2)" id="btn-2">3. 银河系</button>
            <button onclick="zoomTo(3)" id="btn-3">4. 本星系群</button>
            <button onclick="zoomTo(4)" id="btn-4">5. 室女座超星系团</button>
            <button onclick="zoomTo(5)" id="btn-5">6. 可观测宇宙</button>
        </div>
    </div>

    <script>
        // --- 嵌套宇宙绝对坐标配置体系 ---
        const worldPositions = {
            earthMoon: new THREE.Vector3(17018, 4000, -5000),
            solarSystem: new THREE.Vector3(17000, 4000, -5000),
            milkyWay: new THREE.Vector3(16200, 4000, -5800),
            localGroup: new THREE.Vector3(17000, 4000, -7000),
            supercluster: new THREE.Vector3(15000, 5000, -10000),
            universe: new THREE.Vector3(0, 0, 0)
        };

        const scales = [
            {
                title: "地月系",
                desc: "地球与月球组成的引力系统。在这个尺度下，月球沿逆时针方向公转。此时，银河系旋转中的千亿恒星粒子正作为璀璨的深邃背景夜空完美包围着我们。",
                data: "🛰️ 地月平均距离 38.4万 km ≈ 1.28 光秒　·　月球公转周期 27.3 天",
                target: worldPositions.earthMoon,
                offset: new THREE.Vector3(0, 5, 15),
                visibleRange: [0, 50]
            },
            {
                title: "太阳系",
                desc: "以太阳为中心的行星引力系统。地球和行星们正围绕着太阳公转。在锁定模式下，无论银河系如何旋转，相机均能平稳捕捉太阳系在旋臂中的最新绝对世界坐标位置！",
                data: "☀️ 日地距离(1 AU) 1.5亿 km ≈ 8.3 光分　·　海王星轨道半径约 30 AU",
                target: worldPositions.solarSystem,
                offset: new THREE.Vector3(0, 50, 150),
                visibleRange: [30, 800]
            },
            {
                title: "银河系",
                desc: "我们的母棒旋星系（SBbc）。中心由一个温暖明亮的“恒星核心棒”横跨。4条对称的主旋臂（英仙、人马、矩尺、盾牌）从核心棒两端极其清晰地向外缠绕卷曲。黄色波纹雷达环为太阳家园的自转投影位置。",
                data: "🌌 直径约 10万–20万光年　·　太阳距银心约 2.6万光年　·　恒星数千亿颗",
                target: worldPositions.milkyWay,
                offset: new THREE.Vector3(0, 1500, 2800), 
                visibleRange: [500, 5000]
            },
            {
                title: "本星系群",
                desc: "由银河系、仙女座星系等50多个星系组成的集团。蓝色全息雷达环代表了银河系在星系群中的空间定位。仙女座星系是本星系群中最大的成员。",
                data: "🔭 直径约 1000万光年　·　已知成员星系 50余个",
                target: worldPositions.localGroup,
                offset: new THREE.Vector3(0, 2500, 7500),
                visibleRange: [3000, 25000]
            },
            {
                title: "室女座超星系团",
                desc: "由约30个密集交融的星系团和星群组成。引力丝线将数万个星系紧密连结，完美告别僵硬的十字对称，呈现出壮丽而饱满的有机宇宙网大尺度形态。",
                data: "🕸️ 直径约 1.1亿光年　·　包含约 100个星系群/星系团",
                target: worldPositions.supercluster,
                offset: new THREE.Vector3(0, 12000, 38000),
                visibleRange: [18000, 120000]
            },
            {
                title: "可观测宇宙",
                desc: "人类理学观测的终极视界，跨度约930亿光年。在微弱淡雅的巨大视界天球内部，超级星系团群呈群落分布，编织出繁星浩瀚的神经元宇宙网结构。",
                data: "🌠 直径约 930亿光年　·　宇宙年龄约 138亿年　·　星系数量估计超千亿个",
                target: worldPositions.universe,
                offset: new THREE.Vector3(0, 70000, 210000),
                visibleRange: [90000, 1500000]
            }
        ];

        let currentScaleIndex = 0;
        let isPanelCollapsed = false;
        let isFlying = false;
        let cameraMode = 'track'; // 'track' (锁定追踪) 或是 'static' (静态固定俯瞰)
        
        // 关键增量位移变量：用于在极其复杂的运动星系内部平稳控制 OrbitControls
        let lastTargetPos = new THREE.Vector3().copy(worldPositions.earthMoon);

        // --- 相机模式切换逻辑 (极客优化) ---
        function setCameraMode(mode) {
            cameraMode = mode;
            document.getElementById('cam-track').classList.toggle('active', mode === 'track');
            document.getElementById('cam-static').classList.toggle('active', mode === 'static');
            
            if (mode === 'track') {
                // 瞬间将追踪捕捉点重置到当前的真实星体坐标，防止切换时发生镜头拉伸震荡
                lastTargetPos.copy(scales[currentScaleIndex].target);
            }
        }

        // --- 收起/展开面板切换 ---
        function toggleInfoPanel(event) {
            if(event) event.stopPropagation();
            const panel = document.getElementById('info-panel');
            const line1 = document.getElementById('line1');
            const line2 = document.getElementById('line2');
            
            isPanelCollapsed = !isPanelCollapsed;
            
            if (isPanelCollapsed) {
                panel.classList.add('collapsed');
                line1.setAttribute('x1', '6'); line1.setAttribute('y1', '2');
                line1.setAttribute('x2', '6'); line1.setAttribute('y2', '10');
                line2.setAttribute('x1', '2'); line2.setAttribute('y1', '6');
                line2.setAttribute('x2', '10'); line2.setAttribute('y2', '6');
            } else {
                panel.classList.remove('collapsed');
                line1.setAttribute('x1', '2'); line1.setAttribute('y1', '2');
                line1.setAttribute('x2', '10'); line1.setAttribute('y2', '10');
                line2.setAttribute('x1', '10'); line2.setAttribute('y1', '2');
                line2.setAttribute('x2', '2'); line2.setAttribute('y2', '10');
            }
        }

        document.getElementById('info-panel').addEventListener('click', function(e) {
            if (isPanelCollapsed) {
                toggleInfoPanel(e);
            }
        });

        // --- Three.js 初始化 ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 10000000);
        
        const initialTarget = worldPositions.earthMoon;
        camera.position.copy(initialTarget).add(new THREE.Vector3(0, 5, 15));

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxDistance = 600000;
        controls.minDistance = 2;
        controls.target.copy(initialTarget);

        // 光照
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.45);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.3);
        dirLight.position.set(5, 3, 5);
        scene.add(dirLight);

        // --- 核心方法：动态生成发光粒子纹理 ---
        function createParticleTexture(glow) {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const context = canvas.getContext('2d');
            const center = 64;
            const gradient = context.createRadialGradient(center, center, 0, center, center, center);
            if(glow) {
                gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
                gradient.addColorStop(0.2, 'rgba(200, 220, 255, 0.9)');
                gradient.addColorStop(0.5, 'rgba(50, 100, 255, 0.3)');
                gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            } else {
                gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
                gradient.addColorStop(0.3, 'rgba(255, 255, 255, 0.8)');
                gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            }
            context.fillStyle = gradient;
            context.fillRect(0, 0, 128, 128);
            return new THREE.CanvasTexture(canvas);
        }
        const particleTexture = createParticleTexture(false);
        const glowTexture = createParticleTexture(true);

        const groups = [];
        let moonOrbitAngle = 0;
        let markerPulseTime = 0;

        // --- 各层级模型构建 ---

        // 1. 地月系
        function buildEarthMoon() {
            const group = new THREE.Group();
            group.position.copy(worldPositions.earthMoon);
            
            // 地球
            const earthGeo = new THREE.SphereGeometry(2, 32, 32);
            const earthMat = new THREE.MeshPhongMaterial({ 
                color: 0x1e90ff, 
                emissive: 0x0a2a5c,
                transparent: true,
                opacity: 1
            });
            const earth = new THREE.Mesh(earthGeo, earthMat);
            group.earthMesh = earth; 
            
            // 月球
            const moonGeo = new THREE.SphereGeometry(0.5, 16, 16);
            const moonMat = new THREE.MeshStandardMaterial({ 
                color: 0x888888,
                transparent: true,
                opacity: 1
            });
            const moon = new THREE.Mesh(moonGeo, moonMat);
            moon.position.set(6, 0, 0);
            
            group.add(earth);
            group.add(moon);
            
            group.moon = moon; 
            scene.add(group);
            groups.push(group);
        }

        // 2. 太阳系
        function buildSolarSystem() {
            const group = new THREE.Group();
            group.position.copy(worldPositions.solarSystem);
            
            // 太阳
            const sunMat = new THREE.MeshBasicMaterial({ 
                color: 0xffcc00, 
                transparent: true, 
                opacity: 0 
            });
            const sun = new THREE.Mesh(new THREE.SphereGeometry(4, 32, 32), sunMat);
            group.add(sun);

            const planetColors = [0xaaaaaa, 0xffaa00, 0x1e90ff, 0xff4400, 0xffcc88, 0xffddaa, 0x00ffff, 0x0000ff];
            const orbitRadii = [8, 12, 18, 24, 36, 48, 62, 75];
            
            orbitRadii.forEach((r, index) => {
                const orbitGeo = new THREE.RingGeometry(r, r + 0.2, 64);
                const orbitMat = new THREE.MeshBasicMaterial({ 
                    color: 0xffffff, 
                    side: THREE.DoubleSide, 
                    transparent: true, 
                    opacity: 0,
                    depthWrite: false
                });
                const orbit = new THREE.Mesh(orbitGeo, orbitMat);
                orbit.rotation.x = Math.PI / 2;
                group.add(orbit);

                const pGeo = new THREE.SphereGeometry(index > 3 ? 1.5 : 0.8, 16, 16);
                const pMat = new THREE.MeshPhongMaterial({
                    color: planetColors[index],
                    transparent: true,
                    opacity: 0
                });
                const planet = new THREE.Mesh(pGeo, pMat);
                
                const angle = (index === 2) ? 0 : Math.random() * Math.PI * 2;
                planet.position.set(Math.cos(angle) * r, 0, Math.sin(angle) * r);
                group.add(planet);

                if (index === 2) {
                    group.earthMesh = planet; 
                }
            });

            scene.add(group);
            groups.push(group);
        }

        // 3. 银河系 (精细重构：完美的4条对称紧致绕线旋臂 + 恒星核心棒)
        function buildMilkyWay() {
            const group = new THREE.Group();
            group.position.copy(worldPositions.milkyWay);

            const particleCount = 20000; 
            const geo = new THREE.BufferGeometry();
            const pos = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);
            const colorCenter = new THREE.Color(0xffffee);
            const colorEdge = new THREE.Color(0x3366ff);
            const colorBar = new THREE.Color(0xffaa44); 

            const barLength = 260; // 核心棒半长度
            const barAngle = Math.PI / 6; // 恒星棒偏转角 30度

            for (let i = 0; i < particleCount; i++) {
                let x, y, z, mixedColor;

                if (i < 3500) {
                    // (A) 星系中央球核 (Galactic Bulge)
                    const r = Math.pow(Math.random(), 2.2) * 110; 
                    const u = Math.random();
                    const v = Math.random();
                    const theta = u * 2.0 * Math.PI;
                    const phi = Math.acos(2.0 * v - 1.0);

                    x = r * Math.sin(phi) * Math.cos(theta);
                    y = r * Math.sin(phi) * Math.sin(theta) * 0.6; 
                    z = r * Math.cos(phi);

                    mixedColor = new THREE.Color(0xfff8ee).lerp(new THREE.Color(0xffaa00), Math.random() * 0.4);
                } 
                else if (i < 8000) {
                    // (B) 恒星核心棒 (Galactic Bar) - 呈现优雅梭形的密集恒星棒
                    const progress = (Math.random() - 0.5) * 2 * barLength; 
                    const taperFactor = 1.0 - Math.abs(progress) / (barLength * 1.15); // 两端收窄
                    
                    const thicknessRadial = (Math.random() - 0.5) * 65 * taperFactor;
                    const thicknessY = (Math.random() - 0.5) * 45 * taperFactor;

                    const localX = progress;
                    const localZ = thicknessRadial;

                    x = localX * Math.cos(barAngle) - localZ * Math.sin(barAngle);
                    z = localX * Math.sin(barAngle) + localZ * Math.cos(barAngle);
                    y = thicknessY;

                    mixedColor = new THREE.Color(0xfff3e0).lerp(colorBar, Math.abs(progress) / barLength);
                } 
                else {
                    // (C) 四条对称的璀璨对数主旋臂 (4 Spiral Arms) - 完美模仿英仙、人马等四大主臂
                    const armIndex = i % 4; 
                    let startAngle;

                    if (armIndex === 0 || armIndex === 1) {
                        startAngle = barAngle + (armIndex === 0 ? 0 : 0.35);
                    } else {
                        startAngle = barAngle + Math.PI + (armIndex === 2 ? 0 : 0.35);
                    }

                    const dist = Math.random() * 1500; // 旋臂延展径向距离
                    
                    // Winding Constant 设定为 7.5 弧度，旋转缠绕超一整圈，呈现极高包拢感
                    const theta = startAngle - Math.pow(dist / 1500, 0.7) * 7.5;

                    // 窄范围控制散射，保证4条旋臂轨道极度分明清晰
                    const scatter = (Math.random() - 0.5) * 45 * (1 - dist / 1800);
                    const yScatter = (Math.random() - 0.5) * 25 * (1 - dist / 1800);

                    x = Math.cos(theta) * (barLength + dist) + (Math.random() - 0.5) * scatter;
                    z = Math.sin(theta) * (barLength + dist) + (Math.random() - 0.5) * scatter;
                    y = yScatter;

                    const mixRatio = dist / 1500;
                    mixedColor = colorCenter.clone().lerp(colorEdge, mixRatio);
                }

                pos[i * 3] = x;
                pos[i * 3 + 1] = y;
                pos[i * 3 + 2] = z;

                colors[i * 3] = mixedColor.r;
                colors[i * 3 + 1] = mixedColor.g;
                colors[i * 3 + 2] = mixedColor.b;
            }

            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const mat = new THREE.PointsMaterial({
                size: 9.0,
                sizeAttenuation: true,
                map: glowTexture,
                vertexColors: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                transparent: true,
                opacity: 0
            });

            const points = new THREE.Points(geo, mat);
            group.add(points);

            // 太阳系物理位置，使用与旋臂公式完全一致的坐标点（精确嵌套在第1条旋臂上）
            const sunDist = 850;
            const sunTheta = barAngle - Math.pow(sunDist / 1500, 0.7) * 7.5;
            const sunLocalX = Math.cos(sunTheta) * (barLength + sunDist);
            const sunLocalZ = Math.sin(sunTheta) * (barLength + sunDist);

            // 科幻雷达家园锁定标记环 (平躺于旋臂 X/Z 切面上)
            const sunMarkGeo = new THREE.RingGeometry(22, 26, 32);
            const sunMarkMat = new THREE.MeshBasicMaterial({
                color: 0xffaa00,
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });
            const sunMarker = new THREE.Mesh(sunMarkGeo, sunMarkMat);
            sunMarker.position.set(sunLocalX, 0, sunLocalZ);
            sunMarker.rotation.x = Math.PI / 2; 
            group.add(sunMarker);
            group.sunMarker = sunMarker; 

            scene.add(group);
            groups.push(group);
        }

        // 5. 室女座超星系团
        function buildSupercluster() {
            const group = new THREE.Group();
            group.position.copy(worldPositions.supercluster);

            const count = 35000; 
            const geo = new THREE.BufferGeometry();
            const pos = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);

            const clusters = [];
            const clusterColors = [
                new THREE.Color(0xff9999), 
                new THREE.Color(0x99ccff), 
                new THREE.Color(0xffcc99), 
                new THREE.Color(0xcc99ff), 
                new THREE.Color(0xff99ff), 
                new THREE.Color(0x99ffcc), 
                new THREE.Color(0xffffaa)  
            ];
            
            clusters.push({
                center: new THREE.Vector3(2000, -1000, 3000),
                color: new THREE.Color(0x99ccff)
            });

            for (let i = 1; i < 30; i++) {
                clusters.push({
                    center: new THREE.Vector3(
                        (Math.random() - 0.5) * 22000,
                        (Math.random() - 0.5) * 12000,
                        (Math.random() - 0.5) * 22000
                    ),
                    color: clusterColors[i % clusterColors.length]
                });
            }

            for (let i = 0; i < count; i++) {
                let x, y, z;
                let particleColor;

                if (Math.random() < 0.75) {
                    const cluster = clusters[Math.floor(Math.random() * clusters.length)];
                    const radius = Math.pow(Math.random(), 3) * 1800; 
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.acos((Math.random() * 2) - 1);

                    x = cluster.center.x + radius * Math.sin(phi) * Math.cos(theta);
                    y = cluster.center.y + radius * Math.sin(phi) * Math.sin(theta);
                    z = cluster.center.z + radius * Math.cos(phi);
                    particleColor = cluster.color.clone();
                } else {
                    const c1 = clusters[Math.floor(Math.random() * clusters.length)];
                    const c2 = clusters[Math.floor(Math.random() * clusters.length)];
                    
                    const t = Math.random(); 
                    const noise = 1500;
                    const driftX = (Math.random() - 0.5) * noise;
                    const driftY = (Math.random() - 0.5) * noise;
                    const driftZ = (Math.random() - 0.5) * noise;

                    x = THREE.MathUtils.lerp(c1.center.x, c2.center.x, t) + driftX;
                    y = THREE.MathUtils.lerp(c1.center.y, c2.center.y, t) + driftY;
                    z = THREE.MathUtils.lerp(c1.center.z, c2.center.z, t) + driftZ;
                    
                    particleColor = c1.color.clone().lerp(c2.color, t);
                }

                pos[i * 3] = x;
                pos[i * 3 + 1] = y;
                pos[i * 3 + 2] = z;

                colors[i * 3] = particleColor.r;
                colors[i * 3 + 1] = particleColor.g;
                colors[i * 3 + 2] = particleColor.b;
            }

            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const mat = new THREE.PointsMaterial({
                size: 180, 
                map: glowTexture,
                vertexColors: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                transparent: true,
                opacity: 0
            });

            group.add(new THREE.Points(geo, mat));
            scene.add(group);
            groups.push(group);
        }

        // --- 核心：嵌套世界坐标动态逆矩阵投影算法 ---
        function syncNestingWorldPositions() {
            // 1. 实时获取旋转中银河系上“太阳系标记环”的最新世界坐标
            if (groups[2] && groups[2].sunMarker) {
                groups[2].updateMatrixWorld(true);
                groups[2].sunMarker.getWorldPosition(worldPositions.solarSystem);
                
                if (groups[1]) {
                    groups[1].position.copy(worldPositions.solarSystem);
                }
            }

            // 2. 实时获取公转中太阳系内“地球”的世界坐标
            if (groups[1] && groups[1].earthMesh) {
                groups[1].updateMatrixWorld(true);
                groups[1].earthMesh.getWorldPosition(worldPositions.earthMoon);

                if (groups[0]) {
                    groups[0].position.copy(worldPositions.earthMoon);
                }
            }
        }

        // --- 核心渐显渐隐控制体系 ---
        function updateOpacities() {
            if (isFlying) return; 

            const targetOpacities = [0, 0, 0, 0, 0, 0];
            
            switch(currentScaleIndex) {
                case 0: // 地月系
                    targetOpacities[0] = 1.0; 
                    targetOpacities[1] = 0.4; 
                    targetOpacities[2] = 0.55; 
                    break;
                case 1: // 太阳系
                    targetOpacities[0] = 0.25; 
                    targetOpacities[1] = 1.0; 
                    targetOpacities[2] = 0.65; 
                    break;
                case 2: // 银河系
                    targetOpacities[1] = 0.1; 
                    targetOpacities[2] = 1.0; 
                    targetOpacities[3] = 0.2; 
                    break;
                case 3: // 本星系群
                    targetOpacities[2] = 0.15; 
                    targetOpacities[3] = 1.0;  
                    targetOpacities[4] = 0.3;  
                    break;
                case 4: // 超星系团
                    targetOpacities[3] = 0.1;
                    targetOpacities[4] = 1.0;
                    targetOpacities[5] = 0.35; 
                    break;
                case 5: // 可观测宇宙
                    targetOpacities[4] = 0.1;
                    targetOpacities[5] = 1.0; 
                    break;
            }

            groups.forEach((group, index) => {
                if (!group) return;
                const targetOp = targetOpacities[index];
                
                if (group.currentOpacity === undefined) group.currentOpacity = 0;
                group.currentOpacity += (targetOp - group.currentOpacity) * 0.05; 
                
                group.traverse((child) => {
                    if (child.material) {
                        const maxOp = (child.material.userData && child.material.userData.maxOpacity !== undefined) 
                            ? child.material.userData.maxOpacity 
                            : 1.0;
                        child.material.opacity = group.currentOpacity * maxOp;
                        child.visible = child.material.opacity > 0.01;
                    }
                });

                if (index === 2 && group.sunMarker) {
                    group.sunMarker.visible = (currentScaleIndex === 2);
                    group.sunMarker.material.opacity = group.currentOpacity * (0.55 + Math.sin(markerPulseTime * 4) * 0.35);
                }
                if (index === 3 && group.mwMarker) {
                    group.mwMarker.visible = (currentScaleIndex === 3);
                    group.mwMarker.material.opacity = group.currentOpacity * (0.55 + Math.sin(markerPulseTime * 4) * 0.35);
                }
            });

            // 自动侦测深度尺度索引（基于当前动态世界位置）
            let detectedIndex = currentScaleIndex;
            for (let i = 0; i < scales.length; i++) {
                const center = scales[i].target; 
                const dist = camera.position.distanceTo(center);
                if (dist >= scales[i].visibleRange[0] && dist <= scales[i].visibleRange[1]) {
                    detectedIndex = i;
                    break;
                }
            }
            if (detectedIndex !== currentScaleIndex) {
                currentScaleIndex = detectedIndex;
                updateUI(detectedIndex);
            }
        }

        // --- UI 更新及滚动同步 ---
        function updateUI(index) {
            const buttons = document.querySelectorAll('button');
            buttons.forEach((btn, i) => {
                if (btn.id && btn.id.startsWith('btn-') || !btn.id) {
                    btn.className = (btn.id === `btn-${index}`) ? 'active' : '';
                }
            });

            const activeBtn = document.getElementById(`btn-${index}`);
            if (activeBtn) {
                activeBtn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
            }

            const infoPanel = document.getElementById('info-panel');
            const infoTitle = document.getElementById('info-title');
            const infoDesc = document.getElementById('info-desc');
            const infoData = document.getElementById('info-data');

            if (!isPanelCollapsed) {
                gsap.to('.info-content', {
                    opacity: 0,
                    duration: 0.2,
                    onComplete: () => {
                        infoTitle.innerText = scales[index].title;
                        infoData.innerText = scales[index].data;
                        infoDesc.innerText = scales[index].desc;
                        gsap.to('.info-content', { opacity: 1, duration: 0.3 });
                    }
                });
            } else {
                infoTitle.innerText = scales[index].title;
                infoData.innerText = scales[index].data;
                infoDesc.innerText = scales[index].desc;
            }
        }

        // --- 电影级空间对数动态追随飞行算法 ---
        function zoomTo(index) {
            isFlying = true;
            controls.enabled = false; 

            // 飞行启动前，瞬间刷新并捕获天体当前的世界公转位置
            syncNestingWorldPositions();

            const startCam = camera.position.clone();
            const startTarget = controls.target.clone();
            const flightObj = { progress: 0 };

            // 渐显/渐隐其余各天体系统组
            scales.forEach((scale, i) => {
                const group = groups[i];
                if (!group) return;
                
                const finalOpacity = (i === index || (index <= 1 && i === 2)) ? 1 : 0;
                gsap.to(group, {
                    currentOpacity: finalOpacity,
                    duration: 2.2,
                    ease: "power2.inOut",
                    onUpdate: () => {
                        group.traverse((child) => {
                            if (child.material) {
                                const maxOp = (child.material.userData && child.material.userData.maxOpacity !== undefined) 
                                    ? child.material.userData.maxOpacity 
                                    : 1.0;
                                child.material.opacity = group.currentOpacity * maxOp;
                                child.visible = child.material.opacity > 0.01;
                            }
                        });
                        if (i === 2 && group.sunMarker) {
                            group.sunMarker.visible = (index === 2);
                            group.sunMarker.material.opacity = group.currentOpacity * 0.8;
                        }
                        if (i === 3 && group.mwMarker) {
                            group.mwMarker.visible = (index === 3);
                            group.mwMarker.material.opacity = group.currentOpacity * 0.8;
                        }
                    }
                });
            });

            // 核心插值动画：在飞行中每一帧动态读取由于旋转而改变的最新目标世界坐标，保证飞行落点完美对齐！
            gsap.to(flightObj, {
                progress: 1,
                duration: 2.5,
                ease: "power2.inOut",
                onUpdate: () => {
                    syncNestingWorldPositions(); // 保持矩阵在插值期间动态刷新
                    
                    const targetCenter = scales[index].target; 
                    const targetCamOffset = scales[index].offset;
                    const targetCamPos = targetCenter.clone().add(targetCamOffset);

                    camera.position.lerpVectors(startCam, targetCamPos, flightObj.progress);
                    controls.target.lerpVectors(startTarget, targetCenter, flightObj.progress);
                },
                onComplete: () => {
                    controls.enabled = true;
                    isFlying = false;
                    currentScaleIndex = index;
                    lastTargetPos.copy(scales[index].target); // 重置并锁定当前帧的世界坐标，准备接管自由交互
                    updateUI(index);
                }
            });
        }

        // --- 初始化 & 动画主循环 ---
        function init() {
            console.log('%c宇宙尺度探索 - 华仁中学科学实验室', 'color:#4a90e2;font-size:14px;font-weight:bold;');
            console.log('制作者：蔡逸众 (ecchua79) ｜ Chinese High School ｜ 仅供教学使用，禁止商用或盗用');

            buildEarthMoon();
            buildSolarSystem();

            buildUniverse();

            document.getElementById('loading').style.opacity = 0;
            setTimeout(() => document.getElementById('loading').style.display = 'none', 1000);

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            if (window.innerWidth <= 768) {
                toggleInfoPanel();
            }

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);

            markerPulseTime += 0.015;

            // 1. 地月自转公转 (逆时针公转)
            if(groups[0] && groups[0].moon) {
                groups[0].rotation.y += 0.003;
                moonOrbitAngle -= 0.008; 
                groups[0].moon.position.x = Math.cos(moonOrbitAngle) * 6;
                groups[0].moon.position.z = Math.sin(moonOrbitAngle) * 6;
            }

            // 2. 银河系顺时针自转 (其下的4条主旋臂及太阳地标同步旋转)
            if(groups[2]) {
                groups[2].rotation.y -= 0.00035;
            }

            // 3. 室女座与总星系自转
            if(groups[4]) {
                groups[4].rotation.y += 0.00015;
            }
            if(groups[5]) {
                groups[5].rotation.y += 0.00005;
                groups[5].rotation.x += 0.00002;
            }

            // 核心：计算并同步旋转/嵌套中各天体系统的最新绝对世界位置
            syncNestingWorldPositions();

            // 4. 根据相机追踪模式进行极其平滑的参考系同步
            if (!isFlying) {
                const currentTargetPos = scales[currentScaleIndex].target;
                
                if (cameraMode === 'track') {
                    // 【轨道锁定追踪模式】：仅捕捉目标由于自转产生的 Delta 位移。
                    // 仅将 Delta 位移同时叠加到相机和对焦目标上。此时，您既跟着星体一起公转，同时鼠标的操作（旋转、拖拽平移、缩放）完美激活！
                    const delta = currentTargetPos.clone().sub(lastTargetPos);
                    camera.position.add(delta);
                    controls.target.add(delta);
                    
                    lastTargetPos.copy(currentTargetPos);
                }
                // 【星系静态俯瞰模式】：不添加任何 Delta。相机位置彻底在三维空间中绝对固定！
                // 能够完美俯视地球从脚下飘过，太阳系在旋臂一端顺时针自转前行，视角完全静止，毫无跳动违和感！
            }

            // 更新渐隐渐显系统
            updateOpacities();

            controls.update();
            renderer.render(scene, camera);
        }

        window.onload = init;

    </script>
