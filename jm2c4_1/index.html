<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 呼吸系统演示</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #1a1a2e; /* 深蓝色背景，凸显模型 */
            color: white; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }
        #ui-panel { 
            position: absolute; 
            top: 20px; 
            left: 20px; 
            background: rgba(15, 15, 25, 0.85); 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            pointer-events: none; /* 防止面板挡住鼠标拖拽交互 */
        }
        h2 { margin-top: 0; font-size: 1.2rem; margin-bottom: 10px; }
        p { font-size: 0.9rem; color: #a0a0b0; margin-bottom: 15px; }
        .legend-item { display: flex; align-items: center; margin-bottom: 8px; font-size: 0.95rem; }
        .color-box { width: 18px; height: 18px; margin-right: 12px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.3); }
    </style>
</head>
<body>
    <div id="ui-panel">
        <h2>3D 呼吸系统模型</h2>
        <p>左键拖拽旋转视角，滚轮缩放大小</p>
        <div class="legend-item"><div class="color-box" style="background:#ff7b7b;"></div>咽 (Pharynx) / 喉 (Larynx)</div>
        <div class="legend-item"><div class="color-box" style="background:#e0e0e0;"></div>气管 (Trachea)</div>
        <div class="legend-item"><div class="color-box" style="background:#5bc0eb;"></div>支气管 (Bronchi)</div>
        <div class="legend-item"><div class="color-box" style="background:rgba(255,140,160,0.4);"></div>左右肺 (Lungs - 半透明)</div>
        <div class="legend-item"><div class="color-box" style="background:#fde74c;"></div>肺泡 (Alveoli - 左肺内部)</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // 1. 初始化场景、相机和渲染器
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 25); // 设置相机的初始位置

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // 初始化鼠标控制器
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; // 添加惯性，使旋转更平滑
        controls.dampingFactor = 0.05;

        // 2. 设置光照
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6); // 环境光
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8); // 平行光
        directionalLight.position.set(10, 20, 15);
        scene.add(directionalLight);
        const backLight = new THREE.DirectionalLight(0xffffff, 0.3); // 背光，增加立体感
        backLight.position.set(-10, 10, -15);
        scene.add(backLight);

        // 3. 定义各器官的材质 (Material)
        const matPharynx = new THREE.MeshPhongMaterial({ color: 0xff7b7b, shininess: 50 });
        const matTrachea = new THREE.MeshPhongMaterial({ color: 0xe0e0e0, shininess: 30 });
        const matBronchi = new THREE.MeshPhongMaterial({ color: 0x5bc0eb, shininess: 30 });
        // 肺部材质设定为半透明
        const matLung = new THREE.MeshPhongMaterial({ 
            color: 0xff8ca0, 
            transparent: true, 
            opacity: 0.25, 
            depthWrite: false, // 修复透明物体遮挡渲染问题
            side: THREE.DoubleSide,
            shininess: 80 
        });
        const matAlveoli = new THREE.MeshPhongMaterial({ color: 0xfde74c, shininess: 100 });

        // 创建一个总组，方便整体移动
        const respiratorySystem = new THREE.Group();
        scene.add(respiratorySystem);

        // ---- 4. 开始构建解剖结构 ----

        // A. 咽 (Pharynx)
        const pharynx = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.6, 1.5, 32), matPharynx);
        pharynx.position.y = 10.5;
        respiratorySystem.add(pharynx);

        // B. 喉 (Larynx)
        const larynx = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.65, 1.2, 32), matPharynx);
        larynx.position.y = 9.15;
        respiratorySystem.add(larynx);

        // C. 气管 (Trachea)
        const trachea = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.55, 5, 32), matTrachea);
        trachea.position.y = 6.0;
        respiratorySystem.add(trachea);

        // D. 主支气管 (Main Bronchi) - 气管隆突处分叉
        // 右主支气管 (解剖学上更陡直)
        const rightBronchus = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.35, 2.5, 32), matBronchi);
        rightBronchus.position.set(-0.8, 2.7, 0);
        rightBronchus.rotation.z = Math.PI / 6; // 角度相对小
        respiratorySystem.add(rightBronchus);

        // 左主支气管 (解剖学上更平缓，为心脏腾出空间)
        const leftBronchus = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.3, 3.5, 32), matBronchi);
        leftBronchus.position.set(1.2, 2.5, 0);
        leftBronchus.rotation.z = -Math.PI / 3.5;
        respiratorySystem.add(leftBronchus);

        // E. 左右肺 (Lungs)
        // 使用形变的球体模拟肺叶形状
        const lungGeometry = new THREE.SphereGeometry(3.5, 32, 32);
        
        // 右肺 (相对大一点，分为三叶，这里简化为整体形状)
        const rightLung = new THREE.Mesh(lungGeometry, matLung);
        rightLung.scale.set(1, 1.6, 1);
        rightLung.position.set(-3.5, -0.5, 0);
        respiratorySystem.add(rightLung);

        // 左肺 (相对小一点，分为两叶，底部有心切迹)
        const leftLung = new THREE.Mesh(lungGeometry, matLung);
        leftLung.scale.set(0.9, 1.5, 0.9);
        leftLung.position.set(3.8, -0.5, 0);
        respiratorySystem.add(leftLung);

        // F. 左肺内的次级支气管分叉与肺泡 (Inner branches and Alveoli inside Left Lung)
        
        // 次级分叉 1
        const leftSubBranch1 = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.15, 2, 16), matBronchi);
        leftSubBranch1.position.set(2.8, 1.2, 0);
        leftSubBranch1.rotation.z = -Math.PI / 6;
        respiratorySystem.add(leftSubBranch1);

        // 次级分叉 2 (末梢支气管)
        const leftSubBranch2 = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.08, 1.5, 16), matBronchi);
        leftSubBranch2.position.set(3.5, 0.2, 0.5);
        leftSubBranch2.rotation.z = -Math.PI / 4;
        leftSubBranch2.rotation.x = Math.PI / 6;
        respiratorySystem.add(leftSubBranch2);

        // 肺泡簇 (Alveolar Sacs) - 挂在次级分叉2的末端
        const alveoliGroup = new THREE.Group();
        alveoliGroup.position.set(4.2, -0.5, 0.9); // 定位到支气管末端

        // 使用循环生成一团像葡萄一样的肺泡
        for(let i = 0; i < 25; i++) {
            const alveolus = new THREE.Mesh(new THREE.SphereGeometry(0.25, 16, 16), matAlveoli);
            // 随机分布在一个小球形范围内
            alveolus.position.set(
                (Math.random() - 0.5) * 0.9,
                (Math.random() - 0.5) * 0.9,
                (Math.random() - 0.5) * 0.9
            );
            alveoliGroup.add(alveolus);
        }
        respiratorySystem.add(alveoliGroup);

        // 整体往下移动一点，使其居中显示
        respiratorySystem.position.y = -4;

        // 5. 渲染循环动画
        function animate() {
            requestAnimationFrame(animate);
            // 让整个系统缓慢自转，展示 3D 效果
            respiratorySystem.rotation.y += 0.002;
            controls.update(); // 更新控制器
            renderer.render(scene, camera);
        }

        // 6. 响应浏览器窗口缩放
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 启动动画
        animate();
    </script>
</body>
</html>
