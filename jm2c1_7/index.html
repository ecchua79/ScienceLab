<!DOCTYPE html>
<html lang="zh-CN">
<!-- 化学式大挑战 | Designed for 蔡逸众 | 华仁中学 Chinese High School -->
<head>

<meta name="author" content="蔡逸众 华仁中学 Chinese High School">

<title>化学式大挑战 · Chem Formula Challenge</title>
<style>
:root{
  --bg-deep:#03050f;
  --bg-panel:#0b1024;
  --panel-border:#1c2a52;
  --cyan:#4ee8ff;
  --cyan-dim:#1c8fa8;
  --purple:#a06bff;
  --pink:#ff5da2;
  --green:#33ffb0;
  --red:#ff5566;
  --amber:#ffcc55;
  --text:#e7ecff;
  --text-dim:#8a94c0;
  font-size:16px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;background:var(--bg-deep);color:var(--text);
  font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;overflow-x:hidden;}
#starfield{position:fixed;inset:0;z-index:0;display:block;}
#app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;
  padding:18px 14px 40px;}

.glow-title{font-size:1.8rem;font-weight:800;letter-spacing:2px;text-align:center;margin:6px 0 2px;
  background:linear-gradient(90deg,var(--cyan),var(--purple),var(--pink));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 30px rgba(78,232,255,0.25);}
.subtitle{color:var(--text-dim);font-size:0.85rem;text-align:center;margin-bottom:14px;letter-spacing:1px;}

.panel{width:100%;max-width:640px;background:linear-gradient(180deg,rgba(15,22,48,0.9),rgba(8,12,28,0.9));
  border:1px solid var(--panel-border);border-radius:18px;padding:20px 18px;
  box-shadow:0 0 40px rgba(78,232,255,0.06), inset 0 0 60px rgba(78,232,255,0.02);
  backdrop-filter:blur(6px);margin-bottom:16px;}

.btn{cursor:pointer;border:1px solid var(--cyan-dim);background:rgba(78,232,255,0.06);color:var(--text);
  padding:12px 18px;border-radius:12px;font-size:1rem;font-weight:600;letter-spacing:1px;
  transition:all .15s ease;text-align:center;user-select:none;}
.btn:hover{background:rgba(78,232,255,0.15);border-color:var(--cyan);box-shadow:0 0 18px rgba(78,232,255,0.25);}
.btn:active{transform:scale(0.97);}
.btn-primary{background:linear-gradient(90deg,var(--cyan),var(--purple));color:#04081a;border:none;
  box-shadow:0 4px 20px rgba(160,107,255,0.35);}
.btn-primary:hover{filter:brightness(1.1);}
.btn-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:14px;}

/* ---- Cover ---- */
#cover ul{color:var(--text-dim);font-size:0.92rem;line-height:1.75;padding-left:1.2em;margin:10px 0;}
#cover li{margin-bottom:2px;}
#cover .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:0.75rem;font-weight:700;
  margin:3px 4px 3px 0;border:1px solid;}
.badge-1{color:var(--cyan);border-color:var(--cyan-dim);background:rgba(78,232,255,0.08);}
.badge-2{color:var(--purple);border-color:#5b3fa8;background:rgba(160,107,255,0.08);}
.badge-3{color:var(--pink);border-color:#a83f6e;background:rgba(255,93,162,0.08);}

/* ---- progress ---- *峇株吧辖华仁中学蔡逸众制作 |/
#progressWrap{width:100%;max-width:640px;margin-bottom:10px;}
#progressBarBg{width:100%;height:8px;border-radius:6px;background:rgba(255,255,255,0.06);overflow:hidden;
  border:1px solid rgba(255,255,255,0.08);}
#progressBarFill{height:100%;width:0%;background:linear-gradient(90deg,var(--cyan),var(--purple),var(--pink));
  transition:width .3s ease;box-shadow:0 0 10px rgba(78,232,255,0.6);}
#progressLabel{display:flex;justify-content:space-between;font-size:0.75rem;color:var(--text-dim);margin-top:5px;letter-spacing:0.5px;}

/* ---- quiz ---- */
.part-tag{display:inline-block;font-size:0.75rem;font-weight:700;letter-spacing:2px;padding:4px 12px;
  border-radius:20px;margin-bottom:10px;}
.qnum{color:var(--text-dim);font-size:0.85rem;margin-bottom:6px;}
.question-box{text-align:center;padding:26px 10px;margin-bottom:18px;border-radius:14px;
  background:radial-gradient(circle at 50% 0%,rgba(78,232,255,0.08),transparent 70%);
  border:1px solid rgba(78,232,255,0.15);}
.question-formula{font-size:2.4rem;font-weight:700;color:var(--cyan);letter-spacing:1px;
  text-shadow:0 0 20px rgba(78,232,255,0.4);}
.question-name{font-size:1.7rem;font-weight:700;color:#fff;letter-spacing:2px;}
.options{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:420px){.options{grid-template-columns:1fr;}}
.opt-btn{cursor:pointer;border:1px solid var(--panel-border);background:rgba(255,255,255,0.03);
  color:var(--text);padding:14px 10px;border-radius:12px;font-size:1.05rem;text-align:center;
  transition:all .15s ease;min-height:56px;display:flex;align-items:center;justify-content:center;}
.opt-btn:active{transform:scale(0.97);}
.opt-btn.correct{background:rgba(51,255,176,0.15);border-color:var(--green);color:var(--green);
  box-shadow:0 0 16px rgba(51,255,176,0.35);}
.opt-btn.wrong{background:rgba(255,85,102,0.15);border-color:var(--red);color:var(--red);
  box-shadow:0 0 16px rgba(255,85,102,0.35);}
.opt-btn.disabled{pointer-events:none;opacity:0.55;}
.opt-btn.dim{opacity:0.35;pointer-events:none;}

/* ---- matching ----峇株吧辖蔡逸众制作 */
.match-wrap{display:flex;gap:14px;justify-content:space-between;}
.match-col{flex:1;display:flex;flex-direction:column;gap:10px;}
.match-card{cursor:pointer;border:1px solid var(--panel-border);background:rgba(255,255,255,0.03);
  color:var(--text);padding:13px 8px;border-radius:12px;font-size:1.05rem;text-align:center;
  transition:all .15s ease;min-height:52px;display:flex;align-items:center;justify-content:center;line-height:1.3;}
.match-card.selected{border-color:var(--amber);background:rgba(255,204,85,0.12);box-shadow:0 0 14px rgba(255,204,85,0.35);}
.match-card.matched{border-color:var(--green);background:rgba(51,255,176,0.1);color:var(--green);
  opacity:0.7;pointer-events:none;}
.match-card.wrongflash{border-color:var(--red);background:rgba(255,85,102,0.18);}
.match-round-label{text-align:center;color:var(--text-dim);font-size:0.8rem;margin-bottom:10px;letter-spacing:1px;}

/* ---- feedback ---- 峇株吧辖华仁中学蔡逸众制作*/
#feedbackToast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
  padding:10px 22px;border-radius:30px;font-weight:700;font-size:0.95rem;opacity:0;
  transition:all .25s ease;pointer-events:none;z-index:50;letter-spacing:1px;}
#feedbackToast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#feedbackToast.good{background:rgba(51,255,176,0.15);border:1px solid var(--green);color:var(--green);
  box-shadow:0 0 20px rgba(51,255,176,0.35);}
#feedbackToast.bad{background:rgba(255,85,102,0.15);border:1px solid var(--red);color:var(--red);
  box-shadow:0 0 20px rgba(255,85,102,0.35);}

/* ---- results ---- */
#resultsPanel{text-align:center;}
.score-ring{width:160px;height:160px;margin:10px auto 20px;position:relative;}
.score-ring svg{transform:rotate(-90deg);}
.score-ring .bgring{stroke:rgba(255,255,255,0.08);}
.score-ring .fgring{stroke:url(#ringGrad);stroke-linecap:round;transition:stroke-dashoffset 1s ease;}
.score-ring-label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.score-ring-label .pct{font-size:2rem;font-weight:800;color:var(--cyan);}
.score-ring-label .sub{font-size:0.7rem;color:var(--text-dim);letter-spacing:1px;}
.result-row{display:flex;justify-content:space-between;padding:10px 6px;border-bottom:1px solid rgba(255,255,255,0.06);
  font-size:0.95rem;}
.result-row span:first-child{color:var(--text-dim);}
.result-row span:last-child{font-weight:700;color:var(--cyan);}
.rank-title{font-size:1.3rem;font-weight:800;margin:8px 0 4px;
  background:linear-gradient(90deg,var(--cyan),var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent;}

footer{margin-top:24px;text-align:center;color:#3a4470;font-size:0.72rem;letter-spacing:1px;}
</style>

<body>
<canvas id="starfield"></canvas>
<div id="app">
  <div class="glow-title">⚗ 化学式大挑战 ⚗</div>
  <div class="subtitle">CHEMICAL FORMULA CHALLENGE · 初中化学</div>

  <div id="progressWrap" style="display:none;">
    <div id="progressBarBg"><div id="progressBarFill"></div></div>
    <div id="progressLabel"><span id="progressText">第 1 / 30 题</span><span id="scoreText">得分：0</span></div>
  </div>

  <div class="panel" id="cover">
    <ul>
      <li><span class="badge badge-1">第一部分</span>看<b>化学式</b>，选出正确的<b>中文名称</b>（10 题）</li>
      <li><span class="badge badge-2">第二部分</span>看<b>中文名称</b>，选出正确的<b>化学式</b>（10 题）</li>
      <li><span class="badge badge-3">第三部分</span><b>配对题</b>：点击左右卡片完成化学式与中文名称配对（10 题，分两组）</li>
    </ul>
    <p style="color:var(--text-dim);font-size:0.85rem;">题库共 40 种初中生已学过的常见物质，每次开始都会<b style="color:var(--cyan)">随机抽题、随机打乱选项</b>，可以重复挑战！</p>
    <div class="btn-row"><div class="btn btn-primary" id="startBtn" style="width:100%;">🚀 开始挑战</div></div>
  </div>

  <div class="panel" id="quizPanel" style="display:none;"></div>

  <div class="panel" id="resultsPanel" style="display:none;"></div>

  <footer>
    化学式大挑战 · 设计：蔡逸众 · 华仁中学 Chinese High School
  </footer>
</div>
<div id="feedbackToast"></div>

<script>
/* 化学式大挑战 — built for 蔡逸众 华仁中学 Chinese High School */
console.log("%c化学式大挑战 · designed for 蔡逸众 · 华仁中学 Chinese High School","color:#4ee8ff;font-weight:bold;");

/* ---------------- starfield background ---------------- */
(function(){
  const cv=document.getElementById('starfield');
  const ctx=cv.getContext('2d');
  let w,h,stars=[];
  function resize(){
    w=cv.width=window.innerWidth; h=cv.height=window.innerHeight;
    const count=Math.floor((w*h)/9000);
    stars=[];
    for(let i=0;i<count;i++){
      stars.push({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.4+0.3,
        s:Math.random()*0.5+0.1,tw:Math.random()*Math.PI*2});
    }
  }
  //Made by ecchua79
  function draw(t){
    ctx.clearRect(0,0,w,h);
    const grad=ctx.createRadialGradient(w/2,h*0.2,0,w/2,h*0.2,Math.max(w,h)*0.8);
    grad.addColorStop(0,'rgba(30,20,70,0.35)'); grad.addColorStop(1,'rgba(3,5,15,0)');
    ctx.fillStyle=grad; ctx.fillRect(0,0,w,h);
    for(const s of stars){
      s.y+=s.s;
      if(s.y>h){s.y=0;s.x=Math.random()*w;}
      const alpha=0.5+0.5*Math.sin(t*0.001+s.tw);
      ctx.beginPath();
      ctx.fillStyle=`rgba(180,210,255,${(0.3+0.5*alpha).toFixed(2)})`;
      ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fill();
    }
    requestAnimationFrame(draw);
  }
  window.addEventListener('resize',resize);
  resize(); requestAnimationFrame(draw);
})();

/* ---------------- data bank (junior secondary chemistry) ---------------峇株吧辖华仁中学蔡逸众制作 */
const BANK=[
  {f:"H<sub>2</sub>O",n:"水"},
  {f:"O<sub>2</sub>",n:"氧气"},
  {f:"CO<sub>2</sub>",n:"二氧化碳"},
  {f:"N<sub>2</sub>",n:"氮气"},
  {f:"H<sub>2</sub>",n:"氢气"},
  {f:"CO",n:"一氧化碳"},
  {f:"NaCl",n:"氯化钠"},
  {f:"HCl",n:"盐酸"},
  {f:"NaOH",n:"氢氧化钠"},
  {f:"Ca(OH)<sub>2</sub>",n:"氢氧化钙"},
  {f:"CaCO<sub>3</sub>",n:"碳酸钙"},
  {f:"CaO",n:"氧化钙"},
  {f:"H<sub>2</sub>SO<sub>4</sub>",n:"硫酸"},
  {f:"HNO<sub>3</sub>",n:"硝酸"},
  {f:"CH<sub>4</sub>",n:"甲烷"},
  {f:"NH<sub>3</sub>",n:"氨气"},
  {f:"C",n:"碳"},
  {f:"S",n:"硫磺"},
  {f:"Fe",n:"铁"},
  {f:"Cu",n:"铜"},
  {f:"Zn",n:"锌"},
  {f:"Al",n:"铝"},
  {f:"Mg",n:"镁"},
  {f:"O<sub>3</sub>",n:"臭氧"},
  {f:"CuSO<sub>4</sub>",n:"硫酸铜"},
  {f:"AgNO<sub>3</sub>",n:"硝酸银"},
  {f:"ZnCl<sub>2</sub>",n:"氯化锌"},
  {f:"KMnO<sub>4</sub>",n:"高锰酸钾"},
  {f:"Na<sub>2</sub>CO<sub>3</sub>",n:"碳酸钠"},
  {f:"MgO",n:"氧化镁"},
  {f:"Fe<sub>2</sub>O<sub>3</sub>",n:"氧化铁"},
  {f:"KOH",n:"氢氧化钾"},
  {f:"FeCl<sub>3</sub>",n:"氯化铁"},
  {f:"CuO",n:"氧化铜"},
  {f:"Na<sub>2</sub>SO<sub>4</sub>",n:"硫酸钠"},
  {f:"AgCl",n:"氯化银"},
  {f:"BaCl<sub>2</sub>",n:"氯化钡"},
  {f:"Mg(OH)<sub>2</sub>",n:"氢氧化镁"},
  {f:"K<sub>2</sub>CO<sub>3</sub>",n:"碳酸钾"},
  {f:"Zn(OH)<sub>2</sub>",n:"氢氧化锌"}
];

/* ---------------- helpers ---------------- */
function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function sampleUnique(arr,n){ return shuffle(arr).slice(0,n); }

/* ---------------- game state ----------------华仁中学蔡逸众制作 */
let state={
  part1:[], part2:[], match1:[], match2:[],
  score:0, totalQ:30, currentIndex:0,
  part1Score:0, part2Score:0, matchScore:0,
  matchState:null
};
//峇株吧辖华仁中学蔡逸众制作
function buildGame(){
  state.part1 = sampleUnique(BANK,10).map(item=>{
    const distractors = sampleUnique(BANK.filter(b=>b.n!==item.n),3);
    const options = shuffle([item, ...distractors]);
    return {item, options};
  });
  state.part2 = sampleUnique(BANK,10).map(item=>{
    const distractors = sampleUnique(BANK.filter(b=>b.f!==item.f),3);
    const options = shuffle([item, ...distractors]);
    return {item, options};
  });
  const matchPool = sampleUnique(BANK,10);
  state.match1 = matchPool.slice(0,5);
  state.match2 = matchPool.slice(5,10);
  state.score=0; state.currentIndex=0;
  state.part1Score=0; state.part2Score=0; state.matchScore=0;
}

/* ---------------- flow control ---------------- */
// sequence: part1 q0-9 (index0-9), part2 q0-9 (index10-19), match1(index20-24), match2(index25-29)                                                                                                                                                                                 峇株吧辖华仁中学蔡逸众制作
function totalStepsDone(){ return state.currentIndex; }

function showToast(msg, good){
  const t=document.getElementById('feedbackToast');
  t.textContent=msg;
  t.className='show '+(good?'good':'bad');
  clearTimeout(showToast._tm);
  showToast._tm=setTimeout(()=>{ t.className=''; },850);
}

function updateProgress(){
  const pct = Math.round((state.currentIndex/30)*100);
  document.getElementById('progressBarFill').style.width=pct+'%';
  document.getElementById('progressText').textContent=`第 ${Math.min(state.currentIndex+1,30)} / 30 题`;
  document.getElementById('scoreText').textContent=`得分：${state.score}`;
}

document.getElementById('startBtn').addEventListener('click',()=>{
  buildGame();
  document.getElementById('cover').style.display='none';
  document.getElementById('progressWrap').style.display='block';
  document.getElementById('quizPanel').style.display='block';
  document.getElementById('resultsPanel').style.display='none';
  renderStep();
});

function renderStep(){
  updateProgress();
  const idx=state.currentIndex;
  if(idx<10){ renderMCQ('part1', idx, {tag:'第一部分 · 化学式 → 中文名称', color:'badge-1', mode:'f2n'}); }
  else if(idx<20){ renderMCQ('part2', idx-10, {tag:'第二部分 · 中文名称 → 化学式', color:'badge-2', mode:'n2f'}); }
  else if(idx<25){ renderMatch('match1', idx-20, 1); }
  else if(idx<30){ renderMatch('match2', idx-25, 2); }
  else { renderResults(); }
}

function renderMCQ(partKey, qIndex, cfg){
  const q = state[partKey][qIndex];
  const panel = document.getElementById('quizPanel');
  const questionHtml = cfg.mode==='f2n'
    ? `<div class="question-formula">${q.item.f}</div>`
    : `<div class="question-name">${q.item.n}</div>`;

  panel.innerHTML = `
    <div class="part-tag ${cfg.color}">${cfg.tag}</div>
    <div class="qnum">第 ${qIndex+1} / 10 题（本部分）</div>
    <div class="question-box">${questionHtml}</div>
    <div class="options" id="optsWrap"></div>
  `;
  const wrap = document.getElementById('optsWrap');
  q.options.forEach(opt=>{
    const btn=document.createElement('div');
    btn.className='opt-btn';
    btn.innerHTML = cfg.mode==='f2n' ? opt.n : opt.f;
    btn.addEventListener('click',()=>{
      const correct = cfg.mode==='f2n' ? (opt.n===q.item.n) : (opt.f===q.item.f);
      const allBtns=[...wrap.children];
      allBtns.forEach(b=>b.classList.add('disabled'));
      if(correct){
        btn.classList.add('correct');
        state.score++;
        if(partKey==='part1') state.part1Score++; else state.part2Score++;
        showToast('✔ 答对了！', true);
      } else {
        btn.classList.add('wrong');
        allBtns.forEach(b=>{
          const bOpt = q.options[allBtns.indexOf(b)];
          const isCorrectOpt = cfg.mode==='f2n' ? (bOpt.n===q.item.n) : (bOpt.f===q.item.f);
          if(isCorrectOpt) b.classList.add('correct');
        });
        showToast('✘ 答错了', false);
      }
      setTimeout(()=>{ state.currentIndex++; renderStep(); }, 900);
    });
    wrap.appendChild(btn);
  });
}

function renderMatch(matchKey, roundQIndexOffset, roundNum){
  const pairs = state[matchKey];
  const leftItems = shuffle(pairs.map((p,i)=>({id:i, label:p.f, type:'f'})));
  const rightItems = shuffle(pairs.map((p,i)=>({id:i, label:p.n, type:'n'})));

  state.matchState = {
    matchKey, pairs, leftItems, rightItems,
    matchedIds:new Set(), selectedLeft:null, selectedRight:null,
    lockInput:false
  };

  const panel = document.getElementById('quizPanel');
  panel.innerHTML = `
    <div class="part-tag badge-3">第三部分 · 配对题（第 ${roundNum} 组，共 2 组）</div>
    <div class="match-round-label">点击左边的化学式，再点击右边对应的中文名称</div>
    <div class="match-wrap">
      <div class="match-col" id="matchLeft"></div>
      <div class="match-col" id="matchRight"></div>
    </div>
  `;
  const leftCol=document.getElementById('matchLeft');
  const rightCol=document.getElementById('matchRight');
  leftItems.forEach(it=>{
    const card=document.createElement('div');
    card.className='match-card';
    card.innerHTML=it.label;
    card.dataset.id=it.id;
    card.dataset.side='left';
    card.addEventListener('click',()=>onMatchClick(card,it,'left'));
    leftCol.appendChild(card);
  });
  rightItems.forEach(it=>{
    const card=document.createElement('div');
    card.className='match-card';
    card.innerHTML=it.label;
    card.dataset.id=it.id;
    card.dataset.side='right';
    card.addEventListener('click',()=>onMatchClick(card,it,'right'));
    rightCol.appendChild(card);
  });
}

function onMatchClick(cardEl, item, side){
  const ms = state.matchState;
  if(ms.lockInput) return;
  if(ms.matchedIds.has(item.id) && cardEl.classList.contains('matched')) return;

  if(side==='left'){
    if(ms.selectedLeftEl) ms.selectedLeftEl.classList.remove('selected');
    ms.selectedLeft=item; ms.selectedLeftEl=cardEl;
    cardEl.classList.add('selected');
  } else {
    if(ms.selectedRightEl) ms.selectedRightEl.classList.remove('selected');
    ms.selectedRight=item; ms.selectedRightEl=cardEl;
    cardEl.classList.add('selected');
  }

  if(ms.selectedLeft && ms.selectedRight){
    ms.lockInput=true;
    const isMatch = ms.selectedLeft.id===ms.selectedRight.id;
    setTimeout(()=>{
      if(isMatch){
        ms.selectedLeftEl.classList.remove('selected');
        ms.selectedRightEl.classList.remove('selected');
        ms.selectedLeftEl.classList.add('matched');
        ms.selectedRightEl.classList.add('matched');
        ms.matchedIds.add(ms.selectedLeft.id);
        state.score++; state.matchScore++;
        showToast('✔ 配对成功！', true);
      } else {
        ms.selectedLeftEl.classList.add('wrongflash');
        ms.selectedRightEl.classList.add('wrongflash');
        showToast('✘ 配对错误', false);
        setTimeout(()=>{
          ms.selectedLeftEl.classList.remove('wrongflash','selected');
          ms.selectedRightEl.classList.remove('wrongflash','selected');
        },500);
      }
      ms.selectedLeft=null; ms.selectedRight=null;
      ms.selectedLeftEl=null; ms.selectedRightEl=null;
      ms.lockInput=false;

      if(ms.matchedIds.size===ms.pairs.length){
        setTimeout(()=>{
          state.currentIndex += ms.pairs.length;
          renderStep();
        }, 500);
      }
    }, isMatch?400:650);
  }
}

/* ---------------- results ----------------Made by ecchua79 */
function renderResults(){
  document.getElementById('progressWrap').style.display='none';
  document.getElementById('quizPanel').style.display='none';
  const panel=document.getElementById('resultsPanel');
  panel.style.display='block';

  const pct = Math.round((state.score/30)*100);
  const circumference = 2*Math.PI*70;
  const offset = circumference*(1-pct/100);

  let rank, rankColor;
  if(pct>=90){ rank='⭐ 化学大师 ⭐'; }
  else if(pct>=75){ rank='🔬 化学高手'; }
  else if(pct>=60){ rank='🧪 稳步进阶'; }
  else { rank='📘 继续加油'; }

  panel.innerHTML = `
    <div class="rank-title">${rank}</div>
    <div class="score-ring">
      <svg width="160" height="160">
        <defs>
          <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#4ee8ff"/>
            <stop offset="50%" stop-color="#a06bff"/>
            <stop offset="100%" stop-color="#ff5da2"/>
          </linearGradient>
        </defs>
        <circle class="bgring" cx="80" cy="80" r="70" fill="none" stroke-width="12"/>
        <circle class="fgring" cx="80" cy="80" r="70" fill="none" stroke-width="12"
          stroke-dasharray="${circumference}" stroke-dashoffset="${circumference}"/>
      </svg>
      <div class="score-ring-label"><div class="pct">${pct}%</div><div class="sub">总正确率</div></div>
    </div>
    <div class="result-row"><span>总得分</span><span>${state.score} / 30</span></div>
    <div class="result-row"><span>第一部分（化学式 → 名称）</span><span>${state.part1Score} / 10</span></div>
    <div class="result-row"><span>第二部分（名称 → 化学式）</span><span>${state.part2Score} / 10</span></div>
    <div class="result-row"><span>第三部分（配对题）</span><span>${state.matchScore} / 10</span></div>
    <div class="btn-row">
      <div class="btn btn-primary" id="restartBtn">🔁 再玩一次（重新随机抽题）</div>
    </div>
  `;
  requestAnimationFrame(()=>{
    const ring=panel.querySelector('.fgring');
    if(ring) ring.style.strokeDashoffset = offset;
  });
  document.getElementById('restartBtn').addEventListener('click',()=>{
    document.getElementById('resultsPanel').style.display='none';
    document.getElementById('cover').style.display='block';
  });
}
</script>
