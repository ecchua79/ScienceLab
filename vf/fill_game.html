<!-- 峇株吧辖华仁中学 蔡逸众制作 -->
<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>海洋竞速</title>
<style>
  :root{
    --bg:#0f172a; --gold:#facc15; --p1:#3b82f6; --p2:#ef4444;
    --abyss:#04121f; --deep:#0a2f45; --mid:#0e5c73; --glow:#2dd4c7; --coral:#ff6f5e; --sand:#f5dfa8; --foam:#dffcff;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft YaHei","PingFang SC",sans-serif;}
  body{background:var(--bg);color:#fff;height:100vh;overflow:hidden;}

  /* ---------- 设置界面（封面·海洋主题） ---------- */
  #setupScreen{height:100vh;overflow-y:auto;overflow-x:hidden;display:flex;justify-content:center;padding:32px 16px 46px;position:relative;
    background:
      radial-gradient(ellipse at 50% -8%, rgba(45,212,199,.20) 0%, transparent 48%),
      linear-gradient(180deg, var(--deep) 0%, var(--abyss) 55%, #010609 100%);}
  #setupScreen::before{content:'';position:absolute;inset:0;pointer-events:none;z-index:0;opacity:.35;
    background:repeating-linear-gradient(100deg, rgba(255,255,255,.05) 0 2px, transparent 2px 46px);
    animation:causticDrift 16s linear infinite;}
  @keyframes causticDrift{0%{background-position:0 0;}100%{background-position:460px 260px;}}
  #bubbleField{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:1;}
  .bubble{position:absolute;bottom:-10%;border-radius:50%;opacity:0;
    background:radial-gradient(circle at 30% 30%, rgba(255,255,255,.9), rgba(160,240,255,.15) 60%, transparent 72%);
    animation:bubbleRise linear infinite;}
  @keyframes bubbleRise{
    0%{transform:translateY(0) translateX(0);opacity:0;}
    8%{opacity:.6;}
    92%{opacity:.45;}
    100%{transform:translateY(-118vh) translateX(var(--drift,24px));opacity:0;}
  }
  .setupInner{width:100%;max-width:720px;display:flex;flex-direction:column;align-items:center;gap:20px;position:relative;z-index:2;}
  #setupScreen h1{font-size:2.2rem;color:var(--foam);text-align:center;letter-spacing:.5px;
    text-shadow:0 0 18px rgba(45,212,199,.55), 0 2px 10px rgba(0,0,0,.4);}
  .tagline{color:#8fd8d0;font-size:.95rem;margin-top:-10px;text-align:center;opacity:.85;}
  .rulesCard{width:100%;background:rgba(9,44,58,.55);border:1px solid rgba(45,212,199,.28);border-radius:20px;padding:20px 24px;
    backdrop-filter:blur(3px);box-shadow:0 8px 28px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.05);}
  .rulesCard h2{font-size:1.1rem;color:var(--glow);margin-bottom:10px;}
  .rulesCard ul{padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:.95rem;line-height:1.5;color:#dff5f3;}
  .rulesCard b{color:var(--sand);}

  .gradeTabs{display:flex;gap:12px;}
  .gradeTabs button{padding:10px 28px;font-size:1.05rem;border:1px solid rgba(45,212,199,.3);border-radius:999px;background:rgba(6,30,42,.6);color:#cdeef0;cursor:pointer;transition:.2s;}
  .gradeTabs button:hover{border-color:var(--glow);}
  .gradeTabs button.active{background:linear-gradient(160deg,#2dd4c7,#0e8a86);color:#04211f;font-weight:bold;border-color:transparent;box-shadow:0 4px 16px rgba(45,212,199,.35);}

  .chapterGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;width:100%;}
  .chapterBtn{padding:14px 6px;border-radius:14px;border:2px solid rgba(45,212,199,.22);background:linear-gradient(160deg, rgba(14,92,115,.45), rgba(6,28,40,.65));color:#eafffd;font-size:.95rem;cursor:pointer;transition:.18s;position:relative;overflow:hidden;}
  .chapterBtn:hover{border-color:var(--glow);transform:translateY(-3px);box-shadow:0 8px 18px rgba(45,212,199,.25);}
  .chapterBtn.selected{outline:3px solid var(--coral);border-color:transparent;}
  .chapterBtn.disabled{opacity:.4;cursor:not-allowed;border-style:dashed;background:rgba(20,30,38,.5);}
  .chapterBtn.disabled:hover{transform:none;box-shadow:none;border-color:rgba(148,163,184,.25);}
  .chapterBtn small{display:block;font-size:.68rem;color:#9fd7d2;margin-top:4px;}

  #startBtn{padding:16px 48px;font-size:1.3rem;background:linear-gradient(160deg,#ff8a72,var(--coral));color:#2a0f0a;border:none;border-radius:999px;font-weight:bold;cursor:pointer;
    box-shadow:0 8px 24px rgba(255,111,94,.4);transition:.18s;position:relative;z-index:2;}
  #startBtn:disabled{opacity:.35;cursor:not-allowed;box-shadow:none;background:#334155;color:#94a3b8;}
  #startBtn:not(:disabled):hover{transform:translateY(-2px) scale(1.02);box-shadow:0 10px 30px rgba(255,111,94,.55);}

  @media (max-width:600px){
    .chapterGrid{grid-template-columns:repeat(2,1fr);}
    #setupScreen h1{font-size:1.6rem;}
    .rulesCard{padding:16px;}
    .rulesCard ul{font-size:.88rem;}
  }

  /* ---------- 游戏界面（品字型·海洋竞速） ---------- */
  #gameScreen{display:none;height:100vh;flex-direction:column;}

  /* 上层：天空 */
  #topPanel{flex:1 1 33.33%;background:linear-gradient(180deg, #bfe4ff 0%, #dff2ff 60%, #f3fbff 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;position:relative;overflow:hidden;}
  #cloudField{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0;}
  .cloud{position:absolute;width:110px;height:36px;border-radius:50px;background:#fff;opacity:.9;
    box-shadow:28px -13px 0 -4px #fff, 56px 3px 0 -8px #fff, -26px 5px 0 -6px #fff;animation:cloudDrift linear infinite;}
  @keyframes cloudDrift{0%{transform:translateX(-20vw);}100%{transform:translateX(120vw);}}
  #questionCard{background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.85);border-radius:20px;padding:18px 30px;max-width:900px;backdrop-filter:blur(2px);position:relative;z-index:1;box-shadow:0 6px 20px rgba(30,90,130,.15);}
  #scoreBar{position:absolute;top:10px;left:0;right:0;display:flex;justify-content:space-between;padding:0 30px;font-size:1.1rem;font-weight:bold;z-index:1;}
  #scoreBar .s1{color:#1d4ed8;} #scoreBar .s2{color:#dc2626;}
  #questionText{font-size:2.1rem;line-height:1.65;max-width:900px;font-weight:600;color:#0b3350;}
  #questionMeta{font-size:.9rem;color:#5b7d92;margin-top:10px;}
  .filledAnswer{color:#0e8a63;font-weight:bold;text-decoration:underline;text-underline-offset:4px;}

  /* 下层：海洋（左右统一色，中间渔网+进度条） */
  #bottomPanel{flex:2 1 66.66%;display:flex;position:relative;
    background:radial-gradient(ellipse at 50% 100%, #0e6e82 0%, #0a3a52 55%, #051f2e 100%);}
  .playerPanel{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;position:relative;overflow-y:auto;}
  #centerNet{flex:0 0 60px;position:relative;display:flex;justify-content:space-between;align-items:stretch;padding:10px 8px;z-index:5;}
  .netTexture{position:absolute;inset:0;opacity:.55;pointer-events:none;
    background-image:repeating-linear-gradient(50deg, rgba(255,255,255,.28) 0 2px, transparent 2px 15px),
                      repeating-linear-gradient(-50deg, rgba(255,255,255,.28) 0 2px, transparent 2px 15px);}
  .netProgress{position:relative;width:14px;height:100%;border-radius:8px;background:rgba(255,255,255,.14);overflow:visible;box-shadow:inset 0 0 6px rgba(0,0,0,.3);}
  .netProgress .fill{position:absolute;bottom:0;left:0;right:0;height:0%;border-radius:8px 8px 4px 4px;transition:height .45s ease;}
  #netFill1{background:linear-gradient(to top,#1d4ed8,#60a5fa);}
  #netFill2{background:linear-gradient(to top,#b91c1c,#f87171);}
  .netProgressIcon{position:absolute;left:50%;bottom:0%;transform:translate(-50%,-50%);font-size:1.3rem;line-height:1;transition:bottom .45s ease;
    width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, rgba(255,255,255,.9), rgba(255,255,255,.25) 60%, rgba(255,255,255,.05) 100%);
    box-shadow:0 2px 6px rgba(0,0,0,.4);}
  #countdownDisplay{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:6rem;font-weight:bold;color:var(--gold);z-index:10;text-shadow:0 0 20px rgba(0,0,0,.6);}

  /* 气泡答案 */
  .optionsWrap{display:flex;flex-wrap:wrap;gap:16px;width:100%;align-items:center;justify-content:center;padding:0 8px;}
  .optBtn{min-width:104px;min-height:104px;padding:12px 20px;border-radius:50%;border:2px solid rgba(255,255,255,.4);
    background:radial-gradient(circle at 32% 26%, rgba(255,255,255,.55), rgba(255,255,255,.08) 42%, rgba(150,215,255,.22) 75%),
               linear-gradient(160deg, rgba(60,150,190,.4), rgba(10,55,85,.55));
    color:#fff;font-size:1.15rem;font-weight:700;cursor:pointer;text-align:center;line-height:1.25;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 16px rgba(0,0,0,.3), inset 0 2px 5px rgba(255,255,255,.3);
    transition:transform .15s, box-shadow .15s, background .15s;
    animation:bubbleDrift 6s ease-in-out infinite;}
  @keyframes bubbleDrift{
    0%{transform:translateY(20px) scale(.5);opacity:0;}
    8%{opacity:1;transform:translateY(10px) scale(1.06);}
    16%{transform:translateY(4px) scale(1);}
    88%{opacity:1;transform:translateY(-52px) scale(1);}
    100%{transform:translateY(-60px) scale(.85);opacity:0;}
  }
  .optBtn:hover:not(:disabled){transform:scale(1.06);box-shadow:0 10px 22px rgba(0,0,0,.35), inset 0 2px 5px rgba(255,255,255,.35);animation-play-state:paused;}
  .optBtn.correct{background:radial-gradient(circle at 32% 26%, rgba(255,255,255,.6), rgba(22,163,74,.9)) !important;animation:none;}
  .optBtn.wrong{background:radial-gradient(circle at 32% 26%, rgba(255,255,255,.35), rgba(153,27,27,.9)) !important;animation:none;opacity:.55;}
  .optBtn:disabled{cursor:not-allowed;}
  .feedback{font-size:1.4rem;font-weight:bold;min-height:2rem;color:#fff;}
  .milestoneFish{position:fixed;height:80px;width:auto;pointer-events:none;z-index:60;
    filter:drop-shadow(0 6px 12px rgba(0,0,0,.45));}
  .feedback.good{color:#5ee6c8;} .feedback.bad{color:#ff9d94;}

  /* 答对后从海底升到海面的大字气泡 */
  .correctBubble{position:fixed;left:0;top:0;transform:translate(-50%,0);white-space:nowrap;pointer-events:none;z-index:50;
    font-size:1.9rem;font-weight:800;color:#04372c;
    background:radial-gradient(circle at 32% 26%, #fff, #bdf5e6 55%, #6fe0c0 100%);
    padding:14px 28px;border-radius:999px;box-shadow:0 0 0 4px rgba(255,255,255,.35), 0 8px 20px rgba(0,0,0,.35);}

  #resultScreen{display:none;height:100vh;flex-direction:column;align-items:center;justify-content:center;gap:20px;}
  #resultScreen h1{font-size:3rem;color:var(--gold);}
  #resultScreen button{padding:12px 30px;font-size:1.1rem;background:var(--gold);color:#0f172a;border:none;border-radius:8px;cursor:pointer;}

  #madeByFooter{position:fixed;left:0;right:0;bottom:2px;text-align:center;font-size:.65rem;color:#18202f;pointer-events:none;z-index:1;letter-spacing:.5px;}
</style>
</head>
<body>

<div id="setupScreen">
  <div id="bubbleField"></div>
  <div class="setupInner">
    <h1>🐠 海洋竞速</h1>
    <p class="tagline">〜 潜入知识海域 · 抢答制填空复习游戏 〜</p>

    <div class="rulesCard">
      <h2>🧭 游戏规则</h2>
      <ul>
        <li>题目出现后<b>倒数5秒</b>，倒数结束双方才能看到选项</li>
        <li>两边选项内容相同、位置各自打乱，<b>抢先点对得1分</b></li>
        <li>点错会被锁定，需等待对手作答；若双方都答错，重新倒数换一批选项，最多重来3轮</li>
        <li>3轮都无人答对，<b>双方各扣1分</b>，进入下一题</li>
        <li>双空题的①②各自独立抢答、各得1分，谁先点对算谁的</li>
        <li>任意一方<b>率先达到10分</b>即获胜，无需等对方分数</li>
      </ul>
    </div>

    <div class="gradeTabs">
      <button id="gradeBtn1" class="active" onclick="selectGrade(1)">🏝️ 浅海区・初一</button>
      <button id="gradeBtn2" onclick="selectGrade(2)">🐋 深海区・初二</button>
    </div>
    <div class="chapterGrid" id="chapterGrid"></div>
    <button id="startBtn" disabled onclick="startGame()">⚓ 起航开始</button>
  </div>
</div>

<div id="gameScreen">
  <div id="topPanel">
    <div id="cloudField"></div>
    <div id="scoreBar">
      <span class="s1">玩家1：<span id="score1">0</span></span>
      <span id="questionMeta"></span>
      <span class="s2">玩家2：<span id="score2">0</span></span>
    </div>
    <div id="questionCard"><div id="questionText"></div></div>
  </div>
  <div id="bottomPanel">
    <div id="countdownDisplay"></div>
    <div class="playerPanel" id="p1Panel">
      <div class="feedback" id="feedback1"></div>
      <div class="optionsWrap" id="opts1"></div>
    </div>
    <div id="centerNet">
      <div class="netTexture"></div>
      <div class="netProgress"><div class="fill" id="netFill1"></div><span class="netProgressIcon" id="netIcon1">🦈</span></div>
      <div class="netProgress"><div class="fill" id="netFill2"></div><span class="netProgressIcon" id="netIcon2">🐙</span></div>
    </div>
    <div class="playerPanel" id="p2Panel">
      <div class="feedback" id="feedback2"></div>
      <div class="optionsWrap" id="opts2"></div>
    </div>
  </div>
</div>

<div id="resultScreen">
  <h1 id="resultText"></h1>
  <button onclick="location.reload()">再来一局</button>
</div>

<div id="madeByFooter">峇株吧辖华仁中学 蔡逸众制作</div>

<script>
/* 峇株吧辖华仁中学 蔡逸众制作 */
/* ================= 配置 ================= */
const CHAPTERS = {
  1: Array.from({length:10}, (_,i)=>String(i+1).padStart(2,'0')),
  2: Array.from({length:10}, (_,i)=>String(i+1).padStart(2,'0'))
};
const QUESTIONS_PER_STAGE = 15;   // 单空题、双空题各15题
const WIN_SCORE = 10;             // 先达到10分获胜
const COUNTDOWN_SECONDS = 5;
const MAX_ROUNDS_PER_QUESTION = 3;

let currentGrade = 1;
let chapterCache = {};   // path -> parsed module 或 null(制作中)
let chapterData = null;
let gameQuestions = [];
let qIndex = 0;
let score1 = 0, score2 = 0;
let roundAttempt = 1;
let wrongThisRound = { p1:false, p2:false };
let doubleState = null;
let currentDisplayText = ''; // 当前题目文本的显示状态（用于逐步填入正确答案）

/* ================= 章节选择 ================= */
function selectGrade(g){
  currentGrade = g;
  document.getElementById('gradeBtn1').classList.toggle('active', g===1);
  document.getElementById('gradeBtn2').classList.toggle('active', g===2);
  renderChapterGrid();
}

function renderChapterGrid(){
  const grid = document.getElementById('chapterGrid');
  grid.innerHTML = '';
  chapterData = null;
  document.getElementById('startBtn').disabled = true;
  CHAPTERS[currentGrade].forEach(num=>{
    const path = `questions/${currentGrade}c${num}_fill.js`;
    const btn = document.createElement('button');
    btn.className = 'chapterBtn';
    btn.innerHTML = `第${parseInt(num)}章<small>检查中...</small>`;
    grid.appendChild(btn);
    checkChapterFile(path, btn, currentGrade, num);
  });
}

async function checkChapterFile(path, btn, grade, num){
  if(chapterCache.hasOwnProperty(path)){
    applyChapterButtonState(path, btn, grade, num);
    return;
  }
  try{
    const res = await fetch(path);
    if(!res.ok) throw new Error('not found');
    const text = await res.text();
    const mod = extractChapterModule(text);
    if(!mod.FILL_QUESTIONS || !mod.DOUBLE_QUESTIONS) throw new Error('格式错误');
    chapterCache[path] = mod;
  }catch(e){
    chapterCache[path] = null; // 标记为不可用（制作中）
  }
  applyChapterButtonState(path, btn, grade, num);
}

const SEA_ICONS = ['🐠','🐟','🦑','🐡','🦀','🐢','🦐','🐬','⭐','🐙'];

function applyChapterButtonState(path, btn, grade, num){
  const mod = chapterCache[path];
  const icon = SEA_ICONS[(parseInt(num)-1) % SEA_ICONS.length];
  if(mod === null){
    btn.classList.add('disabled');
    btn.innerHTML = `🪨 第${parseInt(num)}章<small>珊瑚礁待探索</small>`;
    btn.onclick = null;
  } else {
    const title = mod.CHAPTER_INFO_FILL && mod.CHAPTER_INFO_FILL.title ? mod.CHAPTER_INFO_FILL.title : '';
    btn.innerHTML = `${icon} 第${parseInt(num)}章<small>${title}</small>`;
    btn.onclick = ()=>selectChapter(path, btn);
  }
}

function selectChapter(path, btnEl){
  chapterData = chapterCache[path];
  Array.from(document.getElementById('chapterGrid').children).forEach(b=>b.classList.remove('selected'));
  btnEl.classList.add('selected');
  document.getElementById('startBtn').disabled = false;
}

// 用 Function 包裹章节文件文本，避免变量污染全局作用域（沿用既有的多文件加载方式）
function extractChapterModule(jsText){
  const wrapped = new Function(jsText + `
    return { CHAPTER_INFO_FILL, TERM_POOL, FILL_QUESTIONS, DOUBLE_QUESTIONS };
  `);
  return wrapped();
}

renderChapterGrid();
generateBubbles();
generateClouds();

/* ================= 海洋气泡装饰 ================= */
function generateBubbles(){
  const field = document.getElementById('bubbleField');
  if(!field) return;
  const COUNT = 22;
  for(let i=0;i<COUNT;i++){
    const b = document.createElement('div');
    b.className = 'bubble';
    const size = (Math.random()*10 + 4).toFixed(1);
    const left = (Math.random()*100).toFixed(1);
    const duration = (Math.random()*10 + 9).toFixed(1);
    const delay = (Math.random()*18).toFixed(1);
    const drift = (Math.random()*50 - 25).toFixed(0);
    b.style.width = size + 'px';
    b.style.height = size + 'px';
    b.style.left = left + '%';
    b.style.setProperty('--drift', drift + 'px');
    b.style.animationDuration = duration + 's';
    b.style.animationDelay = '-' + delay + 's';
    field.appendChild(b);
  }
}

/* ================= 天空云朵装饰 ================= */
function generateClouds(){
  const field = document.getElementById('cloudField');
  if(!field) return;
  const COUNT = 4;
  for(let i=0;i<COUNT;i++){
    const c = document.createElement('div');
    c.className = 'cloud';
    const scale = (Math.random()*.5 + .6).toFixed(2);
    const top = (Math.random()*60 + 5).toFixed(1);
    const duration = (Math.random()*20 + 28).toFixed(1);
    const delay = (Math.random()*30).toFixed(1);
    c.style.top = top + '%';
    c.style.transform = `scale(${scale})`;
    c.style.animationDuration = duration + 's';
    c.style.animationDelay = '-' + delay + 's';
    field.appendChild(c);
  }
}

/* ================= 开始游戏 ================= */
function startGame(){
  if(!chapterData) return;
  const singles = shuffle([...chapterData.FILL_QUESTIONS]).slice(0, QUESTIONS_PER_STAGE)
    .map(q=>({type:'single', ...q}));
  const doubles = shuffle([...chapterData.DOUBLE_QUESTIONS]).slice(0, QUESTIONS_PER_STAGE)
    .map(q=>({type:'double', ...q}));
  gameQuestions = [...singles, ...doubles];
  qIndex = 0; score1 = 0; score2 = 0;
  updateScoreDisplay();
  document.getElementById('setupScreen').style.display='none';
  document.getElementById('gameScreen').style.display='flex';
  loadQuestion();
}

/* ================= 出题流程 ================= */
function loadQuestion(){
  if(qIndex >= gameQuestions.length){ return endGame(); }
  roundAttempt = 1;
  wrongThisRound = {p1:false, p2:false};
  const q = gameQuestions[qIndex];
  currentDisplayText = q.q;
  document.getElementById('questionText').innerHTML = currentDisplayText;
  document.getElementById('questionMeta').textContent =
    `第${qIndex+1}/${gameQuestions.length}题 · ${q.type==='single' ? '单空' : '双空'}`;
  document.getElementById('feedback1').textContent='';
  document.getElementById('feedback2').textContent='';
  document.getElementById('opts1').innerHTML='';
  document.getElementById('opts2').innerHTML='';

  if(q.type==='double'){
    doubleState = { solved1:false, solved2:false, owner1:null, owner2:null };
  }
  runCountdownThenReveal(q);
}

function runCountdownThenReveal(q){
  // 清除上一轮残留的“错误！请等待对手作答！”等提示文字
  showFeedback(1, '', true);
  showFeedback(2, '', true);
  const cd = document.getElementById('countdownDisplay');
  let n = COUNTDOWN_SECONDS;
  cd.textContent = n;
  cd.style.display='block';
  document.getElementById('opts1').style.visibility='hidden';
  document.getElementById('opts2').style.visibility='hidden';
  const timer = setInterval(()=>{
    n--;
    if(n<=0){
      clearInterval(timer);
      cd.style.display='none';
      document.getElementById('opts1').style.visibility='visible';
      document.getElementById('opts2').style.visibility='visible';
      revealOptions(q);
    } else {
      cd.textContent = n;
    }
  },1000);
}

function normalizeAnsList(ans){ return Array.isArray(ans) ? ans : [ans]; }

function buildOptionList(q){
  const pool = chapterData.TERM_POOL;
  let correctAnswers;
  if(q.type==='single'){
    correctAnswers = [normalizeAnsList(q.ans)[0]];
  } else {
    correctAnswers = [normalizeAnsList(q.ans1)[0], normalizeAnsList(q.ans2)[0]];
  }
  let distractorSource;
  if(q.distractors){
    distractorSource = shuffle([...q.distractors]);
  } else {
    distractorSource = shuffle(pool.filter(t=>!correctAnswers.includes(t)));
  }
  const needed = 9 - correctAnswers.length;
  const chosen = distractorSource.slice(0, needed);
  return [...correctAnswers, ...chosen];
}

function revealOptions(q){
  const baseOptions = buildOptionList(q);
  renderOptionsForPlayer(1, shuffle([...baseOptions]), q);
  renderOptionsForPlayer(2, shuffle([...baseOptions]), q);
}

function renderOptionsForPlayer(player, options, q){
  const wrap = document.getElementById(`opts${player}`);
  wrap.innerHTML='';
  options.forEach((opt,i)=>{
    const btn = document.createElement('button');
    btn.className='optBtn';
    btn.textContent = opt;
    const dur = (Math.random()*2 + 5.5).toFixed(2);
    const delay = (Math.random()*dur).toFixed(2);
    btn.style.animationDuration = `${dur}s`;
    btn.style.animationDelay = `-${delay}s`;
    btn.onclick = ()=>handleAnswer(player, opt, btn, q);
    wrap.appendChild(btn);
  });
}

/* ================= 答题判断 ================= */
function isCorrectAnswer(opt, ansField){ return normalizeAnsList(ansField).includes(opt); }

function handleAnswer(player, opt, btnEl, q){
  if(q.type==='single') handleSingleAnswer(player, opt, btnEl, q);
  else handleDoubleAnswer(player, opt, btnEl, q);
}

function disableAllOptions(player){
  document.querySelectorAll(`#opts${player} .optBtn`).forEach(b=>b.disabled=true);
}

function handleSingleAnswer(player, opt, btnEl, q){
  if(isCorrectAnswer(opt, q.ans)){
    btnEl.classList.add('correct');
    spawnCorrectBubble(player, '✅ 正确！');
    disableAllOptions(1); disableAllOptions(2);
    currentDisplayText = currentDisplayText.replace('___', `<span class="filledAnswer">${opt}</span>`);
    document.getElementById('questionText').innerHTML = currentDisplayText;
    awardPoint(player, 1);
    setTimeout(nextQuestion, 3000);
  } else {
    btnEl.classList.add('wrong'); btnEl.disabled = true;
    showFeedback(player, '错误！请等待对手作答！', false);
    wrongThisRound[player===1?'p1':'p2'] = true;
    checkBothWrong(q, false);
  }
}

function handleDoubleAnswer(player, opt, btnEl, q){
  if(!doubleState.solved1 && isCorrectAnswer(opt, q.ans1)){
    doubleState.solved1 = true; doubleState.owner1 = player;
    btnEl.classList.add('correct'); btnEl.disabled = true;
    spawnCorrectBubble(player, '①正确！');
    currentDisplayText = currentDisplayText.replace('①___', `①<span class="filledAnswer">${opt}</span>`);
    document.getElementById('questionText').innerHTML = currentDisplayText;
    awardPoint(player, 1);
    checkDoubleComplete();
  } else if(!doubleState.solved2 && isCorrectAnswer(opt, q.ans2)){
    doubleState.solved2 = true; doubleState.owner2 = player;
    btnEl.classList.add('correct'); btnEl.disabled = true;
    spawnCorrectBubble(player, '②正确！');
    currentDisplayText = currentDisplayText.replace('②___', `②<span class="filledAnswer">${opt}</span>`);
    document.getElementById('questionText').innerHTML = currentDisplayText;
    awardPoint(player, 1);
    checkDoubleComplete();
  } else {
    btnEl.classList.add('wrong'); btnEl.disabled = true;
    showFeedback(player, '错误！请等待对手作答！', false);
    wrongThisRound[player===1?'p1':'p2'] = true;
    checkBothWrong(q, true);
  }
}

/* 答对后：大字气泡从玩家答题区底部升起，3秒后正好抵达海面(topPanel/bottomPanel交界)并消失 */
function spawnCorrectBubble(player, label){
  const panel = document.getElementById(`p${player}Panel`);
  const bottomPanel = document.getElementById('bottomPanel');
  const panelRect = panel.getBoundingClientRect();
  const seaSurfaceY = bottomPanel.getBoundingClientRect().top;
  const startTop = panelRect.bottom - 50;
  const endTop = seaSurfaceY - 10;
  const bubble = document.createElement('div');
  bubble.className = 'correctBubble';
  bubble.textContent = label;
  bubble.style.left = (panelRect.left + panelRect.width/2) + 'px';
  bubble.style.top = startTop + 'px';
  document.body.appendChild(bubble);
  const rise = startTop - endTop;
  const anim = bubble.animate([
    { transform:'translate(-50%,0) scale(.5)', opacity:0, top:startTop+'px' },
    { transform:'translate(-46%,0) scale(1.12)', opacity:1, top:(startTop-rise*0.15)+'px', offset:0.12 },
    { transform:'translate(-54%,0) scale(1)', opacity:1, top:(startTop-rise*0.5)+'px', offset:0.5 },
    { transform:'translate(-46%,0) scale(1)', opacity:1, top:(startTop-rise*0.85)+'px', offset:0.88 },
    { transform:'translate(-50%,0) scale(.85)', opacity:0, top:endTop+'px' }
  ], { duration:3000, easing:'ease-in', fill:'forwards' });
  anim.onfinish = ()=> bubble.remove();
}

function checkDoubleComplete(){
  if(doubleState.solved1 && doubleState.solved2){
    disableAllOptions(1); disableAllOptions(2);
    setTimeout(nextQuestion, 3000);
  }
}

function checkBothWrong(q, isDouble){
  // 双空题：只要还有任一空未解出，双方都错才重来；已解出的空不再触发整题重开
  if(isDouble && (doubleState.solved1 || doubleState.solved2)) return;
  if(wrongThisRound.p1 && wrongThisRound.p2){
    roundAttempt++;
    if(roundAttempt > MAX_ROUNDS_PER_QUESTION){
      score1--; score2--;
      updateScoreDisplay();
      showFeedback(1,'双方都未答对，各扣1分',false);
      showFeedback(2,'双方都未答对，各扣1分',false);
      setTimeout(nextQuestion, 1500);
    } else {
      wrongThisRound = {p1:false, p2:false};
      setTimeout(()=>runCountdownThenReveal(q), 1000);
    }
  }
}

function showFeedback(player, msg, good){
  const el = document.getElementById(`feedback${player}`);
  el.textContent = msg;
  el.className = 'feedback ' + (good ? 'good' : 'bad');
}

function awardPoint(player, pts){
  if(player===1) score1 += pts; else score2 += pts;
  updateScoreDisplay();
  const newScore = player===1 ? score1 : score2;
  if(pts > 0 && (newScore===3 || newScore===6 || newScore===9)){
    spawnMilestoneFish(player);
  }
  if(score1 >= WIN_SCORE || score2 >= WIN_SCORE){
    setTimeout(endGame, 1300);
  }
}

/* 每达到3/6/9分：己方的鱼从本方一侧游向对方一侧 */
function spawnMilestoneFish(player){
  const isP1 = player===1; // 玩家1＝飞鱼，从左游到右；玩家2＝旗鱼，从右游到左
  const src = isP1 ? 'flyingfish.png' : 'sailfish.png';
  const dir = isP1 ? 1 : -1;
  const img = document.createElement('img');
  img.src = src;
  img.className = 'milestoneFish';
  img.onerror = ()=> img.remove();
  const vh = window.innerHeight, vw = window.innerWidth;
  const startX = dir===1 ? -160 : vw + 160;
  const endX = dir===1 ? vw + 160 : -160;
  const baseY = vh * 0.55;
  const arcHeight = isP1 ? vh * 0.34 : vh * 0.10; // 飞鱼跃得更高，旗鱼贴着海面游
  img.style.top = baseY + 'px';
  img.style.left = startX + 'px';
  document.body.appendChild(img);
  const travel = endX - startX;
  const anim = img.animate([
    { transform:`translate(0px,0px) rotate(${dir*-3}deg)` },
    { transform:`translate(${travel*0.25}px, -${arcHeight*0.55}px) rotate(${dir*7}deg)`, offset:0.25 },
    { transform:`translate(${travel*0.5}px, -${arcHeight}px) rotate(${dir*4}deg)`, offset:0.5 },
    { transform:`translate(${travel*0.75}px, -${arcHeight*0.45}px) rotate(${dir*-6}deg)`, offset:0.75 },
    { transform:`translate(${travel}px, 0px) rotate(0deg)` }
  ], { duration:1500, easing:'ease-in-out' });
  anim.onfinish = ()=> img.remove();
  playMilestoneSound();
}

function playMilestoneSound(){
  try{
    const audio = new Audio('fastswim.mp3');
    audio.volume = .85;
    audio.play().catch(()=>{});
  }catch(e){}
}

function updateScoreDisplay(){
  document.getElementById('score1').textContent = score1;
  document.getElementById('score2').textContent = score2;
  updateProgressBar();
}

function updateProgressBar(){
  setNetBar('netFill1','netIcon1', score1);
  setNetBar('netFill2','netIcon2', score2);
}

function setNetBar(fillId, iconId, score){
  const clamped = Math.max(0, Math.min(score, WIN_SCORE));
  const pct = clamped / WIN_SCORE * 100;
  document.getElementById(fillId).style.height = pct + '%';
  document.getElementById(iconId).style.bottom = pct + '%';
}

function nextQuestion(){
  if(score1 >= WIN_SCORE || score2 >= WIN_SCORE){ return endGame(); }
  qIndex++;
  loadQuestion();
}

function endGame(){
  document.getElementById('gameScreen').style.display='none';
  document.getElementById('resultScreen').style.display='flex';
  let text;
  if(score1 > score2) text = `🏆 玩家1 获胜！（${score1} : ${score2}）`;
  else if(score2 > score1) text = `🏆 玩家2 获胜！（${score2} : ${score1}）`;
  else text = `平局！（${score1} : ${score2}）`;
  document.getElementById('resultText').textContent = text;
}

/* ================= 工具函数 ================= */
function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
