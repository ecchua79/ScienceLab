/* ---------- quiz engine ---------- */
function runMC(box,items,end){let i=0,s=0;(function go(){if(i>=items.length){end(s);return}
const a=items[i].split('|'),q=a[0],c=a[1],e=a[a.length-1],o=sh(a.slice(1,-1));
box.innerHTML=`<p><b>第${i+1}/${items.length}题：</b>${q}</p>`+o.map(x=>`<button class=o>${x}</button>`).join('')+'<div class=ex style="display:none"></div>';
box.querySelectorAll('.o').forEach(b=>b.onclick=()=>{box.querySelectorAll('.o').forEach(x=>{x.disabled=1;if(x.textContent==c)x.classList.add('ok')});const g=b.textContent==c;if(g)s++;else b.classList.add('no');const d=box.querySelector('.ex');d.style.display='block';d.innerHTML=(g?'✅ 正确！':'❌ 错误，正确答案：<b>'+c+'</b>')+'<br>解析：'+e+'<br><button class=n>'+(i+1<items.length?'下一题':'完成')+'</button>';d.querySelector('.n').onclick=()=>{i++;go()}})})()}
function runFill(box,items,end){let i=0,s=0;(function go(){if(i>=items.length){end(s);return}
const t=items[i];box.innerHTML=`<p><b>作答题 ${i+1}/${items.length}：</b>${t.q}</p><input class=in placeholder="${t.k?'输入答案':'输入数字'}"><button class=sub>提交</button><div class=ex style="display:none"></div>`;
const inp=box.querySelector('.in');box.querySelector('.sub').onclick=function(){if(this.disabled)return;this.disabled=inp.disabled=true;const v=inp.value.trim(),g=t.k?t.k.some(k=>v.includes(k)):Math.abs(parseFloat(v)-t.a)<=.05;if(g)s++;const d=box.querySelector('.ex');d.style.display='block';d.innerHTML=(g?'✅ 正确！':'❌ 错误，答案：<b>'+(t.k?t.k[0]:t.a)+'</b>')+'<br>解析：'+t.e+'<br><button class=n>'+(i+1<items.length?'下一题':'完成')+'</button>';d.querySelector('.n').onclick=()=>{i++;go()}}})()}
function quiz(box,s){box.innerHTML='<h3>🧪 选择题（5题，答对3题可挑战作答题）</h3><div id=a></div><div id=b></div>';
runMC(box.querySelector('#a'),sh(s.m).slice(0,5),n=>{box.querySelector('#a').innerHTML=`<p class=res>选择题：${n}/5</p>`;const b=box.querySelector('#b'),again=()=>{b.insertAdjacentHTML('beforeend','<button class=n>🔄 换一组新题</button>');b.querySelector('.n').onclick=()=>quiz(box,s)};
if(n<3){b.innerHTML='<p>答对未满3题，暂不能挑战作答题，再试一组吧！</p>';again();return}
b.innerHTML='<h3>✍️ 作答题（2题）</h3><div id=c></div>';runFill(b.querySelector('#c'),sh(s.f).slice(0,2).map(f=>f()),m=>{b.querySelector('#c').innerHTML=`<p class=res>作答题：${m}/2 🎉</p>`;again()})})}
function review(P){P.innerHTML='<h2>总复习</h2><div class=card><p>10题选择 + 5题作答（含课本较难的综合题；题目与数据每次不同）。</p><button class=n id=go>开始总复习</button><div id=a></div><div id=b></div></div>';
$('#go').onclick=()=>{const all=sh(S.flatMap(s=>s.m)),mc=sh([...H,...all.slice(0,6)]),fl=sh(S.flatMap(s=>s.f)).slice(0,5).map(f=>f());$('#go').style.display='none';
runMC($('#a'),mc,x=>{$('#a').innerHTML=`<p class=res>选择题：${x}/10</p>`;runFill($('#b'),fl,y=>{const z=x+y,g=z>=13?'🏆 优秀！已掌握本章':z>=10?'👍 良好，再巩固错题':z>=8?'🙂 及格，建议复习各节重点':'💪 需加油，请重读各节后再试';$('#b').innerHTML=`<p class=res>作答题：${y}/5</p><h3>总分 ${z}/15（${Math.round(z/15*100)}%）</h3><p>${g}</p><button class=n onclick=review($('#P'))>再测一次</button>`})})}}
/* ---------- app ---------- */
const nv=$('#nv');[...S.map(s=>s.id+' '+s.t),'总复习'].forEach((t,i)=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>show(i);nv.append(b)});
function show(i){[...nv.children].forEach((b,j)=>b.classList.toggle('on',j==i));nv.children[i].scrollIntoView({inline:'center',block:'nearest'});const P=$('#P');scrollTo(0,0);if(i==S.length){review(P);return}
const s=S[i];P.innerHTML=`<h2>${s.id} ${s.t}</h2><div class=card><ul>${s.k.map(x=>`<li>${x}</li>`).join('')}</ul></div><div class=card><h3>📘 例题解说</h3>${s.ex}</div>`+s.c.map(k=>`<div class="card" data-k=${k}></div>`).join('')+'<div class=card id=qz></div>';
P.querySelectorAll('[data-k]').forEach(e=>calc(e,e.dataset.k));quiz($('#qz'),s)}
let fs=17;const sf=n=>{fs=Math.min(26,Math.max(13,n));document.documentElement.style.setProperty('--fs',fs+'px')};
$('#m').onclick=()=>sf(fs-1);$('#p').onclick=()=>sf(fs+1);$('#d').onclick=()=>{const h=document.documentElement;h.dataset.t=h.dataset.t=='dark'?'':'dark'};
show(0);
</script></body></html>
