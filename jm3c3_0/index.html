<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>心脏 3D 交互模型 · 血液循环</title>
<style>
:root{
  --bg:#070d1a; --bg2:#0d1528; --panel:rgba(13,21,40,.86); --line:rgba(56,224,208,.22);
  --c:#38e0d0; --c2:#ff6b8a; --txt:#dbe7f5; --dim:#8fa3bd; --warn:#ffb454;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);
  font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif}
#stage{position:fixed;inset:0}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}

/* ---------- 标注层 ---------- */
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.chip{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;cursor:pointer;
  padding:4px 9px;border-radius:14px;font-size:12.5px;line-height:1.25;white-space:nowrap;
  background:rgba(10,18,34,.88);border:1px solid rgba(56,224,208,.42);color:var(--c);
  box-shadow:0 2px 10px rgba(0,0,0,.5);transition:all .18s;user-select:none}
.chip:hover{background:rgba(56,224,208,.18);border-color:var(--c);transform:translate(-50%,-50%) scale(1.06)}
.chip.on{background:rgba(255,107,138,.22);border-color:var(--c2);color:#ffdde4}
.chip.oxy{color:#ff8fa3}
.chip.deoxy{color:#7fb8ff}
#leaders{position:absolute;inset:0;pointer-events:none;overflow:visible}
#leaders line{stroke:rgba(56,224,208,.55);stroke-width:1.1}
#leaders circle{fill:none;stroke:var(--c);stroke-width:1.6}
#leaders circle.hot{stroke:var(--c2);stroke-width:2.2}

/* ---------- 右侧面板 ---------- */
#panel{position:absolute;right:0;top:0;bottom:0;width:300px;background:var(--panel);
  border-left:1px solid var(--line);backdrop-filter:blur(10px);display:flex;flex-direction:column;z-index:5}
#panel h2{margin:0;padding:14px 16px 10px;font-size:14px;letter-spacing:.5px;color:var(--c);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:7px}
#panel h2 .dot{width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
#plist{flex:1;overflow-y:auto;padding:6px 0}
#plist::-webkit-scrollbar{width:6px}
#plist::-webkit-scrollbar-thumb{background:rgba(56,224,208,.28);border-radius:3px}
.row{padding:9px 16px;border-bottom:1px solid rgba(255,255,255,.045);cursor:pointer;transition:background .15s}
.row:hover{background:rgba(56,224,208,.07)}
.row.on{background:rgba(255,107,138,.11);border-left:3px solid var(--c2);padding-left:13px}
.row .nm{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600;margin-bottom:3px}
.row .nm i{width:9px;height:9px;border-radius:2px;flex:none}
.row .fn{font-size:11.5px;color:var(--dim);line-height:1.5}
#detail{border-top:1px solid var(--line);padding:12px 16px;background:rgba(0,0,0,.24);min-height:112px}
#detail .t{font-size:14px;font-weight:700;color:var(--c2);margin-bottom:6px}
#detail .d{font-size:11.5px;color:var(--txt);line-height:1.65}
#detail .hint{font-size:11px;color:var(--dim);line-height:1.6}

/* ---------- 工具栏 ---------- */
#tools{position:absolute;left:14px;bottom:14px;z-index:6;display:flex;flex-direction:column;gap:7px}
#tools .grp{display:flex;gap:6px;flex-wrap:wrap}
.btn{padding:6px 11px;border-radius:7px;font-size:12px;cursor:pointer;user-select:none;
  background:rgba(13,21,40,.9);border:1px solid rgba(56,224,208,.28);color:var(--txt);transition:all .15s}
.btn:hover{border-color:var(--c);color:var(--c);background:rgba(56,224,208,.12)}
.btn.on{background:rgba(56,224,208,.2);border-color:var(--c);color:var(--c)}
.btn.flow.on{background:rgba(255,107,138,.22);border-color:var(--c2);color:#ffdde4}
.btn small{opacity:.65;font-size:10px;margin-left:3px}

/* ---------- 图例 ---------- */
#legend{position:absolute;left:14px;top:14px;z-index:6;background:var(--panel);border:1px solid var(--line);
  border-radius:9px;padding:10px 12px;font-size:11.5px;backdrop-filter:blur(8px);max-width:190px}
#legend b{display:block;color:var(--c);font-size:12px;margin-bottom:7px;letter-spacing:.4px}
#legend .li{display:flex;align-items:center;gap:7px;margin-bottom:5px;color:var(--dim)}
#legend .li:last-child{margin-bottom:0}
#legend .li u{width:16px;height:3px;border-radius:2px;text-decoration:none;flex:none}
#legend .li s{width:9px;height:9px;border-radius:50%;text-decoration:none;flex:none}
#legend .li s.pt{width:11px;height:11px;box-shadow:0 0 7px currentColor}

/* ---------- 标题 ---------- */
#title{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:6;text-align:center;
  pointer-events:none}
#title h1{margin:0;font-size:15px;font-weight:600;letter-spacing:1px;color:var(--txt)}
#title p{margin:3px 0 0;font-size:11px;color:var(--dim)}
#title a{color:var(--c);text-decoration:none;border-bottom:1px dotted rgba(56,224,208,.5)}
#title a:hover{color:#7ff0e4}

/* ---------- 状态条 ---------- */
#status{position:absolute;right:312px;bottom:14px;z-index:6;font-size:11px;color:var(--dim);
  background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:5px 11px;
  pointer-events:none}
#status b{color:var(--c)}

/* ---------- 加载 ---------- */
#loader{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;
  justify-content:center;background:var(--bg);gap:16px;transition:opacity .5s}
#loader.hide{opacity:0;pointer-events:none}
.ring{width:42px;height:42px;border:3px solid rgba(56,224,208,.18);border-top-color:var(--c);
  border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loader span{font-size:12.5px;color:var(--dim)}

/* ---------- 血流模式提示 ---------- */
#flowinfo{position:absolute;left:14px;bottom:104px;z-index:6;
  background:var(--panel);border:1px solid rgba(255,107,138,.3);border-radius:9px;padding:8px 13px;
  font-size:11px;color:var(--txt);max-width:300px;line-height:1.6;
  backdrop-filter:blur(8px);display:none}
#flowinfo.show{display:block}
#flowinfo b{color:var(--c2)}
#flowinfo .red{color:#ff8fa3}
#flowinfo .blue{color:#7fb8ff}
#flowinfo .ln{display:block;margin-top:4px;padding-left:11px;text-indent:-11px}
#flowinfo .ln:first-of-type{margin-top:5px}

@media(max-width:820px){
  #panel{width:240px}
  #status{right:250px}
  #legend{display:none}
}
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl"></canvas>
  <svg id="leaders"></svg>
  <div id="labels"></div>

  <div id="title">
    <h1>心脏 · 血液循环 3D 交互模型</h1>
    <p>模型来源：<a href="https://sketchfab.com/3d-models/cardiac-conduction-system-f314c85abb6a481592ffa5dd973ca0c0" target="_blank" rel="noopener">Sketchfab — Cardiac Conduction System</a> · CC BY</p>
  </div>

  <div id="legend">
    <b>图例</b>
    <div class="li"><s style="background:#ff8fa3"></s>动脉血（含氧）</div>
    <div class="li"><s style="background:#7fb8ff"></s>静脉血（缺氧）</div>
    <div class="li"><s class="pt" style="background:#ff2d6f"></s>红色粒子 · 充氧血流向</div>
    <div class="li"><s class="pt" style="background:#00d8ff"></s>蓝色粒子 · 缺氧血流向</div>
    <div class="li"><s style="background:#ffd54f"></s>传导系统</div>
  </div>

  <div id="panel">
    <h2><span class="dot"></span>心脏结构与功能</h2>
    <div id="plist"></div>
    <div id="detail"><div class="hint">点击左侧标注或下方列表，查看各结构的功能说明。</div></div>
  </div>

  <div id="tools">
    <div class="grp">
      <div class="btn on" id="btnBeat">心跳搏动</div>
      <div class="btn flow" id="btnFlow">血流动画</div>
      <div class="btn" id="btnConduction">传导系统</div>
    </div>
    <div class="grp">
      <div class="btn" id="btnLabels">标注</div>
      <div class="btn" id="btnXray">透视心肌</div>
      <div class="btn" id="btnRotate">自动旋转</div>
      <div class="btn" id="btnReset">重置视角</div>
    </div>
  </div>

  <div id="status">左键旋转 · 滚轮缩放 · 右键平移</div>
  <div id="flowinfo"></div>

  <div id="loader"><div class="ring"></div><span>正在加载心脏三维模型…</span></div>
</div>

<script type="importmap">
{ "imports": { "three": "./vendor/build/three.module.js", "three/addons/": "./vendor/examples/jsm/" } }
</script>
<script type="module" src="./heart-viewer.js"></script>
</body>
</html>
