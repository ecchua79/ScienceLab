<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>温室效应 3D 演示</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000;
            background-image: radial-gradient(circle at center, #111 0%, #000 100%);
        }
        #ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 380px;
            background: rgba(20, 20, 20, 0.85);
            color: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
            border: 1px solid #444;
            backdrop-filter: blur(8px);
            z-index: 10;
        }
        h2 {
            margin-top: 0;
            margin-bottom: 0;
            font-size: 22px;
            color: #4CAF50;
            transition: color 0.3s;
        }
        #panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            border-bottom: 1px solid #555;
            padding-bottom: 10px;
            user-select: none;
        }
        #collapse-btn {
            background: none;
            border: none;
            color: #aaa;
            font-size: 16px;
            padding: 0 0 0 10px;
            width: auto;
            cursor: pointer;
            pointer-events: none; /* 点击交由 #panel-header 统一处理 */
            transition: transform 0.3s;
            flex-shrink: 0;
        }
        #panel-content {
            overflow: hidden;
            max-height: 600px;
            opacity: 1;
            transition: max-height 0.35s ease, opacity 0.25s ease, margin 0.35s ease;
        }
        #ui-panel.collapsed #panel-content {
            max-height: 0;
            opacity: 0;
        }
        #ui-panel.collapsed #collapse-btn {
            transform: rotate(180deg);
        }
        #ui-panel {
            transition: padding 0.3s ease;
        }
        p {
            font-size: 14px;
            line-height: 1.6;
            color: #ddd;
            min-height: 140px; /* 保持高度稳定 */
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.3s;
            background-color: #333;
            color: #aaa;
        }
        #btn-without.active-btn {
            background-color: #455A64;
            color: white;
            box-shadow: 0 0 12px rgba(136, 204, 255, 0.6);
            border: 1px solid #88ccff;
        }
        #btn-normal.active-btn {
            background-color: #2E7D32;
            color: white;
            box-shadow: 0 0 12px rgba(76, 175, 80, 0.6);
            border: 1px solid #4CAF50;
        }
        #btn-extreme.active-btn {
            background-color: #C62828;
            color: white;
            box-shadow: 0 0 12px rgba(244, 67, 54, 0.6);
            border: 1px solid #F44336;
        }
        button:hover {
            filter: brightness(1.2);
        }
        .legend {
            margin-top: 20px;
            font-size: 12px;
            background: rgba(0,0,0,0.3);
            padding: 10px;
            border-radius: 6px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }
        .legend-item:last-child {
            margin-bottom: 0;
        }
        .color-box {
            width: 16px;
            height: 16px;
            margin-right: 10px;
            border-radius: 4px;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 20px;
            z-index: 0;
        }
    </style>
</head>
<body>

    <div id="loading">加载 3D 引擎中...</div>

    <div id="ui-panel" style="display: none;">
        <div id="panel-header">
            <h2 id="title">正常温室效应 (适宜)</h2>
            <button id="collapse-btn" title="收起/展开面板">▲</button>
        </div>
        <div style="font-size:0.55rem; color:rgba(56,189,248,0.18); margin-top:6px; margin-bottom:2px; user-select:none;">峇株吧辖华仁中学蔡逸众制作</div>

        <div id="panel-content">
            <p id="description">
                <!-- 描述内容由 JS 动态填充 -->
            </p>

            <div class="btn-group">
                <button id="btn-without">无温室效应 (冰冻星球)</button>
                <button id="btn-normal" class="active-btn">正常温室效应 (蓝色星球)</button>
                <button id="btn-extreme">温室效应过强 (全球变暖)</button>
            </div>

            <div class="legend">
                <div class="legend-item"><div class="color-box" style="background: #ffff00;"></div> 太阳短波辐射 (输入热量)</div>
                <div class="legend-item"><div class="color-box" style="background: #ffee88;"></div> 反照率 (直接反射回太空)</div>
                <div class="legend-item"><div class="color-box" style="background: #ff3333;"></div> 地表红外辐射 (成功散失太空)</div>
                <div class="legend-item"><div class="color-box" style="background: #ff9900;"></div> 温室气体截留 (反射回地表)</div>
            </div>
        </div>
    </div>

    <!-- 引入 Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
        document.getElementById('loading').style.display = 'none';
        document.getElementById('ui-panel').style.display = 'block';
        //峇株吧辖华仁中学蔡逸众制作

        // 1. 初始化场景
        const scene = new THREE.Scene();
        
        // 添加星空背景粒子
        const starsGeometry = new THREE.BufferGeometry();
        const starsCount = 1000;
        const posArray = new Float32Array(starsCount * 3);
        for(let i = 0; i < starsCount * 3; i++) {
            posArray[i] = (Math.random() - 0.5) * 100;
        }
        starsGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const starsMaterial = new THREE.PointsMaterial({size: 0.1, color: 0xffffff, transparent: true, opacity: 0.8});
        const starMesh = new THREE.Points(starsGeometry, starsMaterial);
        scene.add(starMesh);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 22);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        //峇株吧辖蔡逸众制作

        // 2. 添加光源
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.15); 
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 1.5);
        sunLight.position.set(15, 5, 5);
        scene.add(sunLight);
        //华仁中学蔡逸众制作

        // 为了让地球背光面不至于死黑
        const backLight = new THREE.DirectionalLight(0x444455, 0.3);
        backLight.position.set(-15, -5, -5);
        scene.add(backLight);

        // 3. 创建材质生成器 (使用 Canvas 纹理生成简单的地球外观)
        function createEarthTexture(baseColor, landColor) {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 256;
            const context = canvas.getContext('2d');
            
            // 基础海洋颜色
            context.fillStyle = baseColor;
            context.fillRect(0, 0, canvas.width, canvas.height);
            
            // 绘制假大陆
            context.fillStyle = landColor;
            for(let i = 0; i < 30; i++) {
                context.beginPath();
                let x = Math.random() * canvas.width;
                let y = Math.random() * canvas.height;
                let r = Math.random() * 40 + 10;
                context.arc(x, y, r, 0, Math.PI * 2);
                context.fill();
            }
            return new THREE.CanvasTexture(canvas);
        }

        // 定义三种状态的材质
        // 正常蓝色地球
        const texNormal = createEarthTexture('#1e88e5', '#43a047'); // 蓝海洋，绿陆地
        const matNormal = new THREE.MeshStandardMaterial({ map: texNormal, roughness: 0.7 });

        // 无温室效应 (冰冻)
        const texCold = createEarthTexture('#b3e5fc', '#e0f7fa'); // 浅蓝冰洋，白陆地
        const matCold = new THREE.MeshStandardMaterial({ map: texCold, roughness: 0.4 });

        // 温室效应过强 (干旱发红)
        const texExtreme = createEarthTexture('#0d47a1', '#ef6c00'); // 深蓝海洋，干旱橙红陆地
        const matExtreme = new THREE.MeshStandardMaterial({ map: texExtreme, roughness: 0.9 });

        // 创建地球
        const earthGeometry = new THREE.SphereGeometry(3, 64, 64);
        const earth = new THREE.Mesh(earthGeometry, matNormal);
        //Made by ecchua79
        scene.add(earth);

        // 4. 创建温室气体大气层 (使用多个稍微大一点的球体叠加产生发光效果)
        const atmosphereGeometry = new THREE.SphereGeometry(3.2, 64, 64);
        const atmosphereMaterial = new THREE.MeshBasicMaterial({
            color: 0x88ccff, // 正常大气颜色
            transparent: true,
            opacity: 0.15,
            side: THREE.BackSide,
            blending: THREE.AdditiveBlending
        });
        const atmosphere = new THREE.Mesh(atmosphereGeometry, atmosphereMaterial);
        //峇株吧辖华仁中学蔡逸众制作
        scene.add(atmosphere);

        // 过强温室效应时的额外厚重大气层
        const thickAtmoGeometry = new THREE.SphereGeometry(3.5, 64, 64);
        const thickAtmoMaterial = new THREE.MeshBasicMaterial({
            color: 0xffaa00, // 浑浊的黄色/橙色
            transparent: true,
            opacity: 0.3,
            side: THREE.BackSide,
            blending: THREE.AdditiveBlending
        });
        const thickAtmosphere = new THREE.Mesh(thickAtmoGeometry, thickAtmoMaterial);
        thickAtmosphere.visible = false;
        scene.add(thickAtmosphere);

        // 5. 辅助箭头：表示辐射流向 (仿照教科书示意图，使用弯曲管状箭头 + 流动光点表示能量传递方向)
        const arrowsGroup = new THREE.Group();
        scene.add(arrowsGroup);

        // --- 直线箭头 (用于太阳短波辐射输入，保持原有的往复动画效果) ---
        function createArrow(dir, origin, length, color, headLength, headWidth) {
            const arrow = new THREE.ArrowHelper(dir, origin, length, color, headLength, headWidth);
            arrow.dir = dir; // 保存方向向量供动画循环使用
            arrowsGroup.add(arrow);
            return arrow;
        }

        // --- 弯曲管状箭头：用于表示散失/反射的曲线路径，末端带箭头，并有流动光点沿路径移动 ---
        //峇株吧辖蔡逸众制作
        function createCurvedArrow(start, end, bowHeight, color, tubeRadius, headSize) {
            tubeRadius = tubeRadius || 0.045;
            headSize = headSize || 0.28;

            // 让曲线的控制点朝远离地心的方向外凸，形成弧形轨迹
            const mid = start.clone().lerp(end, 0.5);
            const outward = mid.length() > 0.001 ? mid.clone().normalize() : new THREE.Vector3(0, 1, 0);
            mid.add(outward.multiplyScalar(bowHeight));

            const curve = new THREE.QuadraticBezierCurve3(start, mid, end);
            const tubeGeo = new THREE.TubeGeometry(curve, 24, tubeRadius, 8, false);
            const tubeMat = new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: 0.5 });
            const tubeMesh = new THREE.Mesh(tubeGeo, tubeMat);

            const tangent = curve.getTangentAt(0.98).normalize();
            const coneGeo = new THREE.ConeGeometry(headSize * 0.45, headSize, 10);
            const coneMat = new THREE.MeshBasicMaterial({ color: color });
            const cone = new THREE.Mesh(coneGeo, coneMat);
            cone.position.copy(curve.getPointAt(1));
            cone.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), tangent);

            // 沿曲线流动的光点，模拟能量传递的方向感
            const glowGeo = new THREE.SphereGeometry(tubeRadius * 2.4, 10, 10);
            const glowMat = new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending });
            const glow = new THREE.Mesh(glowGeo, glowMat);

            const group = new THREE.Group();
            group.add(tubeMesh, cone, glow);
            group.curve = curve;
            group.glow = glow;
            group.flowOffset = Math.random();
            group.flowSpeed = 0.35 + Math.random() * 0.15;
            arrowsGroup.add(group);
            allFlowArrows.push(group);
            return group;
        }

        const allFlowArrows = [];
        function angleVec(deg) {
            const rad = deg * Math.PI / 180;
            return new THREE.Vector3(Math.cos(rad), Math.sin(rad), 0);
        }

        const EARTH_R = 3, ATMO_R = 3.3, SPACE_R = 11;

        // --- 太阳短波辐射 (输入，三种情景下恒定不变) ---
        const sunRay1 = createArrow(new THREE.Vector3(-1, -0.3, 0).normalize(), new THREE.Vector3(9, 3, 0), 3.5, 0xffff00, 0.6, 0.4);
        const sunRay2 = createArrow(new THREE.Vector3(-1, 0, 0).normalize(), new THREE.Vector3(9, 0, 0), 3.5, 0xffff00, 0.6, 0.4);
        const sunRay3 = createArrow(new THREE.Vector3(-1, 0.3, 0).normalize(), new THREE.Vector3(9, -3, 0), 3.5, 0xffff00, 0.6, 0.4);
        const animConfig = [
            { obj: sunRay1, type: 'in', baseX: 9 },
            { obj: sunRay2, type: 'in', baseX: 9 },
            { obj: sunRay3, type: 'in', baseX: 9 }
        ];

        // --- 反照率：部分太阳辐射被大气/云层直接反射回太空 (三种情景下基本恒定) ---
        //华仁中学蔡逸众制作
        const albedoArrows = [[15, 55], [-15, -55]].map(([sDeg, eDeg]) => {
            const start = angleVec(sDeg).multiplyScalar(ATMO_R + 0.05);
            const end = angleVec(eDeg).multiplyScalar(SPACE_R * 0.65);
            return createCurvedArrow(start, end, 0.8, 0xffee88, 0.04, 0.22);
        });

        // --- 地表红外辐射：成功散失到太空的部分 (数量随温室效应强弱变化，越强温室效应逃逸越少) ---
        const escapeAngles = [55, 95, 140, 185, 235, 280];
        const escapeArrows = escapeAngles.map(deg => {
            const dir = angleVec(deg);
            const start = dir.clone().multiplyScalar(EARTH_R + 0.15);
            const end = dir.clone().multiplyScalar(SPACE_R);
            return createCurvedArrow(start, end, 1.2, 0xff3333, 0.045, 0.28);
        });

        // --- 温室气体截留后反射回地表的热辐射 (数量随温室效应强弱变化，是本演示的核心变量) ---
        const bounceAngles = [70, 115, 160, 210, 255, 300];
        const bounceArrows = bounceAngles.map(deg => {
            const startDir = angleVec(deg);
            const endDir = angleVec(deg + 18);
            const start = startDir.clone().multiplyScalar(ATMO_R + 0.3);
            const end = endDir.clone().multiplyScalar(EARTH_R + 0.1);
            return createCurvedArrow(start, end, 1.6, 0xff9900, 0.045, 0.28);
        });

        // 6. 状态数据与逻辑
        //Made by ecchua79
        const states = {
            without: {
                title: "无温室效应 (冰冻星球)",
                color: "#88ccff",
                desc: `<strong>效果：</strong> 地球表面平均温度降至约 <strong>-18°C</strong>。全球海洋结冰，变成一个大雪球，极不适宜生命生存。<br><br>
                       <strong>原因：</strong> 大气中没有 CO₂、甲烷等温室气体。太阳照射的短波辐射加热地表后，地表产生的长波红外辐射（热量）毫无阻拦地<strong>全部散失</strong>到宇宙空间中。热量无法被留住。`,
                earthMat: matCold,
                atmoColor: 0x88ccff,
                atmoOpacity: 0.05,
                thickAtmoVisible: false,
                escapeCount: 6,
                bounceCount: 0
            },
            normal: {
                title: "正常温室效应 (蓝色星球)",
                color: "#4CAF50",
                desc: `<strong>效果：</strong> 地球表面平均温度保持在约 <strong>15°C</strong>。存在液态水，适宜丰富多彩的生命繁衍。<br><br>
                       <strong>原因：</strong> 大气中含有<strong>适量</strong>的温室气体。它们允许太阳短波辐射进入，但会吸收地表散发的红外辐射，并将其<strong>部分反射回地表</strong>。这就像给地球盖了一层薄毯子，保持了温暖。`,
                earthMat: matNormal,
                atmoColor: 0x88ccff,
                atmoOpacity: 0.15,
                thickAtmoVisible: false,
                escapeCount: 3,
                bounceCount: 3
            },
            extreme: {
                title: "温室效应过强 (全球变暖)",
                color: "#F44336",
                desc: `<strong>效果：</strong> 地球平均温度异常升高。导致冰川融化、海平面上升、极端天气频发，大片陆地荒漠化。<br><br>
                       <strong>原因：</strong> 人类活动排放了<strong>过多</strong>的温室气体（厚重的毯子）。这导致散失到太空中热量大幅减少，大量热辐射被强制截留并不断在地球系统内循环，导致热量严重失衡。`,
                earthMat: matExtreme,
                atmoColor: 0xff7700,
                atmoOpacity: 0.3,
                thickAtmoVisible: true,
                escapeCount: 1,
                bounceCount: 6 // 几乎全部热辐射被截留反射回地表
            }
        };

        const titleEl = document.getElementById('title');
        //峇株吧辖华仁中学蔡逸众制作
        const descEl = document.getElementById('description');
        const btns = {
            without: document.getElementById('btn-without'),
            normal: document.getElementById('btn-normal'),
            extreme: document.getElementById('btn-extreme')
        };

        // 面板收起/展开
        const uiPanelEl = document.getElementById('ui-panel');
        const panelHeaderEl = document.getElementById('panel-header');
        const collapseBtnEl = document.getElementById('collapse-btn');
        panelHeaderEl.addEventListener('click', () => {
            const collapsed = uiPanelEl.classList.toggle('collapsed');
            collapseBtnEl.textContent = collapsed ? '▼' : '▲';
            collapseBtnEl.title = collapsed ? '展开面板' : '收起面板';
        });

        function switchState(stateName) {
            const state = states[stateName];
            
            // UI 更新
            Object.values(btns).forEach(b => b.classList.remove('active-btn'));
            btns[stateName].classList.add('active-btn');
            
            titleEl.innerText = state.title;
            titleEl.style.color = state.color;
            descEl.innerHTML = state.desc + `<br><br><strong style="color:${state.color}">本情景箭头统计：</strong>
                成功散失到太空的红外辐射 <strong>${state.escapeCount}</strong> 束，
                被温室气体截留反射回地表的辐射 <strong>${state.bounceCount}</strong> 束。`;

            // 3D 材质更新
            earth.material = state.earthMat;
            atmosphere.material.color.setHex(state.atmoColor);
            atmosphere.material.opacity = state.atmoOpacity;
            thickAtmosphere.visible = state.thickAtmoVisible;

            // 箭头池可见数量调整：按 escapeCount / bounceCount 显示对应数量的曲线箭头
            escapeArrows.forEach((arrow, i) => { arrow.visible = i < state.escapeCount; });
            bounceArrows.forEach((arrow, i) => { arrow.visible = i < state.bounceCount; });
        }

        // 绑定点击事件
        btns.without.addEventListener('click', () => switchState('without'));
        btns.normal.addEventListener('click', () => switchState('normal'));
        btns.extreme.addEventListener('click', () => switchState('extreme'));

        // 初始化默认状态
        //华仁中学蔡逸众制作
        switchState('normal');

        // 7. 动画循环
        let time = 0;
        //峇株吧辖蔡逸众制作
        function animate() {
            requestAnimationFrame(animate);
            
            // 地球及云层自转
            earth.rotation.y += 0.0015;
            atmosphere.rotation.y += 0.0018;
            thickAtmosphere.rotation.y += 0.002;
            starMesh.rotation.y -= 0.0002;

            time += 0.04;

            // 太阳短波辐射：沿入射方向往复移动
            animConfig.forEach(cfg => {
                if(!cfg.obj.visible) return;
                cfg.obj.position.x = cfg.baseX + Math.sin(time) * 0.8;
            });

            // 弯曲箭头（反照率 / 逃逸红外 / 温室气体反射）：光点沿曲线持续流动，直观显示能量传递方向
            //Made by ecchua79
            allFlowArrows.forEach(arrow => {
                if(!arrow.visible) return;
                const t = (time * arrow.flowSpeed + arrow.flowOffset) % 1;
                const pos = arrow.curve.getPointAt(Math.min(Math.max(t, 0.001), 0.999));
                arrow.glow.position.copy(pos);
                const fade = Math.sin(t * Math.PI); // 起点和终点渐隐，中段最亮
                arrow.glow.material.opacity = 0.25 + fade * 0.75;
            });

            renderer.render(scene, camera);
        }

        animate();

        // 窗口大小调整自适应
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
