            background: rgba(255, 255, 255, 0.02);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(234, 179, 8, 0.3);
            border-radius: 2px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(234, 179, 8, 0.6);
        }

        }
        /* 按钮呼吸动画 */
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 5px rgba(234, 179, 8, 0.2); }
            50% { box-shadow: 0 0 15px rgba(234, 179, 8, 0.7); }
        }
        .toggle-pulse {
            animation: pulseGlow 2s infinite;
        }
    </style>

    <!-- Custom Shader (GLSL Simplex Noise) for Solar/Stellar Surface (完美的、不发黑、高亮沸腾燃烧着色器) 🌟 -->
    <script id="vertexShader" type="x-shader/x-vertex">
        precision highp float;
        varying vec2 vUv;
        varying vec3 vNormal;
        varying vec3 vPosition;
        void main() {
            vUv = uv;
            vNormal = normalize(normalMatrix * normal);
            vPosition = position;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
    </script>

    <script id="fragmentShader" type="x-shader/x-fragment">
        precision highp float;
        uniform float uTime;
        uniform vec3 uColor;
        varying vec2 vUv;
        varying vec3 vNormal;
        varying vec3 vPosition;

        // Simplex Noise 3D Implementation by Ashima Arts
        vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
        vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }

        float snoise(vec3 v) { 
            const vec2 C = vec2(1.0/6.0, 1.0/3.0) ;
            const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);

            vec3 i  = floor(v + dot(v, C.yyy) );
            vec3 x0 =   v - i + dot(i, C.xxx) ;

            vec3 g = step(x0.yzx, x0.xyz);
            vec3 l = 1.0 - g;
            vec3 i1 = min( g.xyz, l.zxy );
            vec3 i2 = max( g.xyz, l.zxy );

            vec3 x1 = x0 - i1 + C.xxx;
            vec3 x2 = x0 - i2 + C.yyy;
            vec3 x3 = x0 - D.yyy;

            i = mod289(i); 
            vec4 p = permute( permute( permute( 
                        i.z + vec4(0.0, i1.z, i2.z, 1.0 ))
                    + i.y + vec4(0.0, i1.y, i2.y, 1.0 )) 
                    + i.x + vec4(0.0, i1.x, i2.x, 1.0 ));

            float n_ = 0.142857142857;
            vec3  ns = n_ * D.wyz - D.xzx;

            vec4 j = p - 49.0 * floor(p * ns.z);

            vec4 x_ = floor(j * ns.z);
            vec4 y_ = floor(j - 7.0 * x_ );

            vec4 x = x_ *ns.x + ns.yyyy;
            vec4 y = y_ *ns.x + ns.yyyy;
            vec4 h = 1.0 - abs(x) - abs(y);

            vec4 b0 = vec4( x.xy, y.xy );
            vec4 b1 = vec4( x.zw, y.zw );

            vec4 s0 = floor(b0)*2.0 + 1.0;
            vec4 s1 = floor(b1)*2.0 + 1.0;
            vec4 sh = -step(h, vec4(0.0));

            vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy ;
            vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww ;

            vec3 p0 = vec3(a0.xy,h.x);
            vec3 p1 = vec3(a0.zw,h.y);
            vec3 p2 = vec3(a1.xy,h.z);
            vec3 p3 = vec3(a1.zw,h.w);

            vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));
            p0 *= norm.x;
            p1 *= norm.y;
            p2 *= norm.z;
            p3 *= norm.w;

            vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
            m = m * m;
            return 42.0 * dot( m*m, vec4( dot(p0,x0), dot(p1,x1), 
                                            dot(p2,x2), dot(p3,x3) ) );
        }

        void main() {
            // 通过 3D 噪声生成对流胞颗粒
            vec3 noisePos = normalize(vPosition) * 4.5 + vec3(0.0, 0.0, uTime * 0.75);
            float n1 = snoise(noisePos);
            float n2 = snoise(noisePos * 2.5 - vec3(uTime * 0.3)) * 0.5;
            float totalNoise = (n1 + n2) / 1.5; // [-1.0, 1.0]
            totalNoise = clamp(totalNoise, -1.0, 1.0);

            // 恒星耀眼表面配置 (自发光亮度加成，杜绝黑心)
            vec3 coreBright = vec3(1.15, 1.12, 1.0); // 白炽亮斑
            vec3 midTone = uColor * 1.6;             // 对流中色调 (增强 1.6 倍发光)
            vec3 coolTone = uColor * 0.85;           // 对流冷却斑

            vec3 surfaceColor = mix(coolTone, midTone, totalNoise * 0.5 + 0.5);
            if (totalNoise > 0.1) {
                surfaceColor = mix(surfaceColor, coreBright, clamp((totalNoise - 0.1) * 1.6, 0.0, 1.0));
            }

            // 边缘菲涅尔散射，让发光更加有质感
            float fresnel = pow(1.0 - max(dot(vNormal, vec3(0.0, 0.0, 1.0)), 0.0), 3.0);
            vec3 rimColor = mix(uColor, vec3(1.0), 0.6) * 1.8;
            
            vec3 finalColor = surfaceColor + rimColor * fresnel;
            finalColor = clamp(finalColor, 0.0, 4.0);
            gl_FragColor = vec4(finalColor, 1.0);
        }
    </script>

    <script>

        const EVOLUTION_DATA = {

        // --- 2. 初始化核心 3D 变量与后期处理管线 ---
        let scene, camera, renderer, controls;

        // 全局共享噪声 Shader 材质 🌟 (杜绝克隆 Uniform 时的颜色覆盖及不沸腾现象)
        let stellarShaderMaterial = null;

        // 过程化发光点
        function createParticleGlowTexture(innerColStr, outerColStr) {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
            gradient.addColorStop(0, innerColStr);
            gradient.addColorStop(0.2, innerColStr);
            gradient.addColorStop(0.5, outerColStr);
            gradient.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 128, 128);
            return new THREE.CanvasTexture(canvas);
        }

        const textures = {
            purpleGlow: createParticleGlowTexture('rgba(224,180,255,1)', 'rgba(147,51,234,0.3)'),

        //华仁中学蔡逸众制作

            whiteDot: createParticleGlowTexture('rgba(255,255,255,1)', 'rgba(255,255,255,0.35)'),

        // --- 3. 3D 场景与后期通道搭建 ---
        function initScene() {
        //Made by ecchua79
            const container = document.getElementById('canvas3d');
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x010103, 0.01);

            camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(0, 10, 26); 

            renderer = new THREE.WebGLRenderer({ canvas: container, antialias: true, powerPreference: "high-performance" });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            // 轨道控制
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxDistance = 120;
            controls.minDistance = 2;

            scene.add(stageGroup);

            // 强环境光提亮
            const ambient = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambient);
            
            const pointLight = new THREE.PointLight(0xffffff, 6.0, 100);
            pointLight.position.set(0, 0, 0);
            scene.add(pointLight);

            // 初始化电浆着色器材质组件 (强制 highp 精度，修复移动端 GPU 噪声溢出导致的错色 bug) 🌟
            stellarShaderMaterial = new THREE.ShaderMaterial({
                vertexShader: document.getElementById('vertexShader').textContent,
                fragmentShader: document.getElementById('fragmentShader').textContent,
                precision: 'highp',
                uniforms: {
                    uTime: { value: 0.0 },
                    uColor: { value: new THREE.Color(0xffaa00) }
                }
        //峇株吧辖华仁中学蔡逸众制作
            });

            // 核心后期处理管线设置
            const renderScene = new THREE.RenderPass(scene, camera);
            
            const bloomPass = new THREE.UnrealBloomPass(
                new THREE.Vector2(container.clientWidth, container.clientHeight), 
                1.75,  
                0.45,  
                0.12   
            );

            composer = new THREE.EffectComposer(renderer);
            composer.addPass(renderScene);
            composer.addPass(bloomPass);

            // 自适应布局
            checkResponsiveLayout();

            // 生成阶段 Tab
            generateStageButtons();

            // 绘制初始 3D 天体
            buildStage3D();

            animate();

        // --- 4. 三维星云/星体阶段几何动态重建 ---
        function clearStageGroup() {
            while(stageGroup.children.length > 0){ 
                const obj = stageGroup.children[0];
                stageGroup.remove(obj); 
            }
            activePoints = null;
            activeStar = null;
            activeCompanion = null;
            specialOutflow = null;
        }

        // 重新构建对应路线与演化阶段的 3D 星体结构
        function buildStage3D() {
            clearStageGroup();

            const config = EVOLUTION_DATA[currentRoute].stages[currentStage];
            const col = config.color;

            // 阶段 1: 弥漫星云
            if (currentStage === 1) {
                const count = 3800;
                const geom = new THREE.BufferGeometry();
                const pos = new Float32Array(count * 3);
                const colors = new Float32Array(count * 3);

                const scaleRad = currentRoute === 'low' ? 12 : currentRoute === 'medium' ? 16 : 20;
                
        //峇株吧辖蔡逸众制作
                for (let i = 0; i < count * 3; i += 3) {
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.acos(2 * Math.random() - 1);
                    const r = Math.pow(Math.random(), 2.2) * scaleRad + 1.0;

                    pos[i] = r * Math.sin(phi) * Math.cos(theta);
                    pos[i+1] = r * Math.sin(phi) * Math.sin(theta);
                    pos[i+2] = r * Math.cos(phi);

                    const tempCol = new THREE.Color(col);
                    tempCol.multiplyScalar(1.6);
                    colors[i] = tempCol.r;
                    colors[i+1] = tempCol.g;
                    colors[i+2] = tempCol.b;
                }

                geom.setAttribute('position', new THREE.BufferAttribute(pos, 3));
                geom.setAttribute('color', new THREE.BufferAttribute(colors, 3));

                const mapGlow = currentRoute === 'low' ? textures.purpleGlow : currentRoute === 'medium' ? textures.indigoGlow : textures.blueGlow;

                const mat = new THREE.PointsMaterial({
                    size: 0.45, 
                    vertexColors: true,
                    map: mapGlow,
                    transparent: true,
                    opacity: 0.85, 
                    blending: THREE.AdditiveBlending,
                    depthWrite: false
                });

                activePoints = new THREE.Points(geom, mat);
                stageGroup.add(activePoints);
            }

            // 阶段 2: 原恒星
            else if (currentStage === 2) {
                const radius = currentRoute === 'low' ? 1.2 : currentRoute === 'medium' ? 1.8 : 2.5;
                const coreGeom = new THREE.SphereGeometry(radius, 48, 48);
                
                // 给全局共享 Shader 更新当前的颜色 Uniform 🌟
                stellarShaderMaterial.uniforms.uColor.value.setHex(col);
                activeStar = new THREE.Mesh(coreGeom, stellarShaderMaterial);
                stageGroup.add(activeStar);

                // 吸积盘尘埃粒子
                const diskCount = 2000;
                const diskGeom = new THREE.BufferGeometry();
                const diskPos = new Float32Array(diskCount * 3);
                const diskColors = new Float32Array(diskCount * 3);

                for (let i = 0; i < diskCount * 3; i += 3) {
                    const angle = Math.random() * Math.PI * 2;
                    const r = Math.pow(Math.random(), 1.5) * (radius * 5.2) + (radius * 1.1);
                    diskPos[i] = r * Math.cos(angle);
                    diskPos[i+1] = (Math.random() - 0.5) * 0.35;
                    diskPos[i+2] = r * Math.sin(angle);

                    const factor = (r - radius) / (radius * 5.2);
                    const coreCol = new THREE.Color(col).multiplyScalar(1.5); 
                    const outerCol = new THREE.Color(0xaa3300);
                    coreCol.lerp(outerCol, factor);
                    diskColors[i] = coreCol.r;
                    diskColors[i+1] = coreCol.g;
                    diskColors[i+2] = coreCol.b;
                }

                diskGeom.setAttribute('position', new THREE.BufferAttribute(diskPos, 3));
                diskGeom.setAttribute('color', new THREE.BufferAttribute(diskColors, 3));

                const diskMat = new THREE.PointsMaterial({
                    size: 0.22, 
                    vertexColors: true,
                    map: textures.amberGlow,
                    transparent: true,
                    opacity: 0.9,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false
                });
                activePoints = new THREE.Points(diskGeom, diskMat);
                stageGroup.add(activePoints);

                buildPolarJets(radius);
            }

            // 阶段 3: 主序星阶段 (直接绑定全局唯一 Noise Shader 🌟，动态灌入颜色 Uniform，从底层根除交叉覆盖 Bug)
            else if (currentStage === 3) {
                const radius = currentRoute === 'low' ? 1.5 : currentRoute === 'medium' ? 2.2 : 3.0;
                const coreGeom = new THREE.SphereGeometry(radius, 48, 48); 
                
                // 动态将当前阶段的颜色精确、实时写入全局 Shader 中 🌟
                stellarShaderMaterial.uniforms.uColor.value.setHex(col);
                
                activeStar = new THREE.Mesh(coreGeom, stellarShaderMaterial);
                stageGroup.add(activeStar);

                // 日冕环绕粒子
                const coronaCount = 600;
                const coronaGeom = new THREE.BufferGeometry();
                const coronaPos = new Float32Array(coronaCount * 3);
                for (let i = 0; i < coronaCount * 3; i += 3) {
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.acos(2 * Math.random() - 1);
                    const r = radius + 0.1 + Math.random() * 0.5;
                    coronaPos[i] = r * Math.sin(phi) * Math.cos(theta);
                    coronaPos[i+1] = r * Math.sin(phi) * Math.sin(theta);
                    coronaPos[i+2] = r * Math.cos(phi);
                }
                coronaGeom.setAttribute('position', new THREE.BufferAttribute(coronaPos, 3));
                const glowTexture = currentRoute === 'low' ? textures.yellowGlow : textures.blueGlow;
                const coronaMat = new THREE.PointsMaterial({
                    size: 0.15,
                    color: col,
                    map: glowTexture,
                    transparent: true,
                    opacity: 0.8,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false
                });
                activePoints = new THREE.Points(coronaGeom, coronaMat);
                stageGroup.add(activePoints);
            }

            // 阶段 4: 红巨星/红超巨星 (同样应用电浆噪声 Shader 并灌入红橙色 Uniform) 🌟
            else if (currentStage === 4) {
                const radius = currentRoute === 'low' ? 4.2 : currentRoute === 'medium' ? 5.5 : 7.0;
                const coreGeom = new THREE.SphereGeometry(radius, 48, 48);
                
                stellarShaderMaterial.uniforms.uColor.value.setHex(col);

                activeStar = new THREE.Mesh(coreGeom, stellarShaderMaterial);
                stageGroup.add(activeStar);

                const denseGeom = new THREE.SphereGeometry(radius * 0.15, 32, 32);
                const denseMat = new THREE.MeshBasicMaterial({ color: 0xff3300 });
                const denseCore = new THREE.Mesh(denseGeom, denseMat);
                stageGroup.add(denseCore);

                const shieldGeom = new THREE.SphereGeometry(radius * 1.05, 32, 32);
                const shieldMat = new THREE.MeshBasicMaterial({
                    color: col,
                    transparent: true,
                    opacity: 0.35,
                    blending: THREE.AdditiveBlending
                });
                activeCompanion = new THREE.Mesh(shieldGeom, shieldMat);
                stageGroup.add(activeCompanion);
            }

            // 阶段 5: 行星状星云 (重构为七彩高频大爆炸扩散) OR 超新星大爆炸 💥
            else if (currentStage === 5) {
                if (currentRoute === 'low') {
                    // 1. 小质量：行星状星云大面积彩色粒子流
                    const coreGeom = new THREE.SphereGeometry(0.25, 16, 16);
                    const coreMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
                    activeStar = new THREE.Mesh(coreGeom, coreMat);
                    stageGroup.add(activeStar);

                    buildPlanetaryRings();
                } else {
                    // 2. 超新星大爆炸
                    const coreGeom = new THREE.SphereGeometry(0.8, 32, 32);
        //Made by ecchua79
                    const coreMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
                    activeStar = new THREE.Mesh(coreGeom, coreMat);
                    stageGroup.add(activeStar);

                    const snCount = 3500;
                    const snGeom = new THREE.BufferGeometry();
                    const snPos = new Float32Array(snCount * 3);
                    const snColors = new Float32Array(snCount * 3);
                    for (let i = 0; i < snCount * 3; i += 3) {
                        const theta = Math.random() * Math.PI * 2;
                        const phi = Math.acos(2 * Math.random() - 1);
                        const r = 1.0 + Math.random() * 8.0;

                        snPos[i] = r * Math.sin(phi) * Math.cos(theta);
                        snPos[i+1] = r * Math.sin(phi) * Math.sin(theta);
                        snPos[i+2] = r * Math.cos(phi);

                        const mix = Math.random();
                        if (mix < 0.3) {
                            snColors[i] = 1.0; snColors[i+1] = 1.0; snColors[i+2] = 1.0;
                        } else if (mix < 0.7) {
                            snColors[i] = 0.95; snColors[i+1] = 0.45; snColors[i+2] = 0.05;
                        } else {
                            snColors[i] = 0.95; snColors[i+1] = 0.1; snColors[i+2] = 0.1;
                        }
                    }
                    snGeom.setAttribute('position', new THREE.BufferAttribute(snPos, 3));
                    snGeom.setAttribute('color', new THREE.BufferAttribute(snColors, 3));

                    const glowTex = currentRoute === 'medium' ? textures.amberGlow : textures.redGlow;
                    const snMat = new THREE.PointsMaterial({
                        size: 0.38,
                        vertexColors: true,
                        map: glowTex,
                        transparent: true,
                        opacity: 0.85,
                        blending: THREE.AdditiveBlending,
                        depthWrite: false
                    });
                    activePoints = new THREE.Points(snGeom, snMat);
                    stageGroup.add(activePoints);
                }
            }

            // 阶段 6: 终极残骸 (白矮星 vs 中子星 vs 恒星级黑洞)
            else if (currentStage === 6) {
                if (currentRoute === 'low') {
                    const coreGeom = new THREE.SphereGeometry(0.12, 32, 32);
                    const coreMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
                    activeStar = new THREE.Mesh(coreGeom, coreMat);
                    stageGroup.add(activeStar);

                    const haloGeom = new THREE.SphereGeometry(0.4, 16, 16);
                    const haloMat = new THREE.MeshBasicMaterial({
        //峇株吧辖蔡逸众制作
                        color: 0x93c5fd,
                        transparent: true,
                        opacity: 0.8, 
                        blending: THREE.AdditiveBlending
                    });
                    activeCompanion = new THREE.Mesh(haloGeom, haloMat);
                    stageGroup.add(activeCompanion);
                } 
                else if (currentRoute === 'medium') {
                    const coreGeom = new THREE.SphereGeometry(0.15, 32, 32);
                    const coreMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
                    activeStar = new THREE.Mesh(coreGeom, coreMat);
                    stageGroup.add(activeStar);

                    const magnetGeom = new THREE.SphereGeometry(0.45, 16, 16);
                    const magnetMat = new THREE.MeshBasicMaterial({
                        color: 0x818cf8,
                        transparent: true,
                        opacity: 0.85,
                        blending: THREE.AdditiveBlending
                    });
                    activeCompanion = new THREE.Mesh(magnetGeom, magnetMat);
                    stageGroup.add(activeCompanion);

                    // 极向偏角射线束
                    const coneCount = 350;
                    const coneGeom = new THREE.BufferGeometry();
                    const conePos = new Float32Array(coneCount * 3);
                    for (let i = 0; i < coneCount * 3; i += 3) {
                        conePos[i] = (Math.random() - 0.5) * 0.12;
                        conePos[i+1] = Math.random() * 11.0 + 0.3; 
                        conePos[i+2] = (Math.random() - 0.5) * 0.12;
                    }
                    coneGeom.setAttribute('position', new THREE.BufferAttribute(conePos, 3));
                    const coneMat = new THREE.PointsMaterial({
                        size: 0.18,
                        color: 0xe0e7ff,
                        map: textures.whiteDot,
                        transparent: true,
                        opacity: 0.85,
                        blending: THREE.AdditiveBlending,
                        depthWrite: false
                    });
                    specialOutflow = new THREE.Points(coneGeom, coneMat);
                    stageGroup.add(specialOutflow);

                    const coneDownGeom = coneGeom.clone();
                    const posDown = coneDownGeom.attributes.position.array;
                    for (let i = 1; i < posDown.length; i += 3) {
                        posDown[i] = -posDown[i]; 
                    }
                    coneDownGeom.attributes.position.needsUpdate = true;
                    const specialOutflowDown = new THREE.Points(coneDownGeom, coneMat);
                    stageGroup.add(specialOutflowDown);
                } 
                else if (currentRoute === 'high') {
                    const coreGeom = new THREE.SphereGeometry(0.3, 32, 32);
                    const coreMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
                    activeStar = new THREE.Mesh(coreGeom, coreMat);
                    stageGroup.add(activeStar);

                    const ringCount = 2000;
        //峇株吧辖华仁中学蔡逸众制作
                    const ringGeom = new THREE.BufferGeometry();
                    const ringPos = new Float32Array(ringCount * 3);
                    const ringColors = new Float32Array(ringCount * 3);

                    for (let i = 0; i < ringCount * 3; i += 3) {
                        const angle = Math.random() * Math.PI * 2;
                        const r = Math.pow(Math.random(), 1.5) * 7.0 + 0.75; 

                        const waveZ = Math.sin(angle * 2) * (r * 0.22);
                        ringPos[i] = r * Math.cos(angle);
                        ringPos[i+1] = waveZ; 
                        ringPos[i+2] = r * Math.sin(angle);

                        const factor = (r - 0.75) / 7.0;
                        const innerColor = new THREE.Color(0x3b82f6);
                        const outerColor = new THREE.Color(0xef4444);
                        innerColor.lerp(outerColor, factor);
                        ringColors[i] = innerColor.r;
                        ringColors[i+1] = innerColor.g;
                        ringColors[i+2] = innerColor.b;
                    }

                    ringGeom.setAttribute('position', new THREE.BufferAttribute(ringPos, 3));
                    ringGeom.setAttribute('color', new THREE.BufferAttribute(ringColors, 3));

                    const bhDiskMat = new THREE.PointsMaterial({
                        size: 0.16,
                        vertexColors: true,
                        map: textures.whiteDot,
                        transparent: true,
                        opacity: 0.9,
                        blending: THREE.AdditiveBlending,
                        depthWrite: false
                    });
                    activePoints = new THREE.Points(ringGeom, bhDiskMat);
                    stageGroup.add(activePoints);

                    const jetCount = 450;
                    const jetGeom = new THREE.BufferGeometry();
                    const jetPos = new Float32Array(jetCount * 3);
                    for (let i = 0; i < jetCount * 3; i += 3) {
                        jetPos[i] = (Math.random() - 0.5) * 0.12;
                        jetPos[i+1] = Math.random() * 12.0 + 0.35; 
                        jetPos[i+2] = (Math.random() - 0.5) * 0.12;
                    }
                    jetGeom.setAttribute('position', new THREE.BufferAttribute(jetPos, 3));
                    const jetMat = new THREE.PointsMaterial({
                        size: 0.25,
                        color: 0x60a5fa,
                        map: textures.blueGlow,
                        transparent: true,
                        opacity: 0.95,
                        blending: THREE.AdditiveBlending,
                        depthWrite: false
                    });
                    specialOutflow = new THREE.Points(jetGeom, jetMat);
                    stageGroup.add(specialOutflow);

                    const jetDownGeom = jetGeom.clone();
                    const dPos = jetDownGeom.attributes.position.array;
                    for (let i = 1; i < dPos.length; i += 3) {
                        dPos[i] = -dPos[i];
                    }
                    jetDownGeom.attributes.position.needsUpdate = true;
                    const specialOutflowDown = new THREE.Points(jetDownGeom, jetMat);
                    stageGroup.add(specialOutflowDown);
                }
            }
        }

        // 原恒星两极喷流
        function buildPolarJets(radius) {
            const jetCount = 450;
            const jetUpGeom = new THREE.BufferGeometry();
            const jetDownGeom = new THREE.BufferGeometry();
            const posUp = new Float32Array(jetCount * 3);
            const posDown = new Float32Array(jetCount * 3);

            for(let i=0; i<jetCount*3; i+=3) {
                posUp[i] = (Math.random() - 0.5) * 0.3;
                posUp[i+1] = Math.random() * 8.0 + (radius * 1.02);
                posUp[i+2] = (Math.random() - 0.5) * 0.3;

                posDown[i] = (Math.random() - 0.5) * 0.3;
                posDown[i+1] = -(Math.random() * 8.0 + (radius * 1.02));
                posDown[i+2] = (Math.random() - 0.5) * 0.3;
            }

            jetUpGeom.setAttribute('position', new THREE.BufferAttribute(posUp, 3));
            jetDownGeom.setAttribute('position', new THREE.BufferAttribute(posDown, 3));

            const jetMat = new THREE.PointsMaterial({
                size: 0.25, 
                color: 0xaaccff,
                map: textures.blueGlow,
                transparent: true,
                opacity: 0.85,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            const j1 = new THREE.Points(jetUpGeom, jetMat);
            const j2 = new THREE.Points(jetDownGeom, jetMat);
            
            const jetGroup = new THREE.Group();
            jetGroup.add(j1, j2);
            activeCompanion = jetGroup;
            stageGroup.add(activeCompanion);
        }

        // 太阳行星状星云：五彩斑斓爆发式球形扩散气层 🌟
        function buildPlanetaryRings() {
            const count = 2800; 
            const geom = new THREE.BufferGeometry();
            const pos = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);
            const customData = new Float32Array(count * 3); 

            for (let i = 0; i < count; i++) {
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                const r = Math.random() * 0.4;

                const idx = i * 3;
                pos[idx] = r * Math.sin(phi) * Math.cos(theta);
                pos[idx+1] = r * Math.sin(phi) * Math.sin(theta);
                pos[idx+2] = r * Math.cos(phi);

                customData[idx] = Math.sin(phi) * Math.cos(theta);
                customData[idx+1] = Math.sin(phi) * Math.sin(theta);
                customData[idx+2] = Math.cos(phi);

                // 五彩斑斓彩虹色：极光绿、紫、红、宇宙蓝、金黄
                const randCol = Math.random();
                let col = new THREE.Color();
                if (randCol < 0.2) col.setHex(0x14b8a6);      
                else if (randCol < 0.4) col.setHex(0x9333ea); 
                else if (randCol < 0.6) col.setHex(0xef4444); 
                else if (randCol < 0.8) col.setHex(0x3b82f6); 
                else col.setHex(0xeab308);                    

                colors[idx] = col.r;
                colors[idx+1] = col.g;
                colors[idx+2] = col.b;
            }

            geom.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            geom.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geom.setAttribute('customData', new THREE.BufferAttribute(customData, 3));

            const mat = new THREE.PointsMaterial({
                size: 0.16, 
                vertexColors: true,
                map: textures.whiteDot,
                transparent: true,
                opacity: 0.85,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            activePoints = new THREE.Points(geom, mat);
            stageGroup.add(activePoints);
        }

        // --- 5. 动态装配阶段按钮 ---
        function generateStageButtons() {
            const container = document.getElementById("stages-container");
            container.innerHTML = ""; 

            const route = EVOLUTION_DATA[currentRoute];
            const stages = route.stages;

            for (let i = 1; i <= 6; i++) {
                const s = stages[i];
                let roman = "";
                switch(i) {
                    case 1: roman = "STAGE I"; break;
                    case 2: roman = "STAGE II"; break;
                    case 3: roman = "STAGE III"; break;
                    case 4: roman = "STAGE IV"; break;
                    case 5: roman = "STAGE V"; break;
                    case 6: roman = "STAGE VI"; break;
                }

                const button = document.createElement("button");
                button.id = `btn-stage-${i}`;
                button.onclick = () => changeStage(i);
                button.className = "stage-btn flex flex-col p-1.5 rounded border border-slate-800 bg-slate-900/40 hover:bg-yellow-500/5 hover:border-yellow-500/30 transition-all duration-300 text-left";
                
                button.innerHTML = `
                    <span class="text-[8px] ${s.colorClass} font-bold tech-font">${roman}</span>
                    <span class="text-[10px] sm:text-xs text-slate-300 font-semibold truncate w-full">${i}. ${s.title.split(' ')[0]}</span>
                `;
                container.appendChild(button);
            }
        }

        // --- 7. 演化控制与镜头补间过渡 ---
        window.switchMassRoute = function(routeKey) {
            currentRoute = routeKey;
            
            document.getElementById("btn-route-low").className = `px-2 sm:px-3 py-1 rounded text-[10px] font-semibold tracking-wider transition-all duration-300 ${routeKey === 'low' ? 'bg-yellow-500 text-black' : 'text-slate-400 hover:text-white'}`;
            document.getElementById("btn-route-medium").className = `px-2 sm:px-3 py-1 rounded text-[10px] font-semibold tracking-wider transition-all duration-300 ${routeKey === 'medium' ? 'bg-indigo-500 text-white' : 'text-slate-400 hover:text-white'}`;
            document.getElementById("btn-route-high").className = `px-2 sm:px-3 py-1 rounded text-[10px] font-semibold tracking-wider transition-all duration-300 ${routeKey === 'high' ? 'bg-blue-600 text-white shadow-[0_0_15px_#2563eb]' : 'text-slate-400 hover:text-white'}`;

            generateStageButtons();
            changeStage(currentStage);
        };

        window.changeStage = function(stageIndex) {
            currentStage = parseInt(stageIndex);
            
            buildStage3D();

            const route = EVOLUTION_DATA[currentRoute];
            const config = route.stages[currentStage];
            
            // GSAP 镜头平滑拉推
            const targetDistance = config.cameraDist || 20;
            const targetX = 0;
            const targetY = targetDistance * 0.4;
            const targetZ = targetDistance * 0.9;

            gsap.to(camera.position, {
                x: targetX,
                y: targetY,
                z: targetZ,
                duration: 1.4, 
                ease: "power2.inOut",
                onUpdate: () => {
                    camera.lookAt(0, 0, 0);
                }
            });

            gsap.to(controls.target, {
                x: 0,
                y: 0,
                z: 0,
                duration: 1.4,
                ease: "power2.inOut"
            });

            // 面板文字更新
            document.getElementById("star-mass-tag").innerText = route.massTag;
            document.getElementById("text-stage-roman").innerText = config.roman;
            document.getElementById("text-stage-title").innerText = config.title;
            document.getElementById("text-stage-short").innerText = config.short;
            document.getElementById("text-stage-description").innerText = config.desc;

            // 遥测物理指标更新
            document.getElementById("telemetry-temp").innerText = config.temp;
            document.getElementById("telemetry-radius").innerText = config.radius;
            document.getElementById("telemetry-fusion").innerText = config.fusion;
            document.getElementById("telemetry-balance").innerText = config.balance;
            document.getElementById("cosmic-age-timer").innerText = config.ageText;

            // 侧边选定高亮
            document.querySelectorAll(".stage-btn").forEach((btn) => {
                btn.className = "stage-btn flex flex-col p-1.5 rounded border border-slate-800 bg-slate-900/40 hover:bg-yellow-500/5 hover:border-yellow-500/30 transition-all duration-300 text-left";
            });
            const activeBtn = document.getElementById(`btn-stage-${currentStage}`);
            if (activeBtn) {
                activeBtn.className = "stage-btn flex flex-col p-1.5 rounded border border-yellow-500/40 bg-yellow-500/10 transition-all duration-300 text-left neon-border-amber";
            }

            // 赫罗图
            const hrDot = document.getElementById("hr-dot");
            hrDot.style.left = `${config.hrPos.x}%`;
            hrDot.style.bottom = `${config.hrPos.y}%`;
            
            let dotColor = '#eab308';
            if (currentRoute === 'medium') dotColor = '#6366f1';
            if (currentRoute === 'high') dotColor = '#2563eb';
            if (currentStage === 4) dotColor = '#ef4444'; 
            if (currentStage === 5) dotColor = '#f97316'; 

            hrDot.style.boxShadow = `0 0 10px ${dotColor}`;
            hrDot.style.backgroundColor = dotColor;
            document.getElementById("hr-brief").innerText = config.hrBrief;
        };

        // --- 8. 面板展开收纳 ---
        window.toggleLeftPanel = function(forceCollapse = null) {
        //华仁中学蔡逸众制作
            const panel = document.getElementById('panel-left');
            const arrow = document.getElementById('arrow-left');
            
            if (forceCollapse !== null) {
                isLeftPanelOpen = !forceCollapse;
            } else {
                isLeftPanelOpen = !isLeftPanelOpen;
            }

            if (isLeftPanelOpen) {
                panel.style.transform = 'translateX(0)';
                arrow.className = 'fa-solid fa-chevron-left text-xs';
            } else {
                panel.style.transform = 'translateX(-100%)';
                arrow.className = 'fa-solid fa-chevron-right text-xs';
            }
        };

        window.toggleRightPanel = function(forceCollapse = null) {
            const panel = document.getElementById('panel-right');
            const arrow = document.getElementById('arrow-right');

            if (forceCollapse !== null) {
                isRightPanelOpen = !forceCollapse;
            } else {
                isRightPanelOpen = !isRightPanelOpen;
            }

            if (isRightPanelOpen) {
                panel.style.transform = 'translateX(0)';
                arrow.className = 'fa-solid fa-chevron-right text-xs';
            } else {
                panel.style.transform = 'translateX(100%)';
                arrow.className = 'fa-solid fa-chevron-left text-xs';
            }
        };

        function checkResponsiveLayout() {
            if (window.innerWidth < 1024) {
                toggleLeftPanel(true);
                toggleRightPanel(true);
            } else {
                toggleLeftPanel(false);
                toggleRightPanel(false);
            }
        }

        // 自动播放
        window.toggleAutoPlay = function() {
            isPlaying = !isPlaying;
            const playIcon = document.getElementById("icon-play");
            const playBtn = document.getElementById("btn-play");

            if (isPlaying) {
                playIcon.className = "fa-solid fa-pause";
                playBtn.className = "w-8 h-8 rounded-full bg-red-500 text-white flex items-center justify-center hover:bg-red-400 transition-all duration-300 animate-pulse shrink-0";
                startAutoPlayTimer();
            } else {
                playIcon.className = "fa-solid fa-play ml-0.5 text-xs";
                playBtn.className = "w-8 h-8 rounded-full bg-yellow-500 text-black flex items-center justify-center hover:bg-yellow-400 transition-all duration-300 shrink-0";
                clearInterval(autoPlayInterval);
            }
        };

        function startAutoPlayTimer() {
            if (autoPlayInterval) clearInterval(autoPlayInterval);
            const intervalTime = (11 - autoPlaySpeed) * 1000;
            
            autoPlayInterval = setInterval(() => {
                let nextStage = currentStage + 1;
                if (nextStage > 6) nextStage = 1;
                changeStage(nextStage);
            }, intervalTime);
        }

        document.getElementById("autoplay-speed-slider").addEventListener("input", (e) => {
            autoPlaySpeed = parseInt(e.target.value);
            document.getElementById("autoplay-speed-label").innerText = `${(autoPlaySpeed).toFixed(1)} 亿年/秒`;
            if (isPlaying) {
                startAutoPlayTimer();
            }
        });

        // --- 9. 3D 心跳动画渲染主循环 ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            
            const elapsedTime = clock.getElapsedTime();

            // 相机自动巡航
            if (isCameraAutoCruise) {
                const config = EVOLUTION_DATA[currentRoute].stages[currentStage];
                const orbitRadius = (config.cameraDist || 20) * 1.1;
                const slowSpeed = elapsedTime * 0.08; 
                
                camera.position.x = orbitRadius * Math.sin(slowSpeed);
                camera.position.z = orbitRadius * Math.cos(slowSpeed);
                camera.position.y = (orbitRadius * 0.4) + Math.sin(elapsedTime * 0.2) * (orbitRadius * 0.08); 
                
                controls.target.set(0, 0, 0);
            }

            controls.update();

            // 驱动全局共享着色器 Uniform (让沸腾的太阳和炽热大质量蓝巨星在渲染管线中动起来) 🌟
            if (stellarShaderMaterial) {
                stellarShaderMaterial.uniforms.uTime.value = elapsedTime;
            }

            // 1. STAGE I: 星云旋转
            if (currentStage === 1 && activePoints) {
                activePoints.rotation.y = elapsedTime * 0.04;
                activePoints.rotation.z = Math.sin(elapsedTime * 0.05) * 0.08;
            }

            // 2. STAGE II: 原恒星吸积自转
            if (currentStage === 2) {
                if (activeStar) activeStar.rotation.y = elapsedTime * 0.4;
                
                if (activePoints) {
                    activePoints.rotation.y = elapsedTime * 1.1; 
                    const geom = activePoints.geometry;
                    const pos = geom.attributes.position.array;
                    for (let i = 0; i < pos.length; i += 3) {
                        const x = pos[i];
                        const z = pos[i+2];
                        const r = Math.sqrt(x*x + z*z);
                        pos[i+1] = Math.sin(r * 1.5 - elapsedTime * 4.0) * 0.08;
                    }
                    geom.attributes.position.needsUpdate = true;
                }

                if (activeCompanion) {
                    const jets = activeCompanion.children;
                    jets.forEach((j, jIdx) => {
                        const pos = j.geometry.attributes.position.array;
                        const limit = jIdx === 0 ? 9.0 : -9.0;
                        const direction = jIdx === 0 ? 1 : -1;
                        
                        for (let i = 1; i < pos.length; i += 3) {
                            pos[i] += 0.09 * direction;
                            if (direction === 1 && pos[i] > limit) pos[i] = 1.2;
                            if (direction === -1 && pos[i] < limit) pos[i] = -1.2;
                        }
                        j.geometry.attributes.position.needsUpdate = true;
                    });
                }
            }

            // 3. STAGE III: 主序星对流呼吸
            if (currentStage === 3) {
                if (activeStar) {
                    activeStar.rotation.y = elapsedTime * 0.15;
                    const pulse = 1.0 + Math.sin(elapsedTime * 2.5) * 0.015;
                    activeStar.scale.set(pulse, pulse, pulse);
                }
                if (activePoints) {
                    activePoints.rotation.y = -elapsedTime * 0.3;
                }
            }

            // 4. STAGE IV: 巨星/超巨星
            if (currentStage === 4) {
                if (activeStar) {
                    activeStar.rotation.y = elapsedTime * 0.05;
                    const pulse = 1.0 + Math.sin(elapsedTime * 0.8) * 0.03;
                    activeStar.scale.set(pulse, pulse, pulse);
                    
        //Made by ecchua79
                    if (activeCompanion) {
                        activeCompanion.scale.set(pulse * 1.01, pulse * 1.01, pulse * 1.01);
                        activeCompanion.rotation.y = -elapsedTime * 0.06;
                    }
                }
            }

            // 5. STAGE V: 行星状星云大面积彩色粒子爆发扩散 🌟 OR 超新星爆发
            if (currentStage === 5) {
                if (currentRoute === 'low') {
                    if (activeStar) activeStar.rotation.y = elapsedTime * 0.6;
                    if (activePoints) {
                        const geom = activePoints.geometry;
                        const pos = geom.attributes.position.array;
                        const vel = geom.attributes.customData.array;
                        
                        for (let i = 0; i < pos.length; i += 3) {
                            const speed = 0.045 + (i % 5) * 0.015; 
                            pos[i] += vel[i] * speed;
                            pos[i+1] += vel[i+1] * speed;
                            pos[i+2] += vel[i+2] * speed;

                            const dist = Math.sqrt(pos[i]*pos[i] + pos[i+1]*pos[i+1] + pos[i+2]*pos[i+2]);
                            if (dist > 9.0) {
                                pos[i] = 0;
                                pos[i+1] = 0;
                                pos[i+2] = 0;
                            }
                        }
                        geom.attributes.position.needsUpdate = true;
                    }
                } else {
                    if (activePoints) {
                        const geom = activePoints.geometry;
                        const pos = geom.attributes.position.array;
                        const rate = 0.45; 
                        const cycle = (elapsedTime * rate) % 5.0; 
                        
                        for (let i = 0; i < pos.length; i += 3) {
                            const x = pos[i];
                            const y = pos[i+1];
                            const z = pos[i+2];
                            const r = Math.sqrt(x*x + y*y + z*z);
                            
                            const nx = x / r;
                            const ny = y / r;
                            const nz = z / r;
                            
                            pos[i] += nx * 0.07;
                            pos[i+1] += ny * 0.07;
                            pos[i+2] += nz * 0.07;

                            if (cycle < 0.05) {
                                const theta = Math.random() * Math.PI * 2;
                                const phi = Math.acos(2 * Math.random() - 1);
                                const newR = 1.0 + Math.random() * 3.0;
                                pos[i] = newR * Math.sin(phi) * Math.cos(theta);
                                pos[i+1] = newR * Math.sin(phi) * Math.sin(theta);
                                pos[i+2] = newR * Math.cos(phi);
                            }
                        }
                        geom.attributes.position.needsUpdate = true;
                    }
                }
            }

            // 6. STAGE VI: 终极致密核心发光
            if (currentStage === 6) {
                if (currentRoute === 'low') {
                    if (activeStar) activeStar.rotation.y = elapsedTime * 2.0;
                    if (activeCompanion) {
                        const shim = 0.95 + Math.random() * 0.08;
                        activeCompanion.scale.set(shim, shim, shim);
                    }
                }
                else if (currentRoute === 'medium') {
                    if (activeStar) activeStar.rotation.y = elapsedTime * 4.0;
                    if (activeCompanion) {
                        const shim = 0.9 + Math.random() * 0.15;
                        activeCompanion.scale.set(shim, shim, shim);
                    }
                    if (specialOutflow) {
        //峇株吧辖蔡逸众制作
                        specialOutflow.rotation.y = elapsedTime * 10.0; 
                        const geom = specialOutflow.geometry;
                        const pos = geom.attributes.position.array;
                        for (let i = 1; i < pos.length; i += 3) {
                            pos[i] += 0.35;
                            if (pos[i] > 11.0) pos[i] = 0.3;
                        }
                        geom.attributes.position.needsUpdate = true;

                        const downCone = stageGroup.children.find(child => child !== specialOutflow && child.material === specialOutflow.material && child instanceof THREE.Points);
                        if (downCone) {
                            downCone.rotation.y = elapsedTime * 10.0;
                            const dGeom = downCone.geometry;
                            const dPos = dGeom.attributes.position.array;
                            for (let i = 1; i < dPos.length; i += 3) {
                                dPos[i] -= 0.35;
                                if (dPos[i] < -11.0) dPos[i] = -0.3;
                            }
                            dGeom.attributes.position.needsUpdate = true;
                        }
                    }
                }
                else if (currentRoute === 'high') {
                    if (activePoints) {
                        activePoints.rotation.y = elapsedTime * 1.5; 
                    }
                    if (specialOutflow) {
                        specialOutflow.rotation.y = elapsedTime * 0.5;
                        const geom = specialOutflow.geometry;
                        const pos = geom.attributes.position.array;
                        for (let i = 1; i < pos.length; i += 3) {
                            pos[i] += 0.45;
                            if (pos[i] > 12.0) pos[i] = 0.35;
                        }
                        geom.attributes.position.needsUpdate = true;

                        const downJet = stageGroup.children.find(child => child !== specialOutflow && child.material === specialOutflow.material && child instanceof THREE.Points);
                        if (downJet) {
                            downJet.rotation.y = elapsedTime * 0.5;
                            const dGeom = downJet.geometry;
                            const dPos = dGeom.attributes.position.array;
                            for (let i = 1; i < dPos.length; i += 3) {
                                dPos[i] -= 0.45;
                                if (dPos[i] < -12.0) dPos[i] = -0.35;
                            }
                            dGeom.attributes.position.needsUpdate = true;
                        }
                    }
                }
            }

            composer.render();
        }

        // --- 10. 界面事件初始化 ---
        window.addEventListener('resize', () => {
            const container = document.getElementById('canvas3d');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
            composer.setSize(container.clientWidth, container.clientHeight);
            checkResponsiveLayout();
        });

        window.onload = function() {
            initScene();
        };
    </script>
</body>
