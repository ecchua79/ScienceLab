<!DOCTYPE html>
<!--

    出品：峇株吧辖华仁中学 (Chinese High School, Batu Pahat)
    制作：蔡逸众老师 (ecchua79)
    请勿移除此版权声明

<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="蔡逸众老师 (ecchua79) - 峇株吧辖华仁中学 Chinese High School">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoGebra 风格交互图表绘制器</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- 图标已全部改为内联 SVG，不依赖外部字体库 -->
    <style>
        /* 出品：峇株吧辖华仁中学 蔡逸众老师 (ecchua79) — GeoGraph Studio */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* ===== 可收起侧边面板 ===== */
        #sidePanel {
            width: 100%;
            transition: width 0.3s ease, border-color 0.3s ease;
        }
        @media (min-width: 768px) {
            #sidePanel { width: 24rem; }
        }
        #sidePanel.collapsed {
            width: 0 !important;
            border-right-width: 0 !important;
        }
        #panelToggleBtn {
            transition: left 0.3s ease, background-color 0.2s ease;
        }

        /* ===== 深色（夜间）模式覆盖 ===== */
        html.dark body { background-color: #0f172a !important; color: #e2e8f0; }
        html.dark .bg-white { background-color: #1e293b !important; }
        html.dark .bg-slate-50 { background-color: #0f172a !important; }
        html.dark .bg-slate-100 { background-color: #0f172a !important; }
        html.dark .border-slate-200,
        html.dark .border-slate-100,
        html.dark .border-slate-300 { border-color: #334155 !important; }
        html.dark .text-slate-700 { color: #cbd5e1 !important; }
        html.dark .text-slate-600 { color: #94a3b8 !important; }
        html.dark .text-slate-500 { color: #94a3b8 !important; }
        html.dark .text-slate-800 { color: #e2e8f0 !important; }
        html.dark .text-slate-400 { color: #64748b !important; }
        html.dark .divide-slate-200 > :not([hidden]) ~ :not([hidden]) { border-color: #334155 !important; }
        html.dark input, html.dark select {
            background-color: #0f172a !important;
            color: #e2e8f0 !important;
            border-color: #334155 !important;
        }
        html.dark input[type="color"] { background-color: transparent !important; }
        html.dark tr.hover\:bg-slate-50:hover { background-color: #0f172a !important; }
        html.dark ::-webkit-scrollbar-track { background: #1e293b; }
        html.dark ::-webkit-scrollbar-thumb { background: #475569; }
        html.dark #panelToggleBtn { background-color: #1e293b !important; border-color: #334155 !important; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans h-screen flex flex-col overflow-hidden">

    <!-- 顶栏 Header -->
    <header class="bg-slate-900 text-white px-4 sm:px-6 py-3 flex flex-wrap justify-between items-center gap-y-2 gap-x-3 shadow-md shrink-0">
        <div class="flex items-center space-x-3">
            <svg class="w-5 h-5 text-indigo-400 inline-block align-middle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M18.7 8l-5.1 5.1-3-3L4 16.7"/></svg>
            <h1 class="text-lg font-bold tracking-wide">GeoGraph Studio 绘图工作台</h1>
        </div>
        <div class="flex items-center space-x-2">
            <!-- 面板显示 / 隐藏开关（移动端窄屏下面板会占满整个宽度挡住图表，此按钮可快速切换） -->
            <button onclick="togglePanel()" title="显示/隐藏数据面板" class="bg-white/10 hover:bg-white/20 rounded-lg p-2 transition text-white">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
            </button>

            <!-- 字体大小调节 -->
            <div class="flex items-center bg-white/10 rounded-lg overflow-hidden text-xs text-white">
                <button onclick="setFontScale(-10)" title="缩小字体" class="px-2 py-1.5 hover:bg-white/20 transition font-bold">A-</button>
                <span id="fontScaleLabel" class="px-1.5 text-slate-300 select-none tabular-nums w-10 text-center">100%</span>
                <button onclick="setFontScale(10)" title="放大字体" class="px-2 py-1.5 hover:bg-white/20 transition font-bold">A+</button>
            </div>

            <!-- 日间 / 夜间模式切换 -->
            <button onclick="toggleDarkMode()" title="切换日间/夜间模式" class="bg-white/10 hover:bg-white/20 rounded-lg p-2 transition text-white">
                <svg id="iconSun" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                <svg id="iconMoon" class="w-4 h-4 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
            </button>

            <button onclick="exportImage()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold px-4 py-2 rounded-lg transition flex items-center space-x-1 shadow-sm">
                <svg class="w-4 h-4 inline-block align-middle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>
                <span>导出图表图片</span>
            </button>
        </div>
    </header>

    <!-- 主工作区 Layout -->
    <div class="flex flex-1 overflow-hidden">

        <!-- 左侧：数据与设置侧边栏（可收起） -->
        <aside id="sidePanel" class="relative bg-white border-r border-slate-200 h-full z-10 shadow-sm shrink-0">
        <div class="flex flex-col h-full overflow-hidden">
            <!-- 侧边栏头部标签页 / 标题 -->
            <div class="p-4 border-b border-slate-200 bg-slate-50 flex justify-between items-center">
                <h2 class="font-bold text-slate-700 text-sm uppercase tracking-wider flex items-center gap-2">
                    <svg class="w-4 h-4 text-indigo-500 inline-block align-middle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><circle cx="9" cy="6" r="2" fill="currentColor" stroke="none"/><line x1="4" y1="12" x2="20" y2="12"/><circle cx="15" cy="12" r="2" fill="currentColor" stroke="none"/><line x1="4" y1="18" x2="20" y2="18"/><circle cx="7" cy="18" r="2" fill="currentColor" stroke="none"/></svg> 数据与控制面板
                </h2>
                <button onclick="resetData()" class="text-xs text-slate-500 hover:text-red-600 transition" title="重置数据">
                    <svg class="w-3.5 h-3.5 inline-block align-middle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><polyline points="3 4 3 9 8 9"/></svg> 重置
                </button>
            </div>

            <!-- 可滚动表单区域 -->
            <div class="flex-1 overflow-y-auto p-4 space-y-5">

                <!-- 1. 图表主题与模式 -->
                <div class="space-y-3">
                    <label class="text-xs font-bold text-slate-500 uppercase tracking-wider block">图表主题与样式</label>
                    
                    <div>
                        <span class="text-xs text-slate-600 font-medium">图表主题名称</span>
                        <input type="text" id="chartTitle" value="函数与试验数据变化图" oninput="updateChartDebounced()"
                            class="w-full mt-1 px-3 py-1.5 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <span class="text-xs text-slate-600 font-medium">图表类型</span>
                            <select id="chartType" onchange="updateChart()" class="w-full mt-1 px-2.5 py-1.5 text-sm border border-slate-300 rounded-lg bg-white focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                                <option value="line">折线图 (Line)</option>
                                <option value="bar">柱状图 (Bar)</option>
                                <option value="scatter">散点图 (Scatter)</option>
                            </select>
                        </div>
                        <div>
                            <span class="text-xs text-slate-600 font-medium">主题颜色</span>
                            <input type="color" id="chartColor" value="#4f46e5" onchange="updateChart()"
                                class="w-full h-8 mt-1 p-0.5 border border-slate-300 rounded-lg cursor-pointer bg-white">
                        </div>
                    </div>
                </div>

                <!-- 2. 坐标轴与单位设置 -->
                <div class="space-y-3 pt-3 border-t border-slate-100">
                    <label class="text-xs font-bold text-slate-500 uppercase tracking-wider block">坐标轴与单位</label>
                    
                    <!-- X轴 -->
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <span class="text-xs text-slate-600 font-medium">X 轴名称</span>
                            <input type="text" id="xLabel" value="时间" oninput="updateChartDebounced()"
                                class="w-full mt-1 px-2.5 py-1.5 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        </div>
                        <div>
                            <span class="text-xs text-slate-600 font-medium">X 轴单位</span>
                            <input type="text" id="xUnit" value="s" oninput="updateChartDebounced()"
                                class="w-full mt-1 px-2.5 py-1.5 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        </div>
                    </div>

                    <!-- Y轴 -->
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <span class="text-xs text-slate-600 font-medium">Y 轴名称</span>
                            <input type="text" id="yLabel" value="位移" oninput="updateChartDebounced()"
                                class="w-full mt-1 px-2.5 py-1.5 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        </div>
                        <div>
                            <span class="text-xs text-slate-600 font-medium">Y 轴单位</span>
                            <input type="text" id="yUnit" value="m" oninput="updateChartDebounced()"
                                class="w-full mt-1 px-2.5 py-1.5 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        </div>
                    </div>
                </div>

                <!-- 3. 显示选项 -->
                <div class="space-y-2 pt-3 border-t border-slate-100">
                    <label class="text-xs font-bold text-slate-500 uppercase tracking-wider block">高级显示开关</label>
                    
                    <label class="flex items-center space-x-2 text-xs font-medium text-slate-700 cursor-pointer">
                        <input type="checkbox" id="showPointLabels" checked onchange="updateChart()" class="rounded text-indigo-600 focus:ring-indigo-500 h-4 w-4">
                        <span>在每个点上直接标注 (X, Y) 坐标值</span>
                    </label>

                    <label class="flex items-center space-x-2 text-xs font-medium text-slate-700 cursor-pointer">
                        <input type="checkbox" id="smoothCurve" checked onchange="updateChart()" class="rounded text-indigo-600 focus:ring-indigo-500 h-4 w-4">
                        <span>平滑曲线过渡 (Tension)</span>
                    </label>

                    <label class="flex items-center space-x-2 text-xs font-medium text-slate-700 cursor-pointer">
                        <input type="checkbox" id="fillArea" onchange="updateChart()" class="rounded text-indigo-600 focus:ring-indigo-500 h-4 w-4">
                        <span>开启下方区域填充色</span>
                    </label>
                </div>

                <!-- 4. 数据输入表格 -->
                <div class="space-y-3 pt-3 border-t border-slate-100">
                    <div class="flex justify-between items-center">
                        <label class="text-xs font-bold text-slate-500 uppercase tracking-wider block">坐标数据点</label>
                        <button onclick="addRow()" class="bg-emerald-50 hover:bg-emerald-100 text-emerald-700 text-xs font-bold px-2.5 py-1 rounded transition flex items-center space-x-1 border border-emerald-200">
                            <svg class="w-3.5 h-3.5 inline-block align-middle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                            <span>添加行</span>
                        </button>
                    </div>

                    <div class="overflow-hidden border border-slate-200 rounded-lg shadow-sm">
                        <table class="w-full text-left border-collapse text-xs">
                            <thead class="bg-slate-100 text-slate-600 border-b border-slate-200">
                                <tr>
                                    <th class="p-2 text-center w-2/5">X 轴</th>
                                    <th class="p-2 text-center w-2/5">Y 轴</th>
                                    <th class="p-2 text-center w-1/5">操作</th>
                                </tr>
                            </thead>
                            <tbody id="tableBody" class="divide-y divide-slate-200 bg-white">
                                <!-- 动态生成的表格行 -->
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>

            <!-- 侧边栏底部操作 -->
            <div class="p-3 bg-slate-50 border-t border-slate-200 text-center">
                <button onclick="updateChart()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-lg shadow transition text-xs flex items-center justify-center space-x-2">
                    <svg class="w-4 h-4 inline-block align-middle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><polyline points="3 4 3 9 8 9"/></svg>
                    <span>立即更新并重新绘图</span>
                </button>
            </div>
        </div>

        <!-- 收起 / 展开 手柄按钮，随面板宽度动画一起滑动 -->
        <button id="panelToggleBtn" onclick="togglePanel()" title="收起/展开面板"
            class="absolute top-1/2 -translate-y-1/2 -right-3 z-20 bg-white border border-slate-300 shadow-md rounded-full w-6 h-10 flex items-center justify-center hover:bg-slate-50 transition-colors">
            <svg id="panelToggleIcon" class="w-3.5 h-3.5 text-slate-500" style="transition: transform 0.3s ease;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        </aside>

        <!-- 右侧：超大图形绘制区域 -->
        <main class="flex-1 bg-slate-50 p-4 md:p-6 flex flex-col justify-center items-center overflow-hidden relative">
            
            <!-- Canvas 外层大容器：修复 flexbox 容器尺寸计算问题 -->
            <div class="w-full h-full bg-white rounded-2xl shadow-sm border border-slate-200 p-4 md:p-6 flex flex-col relative overflow-hidden min-h-[350px]">
                <div class="relative w-full h-full flex-1 min-h-0">
                    <canvas id="mainChart"></canvas>
                </div>
            </div>

            <!-- 底部提示文字 -->
            <div class="absolute bottom-2 right-6 text-[10px] text-slate-400 select-none hidden md:block">
                <svg class="w-3 h-3 inline-block align-middle mr-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><line x1="12" y1="10" x2="12" y2="16"/><circle cx="12" cy="7.2" r="0.9" fill="currentColor" stroke="none"/></svg> 支持悬停查看详细点数值 | 自动自适应屏幕尺寸
            </div>
        </main>
    </div>

    <!-- 页脚版权信息 -->
    <footer class="shrink-0 bg-slate-900 text-slate-400 text-[11px] text-center py-1.5 select-none">
        GeoGraph Studio 绘图工作台 · 峇株吧辖华仁中学出品 · 蔡逸众老师 制作
    </footer>

    <!-- 导出图片预览弹窗 Modal -->
    <div id="exportModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="bg-white rounded-2xl shadow-2xl max-w-xl w-full p-5 flex flex-col space-y-4 transform scale-95 transition-transform duration-300" id="exportModalContent">
            <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                <h3 class="font-bold text-slate-800 text-base flex items-center gap-2">
                    <svg class="w-5 h-5 text-indigo-600 inline-block align-middle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5" fill="currentColor" stroke="none"/><path d="M21 15l-5-5L5 21"/></svg> 图表导出成功
                </h3>
                <button onclick="closeExportModal()" class="text-slate-400 hover:text-slate-600 p-1 transition">
                    <svg class="w-5 h-5 inline-block align-middle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="6" y1="18" x2="18" y2="6"/></svg>
                </button>
            </div>
            <div class="bg-slate-100 rounded-lg p-2 flex items-center justify-center border border-slate-200 overflow-hidden max-h-[60vh]">
                <img id="exportPreviewImg" src="" alt="Exported Chart" class="max-w-full h-auto rounded shadow-sm object-contain" />
            </div>
            <div class="flex justify-between items-center pt-2">
                <span class="text-xs text-slate-500"><svg class="w-3.5 h-3.5 text-emerald-500 inline-block align-middle mr-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="8 12 11 15 16 9"/></svg>如果自动下载未成功，可长按或右键另存图片</span>
                <div class="flex gap-2">
                    <a id="exportDownloadBtn" href="#" download="" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold px-4 py-2 rounded-lg transition flex items-center gap-1 shadow">
                        <svg class="w-4 h-4 inline-block align-middle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg> 保存图片
                    </a>
                    <button onclick="closeExportModal()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold px-3 py-2 rounded-lg transition">
                        关闭
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast 通知容器 -->
    <div id="toastContainer" class="fixed top-16 right-6 z-50 space-y-2 pointer-events-none"></div>

    <script>
        let chartInstance = null;

        // 防抖：输入频繁时延迟合并触发，减少重建图表的次数，避免卡顿
        let updateChartDebounceTimer = null;
        function updateChartDebounced(notify = false) {
            clearTimeout(updateChartDebounceTimer);
            updateChartDebounceTimer = setTimeout(() => updateChart(notify), 200);
        }

        // ===== 用户界面偏好设置（面板收起状态 / 字体缩放 / 深浅色模式）持久化 =====
        function savePref(key, value) {
            try { localStorage.setItem('geoGraphStudio_' + key, JSON.stringify(value)); } catch (e) { /* 存储不可用时静默忽略 */ }
        }
        function loadPref(key, fallback) {
            try {
                const raw = localStorage.getItem('geoGraphStudio_' + key);
                return raw !== null ? JSON.parse(raw) : fallback;
            } catch (e) { return fallback; }
        }

        // ---- 面板收起 / 展开 ----
        let panelResizeTimer = null;
        function togglePanel(persist = true) {
            const panel = document.getElementById('sidePanel');
            const icon = document.getElementById('panelToggleIcon');
            const collapsed = panel.classList.toggle('collapsed');
            icon.style.transform = collapsed ? 'rotate(180deg)' : 'rotate(0deg)';
            if (persist) savePref('panelCollapsed', collapsed);
            clearTimeout(panelResizeTimer);
            panelResizeTimer = setTimeout(() => { if (chartInstance) chartInstance.resize(); }, 320);
        }

        // ---- 字体大小调节（改变根字号，Tailwind 的 rem 单位会随之整体缩放）----
        let fontScale = 100;
        function setFontScale(delta) {
            fontScale = Math.min(130, Math.max(85, fontScale + delta));
            document.documentElement.style.fontSize = fontScale + '%';
            document.getElementById('fontScaleLabel').textContent = fontScale + '%';
            savePref('fontScale', fontScale);
        }

        // ---- 日间 / 夜间模式 ----
        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            updateDarkModeIcon(isDark);
            savePref('darkMode', isDark);
            if (chartInstance) updateChart(false); // 重绘图表以适配新配色
        }
        function updateDarkModeIcon(isDark) {
            document.getElementById('iconSun').classList.toggle('hidden', isDark);
            document.getElementById('iconMoon').classList.toggle('hidden', !isDark);
        }

        // 页面加载时应用已保存的偏好设置
        function applySavedPreferences() {
            // 深色模式
            if (loadPref('darkMode', false)) {
                document.documentElement.classList.add('dark');
            }
            updateDarkModeIcon(document.documentElement.classList.contains('dark'));

            // 字体缩放
            fontScale = loadPref('fontScale', 100);
            document.documentElement.style.fontSize = fontScale + '%';
            document.getElementById('fontScaleLabel').textContent = fontScale + '%';

            // 面板收起状态：若用户之前手动设置过则遵循设置；否则窄屏（手机）首次访问默认收起，
            // 避免面板占满整个屏幕宽度而挡住图表（这正是最初反馈的问题）
            const savedCollapsed = loadPref('panelCollapsed', null);
            const shouldCollapse = savedCollapsed !== null ? savedCollapsed : (window.innerWidth < 768);
            if (shouldCollapse) {
                document.getElementById('sidePanel').classList.add('collapsed');
                document.getElementById('panelToggleIcon').style.transform = 'rotate(180deg)';
            }
        }

        // 默认数据点
        const defaultData = [
            { x: '0', y: 0 },
            { x: '2', y: 4 },
            { x: '4', y: 16 },
            { x: '6', y: 36 },
            { x: '8', y: 64 },
            { x: '10', y: 100 }
        ];

        // 兼容性绘图：安全绘制圆角矩形，防止部分浏览器中 ctx.roundRect 报错
        function drawRoundedRect(ctx, x, y, width, height, radius) {
            ctx.beginPath();
            if (typeof ctx.roundRect === 'function') {
                ctx.roundRect(x, y, width, height, radius);
            } else {
                ctx.moveTo(x + radius, y);
                ctx.lineTo(x + width - radius, y);
                ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
                ctx.lineTo(x + width, y + height - radius);
                ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
                ctx.lineTo(x + radius, y + height);
                ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
                ctx.lineTo(x, y + radius);
                ctx.quadraticCurveTo(x, y, x + radius, y);
                ctx.closePath();
            }
        }

        /**
         * 自定义 Chart.js 插件：直接在点上方绘制 (X, Y) 标签气泡
         */
        const valueLabelsPlugin = {
            id: 'valueLabelsPlugin',
            afterDatasetsDraw(chart) {
                const showLabels = document.getElementById('showPointLabels').checked;
                if (!showLabels) return;

                const { ctx } = chart;
                const xUnit = document.getElementById('xUnit').value ? ` ${document.getElementById('xUnit').value}` : '';
                const yUnit = document.getElementById('yUnit').value ? ` ${document.getElementById('yUnit').value}` : '';

                chart.data.datasets.forEach((dataset, datasetIndex) => {
                    const meta = chart.getDatasetMeta(datasetIndex);
                    if (!meta || !meta.data) return;
                    
                    meta.data.forEach((element, index) => {
                        const rawX = chart.data.labels ? chart.data.labels[index] : dataset.data[index].x;
                        const rawY = typeof dataset.data[index] === 'object' ? dataset.data[index].y : dataset.data[index];

                        if (rawX !== undefined && rawY !== undefined && !isNaN(rawY)) {
                            const { x, y } = element;

                            ctx.save();
                            ctx.font = '600 11px Inter, sans-serif';
                            
                            // 格式化为 (x, y) 标签文本
                            const labelText = `(${rawX}${xUnit}, ${rawY}${yUnit})`;
                            const textWidth = ctx.measureText(labelText).width;
                            const paddingX = 6;
                            const rectWidth = textWidth + paddingX * 2;
                            const rectHeight = 18;
                            const rectX = x - rectWidth / 2;
                            const rectY = y - 26; // 在数据点正上方

                            // 绘制气泡背景
                            ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
                            ctx.shadowColor = 'rgba(0, 0, 0, 0.08)';
                            ctx.shadowBlur = 4;
                            ctx.shadowOffsetY = 2;
                            
                            drawRoundedRect(ctx, rectX, rectY, rectWidth, rectHeight, 4);
                            ctx.fill();

                            // 气泡边框
                            ctx.shadowColor = 'transparent';
                            ctx.strokeStyle = dataset.borderColor || '#4f46e5';
                            ctx.lineWidth = 1;
                            ctx.stroke();

                            // 绘制文本
                            ctx.fillStyle = '#0f172a';
                            ctx.textAlign = 'center';
                            ctx.textBaseline = 'middle';
                            ctx.fillText(labelText, x, rectY + rectHeight / 2);

                            ctx.restore();
                        }
                    });
                });
            }
        };

        // 背景填充插件 (确保导出的 PNG 图像包含实色底色而非透明；颜色随深浅色模式切换)
        let currentCanvasBgColor = '#ffffff';
        const whiteBackgroundPlugin = {
            id: 'whiteBackgroundPlugin',
            beforeDraw(chart) {
                const { ctx, width, height } = chart;
                ctx.save();
                ctx.fillStyle = currentCanvasBgColor;
                ctx.fillRect(0, 0, width, height);
                ctx.restore();
            }
        };

        window.onload = function() {
            console.log('%cGeoGraph Studio 绘图工作台', 'font-weight:bold;font-size:14px;color:#4f46e5;');
            console.log('出品：峇株吧辖华仁中学 (Chinese High School) | 制作：蔡逸众老师 (ecchua79)');
            // 应用已保存的界面偏好（深色模式 / 字体缩放 / 面板收起状态）
            applySavedPreferences();
            // 检查 Chart.js 库是否成功加载
            if (typeof Chart === 'undefined') {
                showToast('Chart.js 依赖加载失败，请检查网络连接', 'warning');
                return;
            }
            // 初始化填充默认表格行
            loadDefaultTable();
            // 绘制图表
            updateChart(false);
        };

        // 载入默认表格数据
        function loadDefaultTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            defaultData.forEach(pt => {
                createRowElement(pt.x, pt.y);
            });
        }

        // 添加单行表格 DOM
        function createRowElement(xVal = '', yVal = '') {
            const tbody = document.getElementById('tableBody');
            const tr = document.createElement('tr');
            tr.className = 'hover:bg-slate-50 transition';
            tr.innerHTML = `
                <td class="p-1.5">
                    <input type="text" class="x-val w-full px-2 py-1 border border-slate-200 rounded text-center font-mono focus:ring-1 focus:ring-indigo-500 focus:outline-none" 
                        value="${xVal}" oninput="updateChartDebounced(false)">
                </td>
                <td class="p-1.5">
                    <input type="number" step="any" class="y-val w-full px-2 py-1 border border-slate-200 rounded text-center font-mono focus:ring-1 focus:ring-indigo-500 focus:outline-none" 
                        value="${yVal}" oninput="updateChartDebounced(false)">
                </td>
                <td class="p-1.5 text-center">
                    <button onclick="removeRow(this)" class="text-slate-400 hover:text-red-500 p-1 transition rounded">
                        <svg class="w-4 h-4 inline-block align-middle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 7 20 7"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
                    </button>
                </td>
            `;
            tbody.appendChild(tr);
        }

        // 按钮调用：添加一行
        function addRow() {
            createRowElement('', '');
            updateChart(false);
        }

        // 删除一行
        function removeRow(btn) {
            const tbody = document.getElementById('tableBody');
            if (tbody.rows.length <= 1) {
                showToast('至少保留一组坐标数据点', 'warning');
                return;
            }
            const row = btn.closest('tr');
            row.remove();
            updateChart(false);
        }

        // 重置数据
        function resetData() {
            loadDefaultTable();
            updateChart(true);
            showToast('已恢复默认坐标数据', 'info');
        }

        /**
         * 重新计算与渲染 Graph 图表
         * @param {boolean} notify - 是否弹出 Toast 操作反馈
         */
        function updateChart(notify = true) {
            if (typeof Chart === 'undefined') {
                showToast('无法绘图：Chart.js 库未加载', 'warning');
                return;
            }

            // 获取表单值
            const title = document.getElementById('chartTitle').value || '交互图表';
            const type = document.getElementById('chartType').value;
            const themeColor = document.getElementById('chartColor').value || '#4f46e5';
            
            const xLabel = document.getElementById('xLabel').value;
            const xUnit = document.getElementById('xUnit').value;
            const yLabel = document.getElementById('yLabel').value;
            const yUnit = document.getElementById('yUnit').value;

            const smoothCurve = document.getElementById('smoothCurve').checked;
            const fillArea = document.getElementById('fillArea').checked;

            // 轴名称拼接单位
            const xAxisTitleStr = xUnit ? `${xLabel} (${xUnit})` : xLabel;
            const yAxisTitleStr = yUnit ? `${yLabel} (${yUnit})` : yLabel;

            // 收集数据
            const xInputs = document.querySelectorAll('.x-val');
            const yInputs = document.querySelectorAll('.y-val');

            const xValues = [];
            const yValues = [];
            let invalidRowCount = 0;

            xInputs.forEach((input, i) => {
                const xVal = input.value.trim();
                const yRaw = yInputs[i].value.trim();
                const yVal = parseFloat(yRaw);
                if (xVal !== '' && !isNaN(yVal)) {
                    xValues.push(xVal);
                    yValues.push(yVal);
                    input.classList.remove('border-red-400', 'ring-1', 'ring-red-300');
                    yInputs[i].classList.remove('border-red-400', 'ring-1', 'ring-red-300');
                } else if (xVal !== '' || yRaw !== '') {
                    // 只要这一行不是完全空白，就算作一条无效数据（帮助用户定位问题行）
                    invalidRowCount++;
                    input.classList.add('border-red-400', 'ring-1', 'ring-red-300');
                    yInputs[i].classList.add(isNaN(yVal) ? 'border-red-400' : '');
                    if (isNaN(yVal)) {
                        yInputs[i].classList.add('border-red-400', 'ring-1', 'ring-red-300');
                    }
                } else {
                    input.classList.remove('border-red-400', 'ring-1', 'ring-red-300');
                    yInputs[i].classList.remove('border-red-400', 'ring-1', 'ring-red-300');
                }
            });

            // 没有任何有效数据点：明确提示原因，不再静默绘制空图
            if (yValues.length === 0) {
                if (chartInstance) {
                    chartInstance.destroy();
                    chartInstance = null;
                }
                const canvas = document.getElementById('mainChart');
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                showToast('没有可用的数据点：请确认每行 X 不为空、Y 是合法数字', 'warning');
                return;
            } else if (invalidRowCount > 0 && notify) {
                showToast(`已忽略 ${invalidRowCount} 行无效数据（X 为空或 Y 非数字）`, 'warning');
            }

            // 销毁旧图表
            if (chartInstance) {
                chartInstance.destroy();
            }

            const canvas = document.getElementById('mainChart');
            const ctx = canvas.getContext('2d');

            // 散点图数据结构调整
            let datasetData = yValues;
            if (type === 'scatter') {
                datasetData = xValues.map((x, i) => {
                    const parsedX = parseFloat(x);
                    return { x: Number.isNaN(parsedX) ? x : parsedX, y: yValues[i] };
                });
            }

            // 颜色半透明转化
            const bgRgba = hexToRgba(themeColor, fillArea ? 0.15 : 0.0);

            // 深色/浅色模式配色（图表本身的文字、网格、提示框、画布底色）
            const isDark = document.documentElement.classList.contains('dark');
            currentCanvasBgColor = isDark ? '#1e293b' : '#ffffff';
            const chartTitleColor = isDark ? '#e2e8f0' : '#1e293b';
            const chartAxisColor = isDark ? '#cbd5e1' : '#475569';
            const chartGridColorX = isDark ? 'rgba(148,163,184,0.15)' : '#f1f5f9';
            const chartGridColorY = isDark ? 'rgba(148,163,184,0.25)' : '#e2e8f0';
            const tooltipBgColor = isDark ? '#334155' : '#0f172a';

            try {
                chartInstance = new Chart(ctx, {
                    type: type,
                    data: {
                        labels: xValues,
                        datasets: [{
                            label: yLabel || 'Y 数值',
                            data: datasetData,
                            borderColor: themeColor,
                            backgroundColor: type === 'bar' ? hexToRgba(themeColor, 0.6) : bgRgba,
                            borderWidth: 3,
                            pointBackgroundColor: '#ffffff',
                            pointBorderColor: themeColor,
                            pointBorderWidth: 2,
                            pointRadius: 6,
                            pointHoverRadius: 9,
                            fill: fillArea,
                            tension: smoothCurve ? 0.35 : 0
                        }]
                    },
                    plugins: [whiteBackgroundPlugin, valueLabelsPlugin],
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        layout: {
                            padding: {
                                top: 35,
                                right: 25,
                                bottom: 10,
                                left: 10
                            }
                        },
                        plugins: {
                            title: {
                                display: true,
                                text: title,
                                font: {
                                    size: 18,
                                    weight: 'bold',
                                    family: 'Inter, sans-serif'
                                },
                                color: chartTitleColor,
                                padding: { bottom: 15 }
                            },
                            legend: {
                                display: true,
                                position: 'top',
                                labels: { color: chartTitleColor }
                            },
                            tooltip: {
                                backgroundColor: tooltipBgColor,
                                padding: 10,
                                titleFont: { size: 12 },
                                bodyFont: { size: 13, weight: 'bold' },
                                callbacks: {
                                    label: function(context) {
                                        return `${yLabel || 'Y'}: ${context.parsed.y} ${yUnit}`;
                                    }
                                }
                            }
                        },
                        scales: {
                            x: {
                                title: {
                                    display: true,
                                    text: xAxisTitleStr,
                                    font: { size: 13, weight: 'bold' },
                                    color: chartAxisColor
                                },
                                ticks: { color: chartAxisColor },
                                grid: {
                                    color: chartGridColorX
                                }
                            },
                            y: {
                                title: {
                                    display: true,
                                    text: yAxisTitleStr,
                                    font: { size: 13, weight: 'bold' },
                                    color: chartAxisColor
                                },
                                ticks: { color: chartAxisColor },
                                grid: {
                                    color: chartGridColorY
                                },
                                beginAtZero: false
                            }
                        }
                    }
                });

                if (notify) {
                    showToast('图表已成功重新绘制！', 'success');
                }
            } catch (err) {
                console.error('Chart error:', err);
                showToast('绘制失败：请检查输入的坐标数值', 'warning');
            }
        }

        // 导出图片
        function exportImage() {
            if (!chartInstance) {
                showToast('图表尚未就绪，无法导出', 'warning');
                return;
            }

            try {
                // 渲染带有白色背景的高清 Base64 图片
                const imageBase64 = chartInstance.toBase64Image('image/png', 1.0);
                const titleStr = document.getElementById('chartTitle').value || 'chart';
                const filename = `${titleStr.replace(/\s+/g, '_')}_graph.png`;

                // 尝试通过 HTML 5 <a> 标签自动触发下载
                const link = document.createElement('a');
                link.download = filename;
                link.href = imageBase64;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);

                // 打开弹窗展示导出结果与备用手动下载
                openExportModal(imageBase64, filename);
                showToast('图表图片导出成功！', 'success');
            } catch (e) {
                console.error("Export error:", e);
                showToast('导出图片时出错', 'warning');
            }
        }

        // 打开导出图片预览 Modal
        function openExportModal(imgSrc, filename) {
            const modal = document.getElementById('exportModal');
            const modalContent = document.getElementById('exportModalContent');
            const previewImg = document.getElementById('exportPreviewImg');
            const downloadBtn = document.getElementById('exportDownloadBtn');

            previewImg.src = imgSrc;
            downloadBtn.href = imgSrc;
            downloadBtn.download = filename;

            modal.classList.remove('opacity-0', 'pointer-events-none');
            modalContent.classList.remove('scale-95');
            modalContent.classList.add('scale-100');
        }

        // 关闭 Modal
        function closeExportModal() {
            const modal = document.getElementById('exportModal');
            const modalContent = document.getElementById('exportModalContent');

            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-95');
            modal.classList.add('opacity-0', 'pointer-events-none');
        }

        // HEX转RGBA辅助函数
        function hexToRgba(hex, alpha) {
            let c = hex.replace('#', '');
            if (c.length === 3) c = c.split('').map(char => char + char).join('');
            const num = parseInt(c, 16);
            return `rgba(${(num >> 16) & 255}, ${(num >> 8) & 255}, ${num & 255}, ${alpha})`;
        }

        // 内联 SVG 图标（用于动态生成的 Toast，避免依赖外部图标字体）
        const ICON_CIRCLE_CHECK_SVG = '<svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="8 12 11 15 16 9"/></svg>';
        const ICON_CIRCLE_INFO_SVG = '<svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><line x1="12" y1="10" x2="12" y2="16"/><circle cx="12" cy="7.2" r="0.9" fill="currentColor" stroke="none"/></svg>';

        // 自定义 Toast 通知
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            
            let bgStyle = 'bg-slate-800 text-white';
            if (type === 'warning') bgStyle = 'bg-amber-500 text-white';
            if (type === 'success') bgStyle = 'bg-emerald-600 text-white';

            toast.className = `px-4 py-2.5 rounded-lg shadow-lg text-xs font-semibold flex items-center space-x-2 transition-all transform translate-y-2 opacity-0 pointer-events-auto ${bgStyle}`;
            toast.innerHTML = `
                ${type === 'success' ? ICON_CIRCLE_CHECK_SVG : ICON_CIRCLE_INFO_SVG}
                <span>${message}</span>
            `;

            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }
    </script>
</body>
