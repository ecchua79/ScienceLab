{id:'3.1',t:'血液的组成与运输',x:`<h3>血细胞与血浆比较</h3>${cells}${tbl}<h3>课本例题解说</h3><p><b>例1</b> 抗凝血静置后为何分两层？<br>上层淡黄色<b>血浆</b>（约55%，90%以上是水，溶解营养素、激素、抗体等）；下层暗红色<b>血细胞</b>。</p><p><b>例2</b> 红细胞为什么能运氧？<br>成熟红细胞无细胞核，血红蛋白占干重97%，每个最多结合4个O₂；肺泡处氧浓度高→结合，组织处氧浓度低→释放。</p><p><b>例3</b> 体重50 kg的学生，血量按体重 ${fr(8,100)} 计，血液多少 kg？血浆多少？</p><p>血液 = 50 × ${fr(8,100)} = 4 kg；血浆 = 4 × ${fr(55,100)} = 2.2 kg。</p>${tube(4,2.2,1.8)}`,
