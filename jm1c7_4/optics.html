<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>3D 光学交互模拟器 · Optics Lab</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Cormorant+Garamond:wght@300;500;700&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#05060d;color:#d8e4f0;font-family:'JetBrains Mono',monospace;cursor:crosshair}
  #cv{position:fixed;inset:0;background:radial-gradient(ellipse at center,#0a1024 0%,#03040a 70%)}
  .top-bar{position:fixed;top:0;left:0;right:0;padding:18px 28px;display:flex;justify-content:space-between;align-items:center;z-index:10;pointer-events:none;background:linear-gradient(180deg,rgba(5,6,13,.85) 0%,transparent 100%)}
  .brand{pointer-events:auto}
  .brand h1{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:26px;letter-spacing:4px;color:#e8f0fc}
  .brand h1 span{color:#ffb84d;font-style:italic;font-weight:500}
  .brand .sub{font-size:10px;letter-spacing:6px;color:#5a6a85;margin-top:2px;text-transform:uppercase}
  .status{pointer-events:auto;text-align:right;font-size:10px;letter-spacing:2px;color:#5a6a85}
  .live{color:#4ade80;margin-right:6px}
  .live::before{content:'●';margin-right:4px;animation:blink 2s infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
  .ep{position:fixed;left:24px;top:50%;transform:translateY(-50%);z-index:10;display:flex;flex-direction:column;gap:8px;padding:16px 12px;background:rgba(10,14,28,.7);backdrop-filter:blur(14px);border:1px solid rgba(255,184,77,.15);border-radius:2px}
  .ep::before{content:'OPTICAL ELEMENTS';position:absolute;top:-22px;left:0;font-size:9px;letter-spacing:3px;color:#5a6a85}
  .eb{width:56px;height:56px;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.08);border-radius:2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:all .25s;color:#8090a8;font-size:9px;letter-spacing:1px;font-family:'JetBrains Mono',monospace;position:relative}
  .eb svg{width:26px;height:26px;opacity:.85}
  .eb:hover{border-color:rgba(255,184,77,.4);color:#ffb84d;background:rgba(255,184,77,.05)}
  .eb.active{border-color:#ffb84d;color:#ffb84d;background:rgba(255,184,77,.1);box-shadow:0 0 18px rgba(255,184,77,.25),inset 0 0 12px rgba(255,184,77,.08)}
  .eb.active::after{content:'';position:absolute;left:-1px;top:-1px;bottom:-1px;width:2px;background:#ffb84d}

  .ctrl::-webkit-scrollbar{width:4px}
  .ctrl::-webkit-scrollbar-thumb{background:rgba(255,184,77,.3)}
  .sec{margin-bottom:6px}
  .sec-t{font-size:9px;letter-spacing:3px;color:#ffb84d;margin-bottom:0;padding:10px 0 10px;border-bottom:1px dashed rgba(255,184,77,.2);display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none;transition:color .2s}
  .sec-t:hover{color:#ffd080}
  .sec-t .n{color:#5a6a85;font-size:8px}
  .sec-t .arr{color:#ffb84d;font-size:11px;transition:transform .25s;display:inline-block;margin-left:6px}

  .cr{margin-bottom:14px}
  .cl{display:flex;justify-content:space-between;font-size:10px;letter-spacing:1px;color:#8090a8;margin-bottom:6px}
  .cl .v{color:#e8f0fc;font-weight:500}
  .cl .v::before{content:'[';color:#5a6a85;margin-right:2px}
  .cl .v::after{content:']';color:#5a6a85;margin-left:2px}
  input[type=range]{width:100%;-webkit-appearance:none;height:2px;background:rgba(255,255,255,.1);outline:none;cursor:pointer}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;background:#ffb84d;border-radius:50%;cursor:pointer;box-shadow:0 0 10px rgba(255,184,77,.6)}

  .ck input:checked+.cb{background:#ffb84d;border-color:#ffb84d;box-shadow:0 0 8px rgba(255,184,77,.5)}
  .ck input:checked+.cb::after{content:'✓';position:absolute;top:-3px;left:1px;font-size:11px;color:#05060d;font-weight:bold}
  .vb{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .vbtn{padding:8px 4px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);color:#8090a8;font-family:inherit;font-size:9px;letter-spacing:2px;cursor:pointer;transition:all .2s}

  .ic{background:rgba(10,14,28,.75);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.06);border-left:2px solid #ffb84d;padding:12px 18px;min-width:140px}
  .ic .lbl{font-size:8px;letter-spacing:3px;color:#5a6a85;margin-bottom:4px}

  .ht{position:fixed;bottom:24px;right:24px;z-index:10;font-size:9px;letter-spacing:2px;color:#5a6a85;text-align:right;line-height:1.8;pointer-events:none}

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

/*
════════════════════════════════════════════════════════════
  COORDINATE SYSTEM  (must be identical for geometry & rays)
════════════════════════════════════════════════════════════
  • Light travels in the  +X  direction.
  • The optical element is centred at the origin.
  • Aperture radius (half-height of mirrors/lenses): APR = 1.8

  CONCAVE MIRROR
  ──────────────
  • Bowl opening faces  –X  (toward the incoming light).
  • Rim of the bowl at  x = 0.
  • Vertex (deepest point of bowl) at  x = –sag,
    where  sag = R – √(R²–APR²).
  • Sphere centre at  x = +(R – sag) = +√(R²–APR²)  ≡  +CX.

  CONVEX MIRROR
  ─────────────
  • Dome peak faces  –X  (toward the incoming light).
  • Rim at  x = 0.
  • Vertex (tip of dome) at  x = –sag  (same shape as concave!).
  • Sphere centre at  x = –(R – sag) = –CX.

  Both mirrors therefore share the SAME cap mesh (vertex at –sag, rim at 0).
  They differ only in which face is reflective and in the sphere-centre sign:
    – Concave: reflect off the inner face; outward normal (hit–centre) points –X  ✓
    – Convex:  reflect off the outer face; inward  normal (centre–hit) points –X  ✓
════════════════════════════════════════════════════════════
*/

// ─── STATE ───────────────────────────────────────────────
const S = {
  el:'rough', angle:0, spread:2.0,
  R:3.0, d:0.4, n:1.50,
  grid:true, focal:true, norm:false, axis:true
};
const NAMES = {
  rough:'粗糙表面', planar:'平面镜',
  'concave-mirror':'凹面镜', 'convex-mirror':'凸面镜',
  'concave-lens':'凹透镜', 'convex-lens':'凸透镜'
};
const APR = 1.8; // aperture radius

// ─── SCENE ───────────────────────────────────────────────
const container = document.getElementById('cv');
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x03040a, 0.026);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 200);
camera.position.set(5, 3.5, 10);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
container.appendChild(renderer.domElement);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.88, 0.4, 0.18));

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.minDistance = 3; controls.maxDistance = 30;

scene.add(new THREE.AmbientLight(0x4060a0, 0.5));
const kl = new THREE.DirectionalLight(0xffd9a0, 0.9); kl.position.set(4,8,5); scene.add(kl);
const rl = new THREE.DirectionalLight(0x6090ff, 0.4); rl.position.set(-5,2,-5); scene.add(rl);

// ─── GRID ────────────────────────────────────────────────
const gridGrp = new THREE.Group(); scene.add(gridGrp);

function mkSprite(txt, col='#e8f0fc', sz=28) {
  const cv = document.createElement('canvas'); cv.width=128; cv.height=64;
  const ctx = cv.getContext('2d');
  ctx.fillStyle=col; ctx.font=`600 ${sz}px monospace`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(txt, 64, 32);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({
    map: new THREE.CanvasTexture(cv), transparent:true, depthTest:false
  }));
  return sp;
}

function buildGrid() {
  gridGrp.clear();
  const Y = -2.5;
  const grid = new THREE.GridHelper(14,28,0x1e2a42,0x111826);
  grid.position.y = Y;
  gridGrp.add(grid);

  for (let i=-6; i<=6; i++) {
    const len = i===0 ? 0.45 : i%2===0 ? 0.28 : 0.14;
    const col = i===0 ? 0xffb84d : 0x4a5a78;
    const pts = [new THREE.Vector3(i,Y,-0.05), new THREE.Vector3(i,Y,len-0.05)];
    gridGrp.add(new THREE.Line(
      new THREE.BufferGeometry().setFromPoints(pts),
      new THREE.LineBasicMaterial({color:col, transparent:true, opacity:i===0?1:0.6})
    ));
    if (i%2===0) {
      const sp = mkSprite(`${i}`, i===0?'#ffb84d':'#6a7a98', 26);
      sp.position.set(i, Y-0.01, 0.65); sp.scale.set(0.45,0.22,1);
      gridGrp.add(sp);
    }
  }
  const rl2 = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(-7,Y,-0.05), new THREE.Vector3(7,Y,-0.05)
  ]);
  gridGrp.add(new THREE.Line(rl2, new THREE.LineBasicMaterial({color:0x4a5a78, transparent:true, opacity:0.5})));

  if (S.axis) {
    const al = new THREE.Line(
      new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-7,0,0), new THREE.Vector3(7,0,0)]),
      new THREE.LineDashedMaterial({color:0xffb84d, dashSize:0.18, gapSize:0.1, transparent:true, opacity:0.35})
    );
    al.computeLineDistances();
    gridGrp.add(al);
  }
}

// ─── MIRROR / LENS GEOMETRY HELPERS ──────────────────────

// sag = sagitta of the aperture circle on a sphere of radius R
function sag(R) { return R - Math.sqrt(Math.max(0, R*R - APR*APR)); }

/*
  buildMirrorCap(R)
  Produces a spherical-cap mesh that sits with:
    • rim at x = 0
    • vertex at x = −sag(R)   (sticks into the −X / incoming-light side)
  This shape is used for BOTH concave and convex mirrors.
  The difference is only in materials and which normal is used for reflection.
*/
/*
  buildMirrorCap(R, isConcave)
  
  CONCAVE mirror: bowl opening faces –X (toward light).
    • Rim at x = 0, vertex (deepest point of bowl) at x = +sag.
    • Sphere centre at x = –cx  (in front of mirror, on light side).
    • Outward normal (hit–centre) points toward +X (away from light).
    → NOT used directly for reflection normal; see trace() for detail.
  
  CONVEX mirror: dome peak faces –X (toward light).
    • Rim at x = 0, vertex (tip of dome) at x = –sag.
    • Sphere centre at x = +cx  (behind mirror, on far side).
    • Outward normal (hit–centre) points toward –X (toward light). ✓
  
  After rotateZ(-PI/2): LatheGeometry height (Y-axis) maps to scene +X.
    height=0      → scene X=0  (rim)
    height=+sag   → scene X=+sag  (concave vertex, deep in bowl)
    height=–sag   → scene X=–sag  (convex vertex, dome tip)
*/
function buildMirrorCap(R, isConcave) {
  const sg = sag(R);
  const halfAngle = Math.asin(APR / R);
  const SEGS = 48;
  const pts = [];
  for (let i=0; i<=SEGS; i++) {
    const theta = (i/SEGS) * halfAngle;
    const r     = R * Math.sin(theta);        // radial distance from axis
    const depth = R - R * Math.cos(theta);    // 0 at vertex, sg at rim
    // Concave: vertex at +sg, rim at 0 → height = depth (0→sg)
    // Convex:  vertex at −sg, rim at 0 → height = −depth (0→−sg)
    const height = isConcave ? depth : -depth;
    pts.push(new THREE.Vector2(r, height));
  }
  // rotateZ(-PI/2): height axis (Y) → scene +X axis
  const geo = new THREE.LatheGeometry(pts, 48);
  geo.rotateZ(-Math.PI / 2);
  return geo;
}

/*
  Sphere centres for ray–sphere intersection:
    Concave: centre at x = −cx = −√(R²–APR²)   (on the light/incoming side)
    Convex:  centre at x = +cx = +√(R²–APR²)   (on the far side behind dome)
*/
function mirrorSphereCenter(R, isConcave) {
  const cx = Math.sqrt(Math.max(0, R*R - APR*APR));
  return new THREE.Vector3(isConcave ? -cx : cx, 0, 0);
}

// focal-point marker
function addFocalMarker(x, label) {
  const m = new THREE.Mesh(
    new THREE.SphereGeometry(0.09,16,16),
    new THREE.MeshBasicMaterial({color:0xff4444})
  );
  m.position.set(x,0,0); elGrp.add(m);

  const halo = new THREE.Mesh(
    new THREE.SphereGeometry(0.22,16,16),
    new THREE.MeshBasicMaterial({color:0xff4444, transparent:true, opacity:0.18})
  );
  halo.position.set(x,0,0); elGrp.add(halo);

  const sp = mkSprite(label,'#ff8888');
  sp.position.set(x,0.48,0); sp.scale.set(0.52,0.26,1); elGrp.add(sp);

  const fg = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(x,-1.4,0), new THREE.Vector3(x,1.4,0)
  ]);
  const fl = new THREE.Line(fg, new THREE.LineDashedMaterial({
    color:0xff4444, dashSize:0.08, gapSize:0.06, transparent:true, opacity:0.28
  }));
  fl.computeLineDistances(); elGrp.add(fl);
}

// lens lathe geometry (both convex & concave)
function buildLensLathe(R, halfT, isConvex) {
  const sg = sag(R);
  const SEGS = 32;
  const pts = [];
  if (isConvex) {
    // right surface: at r=0 → x = (R–cx)+halfT = sg+halfT; at r=APR → x = halfT
    for (let i=0; i<=SEGS; i++) {
      const r = (i/SEGS)*APR;
      const depth = R - Math.sqrt(R*R - r*r); // sagitta at this r
      const x = (sg - depth) + halfT;          // sg at centre, 0 at rim, + halfT offset
      pts.push(new THREE.Vector2(r, x));
    }
    // left surface (symmetric)
    for (let i=SEGS; i>=0; i--) {
      const r = (i/SEGS)*APR;
      const depth = R - Math.sqrt(R*R - r*r);
      const x = -((sg - depth) + halfT);
      pts.push(new THREE.Vector2(r, x));
    }
  } else {
    // concave lens: centre thin, edges thick
    // right surface caves inward: at r=0 → x = halfT–sg; at r=APR → x = halfT
    for (let i=0; i<=SEGS; i++) {
      const r = (i/SEGS)*APR;
      const depth = R - Math.sqrt(R*R - r*r);
      const x = halfT - (sg - depth);   // halfT at rim, halfT–sg at centre
      pts.push(new THREE.Vector2(r, x));
    }
    for (let i=SEGS; i>=0; i--) {
      const r = (i/SEGS)*APR;
      const depth = R - Math.sqrt(R*R - r*r);
      const x = -(halfT - (sg - depth));
      pts.push(new THREE.Vector2(r, x));
    }
  }
  const geo = new THREE.LatheGeometry(pts, 48);
  geo.rotateZ(-Math.PI / 2);
  return geo;
}

function computeFocalLength() {
  const { R, n, el } = S;
  if (el==='concave-mirror'||el==='convex-mirror') return R/2;
  if (el==='convex-lens'||el==='concave-lens')     return 1/((n-1)*(2/R));
  return 0;
}

// ─── BUILD ELEMENT ───────────────────────────────────────
const elGrp = new THREE.Group(); scene.add(elGrp);

function buildElement() {
  elGrp.clear();
  const { R, d, n, el } = S;

  const rimMat = new THREE.MeshStandardMaterial({color:0x3a4a60, metalness:0.7, roughness:0.3});

  // ── ROUGH ──
  if (el==='rough') {
    const geo = new THREE.BoxGeometry(0.28,4.2,4.2,1,20,20);
    const pos = geo.attributes.position;
    for (let i=0; i<pos.count; i++)
      if (pos.getX(i)>0) pos.setX(i, pos.getX(i)+(Math.random()-.5)*0.28);
    geo.computeVertexNormals();
    elGrp.add(new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
      color:0x6a7888, roughness:0.98, metalness:0.05, flatShading:true
    })));
    return;
  }

  // ── PLANAR MIRROR ──
  if (el==='planar') {
    // Reflective front face faces –X (toward incoming light)
    const fGeo = new THREE.PlaneGeometry(4.2, 4.2);
    const fMat = new THREE.MeshStandardMaterial({
      color:0xddeeff, roughness:0.02, metalness:1.0,
      emissive:0x223344, emissiveIntensity:0.45, side:THREE.FrontSide
    });
    const front = new THREE.Mesh(fGeo, fMat);
    front.rotation.y = Math.PI/2; // normal now points –X
    elGrp.add(front);
    // Bright specular overlay
    const hGeo = new THREE.PlaneGeometry(4.0, 4.0);
    const hMat = new THREE.MeshStandardMaterial({
      color:0xffffff, roughness:0.0, metalness:1.0, transparent:true, opacity:0.14, side:THREE.FrontSide
    });
    const hl = new THREE.Mesh(hGeo, hMat);
    hl.rotation.y = Math.PI/2; hl.position.x = 0.001;
    elGrp.add(hl);
    // Body thickness
    elGrp.add(new THREE.Mesh(
      new THREE.BoxGeometry(0.1,4.2,4.2),
      new THREE.MeshStandardMaterial({color:0x1a2535, roughness:0.7})
    ));
    return;
  }

  // ── CONCAVE MIRROR ──
  // cap(true): vertex at x=+sag, rim at x=0. Bowl opens toward –X.
  // Sphere centre at –cx. hit.x ∈ [0, +sag].
  // Outward normal (hit–centre): hit.x∈[0,sg]>centre.x=–cx → nx>0, ny same sign as hy → CONVERGES ✓
  if (el==='concave-mirror') {
    const capGeo = buildMirrorCap(R, true);
    elGrp.add(new THREE.Mesh(capGeo.clone(), new THREE.MeshStandardMaterial({
      color:0xbdd0e8, roughness:0.03, metalness:0.96, side:THREE.DoubleSide
    })));
    elGrp.add(new THREE.Mesh(capGeo.clone(), new THREE.MeshStandardMaterial({
      color:0xeef4ff, roughness:0.0, metalness:1.0,
      emissive:0x3355aa, emissiveIntensity:0.35,
      transparent:true, opacity:0.85, side:THREE.FrontSide
    })));
    const rim = new THREE.Mesh(new THREE.TorusGeometry(APR,0.07,8,48), rimMat);
    rim.rotation.y = Math.PI/2; elGrp.add(rim);
    if (S.focal) addFocalMarker(-R/2, 'F');
    return;
  }

  // ── CONVEX MIRROR ──
  // cap(false): vertex at x=–sag, rim at x=0. Dome faces –X.
  // Sphere centre at +cx. hit.x ∈ [–sag, 0].
  // Outward normal (hit–centre): hit.x∈[–sg,0]<centre.x=+cx → nx<0, ny same sign as hy → DIVERGES ✓
  if (el==='convex-mirror') {
    const capGeo = buildMirrorCap(R, false);
    elGrp.add(new THREE.Mesh(capGeo.clone(), new THREE.MeshStandardMaterial({
      color:0xbdd0e8, roughness:0.03, metalness:0.96, side:THREE.DoubleSide
    })));
    elGrp.add(new THREE.Mesh(capGeo.clone(), new THREE.MeshStandardMaterial({
      color:0xeef4ff, roughness:0.0, metalness:1.0,
      emissive:0x3355aa, emissiveIntensity:0.35,
      transparent:true, opacity:0.85, side:THREE.FrontSide
    })));
    const rim = new THREE.Mesh(new THREE.TorusGeometry(APR,0.07,8,48), rimMat);
    rim.rotation.y = Math.PI/2; elGrp.add(rim);
    if (S.focal) addFocalMarker(R/2, 'F(虚)');
    return;
  }

  // ── LENSES ──
  if (el==='convex-lens'||el==='concave-lens') {
    const isConvex = el==='convex-lens';
    const lGeo = buildLensLathe(R, d/2, isConvex);
    elGrp.add(new THREE.Mesh(lGeo, new THREE.MeshPhysicalMaterial({
      color:0x88aaff, transparent:true, opacity:0.30,
      roughness:0.0, metalness:0.0,
      transmission:0.88, ior:n, thickness:d, side:THREE.DoubleSide
    })));
    const rim = new THREE.Mesh(new THREE.TorusGeometry(APR,0.055,8,48),
      new THREE.MeshStandardMaterial({color:0x445566, metalness:0.7, roughness:0.3}));
    rim.rotation.y = Math.PI/2; elGrp.add(rim);

    if (S.focal) {
      const f = computeFocalLength();
      if (isConvex) { addFocalMarker(f,'F');      addFocalMarker(-f,"F'"); }
      else          { addFocalMarker(-f,'F(虚)'); addFocalMarker(f,"F'(虚)"); }
    }
  }
}

// ─── RAY RENDERING ───────────────────────────────────────
const rayGrp = new THREE.Group(); scene.add(rayGrp);
const C_IN  = new THREE.Color(0xffe4a0);
const C_REF = new THREE.Color(0x55ccff);
const C_RFR = new THREE.Color(0xff9966);

function drawSeg(a, b, col, opacity=0.92, dashed=false) {
  if (a.distanceTo(b) < 0.005) return;
  const geo = new THREE.BufferGeometry().setFromPoints([a, b]);
  const mat = dashed
    ? new THREE.LineDashedMaterial({color:col.getHex(), transparent:true, opacity:opacity*0.5, dashSize:0.14, gapSize:0.09})
    : new THREE.LineBasicMaterial({color:col.getHex(), transparent:true, opacity});
  const ln = new THREE.Line(geo, mat);
  if (dashed) ln.computeLineDistances();
  rayGrp.add(ln);
}

function drawArrow(pos, dir, col, opacity=0.92) {
  const cone = new THREE.Mesh(
    new THREE.ConeGeometry(0.068, 0.20, 8),
    new THREE.MeshBasicMaterial({color:col.getHex(), transparent:true, opacity})
  );
  cone.position.copy(pos);
  cone.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir.clone().normalize());
  rayGrp.add(cone);
}

function drawRay(a, b, col, opacity=0.92, dashed=false) {
  drawSeg(a, b, col, opacity, dashed);
  const t  = 0.58;
  const mid = a.clone().lerp(b, t);
  const dir = b.clone().sub(a).normalize();
  drawArrow(mid, dir, col, opacity);
}

function drawNorm(pt, n) {
  const e = pt.clone().add(n.clone().multiplyScalar(0.75));
  const ln = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints([pt, e]),
    new THREE.LineDashedMaterial({color:0x44ff88, dashSize:0.08, gapSize:0.06, transparent:true, opacity:0.65})
  );
  ln.computeLineDistances(); rayGrp.add(ln);
}

// reflection: r = d – 2(d·n̂)n̂
function reflect(d, n) {
  const nd = n.clone().normalize();
  return d.clone().sub(nd.clone().multiplyScalar(2 * d.dot(nd))).normalize();
}

// smallest positive t for ray–sphere intersection
function sphereHit(origin, dir, center, R) {
  const oc = origin.clone().sub(center);
  const a = dir.dot(dir);
  const b = 2 * oc.dot(dir);
  const c = oc.dot(oc) - R*R;
  const disc = b*b - 4*a*c;
  if (disc < 0) return null;
  const sq = Math.sqrt(disc);
  const EPS = 0.005;
  const t1 = (-b - sq) / (2*a);
  const t2 = (-b + sq) / (2*a);
  if (t1 > EPS) return t1;
  if (t2 > EPS) return t2;
  return null;
}

// ─── TRACE ONE RAY ───────────────────────────────────────
function trace(origin, dir) {
  const { el, R, n } = S;
  const REACH = 7.5;

  // ── ROUGH ──
  if (el === 'rough') {
    const t = -origin.x / dir.x;
    if (t <= 0.001) { drawRay(origin, origin.clone().addScaledVector(dir, REACH), C_IN); return; }
    const hit = origin.clone().addScaledVector(dir, t);
    drawRay(origin, hit, C_IN);
    for (let k=0; k<4; k++) {
      const rd = new THREE.Vector3(
        -Math.abs(Math.random()*0.6+0.4),
        (Math.random()-.5)*1.6,
        (Math.random()-.5)*0.5
      ).normalize();
      drawRay(hit, hit.clone().addScaledVector(rd, 2.5+Math.random()*2), C_REF, 0.4);
    }
    return;
  }

  // ── PLANAR ──
  if (el === 'planar') {
    if (Math.abs(dir.x) < 1e-5) return;
    const t = -origin.x / dir.x; if (t <= 0.001) return;
    const hit = origin.clone().addScaledVector(dir, t);
    if (Math.abs(hit.y)>2.1 || Math.abs(hit.z)>2.1) return;
    drawRay(origin, hit, C_IN);
    const nrm = new THREE.Vector3(-1,0,0); // faces –X toward light
    const refl = reflect(dir, nrm);
    drawRay(hit, hit.clone().addScaledVector(refl, REACH), C_REF);
    if (S.norm) drawNorm(hit, nrm);
    return;
  }

  // ── CONCAVE MIRROR ──
  if (el === 'concave-mirror') {
    // cap(true): vertex at +sag, rim at 0. Sphere centre at –cx.
    // hit.x ∈ [0, +sag]. outward = (hit–centre), nx>0, ny·hy>0 → CONVERGES ✓
    const sg_R = sag(R);
    const centre = mirrorSphereCenter(R, true); // –cx
    const t = sphereHit(origin, dir, centre, R);
    if (!t) return;
    const hit = origin.clone().addScaledVector(dir, t);
    if (hit.x < -0.02 || hit.x > sg_R + 0.05) return;
    if (Math.sqrt(hit.y*hit.y + hit.z*hit.z) > APR * 1.02) return;
    drawRay(origin, hit, C_IN);
    const nrm = hit.clone().sub(centre).normalize();
    drawRay(hit, hit.clone().addScaledVector(reflect(dir, nrm), REACH), C_REF);
    if (S.norm) drawNorm(hit, nrm);
    return;
  }

  // ── CONVEX MIRROR ──
  if (el === 'convex-mirror') {
    // cap(false): vertex at –sag, rim at 0. Sphere centre at +cx.
    // hit.x ∈ [–sag, 0]. outward = (hit–centre), nx<0, ny·hy>0 → DIVERGES ✓
    const sg_R = sag(R);
    const centre = mirrorSphereCenter(R, false); // +cx
    const t = sphereHit(origin, dir, centre, R);
    if (!t) return;
    const hit = origin.clone().addScaledVector(dir, t);
    if (hit.x < -sg_R - 0.05 || hit.x > 0.02) return;
    if (Math.sqrt(hit.y*hit.y + hit.z*hit.z) > APR * 1.02) return;
    drawRay(origin, hit, C_IN);
    const nrm = hit.clone().sub(centre).normalize();
    drawRay(hit, hit.clone().addScaledVector(reflect(dir, nrm), REACH), C_REF);
    if (S.norm) drawNorm(hit, nrm);
    return;
  }

  // ── LENSES (thin-lens at x = 0) ──
  if (el==='convex-lens' || el==='concave-lens') {
    const isConvex = el==='convex-lens';
    const f = computeFocalLength();
    if (Math.abs(dir.x) < 1e-5) return;
    const t = -origin.x / dir.x; if (t <= 0.001) return;
    const hit = origin.clone().addScaledVector(dir, t);
    if (Math.sqrt(hit.y*hit.y+hit.z*hit.z) > APR*0.97) return;
    drawRay(origin, hit, C_IN);

    let exitDir;
    if (isConvex) {
      // All parallel rays converge at the real focus (f, f·dy/dx, f·dz/dx)
      const fp = new THREE.Vector3(f, f*(dir.y/dir.x), f*(dir.z/dir.x));
      exitDir = fp.clone().sub(hit).normalize();
    } else {
      // All parallel rays diverge as if from virtual focus (–f, –f·dy/dx, –f·dz/dx)
      const vf = new THREE.Vector3(-f, -f*(dir.y/dir.x), -f*(dir.z/dir.x));
      exitDir = hit.clone().sub(vf).normalize();
    }
    drawRay(hit, hit.clone().addScaledVector(exitDir, REACH), C_RFR);
  }
}

// ─── BUILD RAYS ──────────────────────────────────────────
function buildRays() {
  rayGrp.clear();
  const ang = S.angle * Math.PI/180;
  const sp  = S.spread;
  const offsets = [-sp, -sp/2, 0, sp/2, sp];
  offsets.forEach(yo => {
    const origin = new THREE.Vector3(-5.8, yo, 0);
    // Rays are parallel to each other; angle tilts the whole bundle
    const dir = new THREE.Vector3(Math.cos(ang), Math.sin(ang), 0).normalize();
    trace(origin, dir);
  });
  document.getElementById('i-r').textContent = offsets.length;
}

// ─── REBUILD ─────────────────────────────────────────────
function rebuild() {
  buildGrid();
  buildElement();
  buildRays();
  const f = computeFocalLength();
  document.getElementById('i-f').textContent = f>0 ? f.toFixed(2) : '—';
  document.getElementById('i-el').textContent = NAMES[S.el];
}

// ─── UI BINDINGS ─────────────────────────────────────────

// Section collapse/expand
document.querySelectorAll('.sec-t').forEach(title => {
  title.addEventListener('click', () => {
    const id = title.dataset.sec;
    const body = document.getElementById(id);
    const isCollapsed = body.classList.contains('collapsed');
    body.classList.toggle('collapsed');
    title.classList.toggle('collapsed');
  });
});

document.querySelectorAll('.eb').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.eb').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    S.el = b.dataset.el;
    rebuild();
  });
});

function bind(sid, vid, key, fmt=v=>v) {
  document.getElementById(sid).addEventListener('input', e => {
    S[key] = parseFloat(e.target.value);
    if (vid) document.getElementById(vid).textContent = fmt(S[key]);
    rebuild();
  });
}
bind('s-angle','v-angle','angle', v=>`${v}°`);
bind('s-spread','v-spread','spread', v=>v.toFixed(1));
bind('s-R','v-R','R', v=>v.toFixed(1));
bind('s-d','v-d','d', v=>v.toFixed(2));
bind('s-n','v-n','n', v=>v.toFixed(2));

[['c-grid','grid'],['c-focal','focal'],['c-norm','norm'],['c-axis','axis']].forEach(([id,k]) => {
  document.getElementById(id).addEventListener('change', e => {
    S[k] = e.target.checked;
    id==='c-grid' ? (gridGrp.visible=e.target.checked) : rebuild();
  });
});

document.querySelectorAll('.vbtn').forEach(b => {
  b.addEventListener('click', () => {
    const p = {front:[0,0,13], side:[13,0,0], top:[0,13,.01], iso:[5,3.5,10]};
    const tgt = new THREE.Vector3(...p[b.dataset.v]);
    const s = camera.position.clone(), t0 = performance.now();
    (function step() {
      const t=Math.min(1,(performance.now()-t0)/800), e=t<.5?2*t*t:-1+(4-2*t)*t;
      camera.position.lerpVectors(s,tgt,e); controls.update();
      if(t<1) requestAnimationFrame(step);
    })();
  });
});

window.addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  composer.setSize(innerWidth,innerHeight);
});

// ─── RENDER LOOP ─────────────────────────────────────────
let ft=performance.now(), ff=0;
(function loop() {
  requestAnimationFrame(loop);
  controls.update();
  composer.render();
  if (++ff, performance.now()-ft > 600) {
    document.getElementById('fps').textContent=`${Math.round(ff*1e3/(performance.now()-ft))} FPS`;
    ft=performance.now(); ff=0;
  }
})();

rebuild();
</script>
</body>
