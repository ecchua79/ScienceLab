<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>女性生殖系统示意图</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f6f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .svg-container {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            padding: 20px;
            max-width: 900px;
            width: 100%;
        }
    </style>
</head>
<body>

<div class="svg-container">
    <svg width="100%" height="100%" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <radialGradient id="ovaryGrad" cx="30%" cy="30%" r="70%">
                <stop offset="0%" stop-color="#fdf0f5"/>
                <stop offset="100%" stop-color="#f0b6c7"/>
            </radialGradient>
            <linearGradient id="uterusGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#f8b3c8"/>
                <stop offset="100%" stop-color="#d9728f"/>
            </linearGradient>
            <linearGradient id="vaginaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#e89bb0"/>
                <stop offset="100%" stop-color="#f2c4d1"/>
            </linearGradient>
        </defs>

        <rect width="800" height="600" fill="#ffffff" rx="10"/>
        <text x="400" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#333">女性生殖系统结构图 (正面示意图)</text>

        <path d="M 285 185 C 220 160, 160 180, 140 250" fill="none" stroke="#e88ba4" stroke-width="16" stroke-linecap="round"/>
        <path d="M 515 185 C 580 160, 640 180, 660 250" fill="none" stroke="#e88ba4" stroke-width="16" stroke-linecap="round"/>

        <path d="M 130 240 Q 110 260 120 280 Q 135 290 145 270 Q 155 285 160 260 Q 165 240 130 240" fill="#e88ba4" />
        <path d="M 670 240 Q 690 260 680 280 Q 665 290 655 270 Q 645 285 640 260 Q 635 240 670 240" fill="#e88ba4" />

        <ellipse cx="120" cy="290" rx="35" ry="22" fill="url(#ovaryGrad)" stroke="#c2748a" stroke-width="2" transform="rotate(-15 120 290)"/>
        <ellipse cx="680" cy="290" rx="35" ry="22" fill="url(#ovaryGrad)" stroke="#c2748a" stroke-width="2" transform="rotate(15 680 290)"/>

        <path d="M 370 420 L 350 540 Q 400 560 450 540 L 430 420 Z" fill="url(#vaginaGrad)" stroke="#c2748a" stroke-width="2"/>
        <path d="M 365 450 Q 400 460 435 450" fill="none" stroke="#d68399" stroke-width="2"/>
        <path d="M 360 480 Q 400 490 440 480" fill="none" stroke="#d68399" stroke-width="2"/>
        <path d="M 355 510 Q 400 520 445 510" fill="none" stroke="#d68399" stroke-width="2"/>

        <path d="M 370 420 C 350 300, 260 250, 280 180 C 300 130, 500 130, 520 180 C 540 250, 450 300, 430 420 Z" fill="url(#uterusGrad)" stroke="#b54a67" stroke-width="3"/>
        
        <path d="M 380 400 C 365 300, 290 250, 305 195 C 320 155, 480 155, 495 195 C 510 250, 435 300, 420 400 Z" fill="#bd3156" opacity="0.6"/>

        <path d="M 370 420 Q 400 435 430 420" fill="none" stroke="#8c2e46" stroke-width="3"/>


        <g font-size="16" fill="#333">
            
            <line x1="120" y1="290" x2="80" y2="360" stroke="#666" stroke-width="1.5" stroke-dasharray="4,2"/>
            <circle cx="120" cy="290" r="4" fill="#666"/>
            <text x="75" y="380" text-anchor="middle" font-weight="bold" fill="#c24c71">卵巢 (Ovary)</text>
            <text x="75" y="400" text-anchor="middle" font-size="13" fill="#666">产生卵细胞</text>
            <text x="75" y="418" text-anchor="middle" font-size="13" fill="#666">分泌雌性激素</text>

            <line x1="220" y1="180" x2="160" y2="100" stroke="#666" stroke-width="1.5" stroke-dasharray="4,2"/>
            <circle cx="220" cy="180" r="4" fill="#666"/>
            <text x="155" y="70" text-anchor="middle" font-weight="bold" fill="#c24c71">输卵管 (Fallopian Tube)</text>
            <text x="155" y="90" text-anchor="middle" font-size="13" fill="#666">输送卵细胞</text>
            <text x="155" y="108" text-anchor="middle" font-size="13" fill="#666">精子与卵子结合(受精)的场所</text>

            <line x1="330" y1="200" x2="330" y2="100" stroke="#666" stroke-width="1.5" stroke-dasharray="4,2"/>
            <circle cx="330" cy="200" r="4" fill="#666"/>
            <text x="330" y="70" text-anchor="middle" font-weight="bold" fill="#c24c71">子宫 (Uterus)</text>
            <text x="330" y="90" text-anchor="middle" font-size="13" fill="#666">胚胎和胎儿发育的场所</text>

            <line x1="430" y1="280" x2="600" y2="130" stroke="#666" stroke-width="1.5" stroke-dasharray="4,2"/>
            <circle cx="430" cy="280" r="4" fill="#666"/>
            <text x="660" y="120" text-anchor="middle" font-weight="bold" fill="#c24c71">子宫内膜 (Endometrium)</text>
            <text x="660" y="140" text-anchor="middle" font-size="13" fill="#666">受精卵着床的地方</text>
            <text x="660" y="158" text-anchor="middle" font-size="13" fill="#666">周期性脱落形成月经</text>

            <line x1="415" y1="425" x2="550" y2="425" stroke="#666" stroke-width="1.5" stroke-dasharray="4,2"/>
            <circle cx="415" cy="425" r="4" fill="#666"/>
            <text x="600" y="420" text-anchor="middle" font-weight="bold" fill="#c24c71">子宫颈 (Cervix)</text>
            <text x="600" y="440" text-anchor="middle" font-size="13" fill="#666">连接子宫与阴道的狭窄通道</text>

            <line x1="410" y1="500" x2="550" y2="520" stroke="#666" stroke-width="1.5" stroke-dasharray="4,2"/>
            <circle cx="410" cy="500" r="4" fill="#666"/>
            <text x="600" y="525" text-anchor="middle" font-weight="bold" fill="#c24c71">阴道 (Vagina)</text>
            <text x="600" y="545" text-anchor="middle" font-size="13" fill="#666">精子进入和胎儿产出的通道</text>
            <text x="600" y="563" text-anchor="middle" font-size="13" fill="#666">也是月经流出的通道</text>
        </g>
    </svg>
</div>

</body>
</html>
