<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>女性生殖系统示意图 · 初中生物</title>
  <style>
    body {
      background: #fbf7f2;
      font-family: 'Segoe UI', 'Roboto', 'Noto Sans', 'Helvetica Neue', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 32px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08), 0 8px 20px rgba(0, 0, 0, 0.06);
      padding: 25px 30px 20px;
      max-width: 650px;
      width: fit-content;
      transition: all 0.2s ease;
    }
    h2 {
      margin: 0 0 15px 0;
      font-weight: 500;
      font-size: 1.8rem;
      color: #5a3e4b;
      text-align: center;
      letter-spacing: 2px;
      border-bottom: 2px solid #f0dde4;
      padding-bottom: 10px;
    }
    .subtitle {
      text-align: center;
      color: #9c7b8b;
      margin-top: -5px;
      margin-bottom: 15px;
      font-size: 0.95rem;
      font-style: italic;
    }
    svg {
      display: block;
      margin: 0 auto;
      max-width: 100%;
      height: auto;
    }
    .legend-note {
      display: flex;
      justify-content: center;
      gap: 28px;
      margin-top: 15px;
      font-size: 0.9rem;
      color: #6d5c64;
      flex-wrap: wrap;
    }
    .legend-note span::before {
      content: "●";
      margin-right: 5px;
      color: #d88c9a;
      font-size: 1.1rem;
    }
    footer {
      margin-top: 18px;
      color: #b7a1aa;
      font-size: 0.75rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>女性生殖系统</h2>
    <div class="subtitle">（正面观 · 主要内生殖器官）</div>
    
    <!-- SVG 示意图 -->
    <svg viewBox="0 0 500 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="女性生殖系统示意图">
      <title>女性生殖系统：卵巢、输卵管、子宫、子宫颈、阴道</title>
      
      <defs>
        <!-- 柔和的渐变用于器官填充，增加层次感 -->
        <linearGradient id="uterineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#f7cfd7" />
          <stop offset="60%" stop-color="#f2b6c1" />
          <stop offset="100%" stop-color="#e99aaa" />
        </linearGradient>
        <linearGradient id="cervixGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#e99aaa" />
          <stop offset="100%" stop-color="#d47b8c" />
        </linearGradient>
        <linearGradient id="vaginaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#f2c4cd" />
          <stop offset="100%" stop-color="#e5a3b0" />
        </linearGradient>
        <linearGradient id="ovaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#fbe0e4" />
          <stop offset="100%" stop-color="#f0b8c4" />
        </linearGradient>
        <!-- 阴影滤镜，轻微立体感 -->
        <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
          <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#c0909c" flood-opacity="0.25" />
        </filter>
      </defs>

      <!-- 背景装饰 (非常淡的轮廓) -->
      <rect x="0" y="0" width="500" height="620" fill="none" />

      <!-- ========== 卵巢 (左右) ========== -->
      <!-- 左侧卵巢 -->
      <ellipse cx="88" cy="195" rx="28" ry="18" 
               fill="url(#ovaryGrad)" stroke="#c77d8a" stroke-width="2.2" 
               filter="url(#softShadow)" 
               transform="rotate(-10, 88, 195)" />
      <!-- 右侧卵巢 (对称) -->
      <ellipse cx="412" cy="195" rx="28" ry="18" 
               fill="url(#ovaryGrad)" stroke="#c77d8a" stroke-width="2.2" 
               filter="url(#softShadow)" 
               transform="rotate(10, 412, 195)" />

      <!-- ========== 输卵管 (左右) ========== -->
      <!-- 左侧输卵管：从子宫侧壁向外延伸到卵巢附近，呈弯曲状 -->
      <path d="M192,245 C160,235 140,210 120,205 C105,202 95,195 92,195"
            fill="none" stroke="#d4798a" stroke-width="5.5" stroke-linecap="round"
            filter="url(#softShadow)" />
      <!-- 输卵管伞端（漏斗状）在卵巢附近表现 -->
      <path d="M92,195 C88,188 84,185 78,186" 
            fill="none" stroke="#d4798a" stroke-width="5" stroke-linecap="round" />
      <path d="M92,195 C90,202 85,207 80,210" 
            fill="none" stroke="#d4798a" stroke-width="4.5" stroke-linecap="round" />

      <!-- 右侧输卵管 -->
      <path d="M308,245 C340,235 360,210 380,205 C395,202 405,195 408,195"
            fill="none" stroke="#d4798a" stroke-width="5.5" stroke-linecap="round"
            filter="url(#softShadow)" />
      <path d="M408,195 C412,188 416,185 422,186" 
            fill="none" stroke="#d4798a" stroke-width="5" stroke-linecap="round" />
      <path d="M408,195 C410,202 415,207 420,210" 
            fill="none" stroke="#d4798a" stroke-width="4.5" stroke-linecap="round" />

      <!-- ========== 子宫体 (倒梨形) ========== -->
      <!-- 子宫主体：使用路径绘制，上宽下窄，融合宫颈区域 -->
      <path d="M250,195 
               C250,195 300,198 315,240 
               C330,282 320,340 298,380 
               C285,405 270,420 250,430 
               C230,420 215,405 202,380 
               C180,340 170,282 185,240 
               C200,198 250,195 250,195 Z" 
            fill="url(#uterineGrad)" stroke="#b86b7c" stroke-width="2.5" 
            filter="url(#softShadow)" />
      
      <!-- 子宫内膜示意 (内部浅色区域) -->
      <path d="M250,218 
               C265,218 285,232 293,268 
               C301,304 295,338 280,364 
               C270,382 258,395 250,400 
               C242,395 230,382 220,364 
               C205,338 199,304 207,268 
               C215,232 235,218 250,218 Z" 
            fill="#fde8ec" stroke="none" opacity="0.9" />

      <!-- 子宫底部的细微结构 -->
      <path d="M240,210 C245,203 255,203 260,210" 
            fill="none" stroke="#d494a2" stroke-width="2" stroke-linecap="round" />

      <!-- ========== 子宫颈 (宫颈) ========== -->
      <!-- 宫颈在子宫下端，呈圆柱状稍窄，位于y≈430-470 -->
      <path d="M233,430 
               C233,430 225,445 227,470 
               L273,470 
               C275,445 267,430 267,430 Z" 
            fill="url(#cervixGrad)" stroke="#b86b7c" stroke-width="2.2" 
            filter="url(#softShadow)" />
      <!-- 宫颈管示意线 -->
      <line x1="250" y1="435" x2="250" y2="468" stroke="#fde8ec" stroke-width="2.8" stroke-linecap="round" opacity="0.9" />

      <!-- ========== 阴道 ========== -->
      <!-- 阴道从宫颈下端延伸至外部开口，呈管状稍扩张 -->
      <path d="M227,470 
               C225,485 218,510 215,535 
               C213,552 218,568 230,575 
               L270,575 
               C282,568 287,552 285,535 
               C282,510 275,485 273,470 Z" 
            fill="url(#vaginaGrad)" stroke="#b86b7c" stroke-width="2.2" 
            filter="url(#softShadow)" />
      <!-- 阴道壁褶皱示意 (轻微线条) -->
      <path d="M232,495 C240,492 260,492 268,495" 
            fill="none" stroke="#e6b3bd" stroke-width="2" stroke-linecap="round" opacity="0.7" />
      <path d="M225,525 C235,520 265,520 275,525" 
            fill="none" stroke="#e6b3bd" stroke-width="2" stroke-linecap="round" opacity="0.7" />
      
      <!-- 阴道口外部轻微标示 -->
      <ellipse cx="250" cy="578" rx="28" ry="6" fill="#f5d2d9" stroke="#c28594" stroke-width="1.8" opacity="0.9" />

      <!-- ========== 标签与指示线 ========== -->
      <!-- 左侧卵巢标签 -->
      <line x1="72" y1="175" x2="22" y2="148" stroke="#7b5b66" stroke-width="1.5" stroke-dasharray="3 2" />
      <circle cx="72" cy="175" r="3.5" fill="#7b5b66" />
      <text x="8" y="142" font-size="15" font-weight="500" fill="#4d2e3a" font-family="'Noto Sans', 'Segoe UI', sans-serif">卵巢</text>
      
      <!-- 右侧卵巢标签 -->
      <line x1="428" y1="175" x2="470" y2="148" stroke="#7b5b66" stroke-width="1.5" stroke-dasharray="3 2" />
      <circle cx="428" cy="175" r="3.5" fill="#7b5b66" />
      <text x="440" y="142" font-size="15" font-weight="500" fill="#4d2e3a" font-family="'Noto Sans', 'Segoe UI', sans-serif">卵巢</text>

      <!-- 左侧输卵管标签 -->
      <line x1="145" y1="215" x2="100" y2="250" stroke="#7b5b66" stroke-width="1.5" stroke-dasharray="3 2" />
      <circle cx="145" cy="215" r="3.5" fill="#7b5b66" />
      <text x="30" y="268" font-size="15" font-weight="500" fill="#4d2e3a" font-family="'Noto Sans', 'Segoe UI', sans-serif">输卵管</text>
      
      <!-- 右侧输卵管标签 -->
      <line x1="355" y1="215" x2="400" y2="250" stroke="#7b5b66" stroke-width="1.5" stroke-dasharray="3 2" />
      <circle cx="355" cy="215" r="3.5" fill="#7b5b66" />
      <text x="395" y="268" font-size="15" font-weight="500" fill="#4d2e3a" font-family="'Noto Sans', 'Segoe UI', sans-serif">输卵管</text>

      <!-- 子宫标签 -->
      <line x1="280" y1="280" x2="360" y2="260" stroke="#7b5b66" stroke-width="1.5" stroke-dasharray="3 2" />
      <circle cx="280" cy="280" r="3.5" fill="#7b5b66" />
      <text x="365" y="255" font-size="16" font-weight="600" fill="#4d2e3a" font-family="'Noto Sans', 'Segoe UI', sans-serif">子宫</text>

      <!-- 子宫颈标签 -->
      <line x1="267" y1="455" x2="340" y2="445" stroke="#7b5b66" stroke-width="1.5" stroke-dasharray="3 2" />
      <circle cx="267" cy="455" r="3.5" fill="#7b5b66" />
      <text x="345" y="440" font-size="15" font-weight="500" fill="#4d2e3a" font-family="'Noto Sans', 'Segoe UI', sans-serif">子宫颈</text>

      <!-- 阴道标签 -->
      <line x1="273" y1="530" x2="340" y2="540" stroke="#7b5b66" stroke-width="1.5" stroke-dasharray="3 2" />
      <circle cx="273" cy="530" r="3.5" fill="#7b5b66" />
      <text x="345" y="536" font-size="15" font-weight="500" fill="#4d2e3a" font-family="'Noto Sans', 'Segoe UI', sans-serif">阴道</text>

      <!-- 额外的结构注释：子宫内膜（温和标注） -->
      <text x="210" y="330" font-size="12" fill="#a5727e" font-style="italic" opacity="0.9">子宫内膜</text>
      <path d="M230,325 L240,340" stroke="#a5727e" stroke-width="1" opacity="0.7" />

    </svg>

    <div class="legend-note">
      <span>卵巢</span>
      <span>输卵管</span>
      <span>子宫</span>
      <span>子宫颈</span>
      <span>阴道</span>
    </div>
    <footer>
      适合初中生 · 示意结构简化，突出主要内生殖器官
    </footer>
  </div>
</body>
        </html>
