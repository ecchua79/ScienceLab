<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intertidal Zone Simulator</title>
    <style>
        :root {
            --sky-top: #87CEEB;
            --sky-bottom: #E0F6FF;
            --sand-color: #E2C9A1;
            --rock-color: #696969;
            --water-color: rgba(30, 144, 255, 0.7);
            --water-deep: rgba(0, 50, 150, 0.9);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: 20px auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            padding: 20px;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
        }

        .scene-container {
            position: relative;
            width: 100%;
            height: 500px;
            background: linear-gradient(to bottom, var(--sky-top), var(--sky-bottom));
            overflow: hidden;
        }

        /* Controls Section */
        .controls {
            padding: 25px;
            background-color: #ffffff;
            border-top: 1px solid #eee;
        }

        .control-group {
            margin-bottom: 20px;
        }

        .control-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        label {
            font-weight: 600;
            color: #333;
            font-size: 16px;
        }

        #tideValue {
            font-weight: bold;
            color: #2a5298;
            background: #f0f4f8;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 14px;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: #2a5298;
            cursor: pointer;
            margin-top: -8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: transform 0.1s;
        }

        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 8px;
            cursor: pointer;
            background: linear-gradient(to right, #E2C9A1 0%, #1e90ff 100%);
            border-radius: 4px;
        }

        .info-panel {
            background: #f8fbff;
            border-left: 4px solid #2a5298;
            padding: 15px;
            margin-top: 15px;
            border-radius: 0 8px 8px 0;
            font-size: 14px;
            color: #555;
            line-height: 1.5;
            transition: all 0.3s ease;
        }

        .zone-highlight {
            font-weight: bold;
            color: #2a5298;
        }

        /* SVG specific styling within HTML */
        svg {
            display: block;
            width: 100%;
            height: 100%;
        }

        .water-layer {
            transition: transform 0.3s ease-out; /* Smooth transition when using slider */
        }

    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🌊 Intertidal Zone Simulator</h1>
    </div>
    
    <div class="scene-container">
        <!-- SVG Canvas Starts Here -->
        <svg viewBox="0 0 1000 500" preserveAspectRatio="xMidYMax slice" id="mainSvg">
            
            <!-- DEFINITIONS -->
            <defs>
                <!-- Sun gradient -->
                <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#FFF200" />
                    <stop offset="100%" stop-color="#FF9900" stop-opacity="0" />
                </radialGradient>
                
                <!-- Water gradient -->
                <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="rgba(30, 144, 255, 0.6)" />
                    <stop offset="40%" stop-color="rgba(20, 100, 200, 0.8)" />
                    <stop offset="100%" stop-color="rgba(0, 50, 100, 1)" />
                </linearGradient>

                <!-- Sand texture pattern -->
                <pattern id="sandTexture" width="40" height="40" patternUnits="userSpaceOnUse">
                    <rect width="40" height="40" fill="#D2B48C"/>
                    <circle cx="10" cy="10" r="1" fill="#C19A6B" />
                    <circle cx="30" cy="25" r="1.5" fill="#E8D3B9" />
                    <circle cx="20" cy="35" r="0.8" fill="#A0785A" />
                    <circle cx="5" cy="30" r="1" fill="#C19A6B" />
                </pattern>
                
                <!-- Cloud filter -->
                <filter id="blur">
                    <feGaussianBlur stdDeviation="3" />
                </filter>
            </defs>

            <!-- Sky is handled by CSS background on container -->
            
            <!-- Sun -->
            <circle cx="150" cy="80" r="60" fill="url(#sunGrad)" />
            <circle cx="150" cy="80" r="25" fill="#FFD700" />

            <!-- Clouds -->
            <g opacity="0.8" filter="url(#blur)">
                <!-- Cloud 1 (moving) -->
                <g id="cloud1">
                    <path d="M 250 80 Q 270 60 300 80 Q 330 60 350 80 Q 370 100 350 110 L 250 110 Q 230 100 250 80 Z" fill="white" />
                    <animateTransform attributeName="transform" type="translate" from="-100 0" to="1100 0" dur="60s" repeatCount="indefinite" />
                </g>
                <!-- Cloud 2 -->
                <g id="cloud2">
                    <path d="M 700 120 Q 720 90 760 120 Q 800 100 820 130 Q 840 150 810 160 L 690 160 Q 670 140 700 120 Z" fill="white" />
                    <animateTransform attributeName="transform" type="translate" from="-400 0" to="1000 0" dur="80s" repeatCount="indefinite" />
                </g>
            </g>

            <!-- Background solid land to prevent gaps -->
            <rect x="0" y="250" width="1000" height="250" fill="url(#sandTexture)" />

            <!-- Landform Path -->
            <path id="land" d="
                M 0 500 
                L 0 150 
                C 100 150, 150 180, 200 200 
                C 300 240, 350 280, 450 320 
                C 550 360, 650 390, 750 420 
                C 850 450, 950 480, 1000 490
                L 1000 500 Z" 
                fill="url(#sandTexture)" 
                stroke="#A0785A" stroke-width="2" />

            <!-- Substrate details (Rocks) -->
            <g id="rocks">
                <!-- High Tide Rocks -->
                <path d="M 180 200 Q 200 180 220 205 Q 210 220 180 215 Z" fill="#777" />
                <path d="M 230 220 Q 250 200 270 230 Q 240 240 230 220 Z" fill="#666" />
                
                <!-- Mid Tide Rocks -->
                <path d="M 450 310 Q 480 290 510 325 Q 490 340 450 325 Z" fill="#555" />
                <path d="M 520 335 Q 540 315 570 345 Q 550 360 520 345 Z" fill="#444" />
                <path d="M 480 340 Q 500 320 520 345 Q 500 360 480 350 Z" fill="#555" />

                <!-- Low Tide Rocks -->
                <path d="M 720 410 Q 750 390 780 420 Q 760 440 720 425 Z" fill="#333" />
                <path d="M 800 435 Q 830 415 860 445 Q 840 460 800 450 Z" fill="#222" />
            </g>

            <g id="organisms">
                <!-- Splash Zone (Barnacles, Snails - static) -->
                <circle cx="160" cy="180" r="2" fill="#DDD" />
                <circle cx="165" cy="178" r="1.5" fill="#CCC" />
                <circle cx="170" cy="183" r="2" fill="#DDD" />
                <!-- Small snail -->
                <ellipse cx="140" cy="175" rx="4" ry="3" fill="#8B4513" transform="rotate(-20 140 175)" />

                <!-- Mid Tide Zone (Anemones, Crabs - mostly static but reveal at low tide) -->
                <!-- Anemone -->
                <g id="anemone1" transform="translate(470, 315)">
                    <path d="M -10 5 L 10 5 L 5 15 L -5 15 Z" fill="#C71585" />
                    <!-- Tentacles -->
                    <path d="M -8 5 Q -15 -5 -8 -10" fill="none" stroke="#FF69B4" stroke-width="1.5" />
                    <path d="M -4 5 Q -5 -8 0 -12" fill="none" stroke="#FF69B4" stroke-width="1.5" />
                    <path d="M 0 5 Q 5 -8 8 -10" fill="none" stroke="#FF69B4" stroke-width="1.5" />
                    <path d="M 4 5 Q 12 -5 12 -8" fill="none" stroke="#FF69B4" stroke-width="1.5" />
                </g>
                
                <!-- Seaweed / Kelp attached to rocks -->
                <path d="M 540 330 Q 550 300 560 320 Q 570 290 580 310" fill="none" stroke="#228B22" stroke-width="4" stroke-linecap="round" />
                <path d="M 750 410 Q 760 350 780 390 Q 790 340 810 380 Q 820 330 840 370" fill="none" stroke="#006400" stroke-width="5" stroke-linecap="round" />
                
                <!-- Starfish in low tide zone -->
                <g id="starfish" transform="translate(760, 430) scale(0.6)">
                    <path d="M 0 -20 L 5 -5 L 20 -5 L 8 5 L 12 20 L 0 10 L -12 20 L -8 5 L -20 -5 L -5 -5 Z" fill="#FF8C00" />
                </g>
            </g>

            <!-- Group for water so we can translate it based on tide level -->
            <g id="waterGroup" class="water-layer">
                <!-- Water shape. We will animate its 'd' attribute via JS instead of translating the group -->
                <path id="waterBody" d="
                    M -200 480 
                    L 1200 480 
                    L 1200 600 
                    L -200 600 Z" 
                    fill="url(#waterGrad)" />
                
                <!-- Surface waves -->
                <path id="waveSurface" d="" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="3"></path>

                <!-- Fish Group 1 -->
                <g id="fish1" transform="translate(400, 500)">
                    <!-- Body -->
                    <ellipse cx="0" cy="0" rx="15" ry="8" fill="#FF4500" />
                    <!-- Tail -->
                    <path d="M 12 0 L 25 -10 L 22 0 L 25 10 Z" fill="#FF4500" />
                    <!-- Eye -->
                    <circle cx="-8" cy="-2" r="1.5" fill="black" />
                    <circle cx="-8" cy="-2" r="0.5" fill="white" />
                    <!-- Fin -->
                    <path d="M -5 -8 Q 0 -15 5 -8 Z" fill="#FFA500" />
                </g>

                <!-- Fish Group 2 (Smaller) -->
                <g id="fish2" transform="translate(600, 520) scale(0.7)">
                    <ellipse cx="0" cy="0" rx="15" ry="7" fill="#00CED1" />
                    <path d="M 12 0 L 22 -8 L 20 0 L 22 8 Z" fill="#00CED1" />
                    <circle cx="-8" cy="-2" r="1.5" fill="black" />
                </g>
                
                <!-- Fish Group 3 -->
                <g id="fish3" transform="translate(800, 490) scale(0.8)">
                    <ellipse cx="0" cy="0" rx="18" ry="9" fill="#FFD700" />
                    <path d="M 15 0 L 28 -12 L 25 0 L 28 12 Z" fill="#FFD700" />
                    <circle cx="-10" cy="-2" r="2" fill="black" />
                </g>

                <!-- Crab (moves on the bottom) -->
                 <g id="crab" transform="translate(600, 550) scale(0.6)">
                    <!-- Body -->
                    <ellipse cx="0" cy="0" rx="20" ry="12" fill="#DC143C" />
                    <!-- Legs left -->
                    <path d="M -15 5 Q -25 0 -30 15" fill="none" stroke="#DC143C" stroke-width="3" />
                    <path d="M -10 10 Q -15 20 -20 25" fill="none" stroke="#DC143C" stroke-width="3" />
                    <!-- Legs right -->
                    <path d="M 15 5 Q 25 0 30 15" fill="none" stroke="#DC143C" stroke-width="3" />
                    <path d="M 10 10 Q 15 20 20 25" fill="none" stroke="#DC143C" stroke-width="3" />
                    <!-- Claws -->
                    <path d="M -15 -5 Q -25 -15 -35 -5" fill="none" stroke="#DC143C" stroke-width="4" />
                    <circle cx="-35" cy="-5" r="5" fill="#DC143C" />
                    <path d="M 15 -5 Q 25 -15 35 -5" fill="none" stroke="#DC143C" stroke-width="4" />
                    <circle cx="35" cy="-5" r="5" fill="#DC143C" />
                    <!-- Eyes -->
                    <line x1="-5" y1="-10" x2="-8" y2="-18" stroke="#DC143C" stroke-width="2" />
                    <circle cx="-8" cy="-18" r="2" fill="black" />
                    <line x1="5" y1="-10" x2="8" y2="-18" stroke="#DC143C" stroke-width="2" />
                    <circle cx="8" cy="-18" r="2" fill="black" />
                </g>
            </g>

            <!-- Grid/Markers to show zones -->
            <g id="markers" opacity="0.5" font-size="12" fill="#333" font-family="sans-serif">
                <!-- Highest High Tide Line -->
                <line x1="0" y1="180" x2="1000" y2="180" stroke="#f00" stroke-dasharray="5,5" stroke-width="1" />
                <text x="10" y="175" fill="#d00">高潮线 (High Tide Line)</text>
                
                <!-- Lowest Low Tide Line -->
                <line x1="0" y1="480" x2="1000" y2="480" stroke="#00f" stroke-dasharray="5,5" stroke-width="1" />
                <text x="10" y="475" fill="#00a">低潮线 (Low Tide Line)</text>
            </g>

        </svg>
    </div>

    <div class="controls">
        <div class="control-group">
            <div class="control-header">
                <label for="tideSlider">潮汐水位 (Tide Level)</label>
                <span id="tideValue">退潮 (Low Tide)</span>
            </div>
            <!-- Slider range 0 (Lowest) to 100 (Highest) -->
            <input type="range" id="tideSlider" min="0" max="100" value="0">
        </div>

        <div class="info-panel" id="zoneInfo">
            <span class="zone-highlight">潮下带 (Subtidal Zone):</span> 一直被海水淹没。鱼类和螃蟹在这里活动。<br>调节滑块观察潮水上涨时，海洋生物如何进入更高的区域觅食。
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const slider = document.getElementById('tideSlider');
        const waterGroup = document.getElementById('waterGroup');
        const tideValueDisplay = document.getElementById('tideValue');
        const zoneInfo = document.getElementById('zoneInfo');
        const waveSurface = document.getElementById('waveSurface');

        // References to organisms
        const fish1 = document.getElementById('fish1');
        const fish2 = document.getElementById('fish2');
        const fish3 = document.getElementById('fish3');
        const crab = document.getElementById('crab');

        // Constants for water positioning
        // Base Y of water is 480 in SVG (Lowest tide).
        // Highest tide brings water to Y = 180.
        const LOW_TIDE_Y = 480; 
        const HIGH_TIDE_Y = 180; 

        // Info texts for different zones
        const infos = {
            low: '<span class="zone-highlight">低潮带 (Low Tide Zone):</span> 仅在最低潮时暴露。海星和海带在这里生长。鱼类退回深水区。',
            mid: '<span class="zone-highlight">中潮带 (Mid Tide Zone):</span> 每天两次被海水淹没和暴露。这里生活着海葵和藤壶。',
            high: '<span class="zone-highlight">高潮带 (High Tide Zone):</span> 仅在高潮时被海水覆盖。少数适应力强的生物如玉黍螺在此生存。',
            splash: '<span class="zone-highlight">飞溅带 (Splash Zone):</span> 极少被淹没，主要受海浪飞溅影响。'
        };

        // Animation state variables
        let animationTime = 0;
        let currentTidePercent = 0;
        let reqAnimFrame;

        // Fish objects to track their logic
        const fishes = [
            { el: fish1, x: 400, baseCy: 500, speed: 1.2, direction: -1, minX: 100, maxX: 1200, isActive: true },
            { el: fish2, x: 600, baseCy: 530, speed: 1.8, direction: 1, minX: 100, maxX: 1200, isActive: true },
            { el: fish3, x: 800, baseCy: 510, speed: 0.9, direction: -1, minX: 100, maxX: 1200, isActive: true }
        ];

        const crabObj = { el: crab, x: 600, speed: 0.5, direction: -1, minX: 300, maxX: 900 };
        
        let currentWaterLevelY = LOW_TIDE_Y;

        function updateTide() {
            const percent = parseInt(slider.value, 10);
            currentTidePercent = percent;
            
            // Calculate current water level Y
            currentWaterLevelY = LOW_TIDE_Y - (percent / 100) * (LOW_TIDE_Y - HIGH_TIDE_Y);
            
            // Update water body shape to stretch from current level down to 600
            const waterBody = document.getElementById('waterBody');
            waterBody.setAttribute('d', `
                M -200 ${currentWaterLevelY} 
                L 1200 ${currentWaterLevelY} 
                L 1200 600 
                L -200 600 Z
            `);

            // Update UI text based on percent
            if (percent < 20) {
                tideValueDisplay.textContent = '低潮 (Low Tide)';
                zoneInfo.innerHTML = infos.low;
            } else if (percent < 60) {
                tideValueDisplay.textContent = '中潮 (Mid Tide)';
                zoneInfo.innerHTML = infos.mid;
            } else if (percent < 90) {
                tideValueDisplay.textContent = '高潮 (High Tide)';
                zoneInfo.innerHTML = infos.high;
            } else {
                tideValueDisplay.textContent = '最高潮 (Highest Tide)';
                zoneInfo.innerHTML = infos.splash;
            }

            // Update fish boundaries based on tide.
            // As tide goes up, fish can swim further left (up the shore).
            // Land profile approximate x limits at surface water level:
            // Y=480 (p=0): x ~ 950
            // Y=330 (p=50): x ~ 500
            // Y=180 (p=100): x ~ 100
            
            const shoreX = 950 - (percent / 100) * 850; 
            
            fishes.forEach(f => {
                // Buffer to keep fish entirely underwater
                f.minX = shoreX + 30; 
                
                // If a fish gets stranded (slider moved down fast), push it back to sea
                if (f.x < f.minX) {
                    f.x = f.minX + 20;
                }
            });

            // Crab moves along the bottom, needs special path logic
            // Approximate land curve X based on tide for crab limits
            crabObj.minX = shoreX + 50;
            if(crabObj.x < crabObj.minX) crabObj.x = crabObj.minX;
        }

        // Initialize tide
        updateTide();

        // Listen for slider changes
        slider.addEventListener('input', updateTide);

        function animate() {
            animationTime += 0.05;

            // 1. Animate wave surface (sine wave effect) at the current water level
            let wavePath = `M -200 ${currentWaterLevelY} `;
            for(let i = -100; i <= 1200; i += 100) {
                const offset = Math.sin(animationTime + (i/100)) * 8;
                if(i === -100) {
                    wavePath += `Q ${i} ${currentWaterLevelY + offset}, ${i+100} ${currentWaterLevelY} `;
                } else if (i % 200 === 0) {
                    wavePath += `T ${i} ${currentWaterLevelY} `;
                }
            }
            waveSurface.setAttribute('d', wavePath);

            // 2. Animate Fishes
            fishes.forEach(f => {
                // Move horizontal
                f.x += f.speed * f.direction;
                
                // Reverse direction if hitting limits
                if (f.x > f.maxX) {
                    f.direction = -1;
                } else if (f.x < f.minX) {
                    f.direction = 1;
                }

                // Bobbing up and down
                const yOffset = Math.sin(animationTime * 2 + f.x/50) * 5;
                
                // Rotation based on direction
                const scaleX = f.direction === 1 ? -1 : 1;
                
                // Apply transform
                // Note: the waterGroup translates Y, so fish inside just need local coords
                f.el.setAttribute('transform', `translate(${f.x}, ${f.baseCy + yOffset}) scale(${scaleX}, 1)`);
            });

            // 3. Animate Crab along the bottom
            crabObj.x += crabObj.speed * crabObj.direction;
            if (crabObj.x > crabObj.maxX) {
                crabObj.direction = -1;
            } else if (crabObj.x < crabObj.minX) {
                crabObj.direction = 1;
            }

            // Calculate approximate Y on the seabed based on X
            // Using a rough mapping of the land path
            let crabY = 550; // default flat bottom
            if (crabObj.x < 1000 && crabObj.x > 750) {
                crabY = 490 - (crabObj.x - 750) * (10/250); // slight slope
            } else if (crabObj.x <= 750 && crabObj.x > 450) {
                crabY = 420 + (crabObj.x - 450) * (70/300);
            } else if (crabObj.x <= 450 && crabObj.x > 200) {
                crabY = 320 + (crabObj.x - 200) * (100/250);
            } else if (crabObj.x <= 200) {
                crabY = 200 + crabObj.x * (120/200);
            }
            
            // Little hop animation
            const crabHop = Math.abs(Math.sin(animationTime * 4)) * 3;

            crabObj.el.setAttribute('transform', `translate(${crabObj.x}, ${crabY - crabHop}) scale(0.6)`);

            reqAnimFrame = requestAnimationFrame(animate);
        }

        // Start animation loop
        animate();
    });
</script>
</body>
</html>
