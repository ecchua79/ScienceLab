<!DOCTYPE html>
<html lang="zh-CN">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>气体星球挑战赛 · 峇株吧辖华仁中学</title>
<style>

:root {
<!-- 峇株吧辖华仁中学蔡逸众制作 -->
  --bg: #080616;
  --surface: rgba(255,255,255,0.055);
  --surface2: rgba(255,255,255,0.10);
  --border: rgba(255,255,255,0.10);
  --border2: rgba(255,255,255,0.20);
  --text: #eef0ff;
  --muted: rgba(238,240,255,0.50);
  --blue: #5bc8fa;
  --green: #5ef5b0;
  --red: #ff5c5c;
  --yellow: #ffd84d;
  --purple: #d4a8ff;
  --gold: #f7c948;
  --r: 18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Segoe UI',system-ui,sans-serif;
  background:#080616;
  min-height:100vh;
  display:flex;flex-direction:column;
  align-items:center;
  color:var(--text);
  overflow-x:hidden;
}

/* ── Nebula background ── */
#nebula{
  position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 70% 55% at 20% 30%, rgba(60,20,120,0.55) 0%, transparent 70%),
    radial-gradient(ellipse 60% 50% at 80% 70%, rgba(10,50,110,0.50) 0%, transparent 70%),
    radial-gradient(ellipse 50% 40% at 55% 15%, rgba(100,20,80,0.35) 0%, transparent 65%),
    #080616;
}
.stars{position:fixed;inset:0;pointer-events:none;z-index:1}
.star{position:absolute;background:#fff;border-radius:50%;animation:twinkle linear infinite}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.9}}

/* ── Layout shell ── */
#wrap{
  position:relative;z-index:2;
  width:100%;max-width:680px;
  padding:32px 20px 90px;
  flex:1;
}

/* ── Screens ── */
.screen{animation:fadeUp .45s cubic-bezier(.22,1,.36,1) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.hidden{display:none!important}

/* ── Card ── */
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--r);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}

/* ── Buttons ── */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  cursor:pointer;border:none;outline:none;
  font-family:inherit;font-weight:700;letter-spacing:.3px;
  border-radius:50px;padding:13px 30px;font-size:.95rem;
  transition:transform .15s,box-shadow .15s,background .15s;
  text-decoration:none;
}
.btn-primary{
  background:linear-gradient(130deg,#5bc8fa,#1a6fd4);
  color:#fff;box-shadow:0 4px 22px rgba(91,200,250,.30);
}
.btn-danger{background:rgba(255,92,92,.18);color:var(--red);border:1px solid rgba(255,92,92,.35)}
.btn-ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border2)}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(91,200,250,.35)}
.btn:active{transform:scale(.97)}

/* ════════════════════════════
   START SCREEN
════════════════════════════ */
#start-screen{text-align:center;padding:10px 0}
.start-glow{
  display:inline-block;font-size:86px;margin-bottom:18px;
  animation:float 3.5s ease-in-out infinite;filter:drop-shadow(0 0 28px rgba(91,200,250,.5));
}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
#start-screen h1{
/* 峇株吧辖蔡逸众制作 */
  font-size:clamp(1.7rem,5vw,2.4rem);font-weight:900;letter-spacing:-.5px;
  background:linear-gradient(120deg,var(--blue),var(--purple));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  margin-bottom:8px;
}
.start-sub{color:var(--muted);font-size:.95rem;margin-bottom:28px;line-height:1.6}

.rules-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:12px;
  margin-bottom:32px;text-align:left;
}
.rule-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);padding:14px 16px;
}
.rule-card .rc-icon{font-size:1.4rem;margin-bottom:6px;display:block}
.rule-card .rc-title{font-size:.88rem;font-weight:700;color:var(--text);margin-bottom:3px}
.rule-card .rc-desc{font-size:.78rem;color:var(--muted);line-height:1.4}

/* cover watermark */
.cover-wm{
  font-size:10px;color:rgba(238,240,255,0.07);
  margin-top:28px;letter-spacing:.5px;user-select:none;pointer-events:none;
}

/* ════════════════════════════
   GAME SCREEN
════════════════════════════ */
/* Status bar */
.status-bar{
  display:grid;grid-template-columns:1fr auto 1fr;
  align-items:center;gap:8px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);padding:11px 18px;
  font-weight:700;font-size:.9rem;margin-bottom:14px;
}
.sb-lives{color:var(--red);display:flex;align-items:center;gap:5px}
.sb-timer{color:var(--blue);text-align:center;font-size:.85rem}
.sb-score{color:var(--yellow);text-align:right;display:flex;align-items:center;gap:5px;justify-content:flex-end}

/* Combo */
#combo-badge{
  text-align:center;height:30px;line-height:30px;
  font-weight:800;font-size:.92rem;color:var(--yellow);
  transition:all .25s;letter-spacing:.3px;
}
.combo-pop{animation:comboPop .38s cubic-bezier(.22,1,.36,1)}
@keyframes comboPop{0%{transform:scale(.6)}65%{transform:scale(1.22)}100%{transform:scale(1)}}

/* Progress */
.progress-wrap{
  background:rgba(255,255,255,.07);border-radius:50px;
  height:5px;margin-bottom:16px;overflow:hidden;
}
#progress-bar{
  height:100%;background:linear-gradient(90deg,var(--blue),var(--purple));
  border-radius:50px;transition:width .45s ease;
}

/* Level badge */
#level-badge{
  display:inline-block;
  background:linear-gradient(130deg,rgba(212,168,255,.25),rgba(91,200,250,.20));
  border:1px solid rgba(212,168,255,.35);
  color:var(--purple);font-size:.72rem;font-weight:800;
  border-radius:50px;padding:3px 14px;margin-bottom:12px;letter-spacing:.5px;
  text-transform:uppercase;
}

/* Question text */
.question-text{
  font-size:1.1rem;font-weight:700;line-height:1.6;
  margin-bottom:18px;min-height:54px;color:var(--text);
}

/* Options */
.options-grid{display:grid;gap:9px}
.opt{
  background:var(--surface);border:1.5px solid var(--border);
  border-radius:14px;padding:13px 16px;
  cursor:pointer;text-align:left;font-family:inherit;
  font-size:.92rem;font-weight:600;color:var(--text);
  transition:background .14s,border-color .14s,transform .1s;
  display:flex;align-items:center;gap:11px;
}
.opt:hover:not(.disabled){
  background:var(--surface2);border-color:var(--blue);
  transform:translateX(5px);
}
.opt.correct{background:rgba(94,245,176,.14)!important;border-color:var(--green)!important;color:var(--green)!important}
.opt.wrong{background:rgba(255,92,92,.14)!important;border-color:var(--red)!important;color:var(--red)!important}
.opt.disabled{cursor:not-allowed}
.opt-lbl{
  min-width:27px;height:27px;border-radius:50%;
  background:var(--surface2);border:1px solid var(--border2);
  display:flex;align-items:center;justify-content:center;
  font-size:.78rem;font-weight:800;flex-shrink:0;
}

/* Feedback */
/* 华仁中学蔡逸众制作 */
#feedback{
  margin-top:12px;padding:11px 15px;border-radius:13px;
  font-size:.84rem;line-height:1.55;
  border:1px solid transparent;opacity:0;
  transition:opacity .28s;min-height:48px;
}
#feedback.show{opacity:1}
#feedback.ok{background:rgba(94,245,176,.10);border-color:rgba(94,245,176,.4);color:var(--green)}
#feedback.err{background:rgba(255,92,92,.10);border-color:rgba(255,92,92,.4);color:#ff9090}

/* Score popup */
.score-popup{
  position:fixed;font-size:1.4rem;font-weight:900;
  color:var(--yellow);pointer-events:none;z-index:999;
  animation:scoreFloat 1.2s ease forwards;
}
@keyframes scoreFloat{
  0%{opacity:1;transform:translateY(0) scale(1)}
  100%{opacity:0;transform:translateY(-75px) scale(1.3)}
}

/* ════════════════════════════
   RESULT SCREEN
════════════════════════════ */
#result-screen{text-align:center}
.result-icon{font-size:68px;margin-bottom:10px;display:block}
#result-screen h1{font-size:1.8rem;font-weight:900;margin-bottom:6px}
.result-sub{color:var(--muted);margin-bottom:22px;font-size:.92rem}

.stats-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 22px;
}
.stat-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);padding:16px 8px;
}
.stat-val{font-size:1.55rem;font-weight:900}
.stat-lbl{font-size:.72rem;color:var(--muted);margin-top:3px}

.achievements{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:22px}
.ach-badge{
  background:linear-gradient(135deg,var(--yellow),#ff9a00);
  color:#2d1500;font-size:.76rem;font-weight:800;
  border-radius:50px;padding:5px 15px;
}

.name-form{margin-bottom:14px}
.name-form input{
  width:100%;padding:13px 16px;border-radius:13px;
  border:1.5px solid var(--border2);background:var(--surface);
  color:var(--text);font-family:inherit;font-size:.92rem;
  outline:none;transition:border-color .2s;margin-bottom:12px;
}
.name-form input:focus{border-color:var(--blue)}
.name-form input::placeholder{color:var(--muted)}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* ════════════════════════════
   CERT SCREEN
════════════════════════════ */

#cert-screen{text-align:center;padding:0}
#cert-canvas{
  border-radius:14px;max-width:100%;
  box-shadow:0 12px 48px rgba(0,0,0,.7);
}

/* ════════════════════════════
   FOOTER
════════════════════════════ */

#footer{
  position:fixed;bottom:0;left:0;right:0;z-index:10;
  background:rgba(8,6,22,.88);
  border-top:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  padding:9px 20px;
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;flex-wrap:wrap;
}
.footer-left{font-size:.76rem;color:rgba(238,240,255,.45);letter-spacing:.3px}
.footer-right{font-size:.73rem;color:rgba(238,240,255,.30);letter-spacing:.2px;text-align:right}
.footer-dot{color:rgba(91,200,250,.4);margin:0 5px}

/* ── Responsive ── */
@media(max-width:420px){
  #wrap{padding:20px 14px 88px}
  .rules-grid{grid-template-columns:1fr 1fr}
  #start-screen h1{font-size:1.5rem}
  .stat-val{font-size:1.25rem}
}

</style>
</head>
<body>
<div id="nebula"></div>
<div class="stars" id="stars"></div>

<div id="wrap">

<!-- ══ START ══ -->
<div id="start-screen" class="screen">
  <span class="start-glow">🌬️</span>
  <h1>气体星球挑战赛</h1>
  <p class="start-sub">初二科学 · 第七章 · 气体知识大闯关<br>三关十五题，挑战你的极限！</p>
  <div class="rules-grid">
    <div class="rule-card">
      <span class="rc-icon">❤️</span>
      <div class="rc-title">3条命</div>
      <div class="rc-desc">答错扣一命，用完则失败</div>
    </div>
    <div class="rule-card">
      <span class="rc-icon">⭐</span>
      <div class="rc-title">速度计分</div>
      <div class="rc-desc">答得越快，速度奖励越高</div>
    </div>
    <div class="rule-card">
      <span class="rc-icon">🔥</span>
      <div class="rc-title">连击加成</div>
      <div class="rc-desc">连续答对解锁额外奖励分</div>
    </div>
    <div class="rule-card">
      <span class="rc-icon">📈</span>
      <div class="rc-title">三关闯关</div>
      <div class="rc-desc">难度逐渐提升，越来越烧脑</div>
    </div>
  </div>
  <button class="btn btn-primary" onclick="startGame()">🚀 开始挑战</button>
  <p class="cover-wm">峇株吧辖华仁中学 · 蔡逸众制作</p>
  <p class="cover-wm"> ·  · </p>
</div>

<!-- ══ GAME ══ -->
<div id="game-screen" class="screen hidden">
  <div class="status-bar">
    <div class="sb-lives">❤️ <span id="lives-count">3</span></div>
    <div class="sb-timer">⏱️ <span id="timer-val">0</span>s</div>
    <div class="sb-score">⭐ <span id="score-count">0</span></div>
  </div>
  <div id="combo-badge"></div>
  <div class="progress-wrap"><div id="progress-bar" style="width:0%"></div></div>
  <div id="level-badge">Level 1 · 基础关</div>
  <div class="question-text" id="question-text">加载中…</div>
  <div class="options-grid" id="options-grid"></div>
  <div id="feedback"></div>
</div>

<!-- ══ RESULT ══ -->
<div id="result-screen" class="screen hidden">
  <span class="result-icon" id="result-icon">🎉</span>
  <h1 id="result-title">挑战完成！</h1>
  <p class="result-sub" id="result-sub"></p>
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-val" id="st-score" style="color:var(--yellow)">0</div>
      <div class="stat-lbl">总分</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="st-time" style="color:var(--blue)">0s</div>
      <div class="stat-lbl">用时</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="st-acc" style="color:var(--green)">0%</div>
      <div class="stat-lbl">正确率</div>
    </div>
  </div>
  <div class="achievements" id="achievements"></div>
  <div class="name-form" id="cert-form">
    <input type="text" id="student-name" maxlength="20" placeholder="✏️ 输入姓名以领取证书…">
    <div class="btn-row">
      <button class="btn btn-primary" onclick="generateCert()">🏆 生成证书</button>
      <button class="btn btn-ghost" onclick="location.reload()">🔁 再战一次</button>
    </div>
  </div>
  <div id="fail-btns" class="btn-row hidden" style="margin-top:16px">
    <button class="btn btn-primary" onclick="location.reload()">🔁 再战一次</button>
  </div>
</div>

<!-- ══ CERT ══ -->

<div id="cert-screen" class="screen hidden" style="text-align:center">
  <canvas id="cert-canvas"></canvas>
  <div class="btn-row" style="margin-top:18px">
    <button class="btn btn-primary" onclick="downloadCert()">⬇️ 下载证书</button>
    <button class="btn btn-ghost" onclick="location.reload()">🏠 回首页</button>
  </div>
</div>

</div><!-- /#wrap -->

<!-- ══ FOOTER ══ -->

<div id="footer">
  <div class="footer-left">
     峇株吧辖华仁中学<span class="footer-dot">·</span>初二科学第七章
  </div>
  <div class="footer-right">
    蔡逸众 制作<span class="footer-dot">·</span>
  </div>
</div>

<script>


/* ════ STARFIELD ════ */
(function(){
  const s=document.getElementById('stars');
  for(let i=0;i<90;i++){
    const d=document.createElement('div'),sz=Math.random()*2.2+.4;
    d.className='star';
    d.style.cssText=`width:${sz}px;height:${sz}px;top:${Math.random()*100}%;left:${Math.random()*100}%;animation-duration:${2.5+Math.random()*4.5}s;animation-delay:${Math.random()*5}s`;
    s.appendChild(d);
  }
})();

/* ════ DATA ════ */

const LEVELS=[
  {label:'Level 1 · 基础关',timeLimit:20},
  {label:'Level 2 · 进阶关',timeLimit:15},
  {label:'Level 3 · 终极关',timeLimit:10},
];

const ALL_Q=[
/* ─── Level 1: 基础关（5题）─── */
{lv:1,
 q:'在标准状况下，以下哪项正确描述了氧气和空气的密度关系？',
 opts:[
   '氧气密度比空气略小，约为空气的95%',
   '氧气密度与空气几乎相同，差异可以忽略',
   '氧气密度比空气略大，约为1.43 kg/m³',
   '氧气密度是空气的两倍以上'
 ],
 ans:'氧气密度比空气略大，约为1.43 kg/m³',
 hint:'正是这个密度特点，决定了实验室收集氧气时选择的排气方向。',
 explain:'✅ 氧气≈1.43 kg/m³，空气≈1.29 kg/m³，氧气略重，所以用「向上排空气法」收集——重气体沉在瓶底。'},

{lv:1,
 q:'空气的成分中，体积占比最高的气体是哪一种？',
 opts:[
   '氧气，约占60%，维持生命活动',
   '氮气，约占78%，性质稳定',
   '二氧化碳，约占21%，参与光合作用',
   '稀有气体，约占50%，用于制造霓虹灯'
 ],
 ans:'氮气，约占78%，性质稳定',
 hint:'记住口诀「七八氮、二一氧」，剩余的才是其他气体。',
 explain:'✅ 氮气占78%，氧气占21%，CO₂只有约0.04%，稀有气体约0.93%。'},

{lv:1,
 q:'将二氧化碳气体通入澄清石灰水，最明显的实验现象是？',
 opts:[
   '石灰水由无色变为蓝色',
   '石灰水由澄清变浑浊，出现白色沉淀',
   '石灰水颜色不变，但产生大量气泡',
   '石灰水迅速蒸发，液体减少'
 ],
 ans:'石灰水由澄清变浑浊，出现白色沉淀',
 hint:'反应生成了一种白色的不溶性固体，让原本透明的液体变得不透明。',
 explain:'✅ CO₂ + Ca(OH)₂ → CaCO₃↓ + H₂O，碳酸钙是白色沉淀，这是检验CO₂的标准方法。'},

{lv:1,
 q:'将带余烬（有红点但无明火）的木条伸入集气瓶，木条重新燃烧，可以推断瓶内气体是？',
 opts:[
   '氮气——因为氮气不支持燃烧，木条容易复燃',
   '氧气——因为氧气具有助燃性，能使余烬复燃',
   '二氧化碳——因为CO₂密度大，能让木条燃烧更旺',
   '氢气——因为氢气本身可燃，会引燃木条'
 ],
 ans:'氧气——因为氧气具有助燃性，能使余烬复燃',
 hint:'注意区分「助燃」和「可燃」，这道题考查的是哪一种性质。',
 explain:'✅ 氧气助燃，能使带火星木条复燃。这是鉴别氧气的经典操作，氮气和CO₂都不能做到。'},

{lv:1,
 q:'纯净的氢气在空气中燃烧时，火焰呈现什么颜色？',
 opts:[
   '明亮的橙黄色，与蜡烛相似',
   '耀眼的白色，亮度极高',
   '淡蓝色，较为柔和',
   '紫红色，颇为鲜艳'
 ],
 ans:'淡蓝色，较为柔和',
 hint:'酒精灯的火焰也是这个颜色系，都属于含氢燃料的燃烧特征。',
 explain:'✅ 纯净氢气燃烧发出淡蓝色火焰，且产物只有水（H₂+O₂→H₂O），非常清洁环保。'},

/* ─── Level 2: 进阶关（5题）─── */
{lv:2,
 q:'关于催化剂（如MnO₂）的说法，下列哪一项最准确？',
 opts:[
   '催化剂在反应中被缓慢消耗，用量越多效果越好',
   '催化剂能加快反应速率，且反应前后质量和化学性质均不变',
   '没有催化剂，任何化学反应都无法进行',
   '催化剂会改变生成物的种类，让反应更彻底'
 ],

/* ════ STATE ════ */
let questions=[],idx=0,score=0,lives=3,combo=0,timer=0;
let timerInterval,qStart;
let totalAnswered=0,totalCorrect=0,maxCombo=0;

/* ════ UTILS ════ */
function shuffle(a){
  const b=[...a];
  for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}
  return b;
}
const $=id=>document.getElementById(id);
function showScreen(id){
  ['start-screen','game-screen','result-screen','cert-screen'].forEach(s=>{
    const el=$(s);if(el){el.classList.add('hidden');el.style.display='';}
  });
  const t=$(id);
  if(t){t.classList.remove('hidden');void t.offsetWidth;}
}

/* ════ GAME ════ */

function startGame(){
  const l1=shuffle(ALL_Q.filter(q=>q.lv===1));
  const l2=shuffle(ALL_Q.filter(q=>q.lv===2));
  const l3=shuffle(ALL_Q.filter(q=>q.lv===3));
  questions=[...l1,...l2,...l3];
  idx=0;score=0;lives=3;combo=0;timer=0;totalAnswered=0;totalCorrect=0;maxCombo=0;
  showScreen('game-screen');
  if(timerInterval)clearInterval(timerInterval);
  timerInterval=setInterval(()=>{timer++;$('timer-val').textContent=timer;},1000);
  showQuestion();
}

function getLvInfo(i){return i<5?LEVELS[0]:i<10?LEVELS[1]:LEVELS[2];}

function showQuestion(){
  if(idx>=questions.length){endGame(true);return;}
  const q=questions[idx],info=getLvInfo(idx),total=questions.length;
  $('level-badge').textContent=info.label;
  $('progress-bar').style.width=`${(idx/total)*100}%`;
  $('question-text').textContent=`Q${idx+1}. ${q.q}`;
<!-- Made by ecchua79 -->
  $('lives-count').textContent=lives;
  $('score-count').textContent=score;
  const grid=$('options-grid');
  grid.innerHTML='';
  const labels=['A','B','C','D'];
  shuffle(q.opts).forEach((opt,i)=>{
    const div=document.createElement('div');
    div.className='opt';
    div.innerHTML=`<span class="opt-lbl">${labels[i]}</span>${opt}`;
    div.onclick=()=>checkAnswer(opt,div,q);
    grid.appendChild(div);
  });
  const fb=$('feedback');fb.className='';fb.textContent='';
  qStart=Date.now();
}

function checkAnswer(sel,el,q){
  document.querySelectorAll('.opt').forEach(o=>{o.classList.add('disabled');o.onclick=null;});
  const elapsed=(Date.now()-qStart)/1000;
  const info=getLvInfo(idx);
  totalAnswered++;
  if(sel===q.ans){
    el.classList.add('correct');
    totalCorrect++;combo++;
    if(combo>maxCombo)maxCombo=combo;
    const spd=Math.max(0,Math.round((info.timeLimit-elapsed)*0.5));
    const cb=combo>=5?5:combo>=3?3:0;
    const gained=10+spd+cb;
    score+=gained;
    $('score-count').textContent=score;
    updateCombo();
    showScorePopup(`+${gained}`,el);
    showFeedback(true,q.explain);
  } else {
    el.classList.add('wrong');
    document.querySelectorAll('.opt').forEach(o=>{if(o.textContent.includes(q.ans))o.classList.add('correct');});
    lives--;combo=0;
    updateCombo();
    $('lives-count').textContent=lives;
    showFeedback(false,q.hint);
    if(lives<=0){setTimeout(()=>endGame(false),2300);return;}
  }
  idx++;
  setTimeout(showQuestion,2500);
}

function updateCombo(){
  const el=$('combo-badge');
  if(combo>=2){
    el.textContent=`🔥 ${combo}连击！${combo>=5?'超级':''}加成 +${combo>=5?5:combo>=3?3:0}分`;
    el.classList.remove('combo-pop');void el.offsetWidth;el.classList.add('combo-pop');
  } else {el.textContent='';}
}
function showFeedback(ok,text){
  const el=$('feedback');
  el.className=ok?'show ok':'show err';
  el.textContent=text;
}
function showScorePopup(text,refEl){
  const rect=refEl.getBoundingClientRect();
/* 峇株吧辖华仁中学蔡逸众制作 */
  const pop=document.createElement('div');
  pop.className='score-popup';
  pop.style.left=`${rect.left+rect.width/2-30}px`;
  pop.style.top=`${rect.top+window.scrollY-10}px`;
  pop.textContent=text;
  document.body.appendChild(pop);
  setTimeout(()=>pop.remove(),1300);
}

function endGame(success){
  clearInterval(timerInterval);
  $('result-icon').textContent=success?'🎉':'💀';
  $('result-title').textContent=success?'太棒了！全部通关！':'挑战失败，别灰心！';
  $('result-sub').textContent=success
    ?'你征服了气体星球的三大关卡！'
    :`你已答到第 ${idx+1} 题，继续练习就能通关！`;
  $('st-score').textContent=score;
  $('st-time').textContent=timer+'s';
  const acc=totalAnswered?Math.round(totalCorrect/totalAnswered*100):0;
  $('st-acc').textContent=acc+'%';
  const ach=[];
  if(acc===100)ach.push('🏅 满分达人');
  if(timer<60)ach.push('⚡ 极速王');
  if(maxCombo>=5)ach.push('🔥 连击大师');
  if(score>=200)ach.push('👑 200分王者');
  if(lives===3)ach.push('🛡️ 不死之身');
  const achEl=$('achievements');
  achEl.innerHTML=ach.length
    ?ach.map(a=>`<span class="ach-badge">${a}</span>`).join('')
    :'<span style="color:var(--muted);font-size:.82rem">继续努力，下次解锁成就！</span>';
  if(success){
    $('cert-form').classList.remove('hidden');
    $('fail-btns').classList.add('hidden');
  } else {
    $('cert-form').classList.add('hidden');
    $('fail-btns').classList.remove('hidden');
  }
  showScreen('result-screen');
}

function generateCert(){
  const name=$('student-name').value.trim();
  if(!name){$('student-name').focus();$('student-name').placeholder='⚠️ 请先输入姓名！';return;}
  const acc=totalAnswered?Math.round(totalCorrect/totalAnswered*100):0;
  const now=new Date();
  const dateStr=`${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日`;
  const timeStr=`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  let praise='加油，再接再厉！Keep Going!';
  if(score>=180) praise='卓越表现！Outstanding Achievement!';
  else if(score>=130) praise='非常出色！Excellent Performance!';
  else if(score>=80)  praise='表现良好！Great Job!';

  /* Canvas: 480×680 竖版，2× 高清 */
  const CW=480,CH=680,SC=2;
  const cv=$('cert-canvas');
  cv.width=CW*SC;cv.height=CH*SC;
  cv.style.width=CW+'px';cv.style.height=CH+'px';
  const ctx=cv.getContext('2d');
  ctx.scale(SC,SC);

  /* ── 背景 ── */
  const bg=ctx.createLinearGradient(0,0,CW,CH);
  bg.addColorStop(0,'#080616');bg.addColorStop(.5,'#1a0f3a');bg.addColorStop(1,'#0c1529');
  ctx.fillStyle=bg;ctx.fillRect(0,0,CW,CH);

  /* ── 装饰性网格线（极淡） ── */
  ctx.strokeStyle='rgba(255,255,255,0.025)';ctx.lineWidth=.5;
  for(let x=0;x<CW;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,CH);ctx.stroke();}
  for(let y=0;y<CH;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(CW,y);ctx.stroke();}

  /* ── 星星 ── */
  ctx.fillStyle='rgba(255,255,255,.5)';
  for(let i=0;i<55;i++){
    const x=Math.random()*CW,y=Math.random()*CH,r=Math.random()*1.2+.3;
    ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
  }

  /* ── 顶部彩带 ── */
  const ribbon=ctx.createLinearGradient(0,0,CW,0);
  ribbon.addColorStop(0,'#5bc8fa');ribbon.addColorStop(.5,'#d4a8ff');ribbon.addColorStop(1,'#5ef5b0');
  ctx.fillStyle=ribbon;ctx.fillRect(0,0,CW,6);

  /* ── 底部彩带 ── */
  ctx.fillStyle=ribbon;ctx.fillRect(0,CH-6,CW,6);

  /* ── 外边框 ── */
  ctx.strokeStyle='rgba(91,200,250,.55)';ctx.lineWidth=2;
  rr(ctx,10,10,CW-20,CH-20,14);ctx.stroke();
  ctx.strokeStyle='rgba(212,168,255,.25)';ctx.lineWidth=1;
  rr(ctx,17,17,CW-34,CH-34,10);ctx.stroke();

  corner(ctx,18,18,1,1);corner(ctx,CW-18,18,-1,1);
  corner(ctx,18,CH-18,1,-1);corner(ctx,CW-18,CH-18,-1,-1);

  const cx=CW/2;

    ctx.fillText(lbl,bx+bw/2,by+54);
  });
  ctx.textAlign='center';
/* Made by ecchua79 */

  /* ── 成就勋章 ── */
  const ach=[];
  if(acc===100)ach.push('🏅满分达人');if(timer<60)ach.push('⚡极速王');
  if(maxCombo>=5)ach.push('🔥连击大师');if(score>=200)ach.push('👑200分王者');
  if(lives===3)ach.push('🛡不死之身');
  if(ach.length){
    ctx.font=`700 11px 'Segoe UI',sans-serif`;
    const total=ach.join('  ');
    ctx.fillStyle='rgba(247,201,72,.80)';
    ctx.fillText(total,cx,420);
  }

  /* ── 鼓励语 ── */
  ctx.font=`700 14px 'Segoe UI',sans-serif`;
  ctx.fillStyle='#d4a8ff';
  ctx.fillText(praise,cx,450);

  /* ── 分隔线3 ── */
  ctx.strokeStyle=sep;ctx.lineWidth=.6;
  ctx.beginPath();ctx.moveTo(60,468);ctx.lineTo(CW-60,468);ctx.stroke();

  /* ── 校名 + 日期 ── */
  ctx.font=`700 12px 'Segoe UI',sans-serif`;
  ctx.fillStyle='rgba(238,240,255,.55)';
  ctx.fillText('峇株吧辖华仁中学',cx,490);

  ctx.font=`400 11px 'Segoe UI',sans-serif`;
  ctx.fillStyle='rgba(238,240,255,.35)';
  ctx.fillText(`颁发日期：${dateStr}  ${timeStr}`,cx,512);
<!-- 峇株吧辖蔡逸众制作 -->

  /* ── 底部水印（极淡） ── */
  ctx.font=`400 9px 'Segoe UI',sans-serif`;
  ctx.fillStyle='rgba(238,240,255,.08)';
  ctx.fillText(' · ',cx,645);

  /* 显示证书界面 */
  $('result-screen').classList.add('hidden');
  const cs=$('cert-screen');
  cs.classList.remove('hidden');cs.style.display='';
}

function downloadCert(){
  const a=document.createElement('a');
  a.download='气体星球挑战赛证书.png';
  a.href=$('cert-canvas').toDataURL('image/png');
  a.click();
}

/* ── Canvas helpers ── */
function rr(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);
  ctx.closePath();
}
function corner(ctx,x,y,dx,dy){
  const L=20;
  ctx.strokeStyle='rgba(91,200,250,.65)';ctx.lineWidth=1.8;
  ctx.beginPath();ctx.moveTo(x,y+dy*L);ctx.lineTo(x,y);ctx.lineTo(x+dx*L,y);ctx.stroke();
}
