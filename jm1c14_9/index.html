{t:'mc',s:0,q:'长曝光拍摄夜空，会拍到圆弧形的星轨。这直接证明了地球的什么运动？',o:['地球自西向东自转','地球绕太阳公转','太阳绕地球旋转','地轴方向时刻剧烈变化'],e:'星轨是我们随地球转动时看到的「视运动」，就像坐在旋转木马上看外面的人在转圈。它证明地球自西向东自转。'},
{t:'mc',s:0,q:'北半球的夏季（6–8月），地球其实正运行到「远日点」附近。那么决定四季的根本原因是？',o:['地轴倾斜（约23.5°）导致太阳直射点变化','日地距离的远近','地球自转速度快慢','月球引力的拉扯'],e:'四季和远近无关！是地轴倾斜，使阳光直射北半球或南半球，就像把手电筒斜照或正照桌面，热量不同。'},
{t:'mc',s:0,q:'从北极上空往下俯瞰，地球的自转和公转方向分别是？',o:['自转和公转都是逆时针','自转顺时针，公转逆时针','自转逆时针，公转顺时针','自转和公转都是顺时针'],e:'从北极上空看，自转和公转都是逆时针（自西向东）。记口诀：「同向」！'},
{t:'mc',s:1,q:'我们在地球上永远只能看到月球的同一面，这是因为？',o:['月球自转周期等于公转周期（约27.3天）','月球完全不自转','月球背面没有阳光','地球引力让月球停止转动'],e:'月球自转一圈的时间正好等于绕地球一圈的时间，正面就一直「锁定」朝向地球。注意：月球是在自转的，只是步调一致！'},
{t:'mc',s:1,q:'农历初一的「新月」，日、月、地三者的位置关系是？',o:['月球在太阳和地球之间','地球在太阳和月球之间','太阳在月球和地球之间','月球与日地连线呈90°'],e:'新月时月球夹在中间，朝向地球的一面照不到阳光，所以夜里看不到月亮。'},
{t:'mc',s:1,q:'月球公转周期（恒星月）约27.3天，月相周期（朔望月）约29.5天。为什么后者更长？',o:['地球也在绕太阳公转，月球要多跑约2天才能重新对齐日地','月球自转速度不均匀','大气层遮挡了视线','月球轨道变大了'],e:'想象两个人在操场跑圈：你跑完一圈时，前面的人也向前挪了，你得再追一段。地球在前进，月球就要多花约2天。'},
{t:'sort',s:1,q:'农历一个月里，月相按先后顺序是？请依次点选卡片。',items:['新月','上弦月','满月','下弦月'],e:'顺序：新月（初一）→ 上弦月（初八）→ 满月（十五）→ 下弦月（廿三）。月亮的亮面先「长」大再「变」小。'},
{t:'mc',s:2,q:'每个月都有新月和满月，为什么日食、月食却不是每月都发生？',o:['月球轨道（白道）与地球轨道（黄道）有约5°夹角','月球太小遮不住太阳','太阳光强度会变化','地球自转太快'],e:'因为有约5°夹角，多数月份月球的影子会从地球上方或下方「擦过」。只有新月或满月刚好在两个轨道的交点附近，才会发生日月食。'},
{t:'mc',s:2,q:'月全食时月亮变成橙红色（血月），原因是？',o:['地球大气层折射了红光到月面','月球表面火山喷发','太阳光直接穿过地球','月亮反射火星的光'],e:'阳光穿过地球大气时，蓝光被散射掉，红光被折射进地球影子照亮月亮——就像日落时天空是红色的原理。'},
{t:'mc',s:2,q:'要看到「日全食」，观测者必须位于月球影子的哪个区域？',o:['本影区','半影区','影子之外','任何阴暗处'],e:'本影是最暗的中心区，阳光被完全挡住，能看到日全食；在半影区只能看到日偏食。'},
{t:'sim',s:2,q:'🎮 轨道实操：新月时，月球位置离「黄道与白道的交点」多远？拖动滑块，让影子落到地球上，触发日食！',e:'真实的黄白交角固定约5°，不能随便改。关键是：新月刚好出现在交点附近时，月影才会投到地球上，日食才发生！'},
{t:'cls',s:3,q:'把月相对应的潮汐分类：这天是「大潮」还是「小潮」？',items:['新月（初一）','满月（十五）','上弦月（初八）','下弦月（廿三）'],cats:['大潮','小潮'],ans:[0,0,1,1],e:'新月、满月时日、月、地几乎一条直线，两个引力叠加，是大潮；弦月时成90°，引力互相「抵消」一部分，是小潮。'},
{t:'mc',s:3,q:'国际通用的公历（格里历）属于阳历，它的制定依据是？',o:['地球绕太阳公转周期','月球绕地球公转周期','地球自转周期','水星公转周期'],e:'阳历看地球绕太阳一周（约365.242天），所以季节在公历里很固定。'},
{t:'pair',s:3,q:'给三种历法配对正确的特点。先点左边，再点右边。',p:[['公历（格里历）','阳历：依据地球绕太阳公转'],['回历（伊斯兰历）','阴历：只看月相，一年约354天'],['农历','阴阳历：月相＋节气＋闰月']],e:'公历看太阳，回历只看月亮，农历两者兼顾：既有月相（初一、十五），又用节气和闰月跟上四季。'},
{t:'num',s:3,q:'公历闰年规则：四年一闰，百年不闰，四百年再闰。1900年到2000年之间（含两端），共有几个闰年？（输入数字）',a:25,e:'1904到1996共24个（1900不是闰年，因为能被100整除却不能被400整除），再加上2000年（能被400整除），共25个。'},

if(qi>=Q.length){if(!G.rv&&G.missed.length){G.rv=true;Q=G.missed.map(q=>Object.assign({},q,{rv:1}));qi=0}else return end(true)}
cur=Q[qi];const q=cur;
$('sec').textContent=G.rv?'🔧 错题重修（不扣命）':SN[q.s];
$('qn').textContent='第 '+(qi+1)+'/'+Q.length+' 题'+(q.t==='mc'?'':' · 挑战题');
$('bar').style.width=(qi/Q.length*100)+'%';
$('qt').textContent=q.q;$('opts').innerHTML='';$('okwrap').classList.add('hide');$('oks').textContent='';
R[q.t](q);upd();
if(q.t==='sim'){$('tm').classList.add('hide');return}
$('tm').classList.remove('hide');G.limit=q.rv?40:TL[q.s]+(q.t==='mc'?0:12);G.left=G.limit;$('tsec').textContent=G.left;$('tm').classList.remove('warn');
G.tm=setInterval(()=>{G.left--;$('tsec').textContent=G.left;$('tm').classList.toggle('warn',G.left<=5);if(G.left<=0){clearInterval(G.tm);if(!lock)done(false,true)}},1000)}
// 峇株吧辖蔡逸众制作
function okBtn(fn){$('okwrap').classList.remove('hide');$('okb').onclick=()=>{if(lock)return;const r=fn();if(r===null){$('oks').textContent='还没完成哦～';return}done(r)}}
const R={};
R.mc=q=>{const ops=shuf(q.o);ops.forEach((t,k)=>{const b=el('button','opt','<b>'+'ABCD'[k]+'</b><span>'+t+'</span>');b.onclick=()=>{if(lock)return;const ok=t===q.o[0];b.classList.add(ok?'good':'bad');done(ok)};$('opts').appendChild(b)})};
R.sort=q=>{const pick=[];const tray=el('div','tray','点击下方卡片，按先后顺序排好 👇');const pool=el('div','');
shuf(q.items).forEach(t=>{const b=el('button','chip',t);b.onclick=()=>{if(b.disabled)return;b.disabled=true;pick.push(t);tray.textContent=pick.map((x,n)=>(n+1)+'. '+x).join('  →  ')};pool.appendChild(b)});
const rs=el('button','mini','↺ 重排');rs.onclick=()=>{if(!lock){$('opts').innerHTML='';R.sort(q)}};
$('opts').append(tray,pool,rs);okBtn(()=>pick.length<q.items.length?null:pick.every((x,n)=>x===q.items[n]))};
R.cls=q=>{const sel=q.items.map(()=>-1);
q.items.forEach((t,n)=>{const row=el('div','row','<span>'+t+'</span>');const w=el('span','');q.cats.forEach((cn,k)=>{const b=el('button','mini',cn);b.onclick=()=>{sel[n]=k;[...w.children].forEach((x,j)=>x.classList.toggle('on',j===k))};w.appendChild(b)});row.appendChild(w);$('opts').appendChild(row)});
okBtn(()=>sel.includes(-1)?null:sel.every((v,n)=>v===q.ans[n]))};
R.pair=q=>{let L=-1,left=q.p.length,err=0;const cl=el('div',''),cr=el('div','');const lb=[],rb=[];
q.p.forEach((p,n)=>{const b=el('button','chip',p[0]);b.onclick=()=>{if(b.classList.contains('ok'))return;lb.forEach(x=>x.classList.remove('sel'));b.classList.add('sel');L=n};lb.push(b);cl.appendChild(b)});
shuf(q.p.map((p,n)=>n)).forEach(n=>{const b=el('button','chip',q.p[n][1]);b.onclick=()=>{if(lock||L<0||b.classList.contains('ok'))return;if(L===n){b.classList.add('ok');lb[n].classList.remove('sel');lb[n].classList.add('ok');L=-1;left--;sfx('ok');if(!left)done(err<=1)}else{err++;b.classList.add('err');setTimeout(()=>b.classList.remove('err'),400);sfx('no')}};rb.push(b);cr.appendChild(b)});
const w=el('div','cols');w.append(cl,cr);$('opts').appendChild(w)};
R.num=q=>{const i=el('input','');i.id='numin';i.type='text';i.setAttribute('inputmode','numeric');i.placeholder='输入数字';$('opts').appendChild(i);
const f=()=>{let v=i.value.replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248)).trim();return v===''?null:parseFloat(v)===q.a};
okBtn(f);i.onkeydown=e=>{if(e.key==='Enter')$('okb').click()}};
function drawSim(cv,phi){const x=cv.getContext('2d'),W=cv.width,H=cv.height,cy=H/2,sx=60,mx=W*.62,ex=W*.88;
const off=-Math.sin(phi*Math.PI/180)*70,my=cy+off;x.clearRect(0,0,W,H);
x.strokeStyle='#475569';x.setLineDash([6,6]);x.beginPath();x.moveTo(0,cy);x.lineTo(W,cy);x.stroke();x.setLineDash([]);
const tip=my+(my-cy)/(mx-sx)*(ex-mx);
x.fillStyle='rgba(239,68,68,.28)';x.beginPath();x.moveTo(mx,my-9);x.lineTo(ex,tip);x.lineTo(mx,my+9);x.fill();
x.fillStyle='#FBBF24';x.beginPath();x.arc(sx,cy,30,0,7);x.fill();
x.fillStyle='#3B82F6';x.beginPath();x.arc(ex,cy,18,0,7);x.fill();
x.fillStyle='#CBD5E1';x.beginPath();x.arc(mx,my,9,0,7);x.fill();
x.fillStyle='#94A3B8';x.font='16px sans-serif';x.textAlign='center';x.fillText('太阳',sx,cy+52);x.fillText('月球',mx,my>cy?my+28:my-18);x.fillText('地球',ex,cy+36);
return Math.abs(tip-cy)<20}
R.sim=q=>{const cv=el('canvas','sim');cv.width=600;cv.height=240;const lab=el('div','sub');const sl=el('input','');sl.type='range';sl.min=0;sl.max=90;sl.step=1;sl.value=60;let hit=false;
const f=()=>{hit=drawSim(cv,+sl.value);lab.innerHTML='月球离交点：<b style="color:#FBBF24">'+sl.value+'°</b> ｜ '+(hit?'<b style="color:#34D399">🎯 影子落在地球上！日食发生</b>':'<b style="color:#F87171">影子从地球旁边错开了</b>')};
sl.oninput=f;f();$('opts').append(cv,lab,sl);okBtn(()=>hit?true:null);$('oks').textContent='让影子落到地球上才能完成'};
function done(ok,to){lock=1;clearInterval(G.tm);const q=cur;let pts=0;
if(q.t!=='sim'){G.spent+=G.limit-G.left;G.nt++}
if(ok){sfx('ok');G.combo++;G.maxc=Math.max(G.maxc,G.combo);pts=q.t==='sim'?300:q.rv?50:Math.round((100+G.left*2.5)*(G.combo>1?1+.2*Math.min(G.combo-1,8):1));G.sc+=pts;if(!q.rv&&q.t!=='sim')G.cor++}
else{sfx('no');G.combo=0;if(!q.rv){G.lives--;G.wrong++;G.missed.push(q)}}
upd();
$('mt').textContent=ok?'✅ 答对了！ +'+pts+' 分':(to?'⏰ 时间到！':'❌ 差一点！')+(q.rv?'':' 生命 -1');
$('mt').style.color=ok?'#34D399':'#F87171';
$('me').innerHTML='💡 <b style="color:#FBBF24">知识点：</b>'+q.e+(!ok&&!q.rv?'<br><span class="sub">这题会进入「错题重修」，通关前再挑战一次！</span>':'');
$('mb').textContent=(!ok&&G.lives<=0)?'查看战报 📋':'继续航行 🚀';
setTimeout(()=>$('modal').classList.remove('hide'),ok?350:150)}
// Made by ecchua79
function next(){$('modal').classList.add('hide');if(G.lives<=0)return end(false);qi++;loadQ()}
function end(pass){clearInterval(G.tm);G.t1=Date.now();G.pass=pass;
const ach=[];const avg=G.nt?G.spent/G.nt:99;
if(pass)ach.push('🚀 星域修复者');
if(pass&&G.wrong===0)ach.push('💯 满分达人');
if(G.nt>=8&&avg<=8)ach.push('⚡ 极速王');
if(G.maxc>=8)ach.push('🔥 连击大师');
if(pass&&G.lives===1)ach.push('🛡️ 绝地求生');
if(pass&&G.rv)ach.push('🔧 错题终结者');
G.ach=ach;const nb=G.sc>getBest();if(nb)setBest(G.sc);G.nb=nb;
$('etag').textContent=pass?'🏆 任务完成 · 授予荣誉勋章':'💪 任务未完成 · 勇者挑战记录';
$('ach').innerHTML=ach.length?ach.map(a=>'<span>'+a+'</span>').join(''):'<span>再接再厉，解锁成就！</span>';
show('end');cert()}
function cert(){const cv=$('cert'),x=cv.getContext('2d');x.setTransform(2,0,0,2,0,0);const F='"PingFang SC","Microsoft YaHei","Heiti SC",sans-serif';
const W=700,H=990,T=Math.round((G.t1-G.t0)/1000),tm=Math.floor(T/60)+'分'+String(T%60).padStart(2,'0')+'秒';
const acc=G.cor+G.wrong?G.cor/(G.cor+G.wrong):0;
const msg=!G.pass?'Never Give Up! 再来一次，你一定行！':acc>=.9?'Excellent Work! 太棒了！':acc>=.7?'Great Job! 继续保持！':'Good Try! 复习后再挑战吧！';
x.fillStyle='#0F172A';x.fillRect(0,0,W,H);x.strokeStyle='#F59E0B';x.lineWidth=8;x.strokeRect(16,16,W-32,H-32);x.strokeStyle='#3B82F6';x.lineWidth=2;x.strokeRect(30,30,W-60,H-60);
x.textAlign='center';x.fillStyle='#F59E0B';x.font='bold 34px '+F;x.fillText('🏆 '+(G.pass?'结业荣誉证书':'勇者挑战证书'),W/2,120);
x.fillStyle='#94A3B8';x.font='15px '+F;x.fillText('地月航天大冒险 · 华仁中学科学探索系列',W/2,155);
x.fillStyle='#CBD5E1';x.font='20px '+F;x.fillText('兹授予领航员',W/2,250);
let fs=46;x.font='bold '+fs+'px '+F;while(x.measureText(G.n).width>W-140&&fs>18){fs-=2;x.font='bold '+fs+'px '+F}
x.fillStyle='#FFFFFF';x.fillText(G.n,W/2,325);x.strokeStyle='#F59E0B';x.lineWidth=2;x.beginPath();x.moveTo(140,345);x.lineTo(W-140,345);x.stroke();
x.fillStyle='#CBD5E1';x.font='18px '+F;x.fillText(G.pass?'在《地月运动》互动任务中表现出色，':'在《地月运动》互动任务中勇敢挑战，',W/2,400);x.fillText(G.pass?'成功修复地月轨道观测站！':'继续努力，观测站等你来修复！',W/2,432);
x.fillStyle='rgba(30,41,59,.9)';x.fillRect(110,480,480,210);x.strokeStyle='rgba(59,130,246,.5)';x.lineWidth=1;x.strokeRect(110,480,480,210);
x.fillStyle='#F59E0B';x.font='bold 38px '+F;x.fillText('总分 '+G.sc,W/2,540);
x.fillStyle='#38BDF8';x.font='bold 22px '+F;x.fillText('通关时间 '+tm,W/2,585);
x.fillStyle='#A855F7';x.font='18px '+F;x.fillText('最高连击 '+G.maxc+'x ｜ 首答正确率 '+Math.round(acc*100)+'%',W/2,625);
x.fillStyle='#FBBF24';x.font='16px '+F;x.fillText(G.ach.length?G.ach.join('  '):'解锁成就，再战一次！',W/2,665);
x.fillStyle='#34D399';x.font='bold 26px '+F;x.fillText(msg,W/2,760);
if(G.nb){x.fillStyle='#F87171';x.font='bold 18px '+F;x.fillText('🎉 刷新个人最高分！',W/2,800)}
x.fillStyle='#64748B';x.font='15px '+F;x.textAlign='left';x.fillText('日期时间：'+new Date().toLocaleString('zh-CN',{hour12:false}),60,900);
x.textAlign='right';x.fillText('华仁中学科学实验室 · 认证印章',W-60,900)}
// 峇株吧辖华仁中学蔡逸众制作
function dl(){const a=document.createElement('a');a.download='地月运动证书_'+G.n+'.png';a.href=$('cert').toDataURL('image/png');a.click()}
function again(){$('best').textContent=getBest();show('start')}
document.addEventListener('keydown',e=>{if(!$('start').classList.contains('hide')){if(e.key==='Enter')startGame();return}
const k='1234'.indexOf(e.key);if(k>-1&&cur&&cur.t==='mc'&&!lock&&$('modal').classList.contains('hide')&&!$('game').classList.contains('hide')){const b=$('opts').children[k];if(b)b.click()}});
function initBg(){const c=$('bg'),x=c.getContext('2d');let w,h;const rs=()=>{w=c.width=innerWidth;h=c.height=innerHeight};rs();addEventListener('resize',rs);
const st=Array.from({length:70},()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.8,a:Math.random(),v:Math.random()*.02+.005}));
(function f(){if(!document.hidden){x.clearRect(0,0,w,h);st.forEach(s=>{s.a+=s.v;if(s.a>1||s.a<0.1)s.v=-s.v;x.fillStyle='rgba(255,255,255,'+Math.max(0,Math.min(1,s.a))+')';x.beginPath();x.arc(s.x*w,s.y*h,s.r,0,7);x.fill()})}requestAnimationFrame(f)})()}
window.onload=()=>{initBg();$('best').textContent=getBest()};
</script>
