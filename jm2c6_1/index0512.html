<!DOCTYPE html>
<!-- //峇株吧辖华仁中学蔡逸众制作 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>⚗️ 酸碱实验室大冒险</title>
<style>
/* //峇株吧辖蔡逸众制作 */
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Space+Mono:wght@700&display=swap');

:root {
  --acid: #ff6b35;
  --alkali: #4ecdc4;
  --neutral: #ffe66d;
  --bg: #0f0e17;
  --card: #1a1a2e;
  --card2: #16213e;
  --text: #fffffe;
  --text-dim: #a7a9be;
  --danger: #ef233c;
  --success: #06d6a0;
  --combo: #ffd60a;
  --glow-acid: 0 0 20px #ff6b3566;
  --glow-alkali: 0 0 20px #4ecdc466;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Nunito', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  overflow-x: hidden;
}

/* Animated background */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse at 20% 20%, #ff6b3511 0%, transparent 50%),
    radial-gradient(ellipse at 80% 80%, #4ecdc411 0%, transparent 50%),
    radial-gradient(ellipse at 50% 50%, #1a1a2e 0%, #0f0e17 100%);
  z-index: 0;
  pointer-events: none;
}

.wrap {
  width: 100%;
  max-width: 620px;
  min-height: 100vh;
  position: relative;
  z-index: 1;
  padding: 0 0 40px;
}

/* ===== SCREENS ===== */
.screen { display: none; padding: 24px 20px; animation: slideUp .4s ease; }
.screen.active { display: block; }

@keyframes slideUp {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ===== START SCREEN ===== */
.hero {
  text-align: center;
  padding: 40px 20px 30px;
}

.hero-icon {
  font-size: 72px;
  display: block;
  animation: float 3s ease-in-out infinite;
}

@keyframes float {
  0%,100% { transform: translateY(0); }
  50%      { transform: translateY(-12px); }
}

.hero h1 {
  font-size: 2rem;
  font-weight: 900;
  line-height: 1.2;
  margin: 16px 0 8px;
  background: linear-gradient(135deg, var(--acid), var(--alkali));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.hero p {
  color: var(--text-dim);
  font-size: .95rem;
  line-height: 1.6;
}

.level-select {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 12px;
  margin: 24px 0;
}

.level-card {
  background: var(--card);
  border-radius: 16px;
  padding: 18px 10px;
  text-align: center;
  cursor: pointer;
  border: 2px solid transparent;
  transition: all .25s;
  position: relative;
  overflow: hidden;
}

.level-card::before {
  content: '';
  position: absolute;
  inset: 0;
  opacity: 0;
  transition: opacity .3s;
}

.level-card.lv1::before { background: linear-gradient(135deg,#06d6a022,#06d6a011); }
.level-card.lv2::before { background: linear-gradient(135deg,#ffe66d22,#ffe66d11); }
.level-card.lv3::before { background: linear-gradient(135deg,#ff6b3522,#ef233c11); }

.level-card:hover::before, .level-card.selected::before { opacity: 1; }
.level-card.lv1:hover, .level-card.lv1.selected { border-color: var(--success); box-shadow: 0 0 20px #06d6a033; }
.level-card.lv2:hover, .level-card.lv2.selected { border-color: var(--neutral); box-shadow: 0 0 20px #ffe66d33; }
.level-card.lv3:hover, .level-card.lv3.selected { border-color: var(--acid); box-shadow: 0 0 20px #ff6b3533; }

.level-card .lv-emoji { font-size: 32px; display: block; margin-bottom: 8px; }
.level-card .lv-name { font-weight: 800; font-size: .9rem; }
.level-card .lv-desc { font-size: .72rem; color: var(--text-dim); margin-top: 4px; }

.rules-box {
  background: var(--card);
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 20px;
}

.rules-box h3 { font-size: 1rem; margin-bottom: 14px; color: var(--alkali); }

.rule-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 0;
  border-bottom: 1px solid #ffffff11;
  font-size: .9rem;
}
.rule-item:last-child { border-bottom: none; }
.rule-icon { font-size: 1.4rem; flex-shrink: 0; }

.credit { font-size: .65rem; color: #ffffff22; text-align: center; margin-top: 6px; }

/* ===== BTN ===== */
.btn {
  width: 100%;
  padding: 16px;
  border: none;
  border-radius: 14px;
  font-family: 'Nunito', sans-serif;
  font-size: 1.05rem;
  font-weight: 800;
  cursor: pointer;
  transition: all .2s;
  letter-spacing: .5px;
}

.btn-primary {
  background: linear-gradient(135deg, var(--acid), #e63946);
  color: white;
  box-shadow: 0 6px 20px #ff6b3544;
}

.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 28px #ff6b3566; }
.btn-primary:active { transform: translateY(0); }

.btn-secondary {
  background: var(--card);
  color: var(--text-dim);
  border: 1px solid #ffffff22;
  margin-top: 10px;
}

.btn-secondary:hover { background: var(--card2); color: white; }

.btn-download {
  background: linear-gradient(135deg, var(--alkali), #2d9cdb);
  color: white;
  box-shadow: 0 6px 20px #4ecdc444;
}

.btn-download:hover { transform: translateY(-2px); }

/* ===== HUD ===== */
.hud {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 20px;
  background: var(--card);
  border-radius: 16px;
  margin-bottom: 14px;
  gap: 10px;
}

.hud-block { text-align: center; }
.hud-label { font-size: .65rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
.hud-value { font-size: 1.2rem; font-weight: 900; margin-top: 2px; }

.hp-hearts { font-size: 1.4rem; letter-spacing: 2px; }

.combo-badge {
  background: linear-gradient(135deg, var(--combo), #f77f00);
  color: #0f0e17;
  border-radius: 20px;
  padding: 4px 14px;
  font-size: .85rem;
  font-weight: 900;
  white-space: nowrap;
  transition: transform .2s;
}

.combo-badge.pop { animation: comboPop .3s ease; }
@keyframes comboPop {
  0%   { transform: scale(1); }
  50%  { transform: scale(1.35); }
  100% { transform: scale(1); }
}

/* Timer */
.timer-wrap {
  background: var(--card);
  border-radius: 10px;
  height: 10px;
  overflow: hidden;
  margin-bottom: 16px;
}
.timer-fill {
  height: 100%;
  width: 100%;
  background: linear-gradient(90deg, var(--alkali), var(--success));
  transition: width .1s linear, background .3s;
  border-radius: 10px;
}

/* Level badge */
.level-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--card2);
  border-radius: 20px;
  padding: 4px 14px;
  font-size: .8rem;
  font-weight: 700;
  margin-bottom: 12px;
  color: var(--text-dim);
  border: 1px solid #ffffff11;
}

/* Question card */
.q-card {
  background: var(--card);
  border-radius: 16px;
  padding: 22px 20px;
  margin-bottom: 16px;
  border-left: 4px solid var(--acid);
}

.q-type-tag {
  font-size: .7rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--acid);
  margin-bottom: 10px;
}

.q-text {
  font-size: 1.05rem;
  font-weight: 700;
  line-height: 1.6;
}

/* MCQ Options */
.options-grid { display: grid; gap: 10px; margin-bottom: 16px; }

.opt-btn {
  background: var(--card);
  border: 2px solid #ffffff15;
  color: var(--text);
  border-radius: 12px;
  padding: 14px 16px;
  font-size: .95rem;
  font-weight: 600;
  font-family: 'Nunito', sans-serif;
  cursor: pointer;
  text-align: left;
  transition: all .2s;
  display: flex;
  align-items: center;
  gap: 12px;
}

.opt-letter {
  width: 28px; height: 28px;
  border-radius: 50%;
  background: #ffffff11;
  display: flex; align-items: center; justify-content: center;
  font-size: .8rem; font-weight: 800;
  flex-shrink: 0;
  transition: all .2s;
}

.opt-btn:hover:not(:disabled) {
  border-color: var(--alkali);
  background: #4ecdc412;
}
.opt-btn:hover:not(:disabled) .opt-letter { background: var(--alkali); color: #0f0e17; }

.opt-btn.correct { border-color: var(--success); background: #06d6a015; }
.opt-btn.correct .opt-letter { background: var(--success); color: #0f0e17; }

.opt-btn.wrong { border-color: var(--danger); background: #ef233c15; }
.opt-btn.wrong .opt-letter { background: var(--danger); color: white; }

.opt-btn:disabled { cursor: default; }

/* Drag & Drop */
.drag-zone {
  background: var(--card);
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 16px;
}

.drag-zone h4 { font-size: .8rem; color: var(--text-dim); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; }

.drag-items {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  min-height: 48px;
}

.drag-item {
  background: linear-gradient(135deg, var(--card2), var(--card));
  border: 2px solid #ffffff22;
  border-radius: 10px;
  padding: 8px 14px;
  cursor: grab;
  font-weight: 700;
  font-size: .9rem;
  transition: all .2s;
  user-select: none;
  touch-action: none;
}

.drag-item:active { cursor: grabbing; transform: scale(1.05); }
.drag-item.dragging { opacity: .4; }
.drag-item.acid-item { border-color: var(--acid); color: var(--acid); }
.drag-item.alkali-item { border-color: var(--alkali); color: var(--alkali); }
.drag-item.correct-placed { border-color: var(--success); background: #06d6a022; color: var(--success); }
.drag-item.wrong-placed  { border-color: var(--danger);  background: #ef233c22; color: var(--danger); }

.drop-targets {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 10px;
  margin-bottom: 16px;
}

.drop-targets.two-col {
  grid-template-columns: 1fr 1fr;
}

.drop-target {
  background: var(--card);
  border: 2px dashed #ffffff22;
  border-radius: 16px;
  padding: 12px 8px;
  min-height: 110px;
  transition: all .2s;
}

.drop-target.drag-over {
  border-color: var(--alkali);
  background: #4ecdc412;
}

.drop-target h4 {
  font-size: .78rem;
  font-weight: 800;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 4px;
  line-height: 1.3;
}

.drop-target.acid-target   h4 { color: var(--acid); }
.drop-target.alkali-target h4 { color: var(--alkali); }
.drop-target.neutral-target h4 { color: var(--neutral); }
.drop-target.neutral-target.drag-over { border-color: var(--neutral); background: #ffe66d12; }

.drop-zone-items { display: flex; flex-wrap: wrap; gap: 6px; min-height: 36px; }

/* pH slider */
.ph-question { background: var(--card); border-radius: 16px; padding: 20px; margin-bottom: 16px; }
.ph-strip {
  display: flex;
  border-radius: 10px;
  overflow: hidden;
  height: 24px;
  margin: 14px 0;
  position: relative;
}
.ph-seg {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: .55rem;
  font-weight: 800;
  color: rgba(0,0,0,.7);
  cursor: pointer;
  transition: transform .1s;
  position: relative;
}
.ph-seg:hover { transform: scaleY(1.3); z-index: 1; }
.ph-seg.ph-selected::after {
  content: '▲';
  position: absolute;
  bottom: -14px;
  font-size: 10px;
  color: var(--text);
}
.ph-label { font-size: .75rem; color: var(--text-dim); display: flex; justify-content: space-between; margin-top: 16px; }

/* Explanation */
.explanation-box {
  background: linear-gradient(135deg, #1a1a2e, #16213e);
  border: 1px solid var(--alkali);
  border-radius: 14px;
  padding: 16px 18px;
  margin-bottom: 16px;
  font-size: .9rem;
  line-height: 1.7;
  display: none;
}

.explanation-box.show { display: block; animation: slideUp .3s ease; }
.exp-title { font-weight: 800; color: var(--alkali); margin-bottom: 6px; font-size: .85rem; }

/* Score popup */
.score-popup {
  position: fixed;
  font-family: 'Space Mono', monospace;
  font-size: 1.4rem;
  font-weight: 700;
  color: var(--success);
  pointer-events: none;
  z-index: 9999;
  animation: scoreFloat 1.2s ease forwards;
}

@keyframes scoreFloat {
  0%   { opacity: 1; transform: translateY(0) scale(1); }
  100% { opacity: 0; transform: translateY(-60px) scale(1.4); }
}

/* ===== RESULTS ===== */
.results-hero {
  text-align: center;
  padding: 30px 0 20px;
}

.results-icon { font-size: 64px; }
.results-title { font-size: 1.8rem; font-weight: 900; margin: 12px 0 4px; }
.results-sub { color: var(--text-dim); font-size: .9rem; }

.stats-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin: 20px 0;
}

.stat-card {
  background: var(--card);
  border-radius: 14px;
  padding: 16px;
  text-align: center;
}

.stat-val {
  font-size: 1.8rem;
  font-weight: 900;
  background: linear-gradient(135deg, var(--acid), var(--alkali));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.stat-label { font-size: .75rem; color: var(--text-dim); margin-top: 4px; }

.achievements { margin: 16px 0; }
.ach-title { font-size: .8rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }

.ach-item {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--card);
  border-radius: 12px;
  padding: 12px 14px;
  margin-bottom: 8px;
  border: 1px solid #ffffff11;
}

.ach-item.unlocked { border-color: var(--combo); background: #ffd60a11; }
.ach-icon { font-size: 1.4rem; }
.ach-name { font-weight: 800; font-size: .9rem; }
.ach-desc { font-size: .75rem; color: var(--text-dim); }
.ach-item.locked .ach-icon { filter: grayscale(1) opacity(.4); }
.ach-item.locked .ach-name { color: var(--text-dim); }

/* Name input */
.name-section {
  background: var(--card);
  border-radius: 16px;
  padding: 20px;
  margin: 16px 0;
}

.name-section label { font-size: .85rem; color: var(--text-dim); display: block; margin-bottom: 8px; }

.name-input {
  width: 100%;
  background: var(--card2);
  border: 2px solid #ffffff22;
  border-radius: 10px;
  padding: 12px 16px;
  font-family: 'Nunito', sans-serif;
  font-size: 1rem;
  font-weight: 700;
  color: var(--text);
  outline: none;
  transition: border-color .2s;
}

.name-input:focus { border-color: var(--alkali); }
.name-input::placeholder { color: #ffffff33; }

/* ===== CERTIFICATE CANVAS WRAP ===== */
#cert-canvas-wrap { text-align: center; margin-bottom: 16px; }
#cert-canvas {
  max-width: 100%;
  border-radius: 12px;
  box-shadow: 0 8px 32px rgba(0,0,0,.5);
}

/* ===== Confetti ===== */
.confetti-piece {
  position: fixed;
  width: 10px;
  height: 10px;
  top: -10px;
  border-radius: 2px;
  pointer-events: none;
  z-index: 9998;
  animation: confettiFall linear forwards;
}

@keyframes confettiFall {
  to { transform: translateY(110vh) rotate(720deg); opacity: 0; }
}

/* Progress dots */
.progress-dots {
  display: flex;
  justify-content: center;
  gap: 5px;
  margin-bottom: 14px;
  flex-wrap: wrap;
}

.dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: #ffffff22;
  transition: background .3s;
}
.dot.done    { background: var(--success); }
.dot.current { background: var(--acid); box-shadow: 0 0 6px var(--acid); }
.dot.wrong   { background: var(--danger); }

/* Responsive */
@media (max-width: 400px) {
  .hero h1 { font-size: 1.6rem; }
  .level-select { grid-template-columns: 1fr; }
  .drop-targets { grid-template-columns: 1fr; }
  .drop-targets.two-col { grid-template-columns: 1fr 1fr; }
}
</style>
</head>
<body>
<!-- //华仁中学蔡逸众制作 -->
<div class="wrap">

<!-- ===== START SCREEN ===== -->
<div id="screen-start" class="screen active">
  <div class="hero">
    <span class="hero-icon">⚗️</span>
    <h1>酸碱实验室<br>大冒险</h1>
    <p>穿上白大褂，拿起试管，成为顶级实验室科学家！</p>
  </div>

  <div style="padding: 0 4px;">
    <p style="font-size:.85rem; color:var(--text-dim); margin-bottom:10px; text-align:center;">选择难度：</p>
    <div class="level-select">
      <div class="level-card lv1 selected" onclick="selectLevel(1,this)">
        <span class="lv-emoji">🌱</span>
        <div class="lv-name">新手</div>
        <div class="lv-desc">基础概念</div>
      </div>
      <div class="level-card lv2" onclick="selectLevel(2,this)">
        <span class="lv-emoji">⚗️</span>
        <div class="lv-name">进阶</div>
        <div class="lv-desc">应用题+配对</div>
      </div>
      <div class="level-card lv3" onclick="selectLevel(3,this)">
        <span class="lv-emoji">🔥</span>
        <div class="lv-name">大师</div>
        <div class="lv-desc">全题型混合</div>
      </div>
    </div>

    <div class="rules-box">
      <h3>📋 游戏规则</h3>
      <div class="rule-item"><span class="rule-icon">❤️</span><span>3 条生命，答错或超时扣一条</span></div>
      <div class="rule-item"><span class="rule-icon">⚡</span><span>答题越快，时间加分越多</span></div>
      <div class="rule-item"><span class="rule-icon">🔥</span><span>连续答对触发 Combo，分数翻倍</span></div>
      <div class="rule-item"><span class="rule-icon">🏆</span><span>完成全部关卡，获取专属证书</span></div>
      <div class="rule-item"><span class="rule-icon">📚</span><span>答错会给你小提示，不是惩罚哦</span></div>
    </div>

    <button class="btn btn-primary" onclick="startGame()">开始实验！🚀</button>
    <p class="credit">峇株吧辖华仁中学 · 蔡逸众制作</p>
  </div>
</div>

<!-- ===== GAME SCREEN ===== -->
<div id="screen-game" class="screen">
  <div class="hud">
    <div class="hud-block">
      <div class="hud-label">生命值</div>
      <div class="hp-hearts" id="hp-display">❤️❤️❤️</div>
    </div>
    <div id="combo-badge" class="combo-badge">🔥 x<span id="combo-num">0</span></div>
    <div class="hud-block">
      <div class="hud-label">分数</div>
      <div class="hud-value" id="score-display" style="color:var(--alkali)">0</div>
    </div>
  </div>

  <div class="timer-wrap"><div class="timer-fill" id="timer-fill"></div></div>
  <div class="progress-dots" id="progress-dots"></div>

  <div id="q-area"><!-- dynamic --></div>
  <div class="explanation-box" id="exp-box">
    <div class="exp-title">🧪 老师的小提示：</div>
    <div id="exp-text"></div>
  </div>
  <button class="btn btn-primary" id="next-btn" style="display:none;" onclick="nextQuestion()">下一题 ➡️</button>
</div>

<!-- ===== RESULTS SCREEN ===== -->
<div id="screen-results" class="screen">
  <div class="results-hero">
    <div class="results-icon" id="res-icon">🏆</div>
    <div class="results-title" id="res-title">实验完成！</div>
    <div class="results-sub" id="res-sub">你掌握了酸碱的秘密！</div>
  </div>

  <div class="stats-grid">
    <div class="stat-card"><div class="stat-val" id="r-score">0</div><div class="stat-label">最终得分</div></div>
    <div class="stat-card"><div class="stat-val" id="r-correct">0/0</div><div class="stat-label">答题正确率</div></div>
    <div class="stat-card"><div class="stat-val" id="r-combo">0</div><div class="stat-label">最高连击</div></div>
    <div class="stat-card"><div class="stat-val" id="r-time">0s</div><div class="stat-label">用时</div></div>
  </div>

  <div class="achievements">
    <div class="ach-title">🏅 成就解锁</div>
    <div id="ach-list"><!-- dynamic --></div>
  </div>

  <div class="name-section" id="name-section">
    <label>输入你的大名，领取专属证书 👇</label>
    <input class="name-input" id="player-name" type="text" placeholder="例如：科学小天才" maxlength="16">
    <button class="btn btn-download" style="margin-top:12px;" onclick="generateCert()">生成证书 🏆</button>

/* =========================================================

function selectLevel(lv, el) {

  el.classList.add('selected');

/* =========================================================

function startGame() {
  // Filter questions by level (all levels up to selected)
  let pool = ALL_QUESTIONS.filter(q => q.level <= gameLevel);
  questions = shuffle([...pool]);
  qIndex = 0; score = 0; hp = 3; combo = 0; maxCombo = 0;
  correctCount = 0; qResults = [];

/* =========================================================
   QUESTION LOADER
   ========================================================= */
function loadQuestion() {
  answered = false;
  document.getElementById('exp-box').classList.remove('show');
  document.getElementById('next-btn').style.display = 'none';
  updateHUD();

  const q = questions[qIndex];
  const area = document.getElementById('q-area');
  area.innerHTML = '';

  if (q.type === 'mcq')  renderMCQ(q, area);
  if (q.type === 'drag') renderDrag(q, area);
  if (q.type === 'ph')   renderPH(q, area);

  updateDots();
  startTimer(q.type === 'drag' ? 40 : q.type === 'ph' ? 20 : 18);
}

/* ===== MCQ ===== */
function renderMCQ(q, container) {
  const letters = ['A','B','C','D'];
  let opts = q.options.map((t,i) => ({text:t, isCorrect: i===q.correct}));
  opts = shuffle(opts);

  container.innerHTML = `
    <div class="q-card">
      <div class="q-type-tag">📝 单选题 · 第${qIndex+1}/${questions.length}题</div>
      <div class="q-text">${q.q}</div>

    <div class="options-grid">
      ${opts.map((o,i) => `
        <button class="opt-btn" onclick="checkMCQ(this,${o.isCorrect},'${escQ(q.exp)}')">
          <span class="opt-letter">${letters[i]}</span>
          <span>${o.text}</span>
        </button>
      `).join('')}
    </div>`;
}

function checkMCQ(btn, isCorrect, exp) {
  if (answered) return;
  answered = true;
  stopTimer();

  document.querySelectorAll('.opt-btn').forEach(b => b.disabled = true);
  btn.classList.add(isCorrect ? 'correct' : 'wrong');

  if (isCorrect) {
    handleCorrect();
  } else {
    handleWrong(exp);
  }
}

/* ===== DRAG & DROP ===== */
let dragSrc = null;

function renderDrag(q, container) {
  const acidLabel    = q.acidLabel    || '酸性物质';
  const alkaliLabel  = q.alkaliLabel  || '碱性物质';
  const neutralLabel = q.neutralLabel || '中性物质';
  const hasNeutral   = !!(q.neutralItems && q.neutralItems.length);

  const items = shuffle([...q.items]);
  const colClass = hasNeutral ? '' : 'two-col';

  container.innerHTML = `
    <div class="q-card" style="border-color:var(--alkali)">
      <div class="q-type-tag" style="color:var(--alkali)">🧲 拖拽分类 · 第${qIndex+1}/${questions.length}题</div>
      <div class="q-text">${q.q}</div>
    </div>
    <div class="drag-zone">
      <h4>拖动下面的物质 👇</h4>
      <div class="drag-items" id="drag-source">
        ${items.map(name => `<div class="drag-item" draggable="true" data-name="${name.replace(/"/g,'&quot;')}"
          ondragstart="onDragStart(event)"
          ontouchstart="onTouchStart(event)"
          ontouchmove="onTouchMove(event)"
          ontouchend="onTouchEnd(event)"
        >${name}</div>`).join('')}
      </div>
    </div>
    <div class="drop-targets ${colClass}">
      <div class="drop-target acid-target" id="drop-acid"
        ondragover="event.preventDefault();this.classList.add('drag-over')"
        ondragleave="this.classList.remove('drag-over')"
        ondrop="onDrop(event,'acid')">
        <h4>🧪 ${acidLabel}</h4>
        <div class="drop-zone-items" id="zone-acid"></div>
      </div>
      ${hasNeutral ? `
      <div class="drop-target neutral-target" id="drop-neutral"
        ondragover="event.preventDefault();this.classList.add('drag-over')"
        ondragleave="this.classList.remove('drag-over')"
        ondrop="onDrop(event,'neutral')">
        <h4>💧 ${neutralLabel}</h4>
        <div class="drop-zone-items" id="zone-neutral"></div>
      </div>` : ''}
      <div class="drop-target alkali-target" id="drop-alkali"
        ondragover="event.preventDefault();this.classList.add('drag-over')"
        ondragleave="this.classList.remove('drag-over')"
        ondrop="onDrop(event,'alkali')">
        <h4>🫧 ${alkaliLabel}</h4>
        <div class="drop-zone-items" id="zone-alkali"></div>
      </div>
    </div>
    <button class="btn btn-primary" id="drag-submit-btn" data-qindex="${qIndex}" style="margin-bottom:14px;">✅ 提交答案</button>`;

  // Attach submit handler safely (avoids JSON-in-onclick quoting bugs)
  document.getElementById('drag-submit-btn').addEventListener('click', function() {
    checkDrag(this.dataset.qindex);
  });

/* Drag events */
function onDragStart(e) {
  dragSrc = e.currentTarget;
  e.dataTransfer.effectAllowed = 'move';
  setTimeout(() => dragSrc && dragSrc.classList.add('dragging'), 0);
}

function onDrop(e, zone) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  if (!dragSrc) return;
  dragSrc.classList.remove('dragging');
  const zoneEl = document.getElementById('zone-' + zone);
  if (zoneEl) zoneEl.appendChild(dragSrc);
  dragSrc = null;
}

/* Touch drag — supports acid / neutral / alkali zones */
let touchEl = null, touchClone = null;
function onTouchStart(e) {
  touchEl = e.currentTarget;
  const r = touchEl.getBoundingClientRect();
  touchClone = touchEl.cloneNode(true);
  touchClone.style.cssText = `position:fixed;opacity:.85;pointer-events:none;z-index:9999;` +
    `width:${r.width}px;left:${r.left}px;top:${r.top}px;transition:none;`;
  document.body.appendChild(touchClone);
}
function onTouchMove(e) {
  e.preventDefault();
  if (!touchClone) return;
  const t = e.touches[0];
  touchClone.style.left = (t.clientX - touchClone.offsetWidth/2) + 'px';
  touchClone.style.top  = (t.clientY - touchClone.offsetHeight/2) + 'px';
}
function onTouchEnd(e) {
  if (!touchClone || !touchEl) return;
  const t = e.changedTouches[0];
  touchClone.remove(); touchClone = null;
  const el = document.elementFromPoint(t.clientX, t.clientY);
  const dropTarget = el?.closest('.drop-target');
  if (dropTarget) {
    const idMap = { 'drop-acid':'acid', 'drop-neutral':'neutral', 'drop-alkali':'alkali' };
    const zoneKey = idMap[dropTarget.id];
    if (zoneKey) {
      const zoneEl = document.getElementById('zone-' + zoneKey);
      if (zoneEl) zoneEl.appendChild(touchEl);
    }
  }
  touchEl = null;
}

function checkDrag(qi) {
  if (answered) return;
  answered = true;
  stopTimer();

  const q = questions[parseInt(qi)];
  const acidCorrect    = q.acidItems    || [];
  const alkaliCorrect  = q.alkaliItems  || [];
  const neutralCorrect = q.neutralItems || [];
  const hasNeutral     = neutralCorrect.length > 0;

  // Disable submit button
  const btn = document.getElementById('drag-submit-btn');
  if (btn) btn.disabled = true;

  let allCorrect = true;

  // Check acid zone
  [...(document.getElementById('zone-acid')?.querySelectorAll('.drag-item') || [])].forEach(el => {
    const ok = acidCorrect.includes(el.dataset.name);
    el.classList.add(ok ? 'correct-placed' : 'wrong-placed');
    if (!ok) allCorrect = false;
  });

  // Check neutral zone (if exists)
  if (hasNeutral) {
    [...(document.getElementById('zone-neutral')?.querySelectorAll('.drag-item') || [])].forEach(el => {
      const ok = neutralCorrect.includes(el.dataset.name);
      el.classList.add(ok ? 'correct-placed' : 'wrong-placed');
      if (!ok) allCorrect = false;
    });
  }

  // Check alkali zone
  [...(document.getElementById('zone-alkali')?.querySelectorAll('.drag-item') || [])].forEach(el => {
    const ok = alkaliCorrect.includes(el.dataset.name);
    el.classList.add(ok ? 'correct-placed' : 'wrong-placed');
    if (!ok) allCorrect = false;
  });

  // Any item left in the source pool = wrong
  const leftover = document.getElementById('drag-source')?.querySelectorAll('.drag-item') || [];
  if (leftover.length > 0) {
    leftover.forEach(el => el.classList.add('wrong-placed'));
    allCorrect = false;
  }

  if (allCorrect) handleCorrect();
  else handleWrong(q.exp);
}

        ${q.phChoices.map(v => `
          <div class="ph-seg" style="background:${pHColors[v-1] || '#888'}" data-ph="${v}" onclick="checkPH(${v},${q.phTarget},'${escQ(q.exp)}')">
            ${v}
          </div>
        `).join('')}
      </div>
      <div class="ph-label">
        <span>← 强酸</span><span>中性</span><span>强碱 →</span>
      </div>
    </div>`;
}

function checkPH(selected, target, exp) {
  if (answered) return;
  answered = true;
  stopTimer();
  const segs = document.querySelectorAll('.ph-seg');
  segs.forEach(s => s.style.pointerEvents = 'none');
  const chosen = document.querySelector(`.ph-seg[data-ph="${selected}"]`);
  if (chosen) chosen.classList.add('ph-selected');
  if (selected === target) handleCorrect();
  else handleWrong(exp);
}

/* =========================================================
   ANSWER HANDLING
   ========================================================= */
function handleCorrect() {
  combo++;
  if (combo > maxCombo) maxCombo = combo;
  correctCount++;
  qResults.push('correct');

  const timeBonus  = Math.floor(timerValue * 5);
  const comboBonus = combo >= 3 ? combo * 15 : 0;
  const gained = 100 + timeBonus + comboBonus;
  score += gained;

  updateHUD();
  spawnScorePopup(`+${gained}${combo>=3 ? ' 🔥COMBO' : ''}`);
  if (combo >= 3) confetti();

  // Show exp briefly but auto-continue allowed
  showExp('✅ 答对了！', questions[qIndex].exp);
  document.getElementById('next-btn').style.display = 'block';
}

function handleWrong(exp) {
  combo = 0;
  hp--;
  qResults.push('wrong');
  updateDots();
  updateHUD();

  showExp('❌ 哎呀，再想想！', exp);

  if (hp <= 0) {
    setTimeout(() => endGame(false), 2000);
  } else {
    document.getElementById('next-btn').style.display = 'block';
  }
}

function handleTimeout() {
  if (answered) return;
  answered = true;
  combo = 0;
  hp--;
  qResults.push('timeout');
  updateDots();
  updateHUD();

  showExp('⏰ 时间到了！', questions[qIndex].exp);

  if (hp <= 0) {
    setTimeout(() => endGame(false), 2000);
  } else {
    document.getElementById('next-btn').style.display = 'block';
  }
}

function nextQuestion() {
  qIndex++;
  if (qIndex >= questions.length) {
    endGame(true);
  } else {
    loadQuestion();
  }
}

/* =========================================================
   TIMER (requestAnimationFrame)
   ========================================================= */
function startTimer(seconds) {
  timerMax   = seconds * 1000;
  timerValue = timerMax;
  timerStart = performance.now();
  cancelAnimationFrame(timerRAF);

  function tick(now) {
    const elapsed = now - timerStart;
    timerValue = Math.max(0, timerMax - elapsed);
    const pct = timerValue / timerMax;
    const fill = document.getElementById('timer-fill');
    if (fill) {
      fill.style.width = (pct * 100) + '%';
      fill.style.background = pct > .5 ? 'linear-gradient(90deg,var(--alkali),var(--success))'
                            : pct > .25 ? 'linear-gradient(90deg,var(--neutral),#f0a500)'
                            :             'linear-gradient(90deg,var(--danger),#ef233c)';
    }
    if (timerValue <= 0) { handleTimeout(); return; }
    timerRAF = requestAnimationFrame(tick);
  }
  timerRAF = requestAnimationFrame(tick);
}

function stopTimer() {
  cancelAnimationFrame(timerRAF);
  // Keep timerValue for score calculation
  timerValue = timerValue / 1000; // convert to seconds for scoring
}

/* =========================================================
   HUD & UI HELPERS
   ========================================================= */
function updateHUD() {
  document.getElementById('hp-display').innerHTML =
    '❤️'.repeat(Math.max(0,hp)) + '🖤'.repeat(Math.max(0,3-hp));
  document.getElementById('score-display').textContent = score;
  const cn = document.getElementById('combo-num');
  const cb = document.getElementById('combo-badge');
  cn.textContent = combo;
  if (combo >= 3) {
    cb.style.background = 'linear-gradient(135deg,#ff6b35,#e63946)';
    cb.classList.add('pop');
    setTimeout(() => cb.classList.remove('pop'), 300);
  } else {
    cb.style.background = 'linear-gradient(135deg,var(--combo),#f77f00)';
  }
}

function showExp(title, text) {
  document.getElementById('exp-text').innerHTML = text;
  document.querySelector('#exp-box .exp-title').textContent = title;
  document.getElementById('exp-box').classList.add('show');
}

function buildProgressDots() {
  const d = document.getElementById('progress-dots');
  d.innerHTML = questions.map((_, i) => `<div class="dot" id="dot-${i}"></div>`).join('');
}

function updateDots() {
  questions.forEach((_, i) => {
    const dot = document.getElementById('dot-' + i);
    if (!dot) return;
    dot.className = 'dot';
    if (i < qIndex) dot.classList.add(qResults[i] === 'correct' ? 'done' : 'wrong');
    else if (i === qIndex) dot.classList.add('current');
  });
}

function spawnScorePopup(text) {
  const el = document.createElement('div');
  el.className = 'score-popup';
  el.textContent = text;
  el.style.left = (30 + Math.random()*40) + '%';
  el.style.top  = '30%';
  document.body.appendChild(el);
  el.addEventListener('animationend', () => el.remove());
}

/* =========================================================
   CONFETTI
   ========================================================= */
function confetti() {
  const colors = ['#ff6b35','#4ecdc4','#ffe66d','#06d6a0','#ef233c'];
  for (let i = 0; i < 28; i++) {
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    p.style.left = Math.random()*100 + 'vw';
    p.style.background = colors[i % colors.length];
    p.style.width  = (6+Math.random()*8) + 'px';
    p.style.height = (6+Math.random()*8) + 'px';
    p.style.borderRadius = Math.random() > .5 ? '50%' : '2px';
    p.style.animationDuration = (1.2 + Math.random()*1.5) + 's';
    p.style.animationDelay = Math.random()*.4 + 's';
    document.body.appendChild(p);
    p.addEventListener('animationend', () => p.remove());
  }
}

/* =========================================================
   END GAME
   ========================================================= */
function endGame(win) {
  stopTimer();
  cancelAnimationFrame(timerRAF);

  const elapsed = Math.floor((Date.now() - gameStartTime) / 1000);
  const mm = String(Math.floor(elapsed/60)).padStart(2,'0');
  const ss = String(elapsed % 60).padStart(2,'0');

  showScreen('screen-results');
  if (win) confetti();

  document.getElementById('res-icon').textContent  = win ? '🏆' : '💥';
  document.getElementById('res-title').textContent = win ? '实验大成功！' : '哎，实验失败了…';
  document.getElementById('res-sub').textContent   = win
    ? `你掌握了酸碱的秘密！得分 ${score} 分`
    : `生命值耗尽，但失败是成功之母！复习后再来挑战！`;

  document.getElementById('r-score').textContent   = score;
  document.getElementById('r-correct').textContent = `${correctCount}/${questions.length}`;
  document.getElementById('r-combo').textContent   = maxCombo;
  document.getElementById('r-time').textContent    = `${mm}:${ss}`;

  // Achievements
  const achs = [
    { id:'perfect', icon:'💎', name:'满分达人', desc:'全部答对！', unlocked: correctCount === questions.length },
    { id:'speed',   icon:'⚡', name:'极速闪电', desc:'平均用时不超过8秒', unlocked: correctCount>0 && (elapsed/questions.length)<8 },
    { id:'combo5',  icon:'🔥', name:'连击王者', desc:'达成5连击', unlocked: maxCombo>=5 },
    { id:'survive', icon:'❤️', name:'钢铁意志', desc:'保住所有生命通关', unlocked: win && hp===3 },
    { id:'scholar', icon:'🎓', name:'酸碱学者', desc:'完成进阶或大师关卡', unlocked: gameLevel>=2 && win },
  ];

  document.getElementById('ach-list').innerHTML = achs.map(a => `
    <div class="ach-item ${a.unlocked ? 'unlocked' : 'locked'}">
      <span class="ach-icon">${a.icon}</span>
      <div><div class="ach-name">${a.name}</div><div class="ach-desc">${a.desc}</div></div>
      ${a.unlocked ? '<span style="margin-left:auto;color:var(--combo);font-size:.8rem;font-weight:800;">✅ 已解锁</span>' : ''}
    </div>`).join('');
}

/* =========================================================
   CERTIFICATE (Canvas)
   ========================================================= */
let certScore = 0;

function generateCert() {
  const name = document.getElementById('player-name').value.trim();
  if (!name) { alert('请输入你的大名哦！'); return; }
  certScore = score;

  // Hide name section
  document.getElementById('name-section').style.display = 'none';

  showScreen('screen-cert');

  const canvas = document.getElementById('cert-canvas');
  const W = 540, H = 900;
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  // //华仁中学蔡逸众制作
  // Background
  const bg = ctx.createLinearGradient(0,0,W,H);
  bg.addColorStop(0, '#0f0e17');
  bg.addColorStop(.5, '#1a1a2e');
  bg.addColorStop(1, '#16213e');
  ctx.fillStyle = bg;
  ctx.fillRect(0,0,W,H);

  // Decorative circles
  const drawCircle = (x,y,r,color) => {
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fillStyle = color; ctx.fill();
  };
  drawCircle(60,60,80,'#ff6b3511');
  drawCircle(480,840,100,'#4ecdc411');
  drawCircle(W/2,H/2,250,'#ffffff05');

  // Border
  const drawRoundRect = (x,y,w,h,r) => {
    ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.arcTo(x+w,y,x+w,y+r,r);
    ctx.lineTo(x+w,y+h-r); ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
    ctx.lineTo(x+r,y+h); ctx.arcTo(x,y+h,x,y+h-r,r);
    ctx.lineTo(x,y+r); ctx.arcTo(x,y,x+r,y,r);
    ctx.closePath();
  };
  // //Made by ecchua79
  // Outer border gradient
  const grad1 = ctx.createLinearGradient(0,0,W,H);
  grad1.addColorStop(0,'#ff6b35'); grad1.addColorStop(1,'#4ecdc4');
  ctx.strokeStyle = grad1; ctx.lineWidth = 8;
  drawRoundRect(16,16,W-32,H-32,20); ctx.stroke();

  // Inner border
  ctx.strokeStyle = '#ffffff22'; ctx.lineWidth = 1.5;
  drawRoundRect(28,28,W-56,H-56,14); ctx.stroke();

  // Top emoji
  ctx.font = '72px serif';
  ctx.textAlign = 'center';
  ctx.fillText('⚗️', W/2, 120);

  // Title
  ctx.font = 'bold 36px sans-serif';
  const titleGrad = ctx.createLinearGradient(100,0,440,0);
  titleGrad.addColorStop(0,'#ff6b35'); titleGrad.addColorStop(1,'#4ecdc4');
  ctx.fillStyle = titleGrad;
  ctx.fillText('荣誉证书', W/2, 178);

  // Subtitle
  ctx.font = '16px sans-serif';
  ctx.fillStyle = '#a7a9be';
  ctx.fillText('CERTIFICATE OF ACHIEVEMENT', W/2, 205);

  // Divider
  const divGrad = ctx.createLinearGradient(80,0,460,0);
  divGrad.addColorStop(0,'transparent'); divGrad.addColorStop(.5,'#4ecdc4'); divGrad.addColorStop(1,'transparent');
  ctx.strokeStyle = divGrad; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(80,220); ctx.lineTo(460,220); ctx.stroke();
  // //峇株吧辖蔡逸众制作
  // Certificate text
  ctx.fillStyle = '#fffffe'; ctx.font = '17px sans-serif';
  ctx.fillText('特此证明', W/2, 262);

  // Name
  ctx.font = 'bold 38px sans-serif';
  ctx.fillStyle = '#ffe66d';
  ctx.shadowColor = '#ffe66d'; ctx.shadowBlur = 12;
  ctx.fillText(name, W/2, 316);
  ctx.shadowBlur = 0;

  // Underline
  const nameW = ctx.measureText(name).width;
  ctx.strokeStyle = '#ffe66d66'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(W/2-nameW/2, 326); ctx.lineTo(W/2+nameW/2, 326); ctx.stroke();

  // Body text
  ctx.fillStyle = '#fffffe'; ctx.font = '16px sans-serif';
  ctx.fillText('成功完成了', W/2, 368);
  ctx.font = 'bold 20px sans-serif';
  ctx.fillStyle = '#4ecdc4';
  ctx.fillText('《酸碱实验室大冒险》', W/2, 398);
  ctx.fillStyle = '#fffffe'; ctx.font = '16px sans-serif';
  ctx.fillText('科学知识挑战，表现优异！', W/2, 428);

  // Score section box
  drawRoundRect(80, 455, W-160, 110, 14);
  const scoreBoxGrad = ctx.createLinearGradient(80,455,W-80,565);
  scoreBoxGrad.addColorStop(0,'#ff6b3522'); scoreBoxGrad.addColorStop(1,'#4ecdc422');
  ctx.fillStyle = scoreBoxGrad; ctx.fill();
  ctx.strokeStyle = '#ffffff22'; ctx.lineWidth = 1; ctx.stroke();

  ctx.fillStyle = '#a7a9be'; ctx.font = '13px sans-serif';
  ctx.fillText('最终得分', W/2, 488);
  ctx.font = 'bold 52px sans-serif';
  const sGrad = ctx.createLinearGradient(200,490,340,540);
  sGrad.addColorStop(0,'#ff6b35'); sGrad.addColorStop(1,'#4ecdc4');
  ctx.fillStyle = sGrad;
  ctx.shadowColor = '#4ecdc4'; ctx.shadowBlur = 15;
  ctx.fillText(score, W/2, 543);
  ctx.shadowBlur = 0;
  ctx.font = '13px sans-serif'; ctx.fillStyle = '#a7a9be';
  ctx.fillText('分', W/2, 558);

  // Level badge
  const lvNames = ['','🌱 新手模式','⚗️ 进阶模式','🔥 大师模式'];
  ctx.font = 'bold 15px sans-serif'; ctx.fillStyle = '#ffe66d';
  ctx.fillText(lvNames[gameLevel], W/2, 592);
  // //峇株吧辖华仁中学蔡逸众制作
  // Encouraging message
  ctx.font = 'bold 22px sans-serif';
  ctx.fillStyle = '#06d6a0';
  ctx.shadowColor = '#06d6a0'; ctx.shadowBlur = 8;
  ctx.fillText('Excellent Work! 🎉', W/2, 640);
  ctx.shadowBlur = 0;
  ctx.font = '15px sans-serif'; ctx.fillStyle = '#a7a9be';
  ctx.fillText('你已掌握酸碱化学的核心知识！', W/2, 668);

  // Date
  const now = new Date();
  const dateStr = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日`;
  ctx.font = '14px sans-serif'; ctx.fillStyle = '#ffffff55';
  ctx.fillText(`颁发日期：${dateStr}`, W/2, 720);

  // Bottom divider
  ctx.strokeStyle = divGrad; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(80,740); ctx.lineTo(460,740); ctx.stroke();

  // School name watermark
  ctx.font = '13px sans-serif'; ctx.fillStyle = '#4ecdc488';
  ctx.fillText('峇株吧辖华仁中学', W/2, 768);
  ctx.font = '12px sans-serif'; ctx.fillStyle = '#ffffff33';
  ctx.fillText('Made by ecchua79 · 蔡逸众制作', W/2, 790);

  // Corner decorations
  const corners = [[40,40],[W-40,40],[40,H-40],[W-40,H-40]];
  corners.forEach(([cx,cy]) => {
    ctx.beginPath(); ctx.arc(cx,cy,6,0,Math.PI*2);
    ctx.fillStyle = '#4ecdc4'; ctx.fill();
  });
}

/* =========================================================
   UTILS
   ========================================================= */
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function shuffle(arr) {
  for (let i = arr.length-1; i>0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

function escQ(s) {
  return (s||'').replace(/'/g,"\\'").replace(/"/g,'&quot;');
}
