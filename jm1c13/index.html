// ---- Comet (Halley) ----
const COMET = { e:.967, aAU:17.8, T:75.3, ang:0 };
function cometDtheta(dt){
  const {e,aAU,T,ang}=COMET;
  const sl=aAU*(1-e*e);
  const r=sl/(1+e*Math.cos(ang));
  const b=aAU*Math.sqrt(1-e*e);
  const h=(Math.PI*2*aAU*b)/T;
  return (h/(r*r))*dt;
}
function cometScreen(){
  const {e,aAU,ang}=COMET;
  const aScr=distMode==='opt'?280:aAU*130;
  const p=aScr*(1-e*e);
  const r=p/(1+e*Math.cos(ang));
  return {x:panX+r*Math.cos(ang)*zoom,y:panY+r*Math.sin(ang)*zoom,aScr,e};
}
function cometOrbitEllipse(){
  const {e,aAU}=COMET;
  const aScr=distMode==='opt'?280:aAU*130;
  const b=aScr*Math.sqrt(1-e*e);
  const c=aScr*e;
  return {a:aScr,b,c};
}

function pDist(p){ return distMode==='opt'?p.oD:p.rD*130; }
function pRad(p){ return sizeMode==='opt'?p.oR:p.rR*.5; }
function sunRad(){ return sizeMode==='opt'?32:54.5; }

// ---- Zoom ----
function doZoom(f,cx,cy){
  cx??=C.width/2; cy??=C.height/2;
  const old=zoom;
  zoom=Math.max(.06,Math.min(zoom*f,14));
  panX=cx-(cx-panX)*(zoom/old);
  panY=cy-(cy-panY)*(zoom/old);
  D.zoom.textContent=Math.round(zoom*100)+'%';
}

  D.rpName.textContent=p.name;

// ---- Click handler ----
C.addEventListener('click',e=>{
  const rect=C.getBoundingClientRect();
  const cx=e.clientX-rect.left, cy=e.clientY-rect.top;
  let best=null,bestD=Infinity;
  PLANETS.forEach(p=>{
    const d=pDist(p), px=panX+Math.cos(p.a)*d*zoom, py=panY+Math.sin(p.a)*d*zoom;
    const hit=Math.max(pRad(p)*zoom,14);
    const dist=Math.hypot(cx-px,cy-py);
    if(dist<=hit&&dist<bestD){best=p;bestD=dist;}
  });
  const sR=Math.max(sunRad()*zoom,22);
  if(Math.hypot(cx-panX,cy-panY)<=sR){
    best={id:'sun',name:'太阳',eng:'The Sun',col:'#f59e0b',rR:109,oR:32,rD:0,oD:0,T:0,v:0,moons:'无',
      desc:'太阳系中心恒星，占总质量99.86%。强大引力维系行星运行，核心氢核聚变为地球持续提供光和热。'};
  }
  if(best) selectPlanet(best);
});

// ---- Touch ----
let td0=0,tmx=0,tmy=0;
C.addEventListener('touchstart',e=>{
  if(e.touches.length===1){ dragging=true;dragX=e.touches[0].clientX-panX;dragY=e.touches[0].clientY-panY; }
  else if(e.touches.length===2){
    dragging=false;
    td0=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    tmx=(e.touches[0].clientX+e.touches[1].clientX)/2;
    tmy=(e.touches[0].clientY+e.touches[1].clientY)/2;
  }
},{passive:true});
C.addEventListener('touchmove',e=>{
  if(dragging&&e.touches.length===1){ panX=e.touches[0].clientX-dragX;panY=e.touches[0].clientY-dragY;focused=null; }
  else if(e.touches.length===2){
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    doZoom(d/td0>1?1.04:.96,tmx,tmy); td0=d;
  }
},{passive:true});
C.addEventListener('touchend',()=>{ dragging=false; });

function drawWatermark(){
  ctx.save();
  ctx.globalAlpha = 0.06;
  ctx.fillStyle = '#94a3b8';
  ctx.font = '12px sans-serif';
  ctx.textAlign = 'left';
  // 斜向平铺水印 — 
  const lines = [
    '',
    '',
    '',
    '',
  ];
  const lineH = 80;
  const colW  = 340;
  ctx.translate(C.width/2, C.height/2);
  ctx.rotate(-Math.PI/6);
  const rows = Math.ceil(C.height / lineH) + 6;
  const cols = Math.ceil(C.width  / colW) + 4;
  const offY = -(rows/2)*lineH;
  const offX = -(cols/2)*colW;
  for(let r=0; r<rows; r++){
    for(let c=0; c<cols; c++){
      const txt = lines[(r+c)%lines.length];
      ctx.fillText(txt, offX+c*colW, offY+r*lineH);
    }
  }
  ctx.restore();
}

// 底部固定版权水印 — 
function drawCopyrightBar(){
  ctx.save();
  ctx.globalAlpha = 0.18;
  ctx.font = '11px sans-serif';
  ctx.fillStyle = '#94a3b8';
  ctx.textAlign = 'right';
  ctx.fillText(
    ' ©  |  | ',
    C.width - 8, C.height - 8
  );
  ctx.restore();
}

// DRAW LOOP
// ============================================================
function draw(ts){
  if(!lastTs) lastTs=ts;
  const rdt=Math.min(ts-lastTs,50)/1000;
  lastTs=ts;
  const DT_SCALE=1/30;
  const dt=playing?speed*rdt*DT_SCALE:0;

  if(dt>0){
    simTime+=dt;
    D.time.textContent=simTime.toFixed(2);
    PLANETS.forEach(p=>{
      p.a=(p.a-(Math.PI*2/p.T)*dt+Math.PI*2)%(Math.PI*2);
      if(p.satellites) p.satellites.forEach(m=>{ m.a=(m.a-(Math.PI*2/m.T)*dt+Math.PI*2)%(Math.PI*2); });
    });
    COMET.ang=(COMET.ang-cometDtheta(dt*10)+Math.PI*2)%(Math.PI*2);
  }

  // Camera follow
  if(focused){
    const d=pDist(focused);
    panX=C.width/2-Math.cos(focused.a)*d*zoom;
    panY=C.height/2-Math.sin(focused.a)*d*zoom;
    D.liveAng.textContent=((focused.a*180/Math.PI)%360).toFixed(1)+'°';
    D.liveVel.textContent=focused.v.toFixed(2)+' km/s';
  }

  // CLEAR
  ctx.fillStyle='#030712';
  ctx.fillRect(0,0,C.width,C.height);

  // STARS
  const t=ts/1000;
  STARS.forEach(layer=>{
    layer.forEach(s=>{
      let sx=((s.x*C.width+panX*s.px)%C.width); if(sx<0)sx+=C.width;
      let sy=((s.y*C.height+panY*s.px)%C.height); if(sy<0)sy+=C.height;
      const a=s.al*(0.7+0.3*Math.sin(t*1.1+s.tw));
      ctx.fillStyle='rgba(255,255,255,'+a.toFixed(3)+')';
      ctx.beginPath(); ctx.arc(sx,sy,s.r,0,Math.PI*2); ctx.fill();
    });
  });

  // ORBIT PATHS
  if(showOrbit){
    ctx.save();
    ctx.strokeStyle='rgba(51,65,85,0.35)'; ctx.lineWidth=1;
    PLANETS.forEach(p=>{ const r=pDist(p)*zoom; ctx.beginPath();ctx.arc(panX,panY,r,0,Math.PI*2);ctx.stroke(); });
    ctx.restore();
    if(showAst){
      const {a,b,c}=cometOrbitEllipse();
      ctx.save();
      ctx.translate(panX,panY); ctx.scale(zoom,zoom);
      ctx.beginPath(); ctx.ellipse(-c,0,a,b,0,0,Math.PI*2);
      ctx.strokeStyle='rgba(148,163,184,0.2)'; ctx.lineWidth=1/zoom;
      ctx.setLineDash([5/zoom,5/zoom]); ctx.stroke(); ctx.setLineDash([]);
      ctx.restore();
    }
  }

  // ASTEROID BELT
  if(showAst){
    ctx.save(); ctx.translate(panX,panY); ctx.scale(zoom,zoom);
    ASTS.forEach(a=>{
      const r=distMode==='opt'?a.oD:a.rD*130;
      const ang=a.a+simTime*0.3*a.sp;
      ctx.fillStyle='rgba(148,163,184,'+a.al+')';
      ctx.beginPath(); ctx.arc(Math.cos(ang)*r,Math.sin(ang)*r,a.sz,0,Math.PI*2); ctx.fill();
    });
    ctx.restore();
  }

  // SUN
  const sR=sunRad();
  const sg=ctx.createRadialGradient(panX,panY,sR*.4*zoom,panX,panY,(sR+30)*zoom);
  sg.addColorStop(0,'rgba(251,191,36,0.85)');
  sg.addColorStop(.3,'rgba(245,158,11,0.45)');
  sg.addColorStop(1,'rgba(245,158,11,0)');
  ctx.beginPath(); ctx.arc(panX,panY,(sR+30)*zoom,0,Math.PI*2); ctx.fillStyle=sg; ctx.fill();
  ctx.beginPath(); ctx.arc(panX,panY,sR*zoom,0,Math.PI*2); ctx.fillStyle='#f59e0b'; ctx.fill();
  ctx.beginPath(); ctx.arc(panX,panY,sR*.6*zoom,0,Math.PI*2); ctx.fillStyle='#fffbeb'; ctx.fill();
  if(showLabel&&zoom>.3){
    ctx.font='11px sans-serif'; ctx.fillStyle='#fcd34d'; ctx.textAlign='center';
    ctx.fillText('太阳',panX,panY-(sR+10)*zoom);
  }

  // PLANETS
  PLANETS.forEach(p=>{
    const d=pDist(p);
    const px=panX+Math.cos(p.a)*d*zoom;
    const py=panY+Math.sin(p.a)*d*zoom;
    const rad=Math.max(pRad(p)*zoom,1.5);

    // halo
    const hl=ctx.createRadialGradient(px,py,rad*.3,px,py,rad*3);
    hl.addColorStop(0,p.col+'66'); hl.addColorStop(1,p.col+'00');
    ctx.beginPath(); ctx.arc(px,py,rad*3,0,Math.PI*2); ctx.fillStyle=hl; ctx.fill();

    // body
    ctx.save(); ctx.translate(px,py);
    ctx.beginPath(); ctx.arc(0,0,rad,0,Math.PI*2); ctx.fillStyle=p.col; ctx.fill();

    if(p.bands&&rad>5){
      ctx.save(); ctx.beginPath(); ctx.arc(0,0,rad,0,Math.PI*2); ctx.clip();
      ctx.strokeStyle='rgba(120,53,4,0.45)'; ctx.lineWidth=rad*.25;
      [-0.38,0.38].forEach(fy=>{ ctx.beginPath();ctx.moveTo(-rad,rad*fy);ctx.lineTo(rad,rad*fy);ctx.stroke(); });
      ctx.restore();
    }

    // Shadow
    const sunAngle=Math.atan2(panY-py,panX-px);
    ctx.save();
    ctx.beginPath(); ctx.arc(0,0,rad,0,Math.PI*2); ctx.clip();
    ctx.rotate(sunAngle);
    ctx.fillStyle='rgba(0,0,0,0.55)';
    ctx.fillRect(-rad,-rad,rad,rad*2);
    ctx.restore();
    ctx.restore();

    // rings (Saturn)
    if(p.rings){
      ctx.save(); ctx.translate(px,py); ctx.rotate(.28); ctx.scale(2.1,.5);
      ctx.beginPath(); ctx.arc(0,0,rad*1.15,0,Math.PI*2);
      ctx.strokeStyle='rgba(234,179,8,0.6)'; ctx.lineWidth=3.5*zoom; ctx.stroke();
      ctx.beginPath(); ctx.arc(0,0,rad*1.45,0,Math.PI*2);
      ctx.strokeStyle='rgba(161,98,7,0.3)'; ctx.lineWidth=1.5*zoom; ctx.stroke();
      ctx.restore();
    }

    // moons
    if(p.satellites){
      p.satellites.forEach(m=>{
        const mD=distMode==='opt'?m.oD:Math.max(m.rD*130*.55,(rad/zoom)*2);
        const mR=Math.max((sizeMode==='opt'?m.oR:m.rR*.5)*zoom,1);
        const mx=px+Math.cos(m.a)*mD*zoom, my=py+Math.sin(m.a)*mD*zoom;
        if(showOrbit){ ctx.beginPath();ctx.arc(px,py,mD*zoom,0,Math.PI*2);ctx.strokeStyle='rgba(148,163,184,0.12)';ctx.lineWidth=.5;ctx.stroke(); }
        ctx.beginPath(); ctx.arc(mx,my,mR,0,Math.PI*2); ctx.fillStyle=m.col; ctx.fill();
        if(showLabel&&zoom>1.8){ctx.font='8px sans-serif';ctx.fillStyle='#9ca3af';ctx.textAlign='center';ctx.fillText(m.name,mx,my-mR-3);}
      });
    }

    if(showLabel&&zoom>.3){
      ctx.font='11px sans-serif'; ctx.fillStyle='#94a3b8'; ctx.textAlign='center';
      ctx.fillText(p.name,px,py-rad-7);
    }

    if(focused&&focused.id===p.id){
      ctx.save(); ctx.beginPath(); ctx.arc(px,py,rad+8,0,Math.PI*2);
      ctx.strokeStyle='#06b6d4'; ctx.lineWidth=1.5; ctx.setLineDash([4,4]); ctx.stroke();
      ctx.setLineDash([]); ctx.restore();
    }
  });

  // COMET
  if(showAst){
    const {x:cx,y:cy}=cometScreen();
    const dx=cx-panX, dy=cy-panY, ds=Math.hypot(dx,dy)||1;
    const ux=dx/ds, uy=dy/ds;
    const tLen=Math.min(80/(ds/zoom/80+.4),160)*zoom;
    if(tLen>3){
      const tx=cx+ux*tLen, ty=cy+uy*tLen;
      const tg=ctx.createLinearGradient(cx,cy,tx,ty);
      tg.addColorStop(0,'rgba(226,232,240,0.9)');
      tg.addColorStop(.4,'rgba(148,163,184,0.35)');
      tg.addColorStop(1,'rgba(148,163,184,0)');
      const pw=Math.max(2.5*zoom,1.5);
      ctx.beginPath();
      ctx.moveTo(cx+(-uy*pw),cy+(ux*pw));
      ctx.lineTo(tx,ty);
      ctx.lineTo(cx+(uy*pw),cy+(-ux*pw));
      ctx.closePath(); ctx.fillStyle=tg; ctx.fill();
    }
    ctx.beginPath(); ctx.arc(cx,cy,Math.max(2.5*zoom,2),0,Math.PI*2);
    ctx.fillStyle='#f1f5f9'; ctx.fill();
    if(showLabel&&zoom>.3){
      ctx.font='10px sans-serif'; ctx.fillStyle='#cbd5e1'; ctx.textAlign='center';
      ctx.fillText('哈雷彗星',cx,cy-Math.max(2.5*zoom,2)-5);
    }
  }

  // 绘制防盗版水印 — 峇株吧辖华仁中学蔡逸众制作 | 华仁中学蔡逸众制作
  drawWatermark();
  // 底部版权条 — Made by ecchua79 | 峇株吧辖蔡逸众制作
  drawCopyrightBar();

  requestAnimationFrame(draw);
}
