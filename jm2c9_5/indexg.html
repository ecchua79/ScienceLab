<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D滑轮组力学演示 - 完美缠绕版</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #0f172a; font-family: sans-serif; user-select: none; }
        #webgl-container { width: 100vw; height: 100vh; position: absolute; z-index: 1; }
        #ui-layer { position: relative; z-index: 10; pointer-events: none; width: 100%; height: 100%; }
        .pointer-events-auto { pointer-events: auto; }
        .glass-panel {
            background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="text-slate-100">

    <div id="webgl-container"></div>

    <div id="ui-layer">
        <!-- 控制面板 -->
        <div id="control-panel" class="absolute top-4 right-4 max-w-sm w-[calc(100vw-2rem)] sm:w-80 pointer-events-auto transition-all duration-300">
            <div class="glass-panel rounded-2xl shadow-2xl overflow-hidden flex flex-col">
                <div id="panel-header" class="p-4 bg-slate-800/90 flex justify-between items-center cursor-pointer border-b border-slate-700/50">
                    <div class="flex items-center space-x-2">
                        <i class="fa-solid fa-gears text-indigo-400"></i>
                        <h1 class="font-bold text-base">滑轮组物理引擎控制台</h1>
                    </div>
                    <i id="toggle-icon" class="fa-solid fa-chevron-up text-slate-400"></i>
                </div>

                <div id="panel-body" class="p-4 space-y-4 max-h-[75vh] overflow-y-auto no-scrollbar transition-all duration-300">
                    <!-- 滑轮数量 -->
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-2">配置切换 (2 - 6 滑轮)</label>
                        <div class="grid grid-cols-5 gap-1.5" id="pulley-num-selector">
                            <button data-num="2" class="pulley-btn py-1.5 rounded-lg text-sm font-bold border border-slate-600 bg-slate-700/50 hover:bg-slate-600 transition">2</button>
                            <button data-num="3" class="pulley-btn py-1.5 rounded-lg text-sm font-bold border border-slate-600 bg-slate-700/50 hover:bg-slate-600 transition">3</button>
                            <button data-num="4" class="pulley-btn py-1.5 rounded-lg text-sm font-bold border border-indigo-500 bg-indigo-600 text-white shadow-lg shadow-indigo-600/30 transition">4</button>
                            <button data-num="5" class="pulley-btn py-1.5 rounded-lg text-sm font-bold border border-slate-600 bg-slate-700/50 hover:bg-slate-600 transition">5</button>
                            <button data-num="6" class="pulley-btn py-1.5 rounded-lg text-sm font-bold border border-slate-600 bg-slate-700/50 hover:bg-slate-600 transition">6</button>
                        </div>
                    </div>

                    <!-- 参数 -->
                    <div class="space-y-4 bg-slate-900/60 p-4 rounded-xl border border-slate-700/50">
                        <div>
                            <div class="flex justify-between text-xs mb-2">
                                <span class="text-slate-400">负载重力 (G)</span>
                                <span id="weight-val" class="text-indigo-400 font-mono font-bold">120 N</span>
                            </div>
                            <input id="weight-slider" type="range" min="60" max="300" step="10" value="120" class="w-full accent-indigo-500 h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer">
                        </div>
                    </div>

                    <!-- 动画按钮 -->
                    <div class="flex space-x-2">
                        <button id="play-pause-btn" class="flex-1 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 font-bold text-sm shadow-lg shadow-indigo-600/30 flex items-center justify-center space-x-2 transition">
                            <i id="play-icon" class="fa-solid fa-pause"></i>
                            <span id="play-text">暂停演示</span>
                        </button>
                    </div>

                    <!-- 实时数据 -->
                    <div class="bg-gradient-to-br from-indigo-950/60 to-slate-900/60 p-3.5 rounded-xl border border-indigo-500/30 text-xs space-y-3">
                        <div class="font-bold text-indigo-300 border-b border-indigo-500/20 pb-2 flex justify-between items-center">
                            <span><i class="fa-solid fa-calculator mr-1"></i> 力学分析</span>
                            <span id="mechanical-advantage" class="bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded text-[10px]">省力 4 倍</span>
                        </div>
                        <div class="grid grid-cols-2 gap-3 text-slate-300 font-mono text-[11px]">
                            <div>手端拉力 (F)<br><span id="force-val" class="text-amber-400 font-bold text-sm">30.0 N</span></div>
                            <div>承重段数 (n)<br><span id="rope-count-val" class="text-emerald-400 font-bold text-sm">4</span></div>
                            <div>重物上升 (h)<br><span id="load-dist-val" class="text-white">0.00 m</span></div>
                            <div>拉绳距离 (s)<br><span id="rope-dist-val" class="text-white">0.00 m</span></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 部件说明弹窗 -->
        <div id="info-modal" class="absolute bottom-8 left-1/2 -translate-x-1/2 z-20 transition-all duration-300 opacity-0 pointer-events-none max-w-sm w-[calc(100vw-2rem)]">
            <div class="glass-panel p-4 rounded-2xl border border-indigo-500/40 shadow-[0_0_30px_rgba(79,70,229,0.2)] flex items-start space-x-3 pointer-events-auto">
                <div class="bg-indigo-600/30 p-2.5 rounded-xl border border-indigo-400/40 text-indigo-300 shrink-0">
                    <i id="info-icon" class="fa-solid fa-circle-info text-xl"></i>
                </div>
                <div class="flex-1 min-w-0">
                    <h3 id="info-title" class="font-bold text-sm text-indigo-200">名称</h3>
                    <p id="info-desc" class="text-xs text-slate-300 mt-1 leading-relaxed">描述</p>
                </div>
                <button id="close-info" class="text-slate-400 hover:text-white p-1">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- 核心变量 ---
        let scene, camera, renderer, controls;
        let isPlaying = true, animTime = 0;
        
        let pulleyCount = 4; 
        let weightForce = 120;
        
        const baseHeight = 12; // 顶部横梁高度
        let loadDisplacement = 0;
        const maxDisplacement = 4.0;
        
        let topBlockGroup, bottomBlockGroup, ropeMesh, weightMesh, pullerHandMesh;
        let pulleySequence = []; // 决定穿绳顺序的核心数据结构
        const pulleyRadius = 1.0; 
        const deltaZ = 0.5; // 滑轮之间在 Z 轴的厚度间距

        let interactiveObjects = [];

        // --- 场景初始化 ---
        function initScene() {
            const container = document.getElementById('webgl-container');
            
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x0f172a, 0.015);

            // 设置正面偏右视角，确保能清晰看到 6 滑轮的纵深排列
            camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 7, 30); 

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.target.set(0, 5, 0);

            setupLights();
            setupEnvironment();
            buildPulleySystem();

            window.addEventListener('resize', onWindowResize);
            renderer.domElement.addEventListener('pointerdown', onPointerDown);
        }

        function setupLights() {
            scene.add(new THREE.AmbientLight(0xffffff, 0.6));
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(10, 20, 15);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.set(2048, 2048);
            scene.add(dirLight);
        }

        function setupEnvironment() {
            const gridHelper = new THREE.GridHelper(50, 50, 0x334155, 0x1e293b);
            gridHelper.position.y = -3;
            scene.add(gridHelper);

            // 支撑立柱框架
            const frameMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8 });
            const topFrame = new THREE.Mesh(new THREE.BoxGeometry(16, 0.8, 6), frameMat);
            topFrame.position.set(0, baseHeight + 1.2, 0);
            scene.add(topFrame);

            const pillarGeo = new THREE.CylinderGeometry(0.3, 0.3, baseHeight + 4);
            const p1 = new THREE.Mesh(pillarGeo, frameMat); p1.position.set(-7, (baseHeight+4)/2 - 3, 0); scene.add(p1);
            const p2 = new THREE.Mesh(pillarGeo, frameMat); p2.position.set(7, (baseHeight+4)/2 - 3, 0); scene.add(p2);
        }

        // --- 滑轮几何体 (使其法线朝向 Z 轴正前方) ---
        function createPulleyGeometry() {
            const shape = new THREE.Shape();
            const R = pulleyRadius;
            const thick = 0.15, groove = 0.12;
            shape.moveTo(0.2, -thick);
            shape.lineTo(R, -thick);
            shape.lineTo(R - groove, 0);
            shape.lineTo(R, thick);
            shape.lineTo(0.2, thick);
            shape.closePath();
            
            const geo = new THREE.LatheGeometry(shape.getPoints(), 48);
            // 将平躺的滑轮竖立起来，使得圆截面处于 X-Y 平面，方便我们在 X-Y 视角下观察
            geo.rotateX(Math.PI / 2);
            return geo;
        }

        const pulleyGeometry = createPulleyGeometry();
        const brassMat = new THREE.MeshStandardMaterial({ color: 0xd97706, metalness: 0.7, roughness: 0.2 });
        const steelMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8, metalness: 0.9, roughness: 0.4 });
        const ropeMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.9 });

        // --- 核心重构：构建平行的滑轮系统 ---
        function buildPulleySystem() {
            if (topBlockGroup) scene.remove(topBlockGroup);
            if (bottomBlockGroup) scene.remove(bottomBlockGroup);
            if (ropeMesh) scene.remove(ropeMesh);
            if (weightMesh) scene.remove(weightMesh);
            if (pullerHandMesh) scene.remove(pullerHandMesh);

            interactiveObjects = [];
            pulleySequence = [];

            topBlockGroup = new THREE.Group();
            topBlockGroup.position.set(0, baseHeight, 0);
            scene.add(topBlockGroup);

            bottomBlockGroup = new THREE.Group();
            bottomBlockGroup.position.set(0, baseHeight - 7, 0);
            scene.add(bottomBlockGroup);

            // 根据滑轮总数计算 Z 轴起始位置，保证整体居中
            const startZ = -(pulleyCount * deltaZ) / 2;
            let isEven = (pulleyCount % 2 === 0);

            // ★ 核心穿线逻辑映射表 (保证不穿模，交替进出) ★
            // Even: Anchor(Top) -> Btm0 -> Top0 -> Btm1 -> Top1 -> Pull
            // Odd: Anchor(Btm) -> Top0 -> Btm0 -> Top1 -> Btm1 -> Top2 -> Pull
            if (isEven) {
                for (let i = 0; i < pulleyCount / 2; i++) {
                    pulleySequence.push({ type: 'btm', z: startZ + (i * 2 + 1) * deltaZ, mesh: null });
                    pulleySequence.push({ type: 'top', z: startZ + (i * 2 + 2) * deltaZ, mesh: null });
                }
            } else {
                pulleySequence.push({ type: 'top', z: startZ + 1 * deltaZ, mesh: null });
                for (let i = 0; i < Math.floor(pulleyCount / 2); i++) {
                    pulleySequence.push({ type: 'btm', z: startZ + (i * 2 + 2) * deltaZ, mesh: null });
                    pulleySequence.push({ type: 'top', z: startZ + (i * 2 + 3) * deltaZ, mesh: null });
                }
            }

            // 实例化各个滑轮
            pulleySequence.forEach(node => {
                const p = new THREE.Mesh(pulleyGeometry, brassMat);
                p.position.set(0, 0, node.z); 
                node.mesh = p;
                if (node.type === 'top') topBlockGroup.add(p);
                else bottomBlockGroup.add(p);
            });

            // 构建公共的主轴承托架 (容纳所有并列滑轮)
            const bracketZCenter = startZ + (pulleyCount * deltaZ) / 2;
            const bracketLen = pulleyCount * deltaZ + 0.8;
            
            const frameGeo = new THREE.BoxGeometry(2.6, 0.4, bracketLen);
            const frameTop = new THREE.Mesh(frameGeo, steelMat);
            frameTop.position.set(0, 1.2, bracketZCenter);
            topBlockGroup.add(frameTop);
            
            const frameBtm = new THREE.Mesh(frameGeo, steelMat);
            frameBtm.position.set(0, -1.2, bracketZCenter);
            bottomBlockGroup.add(frameBtm);

            // 贯穿滑轮的横轴
            const axleGeo = new THREE.CylinderGeometry(0.15, 0.15, bracketLen);
            axleGeo.rotateX(Math.PI/2);
            
            const axleTop = new THREE.Mesh(axleGeo, steelMat);
            axleTop.position.set(0, 0, bracketZCenter);
            topBlockGroup.add(axleTop);
            
            const axleBtm = new THREE.Mesh(axleGeo, steelMat);
            axleBtm.position.set(0, 0, bracketZCenter);
            bottomBlockGroup.add(axleBtm);

            // 悬挂重物 (固定在 Bottom Bracket 正下方中间)
            const weightGeo = new THREE.CylinderGeometry(1.2, 1.5, 2.2, 32);
            const weightMaterial = new THREE.MeshStandardMaterial({ color: 0xef4444 });
            weightMesh = new THREE.Mesh(weightGeo, weightMaterial);
            weightMesh.position.set(0, -3.0, bracketZCenter);
            bottomBlockGroup.add(weightMesh);

            // 牵引端绿球
            pullerHandMesh = new THREE.Mesh(new THREE.SphereGeometry(0.4, 32, 32), new THREE.MeshStandardMaterial({ color: 0x10b981 }));
            scene.add(pullerHandMesh);

            ropeMesh = new THREE.Mesh(new THREE.BufferGeometry(), ropeMat);
            scene.add(ropeMesh);

            // 交互元数据
            topBlockGroup.userData = { name: "定滑轮组", icon: "fa-anchor", desc: "主轴固定在上方，能改变力的方向。它们平齐排列在 Z 轴上。" };
            bottomBlockGroup.userData = { name: "动滑轮组", icon: "fa-arrows-up-down", desc: "随重物升降的滑轮，每增加一段连接绳索即可多省一份力。" };
            weightMesh.userData = { name: "负载重物", icon: "fa-weight-hanging", desc: "受到重力 G 作用的物体。" };
            
            interactiveObjects.push(topBlockGroup, bottomBlockGroup, weightMesh);

            updateRopesAndPositions();
            updateUI();
        }

        // 插入密集控制点以保证管状模型 (TubeGeometry) 在直线部分绝对笔直，不扭曲
        function addStraightLine(p1, p2, ptsArray) {
            const steps = 12; // 恒定分段，防止数组长度剧烈波动
            for(let i=1; i<=steps; i++) {
                ptsArray.push(new THREE.Vector3().lerpVectors(p1, p2, i/steps));
            }
        }

        // --- 核心算法：实时重构完美的 3D 绳索路径 ---
        function updateRopesAndPositions() {
            const btmY = (baseHeight - 7) + loadDisplacement;
            bottomBlockGroup.position.y = btmY;

            // 滑轮自转 (基于移动距离)
            const rotAngle = loadDisplacement / pulleyRadius;
            pulleySequence.forEach((node, idx) => {
                // 因为完美缠绕方向一致，所有滑轮都是一个方向旋转 (假设顺时针)
                node.mesh.rotation.z = -rotAngle; 
            });

            const points = [];
            let isEven = (pulleyCount % 2 === 0);
            const R = pulleyRadius;
            
            // 锚点位置计算
            const startZ = -(pulleyCount * deltaZ) / 2;
            const anchorZ = startZ;
            const anchorX = isEven ? R : -R;
            const anchorGlobalY = isEven ? baseHeight + 1.0 : btmY - 1.0;
            
            let prevP = new THREE.Vector3(anchorX, anchorGlobalY, anchorZ);
            points.push(prevP);

            // 遍历各个滑轮生成切线与半圆周
            pulleySequence.forEach(step => {
                const isTop = (step.type === 'top');
                const cy = isTop ? baseHeight : btmY;
                const cz = step.z;
                
                // 根据穿插方向，顶部滑轮从左(-R)进右(+R)出，底部滑轮从右(+R)进左(-R)出
                const startX = isTop ? -R : R;
                
                // 1. 直线接近切点
                const pIn = new THREE.Vector3(startX, cy, cz);
                addStraightLine(prevP, pIn, points);

                // 2. 半圆弧线环绕
                const startAngle = isTop ? Math.PI : 0;
                const endAngle = isTop ? 0 : -Math.PI;
                const arcSteps = 16;
                for(let j=1; j<=arcSteps; j++) {
                    const angle = startAngle + (endAngle - startAngle) * (j / arcSteps);
                    points.push(new THREE.Vector3(R * Math.cos(angle), cy + R * Math.sin(angle), cz));
                }
                
                prevP = points[points.length - 1];
            });

            // 终点手拉部分：根据省力公式，手拉位移 s = n * h
            const lastNode = pulleySequence[pulleySequence.length - 1];
            const pullDistance = loadDisplacement * pulleyCount; 
            
            // 手总是从最外侧(右侧)拉出
            const handX = R + 3.0; 
            const baseHandY = baseHeight - 3.0;
            const handY = baseHandY - pullDistance; 
            const handZ = lastNode.z + 0.5;

            const pHand = new THREE.Vector3(handX, handY, handZ);
            addStraightLine(prevP, pHand, points);
            pullerHandMesh.position.copy(pHand);

            // 刷新绳索几何体
            const curve = new THREE.CatmullRomCurve3(points, false, 'catmullrom', 0.01);
            if (ropeMesh.geometry) ropeMesh.geometry.dispose();
            // 分段数充足即可保证极度顺滑
            ropeMesh.geometry = new THREE.TubeGeometry(curve, points.length * 2, 0.05, 10, false);
        }

        // --- 动画循环 ---
        function animate() {
            requestAnimationFrame(animate);

            if (isPlaying) {
                animTime += 0.015;
                // 正弦波缓动 (0 到 maxDisplacement)
                loadDisplacement = (Math.sin(animTime) + 1) * (maxDisplacement / 2);
                updateRopesAndPositions();
                updateRealtimeData();
            }

            controls.update();
            renderer.render(scene, camera);
        }

        // --- 数据 UI 绑定 ---
        function updateUI() {
            const f = (weightForce / pulleyCount).toFixed(1);
            document.getElementById('mechanical-advantage').innerText = `省力 ${pulleyCount} 倍`;
            document.getElementById('force-val').innerText = `${f} N`;
            document.getElementById('rope-count-val').innerText = `${pulleyCount}`;
            document.getElementById('weight-val').innerText = `${weightForce} N`;
        }

        function updateRealtimeData() {
            document.getElementById('load-dist-val').innerText = `${loadDisplacement.toFixed(2)} m`;
            document.getElementById('rope-dist-val').innerText = `${(loadDisplacement * pulleyCount).toFixed(2)} m`;
        }

        // --- DOM 事件与交互 ---
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function onPointerDown(event) {
            if (event.target.closest('#control-panel') || event.target.closest('#info-modal')) return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            const intersects = raycaster.intersectObjects(interactiveObjects, true);
            if (intersects.length > 0) {
                let obj = intersects[0].object;
                while (obj && (!obj.userData || !obj.userData.name) && obj.parent) {
                    obj = obj.parent;
                }
                if (obj && obj.userData.name) {
                    document.getElementById('info-title').innerText = obj.userData.name;
                    document.getElementById('info-desc').innerText = obj.userData.desc;
                    document.getElementById('info-icon').className = `fa-solid ${obj.userData.icon} text-xl`;
                    document.getElementById('info-modal').classList.replace('opacity-0', 'opacity-100');
                    document.getElementById('info-modal').classList.replace('pointer-events-none', 'pointer-events-auto');
                }
            } else {
                document.getElementById('info-modal').classList.replace('opacity-100', 'opacity-0');
                document.getElementById('info-modal').classList.replace('pointer-events-auto', 'pointer-events-none');
            }
        }

        // UI 事件挂载
        document.getElementById('panel-header').addEventListener('click', () => {
            const body = document.getElementById('panel-body');
            const icon = document.getElementById('toggle-icon');
            body.classList.toggle('hidden');
            icon.className = body.classList.contains('hidden') ? 'fa-solid fa-chevron-down text-slate-400' : 'fa-solid fa-chevron-up text-slate-400';
        });

        document.querySelectorAll('.pulley-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.pulley-btn').forEach(b => {
                    b.className = "pulley-btn py-1.5 rounded-lg text-sm font-bold border border-slate-600 bg-slate-700/50 hover:bg-slate-600 transition";
                });
                btn.className = "pulley-btn py-1.5 rounded-lg text-sm font-bold border border-indigo-500 bg-indigo-600 text-white shadow-lg shadow-indigo-600/30 transition";
                pulleyCount = parseInt(btn.getAttribute('data-num'));
                buildPulleySystem();
            });
        });

        document.getElementById('weight-slider').addEventListener('input', (e) => {
            weightForce = parseInt(e.target.value);
            updateUI();
        });

        document.getElementById('play-pause-btn').addEventListener('click', function() {
            isPlaying = !isPlaying;
            this.className = isPlaying 
                ? "flex-1 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 font-bold text-sm shadow-lg shadow-indigo-600/30 flex items-center justify-center space-x-2 transition" 
                : "flex-1 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 font-bold text-sm shadow-lg shadow-emerald-600/30 flex items-center justify-center space-x-2 transition";
            document.getElementById('play-icon').className = isPlaying ? 'fa-solid fa-pause' : 'fa-solid fa-play';
            document.getElementById('play-text').innerText = isPlaying ? '暂停演示' : '继续动画';
        });

        document.getElementById('close-info').addEventListener('click', () => {
            document.getElementById('info-modal').classList.replace('opacity-100', 'opacity-0');
            document.getElementById('info-modal').classList.replace('pointer-events-auto', 'pointer-events-none');
        });

        window.onload = () => {
            initScene();
            animate();
        };
    </script>
</body>
</html>
