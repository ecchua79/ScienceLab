<!-- 华仁中学蔡逸众制作 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>光的奇妙世界 🌟 初一科学第7章</title>
<!-- 峇株吧辖蔡逸众制作 -->
<style>
/* 峇株吧辖华仁中学蔡逸众制作 */
:root {
  --bg: #0a0a1a;
  --panel: #12122a;
  --card: #1a1a3e;
  --accent: #f7c948;
  --accent2: #5bf5e0;
  --accent3: #ff6f91;
  --accent4: #a78bfa;
  --text: #e8e8ff;
  --text-dim: #8888aa;
  --success: #4ade80;
  --danger: #f87171;
  --border: rgba(255,255,255,0.08);
  --glow: 0 0 24px rgba(247,201,72,0.25);
  --glow2: 0 0 24px rgba(91,245,224,0.2);
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;overflow-x:hidden;}

/* ─── STARFIELD ─── */
#stars{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.star{position:absolute;border-radius:50%;background:#fff;animation:twinkle var(--d,3s) ease-in-out infinite;}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(1);}50%{opacity:.9;transform:scale(1.5);}}

/* ─── LAYOUT ─── */
#app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;}

/* ─── SCREENS ─── */
.screen{display:none;width:100%;max-width:780px;animation:fadeUp .5s ease;}
.screen.active{display:block;}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:translateY(0);}}

/* ─── START SCREEN ─── */
#startScreen{text-align:center;padding:32px 16px;}
.game-title{font-size:clamp(2rem,8vw,3.4rem);font-weight:900;letter-spacing:-1px;
  background:linear-gradient(135deg,var(--accent),var(--accent2),var(--accent4));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  line-height:1.1;margin-bottom:8px;}
.game-subtitle{color:var(--text-dim);font-size:1rem;margin-bottom:28px;}
.light-ray-demo{width:220px;height:80px;margin:0 auto 24px;position:relative;overflow:hidden;}
.ray{position:absolute;height:2px;border-radius:2px;animation:rayAnim 2s ease-in-out infinite;}
.ray1{width:120px;left:-10px;top:20px;background:linear-gradient(90deg,transparent,var(--accent));animation-delay:0s;}
.ray2{width:90px;left:-10px;top:40px;background:linear-gradient(90deg,transparent,var(--accent2));animation-delay:.3s;}
.ray3{width:110px;left:-10px;top:60px;background:linear-gradient(90deg,transparent,var(--accent3));animation-delay:.6s;}
@keyframes rayAnim{0%{transform:translateX(0);opacity:0;}50%{opacity:1;}100%{transform:translateX(240px);opacity:0;}}
.info-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:24px 0;}
.info-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 12px;text-align:center;}
.info-card .icon{font-size:1.8rem;margin-bottom:6px;}
.info-card .label{font-size:.78rem;color:var(--text-dim);}
.info-card .val{font-size:1.1rem;font-weight:700;color:var(--accent);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:14px 32px;border-radius:50px;border:none;cursor:pointer;font-size:1rem;font-weight:700;
  transition:all .2s;position:relative;overflow:hidden;}
.btn::after{content:'';position:absolute;inset:0;background:rgba(255,255,255,.12);opacity:0;transition:opacity .2s;}
.btn:hover::after{opacity:1;}
.btn:active{transform:scale(.96);}
.btn-primary{background:linear-gradient(135deg,#f7c948,#ffaa00);color:#1a1000;box-shadow:var(--glow);}
.btn-secondary{background:var(--card);color:var(--accent2);border:1px solid var(--accent2);box-shadow:var(--glow2);}
.btn-danger{background:linear-gradient(135deg,#f87171,#ef4444);color:#fff;}
.btn-success{background:linear-gradient(135deg,#4ade80,#22c55e);color:#0a1f00;}
.credit{margin-top:16px;font-size:.7rem;color:rgba(255,255,255,.08);user-select:none;}

/* ─── HUD ─── */
#hud{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;
  background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:12px 18px;margin-bottom:18px;}
.hud-block{display:flex;flex-direction:column;align-items:center;}
.hud-label{font-size:.65rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:.08em;}
.hud-val{font-size:1.2rem;font-weight:800;color:var(--accent);}
#livesDisplay{display:flex;gap:4px;font-size:1.3rem;}
#comboBar{height:4px;background:rgba(255,255,255,.1);border-radius:4px;overflow:hidden;width:80px;}
#comboFill{height:100%;background:linear-gradient(90deg,var(--accent3),var(--accent));width:0%;transition:width .3s;}

/* ─── LEVEL BANNER ─── */
#levelBanner{text-align:center;margin-bottom:16px;}
.level-tag{display:inline-block;background:linear-gradient(135deg,var(--accent4),#7c3aed);
  color:#fff;font-size:.8rem;font-weight:700;padding:4px 16px;border-radius:50px;margin-bottom:6px;}
.level-title{font-size:1.3rem;font-weight:800;color:var(--accent2);}
.level-desc{font-size:.85rem;color:var(--text-dim);margin-top:4px;}

/* ─── QUESTION CARD ─── */
#questionCard{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:24px;margin-bottom:16px;}
.q-type-badge{font-size:.7rem;font-weight:700;padding:3px 12px;border-radius:50px;display:inline-block;margin-bottom:10px;}
.badge-mcq{background:rgba(167,139,250,.2);color:var(--accent4);}
.badge-tf{background:rgba(91,245,224,.2);color:var(--accent2);}
.badge-drag{background:rgba(255,111,145,.2);color:var(--accent3);}
.badge-order{background:rgba(247,201,72,.2);color:var(--accent);}
.badge-fill{background:rgba(74,222,128,.2);color:var(--success);}
.q-text{font-size:1.05rem;font-weight:600;line-height:1.55;margin-bottom:18px;}
.q-visual{text-align:center;margin-bottom:14px;}
.q-visual canvas{border-radius:10px;max-width:100%;border:1px solid var(--border);}

/* MCQ OPTIONS */
.options-grid{display:grid;gap:10px;}
.opt-btn{background:rgba(255,255,255,.04);border:1.5px solid var(--border);border-radius:12px;
  padding:12px 16px;text-align:left;cursor:pointer;transition:all .2s;font-size:.95rem;color:var(--text);
  display:flex;align-items:center;gap:10px;}
.opt-btn:hover{border-color:var(--accent2);background:rgba(91,245,224,.07);}
.opt-btn.correct{border-color:var(--success);background:rgba(74,222,128,.12);color:var(--success);}
.opt-btn.wrong{border-color:var(--danger);background:rgba(248,113,113,.12);color:var(--danger);}
.opt-letter{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.08);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex-shrink:0;}

/* TF BUTTONS */
.tf-row{display:flex;gap:12px;justify-content:center;}
.tf-btn{flex:1;max-width:180px;padding:18px;border-radius:16px;font-size:1rem;font-weight:700;}

/* DRAG DROP */
#dragArea{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:16px;}
.drag-chip{background:var(--card);border:1.5px solid var(--accent4);border-radius:50px;
  padding:8px 18px;cursor:grab;user-select:none;font-size:.9rem;transition:all .2s;touch-action:none;}
.drag-chip:active{cursor:grabbing;transform:scale(1.05);}
.drag-chip.dragging{opacity:.5;}
.drop-zones{display:grid;gap:10px;}
.drop-zone{background:rgba(255,255,255,.03);border:2px dashed var(--border);border-radius:12px;
  padding:14px;min-height:58px;transition:border-color .2s;}
.drop-zone.over{border-color:var(--accent2);background:rgba(91,245,224,.06);}
.drop-zone-label{font-size:.75rem;color:var(--text-dim);margin-bottom:8px;}
.drop-zone-items{display:flex;flex-wrap:wrap;gap:6px;}
.dropped-chip{background:rgba(167,139,250,.15);border:1px solid var(--accent4);border-radius:50px;
  padding:5px 14px;font-size:.85rem;display:flex;align-items:center;gap:6px;}
.dropped-chip .remove{cursor:pointer;color:var(--danger);font-size:.7rem;}

/* ORDER */
#orderList{display:flex;flex-direction:column;gap:8px;}
.order-item{background:rgba(255,255,255,.04);border:1.5px solid var(--border);border-radius:12px;
  padding:12px 16px;cursor:grab;display:flex;align-items:center;gap:10px;touch-action:none;
  transition:border-color .2s,background .2s;}
.order-item:active{cursor:grabbing;}
.order-item.dragging-order{opacity:.4;}
.order-item.over-order{border-color:var(--accent);background:rgba(247,201,72,.08);}
.order-handle{color:var(--text-dim);font-size:1.1rem;}
.order-num{width:26px;height:26px;border-radius:50%;background:rgba(247,201,72,.15);
  color:var(--accent);font-weight:700;font-size:.8rem;display:flex;align-items:center;justify-content:center;}

/* FILL BLANK */
#fillArea{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
.word-chip{background:var(--card);border:1.5px solid var(--accent2);border-radius:50px;
  padding:8px 18px;cursor:pointer;font-size:.9rem;transition:all .2s;}
.word-chip:hover{background:rgba(91,245,224,.1);}
.word-chip.used{opacity:.3;pointer-events:none;}
.fill-sentence{font-size:1rem;line-height:2.2;background:rgba(255,255,255,.03);
  border:1px solid var(--border);border-radius:12px;padding:14px 18px;}
.fill-blank{display:inline-block;min-width:80px;border-bottom:2px solid var(--accent2);
  text-align:center;padding:2px 8px;margin:0 4px;cursor:pointer;color:var(--accent2);
  font-weight:700;position:relative;}
.fill-blank.filled{border-color:var(--accent);color:var(--accent);}

/* FEEDBACK */
#feedback{border-radius:14px;padding:14px 18px;margin-bottom:14px;display:none;animation:fadeUp .3s ease;}
#feedback.show{display:block;}
#feedback.correct-fb{background:rgba(74,222,128,.12);border:1px solid var(--success);}
#feedback.wrong-fb{background:rgba(248,113,113,.12);border:1px solid var(--danger);}
.fb-header{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1rem;margin-bottom:6px;}
.fb-icon{font-size:1.3rem;}
.fb-text{font-size:.88rem;color:var(--text-dim);line-height:1.5;}

/* TIMER BAR */
#timerWrap{height:6px;background:rgba(255,255,255,.08);border-radius:6px;overflow:hidden;margin-bottom:6px;}
#timerBar{height:100%;border-radius:6px;transition:width .5s linear,background .5s;
  background:linear-gradient(90deg,var(--success),var(--accent));}

/* ACTION BAR */
#actionBar{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;}

/* LEVEL TRANSITION */
#levelTransition{text-align:center;padding:48px 16px;}
.lt-star{font-size:4rem;animation:spin 1s ease-in-out;}
@keyframes spin{from{transform:rotate(-30deg) scale(.8);}to{transform:rotate(30deg) scale(1.1);}}
.lt-title{font-size:1.8rem;font-weight:900;margin:16px 0 8px;color:var(--accent);}
.lt-sub{color:var(--text-dim);margin-bottom:28px;}

/* END SCREEN */
#endScreen{text-align:center;padding:24px 16px;}
.end-trophy{font-size:5rem;margin-bottom:12px;}
.end-title{font-size:2rem;font-weight:900;margin-bottom:6px;}
.end-grade{font-size:3.5rem;font-weight:900;margin:12px 0;}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0;}
.stat-box{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;}
.stat-num{font-size:1.4rem;font-weight:800;color:var(--accent2);}
.stat-label{font-size:.7rem;color:var(--text-dim);}
.name-input-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:16px 0;}
#studentName{background:var(--card);border:1.5px solid var(--border);border-radius:10px;
  padding:12px 18px;color:var(--text);font-size:1rem;width:220px;outline:none;}
#studentName:focus{border-color:var(--accent2);}
#certWrap{margin-top:16px;display:none;}
#certCanvas{border-radius:14px;max-width:100%;box-shadow:0 8px 40px rgba(0,0,0,.5);}

/* ACHIEVEMENTS */
#achievePopup{position:fixed;bottom:24px;right:24px;z-index:100;
  background:linear-gradient(135deg,var(--card),#1e1e4a);border:1px solid var(--accent);
  border-radius:16px;padding:14px 20px;display:none;animation:slideIn .4s ease;max-width:240px;}
@keyframes slideIn{from{transform:translateX(100px);opacity:0;}to{transform:translateX(0);opacity:1;}}
.achieve-icon{font-size:1.8rem;}
.achieve-name{font-size:.95rem;font-weight:700;color:var(--accent);margin:4px 0 2px;}
.achieve-desc{font-size:.75rem;color:var(--text-dim);}

/* COMBO POPUP */
#comboPopup{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);
  z-index:99;font-size:3rem;font-weight:900;color:var(--accent);
  text-shadow:0 0 30px var(--accent);pointer-events:none;transition:all .3s;}
#comboPopup.show{transform:translate(-50%,-50%) scale(1);}

/* PROGRESS DOTS */
#progressDots{display:flex;gap:6px;justify-content:center;margin-bottom:14px;flex-wrap:wrap;}
.pdot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.12);transition:all .3s;}
.pdot.done{background:var(--success);}
.pdot.active{background:var(--accent);transform:scale(1.3);}
.pdot.wrong-dot{background:var(--danger);}

/* RESPONSIVE */
@media(max-width:520px){
  .info-cards{grid-template-columns:1fr 1fr;}
  .stats-grid{grid-template-columns:1fr 1fr;}
  #hud{gap:6px;}
  .hud-val{font-size:1rem;}
}
/* Made by ecchua79 */
</style>
</head>
<body>
<!-- 华仁中学蔡逸众制作 -->
<div id="stars"></div>
<div id="app">

  <!-- START SCREEN -->
  <div id="startScreen" class="screen active">
    <div class="light-ray-demo">
      <div class="ray ray1"></div>
      <div class="ray ray2"></div>
      <div class="ray ray3"></div>
    </div>
    <div class="game-title">光的奇妙世界</div>
    <div class="game-subtitle">初一科学 · 第7章 · 光的现象 · 互动闯关游戏</div>
    <div class="info-cards">
      <div class="info-card"><div class="icon">🎯</div><div class="label">关卡</div><div class="val">5 关</div></div>
      <div class="info-card"><div class="icon">❤️</div><div class="label">生命</div><div class="val">3 条</div></div>
      <div class="info-card"><div class="icon">⭐</div><div class="label">题型</div><div class="val">5 种</div></div>

    <br><br>
    <button class="btn btn-secondary" onclick="showInstructions()">📖 游戏说明</button>
    <div class="credit">峇株吧辖华仁中学蔡逸众制作 · Made by ecchua79</div>
  </div>

  <!-- GAME SCREEN -->
  <div id="gameScreen" class="screen">
    <div id="hud">
      <div class="hud-block"><div class="hud-label">分数</div><div class="hud-val" id="scoreDisplay">0</div></div>
      <div class="hud-block"><div class="hud-label">生命</div><div id="livesDisplay"></div></div>
      <div class="hud-block"><div class="hud-label">连击</div><div class="hud-val" id="comboDisplay">×1</div><div id="comboBar"><div id="comboFill"></div></div></div>
      <div class="hud-block"><div class="hud-label">本关</div><div class="hud-val" id="levelDisplay">1/5</div></div>
      <div class="hud-block"><div class="hud-label">时间</div><div class="hud-val" id="timeDisplay">--</div></div>

    <div id="levelBanner">
      <div class="level-tag" id="levelTag">第1关</div>
      <div class="level-title" id="levelTitle"></div>
      <div class="level-desc" id="levelDesc"></div>
    </div>
    <div id="progressDots"></div>
    <div id="timerWrap"><div id="timerBar" style="width:100%"></div></div>
    <div id="questionCard">
      <div id="qTypeBadge" class="q-type-badge"></div>

  <!-- LEVEL TRANSITION -->
  <div id="levelTransitionScreen" class="screen">

  <!-- END SCREEN -->
  <div id="endScreen" class="screen">
    <div class="end-trophy" id="endTrophy">🏆</div>
    <div class="end-title" id="endTitle">挑战完成！</div>
    <div class="end-grade" id="endGrade" style="color:var(--accent)">A+</div>
    <div class="stats-grid">
      <div class="stat-box"><div class="stat-num" id="finalScore">0</div><div class="stat-label">总分</div></div>
      <div class="stat-box"><div class="stat-num" id="finalAcc">0%</div><div class="stat-label">正确率</div></div>
      <div class="stat-box"><div class="stat-num" id="finalTime">0s</div><div class="stat-label">用时</div></div>

</div>

<!-- ACHIEVE POPUP -->
<div id="achievePopup">
  <div class="achieve-icon" id="achIcon">🏅</div>

</div>

<div id="comboPopup"></div>

<script>
/* ════════════════════════════════════════════
   峇株吧辖华仁中学蔡逸众制作
   光的奇妙世界 · 第7章互动游戏
   ════════════════════════════════════════════ */

/* ─── STARS ─── */
(function(){
  const c=document.getElementById('stars');
  for(let i=0;i<80;i++){
    const s=document.createElement('div');
    s.className='star';
    const sz=Math.random()*2.5+.5;
    s.style.cssText=`width:${sz}px;height:${sz}px;top:${Math.random()*100}%;left:${Math.random()*100}%;--d:${(Math.random()*4+2).toFixed(1)}s;animation-delay:${(Math.random()*5).toFixed(1)}s;`;
    c.appendChild(s);
  }
})();

/* ─── GAME STATE ─── */
let state={
  score:0,lives:3,combo:1,level:0,qIdx:0,
  totalQ:0,correctQ:0,wrongQ:0,
  startTime:0,totalTime:0,
  timerInterval:null,questionTimer:null,
  achievements:[],
  levelScores:[],answered:false
};

const LEVELS=[
  {tag:'第1关',title:'☀️ 光的传播之旅',desc:'了解光速与直线传播的秘密',time:25,questions:[]},
  {tag:'第2关',title:'🪞 镜子的魔法',desc:'探索光的反射定律与镜子成像',time:25,questions:[]},
  {tag:'第3关',title:'🔬 折射大冒险',desc:'光线穿越不同介质时的神奇变化',time:25,questions:[]},
  {tag:'第4关',title:'🌈 色彩的秘密',desc:'白光的色散与物体颜色的来源',time:25,questions:[]},
  {tag:'⚔️ 第5关',title:'🌟 光学宗师考验',desc:'综合挑战！考验你的全部光学知识',time:20,questions:[]},
];

/* ════════════════════════════════════════════
   QUESTION BANK
   ════════════════════════════════════════════ */
// Made by ecchua79

// 华仁中学蔡逸众制作

/* ─── INIT LEVELS ─── */
function initLevels(){
  for(let i=0;i<5;i++) LEVELS[i].questions=shuffle([...Q_BANK['level'+i]]);
}

/* ─── UTILS ─── */
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}
function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function el(id){return document.getElementById(id);}
function fmt(n){return n<10?'0'+n:n;}

/* ─── STARS GLOW ─── */
function updateHUD(){
  el('scoreDisplay').textContent=state.score;
  el('comboDisplay').textContent='×'+state.combo;
  el('comboFill').style.width=Math.min((state.combo-1)*20,100)+'%';
  let hearts='';
  for(let i=0;i<3;i++) hearts+= i<state.lives?'❤️':'🖤';
  el('livesDisplay').innerHTML=hearts;
  el('levelDisplay').textContent=(state.level+1)+'/5';
}

/* ─── TIMER ─── */
let qTimeLeft=0,qTimerAnim=null;
function startQuestionTimer(sec){
  clearInterval(qTimerAnim);
  qTimeLeft=sec;
  const bar=el('timerBar');
  bar.style.width='100%';
  bar.style.background='linear-gradient(90deg,var(--success),var(--accent))';
  el('timeDisplay').textContent=sec+'s';
  qTimerAnim=setInterval(()=>{
    if(state.answered) return;
    qTimeLeft--;
    const pct=Math.max(0,qTimeLeft/sec*100);
    bar.style.width=pct+'%';
    el('timeDisplay').textContent=qTimeLeft+'s';
    if(pct<40) bar.style.background='linear-gradient(90deg,var(--danger),#f97316)';
    if(qTimeLeft<=0){
      clearInterval(qTimerAnim);
      if(!state.answered) timeUp();
    }
  },1000);
}
function timeUp(){
  state.answered=true;
  showFeedback(false,null,'⏰ 时间到！记得要快一点哦～',true);
  state.combo=1;updateHUD();
  setTimeout(()=>nextQuestion(),2000);
}

/* ─── GAME START ─── */
function startGame(){
  initLevels();
  state={score:0,lives:3,combo:1,level:0,qIdx:0,
    totalQ:0,correctQ:0,wrongQ:0,
    startTime:Date.now(),totalTime:0,
    timerInterval:null,questionTimer:null,
    achievements:[],levelScores:[],answered:false};
  updateHUD();
  loadLevel(0);
  show('gameScreen');
}

function loadLevel(lv){
  state.level=lv;
  state.qIdx=0;
  state.answered=false;
  const L=LEVELS[lv];
  el('levelTag').textContent=L.tag;
  el('levelTitle').textContent=L.title;
  el('levelDesc').textContent=L.desc;
  buildProgressDots(L.questions.length);
  updateHUD();
  loadQuestion();
}

function buildProgressDots(n){
  const c=el('progressDots');c.innerHTML='';
  for(let i=0;i<n;i++){
    const d=document.createElement('div');
    d.className='pdot'+(i===0?' active':'');
    d.id='pdot'+i;
    c.appendChild(d);
  }
}

function loadQuestion(){
  const L=LEVELS[state.level];
  const q=L.questions[state.qIdx];
  if(!q){levelComplete();return;}
  state.answered=false;

  // update dots
  for(let i=0;i<L.questions.length;i++){
    const d=el('pdot'+i);
    if(d){d.className='pdot'+(i<state.qIdx?'done':i===state.qIdx?' active':'');}
  }

  // type badge
  const badges={mcq:'badge-mcq',tf:'badge-tf',drag:'badge-drag',order:'badge-order',fill:'badge-fill'};
  const labels={mcq:'选择题',tf:'判断题',drag:'拖拽分类',order:'排列顺序',fill:'填空题'};
  el('qTypeBadge').className='q-type-badge '+badges[q.type];
  el('qTypeBadge').textContent=labels[q.type];
  el('qText').textContent=q.q;
  el('qVisual').style.display='none';
  el('feedback').className='';el('feedback').style.display='none';
  el('actionBar').innerHTML='';

  const body=el('qBody');body.innerHTML='';
  if(q.type==='mcq') renderMCQ(body,q);
  else if(q.type==='tf') renderTF(body,q);
  else if(q.type==='drag') renderDrag(body,q);
  else if(q.type==='order') renderOrder(body,q);
  else if(q.type==='fill') renderFill(body,q);

  startQuestionTimer(LEVELS[state.level].time);
  updateHUD();
}

/* ════════ MCQ ════════ */
function renderMCQ(body,q){
  const optsCopy=q.opts.map((o,i)=>({text:o,origIdx:i}));
  shuffle(optsCopy);
  const correctOrig=q.ans;
  const grid=document.createElement('div');
  grid.className='options-grid';
  const letters=['A','B','C','D'];
  optsCopy.forEach((o,i)=>{
    const btn=document.createElement('button');
    btn.className='opt-btn';
    btn.innerHTML=`<div class="opt-letter">${letters[i]}</div><span>${o.text}</span>`;
    btn.onclick=()=>{
      if(state.answered) return;
      state.answered=true;
      clearInterval(qTimerAnim);
      const correct=o.origIdx===correctOrig;
      btn.classList.add(correct?'correct':'wrong');
      if(!correct){
        // highlight correct
        grid.querySelectorAll('.opt-btn').forEach((b,bi)=>{
          if(optsCopy[bi].origIdx===correctOrig) b.classList.add('correct');
        });
      }
      handleAnswer(correct,q.explain,qTimeLeft);
    };
    grid.appendChild(btn);
  });
  body.appendChild(grid);
}

/* ════════ TF ════════ */
function renderTF(body,q){
  const row=document.createElement('div');row.className='tf-row';
  [['✅ 正确',true],['❌ 错误',false]].forEach(([label,val])=>{
    const btn=document.createElement('button');
    btn.className='btn '+(val?'btn-success':'btn-danger')+' tf-btn';
    btn.textContent=label;
    btn.onclick=()=>{
      if(state.answered) return;
      state.answered=true;
      clearInterval(qTimerAnim);
      handleAnswer(val===q.ans,q.explain,qTimeLeft);
    };
    row.appendChild(btn);
  });
  body.appendChild(row);
}

/* ════════ DRAG ════════ */
function renderDrag(body,q){
  const items=q.items.map((t,i)=>({text:t,origIdx:i}));
  shuffle(items);
  const placement=q.zones.map(()=>[]);
  let dragging=null;

  const chipArea=document.createElement('div');chipArea.id='dragArea';
  items.forEach(item=>{
    const chip=document.createElement('div');
    chip.className='drag-chip';chip.textContent=item.text;
    chip.dataset.origIdx=item.origIdx;
    setupDrag(chip);
    chipArea.appendChild(chip);
  });
  body.appendChild(chipArea);

  const zoneArea=document.createElement('div');zoneArea.className='drop-zones';
  q.zones.forEach((zname,zi)=>{
    const zone=document.createElement('div');zone.className='drop-zone';
    zone.innerHTML=`<div class="drop-zone-label">${zname}</div><div class="drop-zone-items" id="zone${zi}"></div>`;
    zone.addEventListener('dragover',e=>{e.preventDefault();zone.classList.add('over');});
    zone.addEventListener('dragleave',()=>zone.classList.remove('over'));
    zone.addEventListener('drop',e=>{
      e.preventDefault();zone.classList.remove('over');
      if(dragging===null) return;
      const origIdx=parseInt(dragging.dataset.origIdx);
      // remove from old zone
      placement.forEach(p=>{const i=p.indexOf(origIdx);if(i>-1)p.splice(i,1);});
      placement[zi].push(origIdx);
      dragging.remove();
      const d=document.createElement('div');
      d.className='dropped-chip';d.dataset.origIdx=origIdx;d.dataset.zone=zi;
      d.innerHTML=`<span>${items.find(x=>x.origIdx===origIdx).text}</span><span class="remove" onclick="removeDrop(this,${origIdx},${zi})">✕</span>`;
      el('zone'+zi).appendChild(d);
      dragging=null;
    });
    // pointer events for mobile
    zone.addEventListener('pointerup',e=>{
      if(dragging===null) return;
      e.preventDefault();zone.classList.remove('over');
      const origIdx=parseInt(dragging.dataset.origIdx);
      placement.forEach(p=>{const i=p.indexOf(origIdx);if(i>-1)p.splice(i,1);});
      placement[zi].push(origIdx);
      dragging.remove();
      const d=document.createElement('div');
      d.className='dropped-chip';d.dataset.origIdx=origIdx;
      d.innerHTML=`<span>${items.find(x=>x.origIdx===origIdx).text}</span><span class="remove" onclick="removeDrop(this,${origIdx},${zi})">✕</span>`;
      el('zone'+zi).appendChild(d);
      dragging=null;
    });
    zoneArea.appendChild(zone);
  });
  body.appendChild(zoneArea);

  function setupDrag(chip){
    chip.draggable=true;
    chip.addEventListener('dragstart',e=>{dragging=chip;chip.classList.add('dragging');});
    chip.addEventListener('dragend',()=>chip.classList.remove('dragging'));
    chip.addEventListener('pointerdown',e=>{
      dragging=chip;chip.classList.add('dragging');
      chip.setPointerCapture(e.pointerId);
    });
    chip.addEventListener('pointerup',()=>{chip.classList.remove('dragging');});
  }
  window.removeDrop=function(span,origIdx,zi){
    placement[zi].splice(placement[zi].indexOf(origIdx),1);
    span.parentElement.remove();
    const chip=document.createElement('div');
    chip.className='drag-chip';chip.textContent=items.find(x=>x.origIdx===origIdx).text;
    chip.dataset.origIdx=origIdx;
    setupDrag(chip);
    chipArea.appendChild(chip);
  };

  const submitBtn=document.createElement('button');
  submitBtn.className='btn btn-primary';submitBtn.style.marginTop='12px';
  submitBtn.textContent='✅ 确认分类';
  submitBtn.onclick=()=>{
    if(state.answered) return;
    state.answered=true;clearInterval(qTimerAnim);
    let correct=true;
    q.ans.forEach((ans,zi)=>{
      const got=placement[zi].slice().sort();
      const exp=ans.slice().sort();
      if(JSON.stringify(got)!==JSON.stringify(exp)) correct=false;
    });
    handleAnswer(correct,q.explain,qTimeLeft);
  };
  body.appendChild(submitBtn);
}

/* ════════ ORDER ════════ */
function renderOrder(body,q){
  const shuffled=q.items.map((t,i)=>({text:t,origIdx:i}));
  shuffle(shuffled);
  let dragItem=null,overItem=null;

  const list=document.createElement('div');list.id='orderList';
  function buildList(){
    list.innerHTML='';
    shuffled.forEach((item,i)=>{
      const div=document.createElement('div');
      div.className='order-item';div.dataset.i=i;
      div.innerHTML=`<div class="order-handle">⠿</div><div class="order-num">${i+1}</div><span>${item.text}</span>`;
      div.draggable=true;
      div.addEventListener('dragstart',()=>{dragItem=i;div.classList.add('dragging-order');});
      div.addEventListener('dragend',()=>{div.classList.remove('dragging-order');dragItem=null;overItem=null;});
      div.addEventListener('dragover',e=>{e.preventDefault();if(dragItem!==null&&dragItem!==i){overItem=i;div.classList.add('over-order');}});
      div.addEventListener('dragleave',()=>div.classList.remove('over-order'));
      div.addEventListener('drop',()=>{
        if(dragItem!==null&&overItem!==null&&dragItem!==overItem){
          const tmp=shuffled[dragItem];shuffled[dragItem]=shuffled[overItem];shuffled[overItem]=tmp;
          buildList();
        }
      });
      // pointer/touch
      div.addEventListener('pointerdown',e=>{dragItem=i;});
      div.addEventListener('pointerup',e=>{
        if(overItem!==null&&dragItem!==overItem){
          const tmp=shuffled[dragItem];shuffled[dragItem]=shuffled[overItem];shuffled[overItem]=tmp;
          buildList();
        }
        dragItem=null;overItem=null;
      });
      div.addEventListener('pointerenter',()=>{if(dragItem!==null&&dragItem!==i){overItem=i;div.classList.add('over-order');}});
      div.addEventListener('pointerleave',()=>div.classList.remove('over-order'));
      list.appendChild(div);
    });
  }
  buildList();
  body.appendChild(list);

  const submitBtn=document.createElement('button');
  submitBtn.className='btn btn-primary';submitBtn.style.marginTop='12px';
  submitBtn.textContent='✅ 确认顺序';
  submitBtn.onclick=()=>{
    if(state.answered) return;
    state.answered=true;clearInterval(qTimerAnim);
    const correct=shuffled.every((item,i)=>item.origIdx===q.correctOrder[i]);
    handleAnswer(correct,q.explain,qTimeLeft);
  };
  body.appendChild(submitBtn);
}
  
/*<!-- 峇株吧辖蔡逸众制作 -->*/
/* ════════ FILL ════════ */
function renderFill(body,q){
  const wordsCopy=shuffle([...q.words]);
  const filled=new Array(q.blanks.length).fill(null);
  let selBlank=0;

  const chipArea=document.createElement('div');chipArea.id='fillArea';
  wordsCopy.forEach((w,wi)=>{
    const chip=document.createElement('div');
    chip.className='word-chip';chip.textContent=w;chip.dataset.wi=wi;chip.dataset.word=w;
    chip.onclick=()=>{
      if(chip.classList.contains('used')) return;
      // put word into selected blank
      const bi=selBlank;
      if(filled[bi]!==null){
        // return old word
        const oldChip=chipArea.querySelector(`[data-word="${filled[bi]}"]`);
        if(oldChip) oldChip.classList.remove('used');
      }
      filled[bi]=w;
      chip.classList.add('used');
      updateBlankDisplay();
      // auto advance
      if(bi<q.blanks.length-1) selBlank=bi+1;
    };
    chipArea.appendChild(chip);
  });
  body.appendChild(chipArea);

  const sent=document.createElement('div');sent.className='fill-sentence';
  body.appendChild(sent);

  function updateBlankDisplay(){
    const parts=q.sentence.split('__');
    let html='';
    parts.forEach((part,i)=>{
      html+=part;
      if(i<q.blanks.length){
        const val=filled[i]||'___';
        const cls='fill-blank'+(filled[i]?' filled':'')+(i===selBlank?' active-blank':'');
        html+=`<span class="${cls}" onclick="selectBlank(${i})">${val}</span>`;
      }
    });
    sent.innerHTML=html;
  }
  window.selectBlank=function(i){selBlank=i;updateBlankDisplay();};
  updateBlankDisplay();

  const submitBtn=document.createElement('button');
  submitBtn.className='btn btn-primary';submitBtn.style.marginTop='12px';
  submitBtn.textContent='✅ 提交答案';
  submitBtn.onclick=()=>{
    if(state.answered) return;
    if(filled.some(f=>f===null)){alert('请填写所有空格！');return;}
    state.answered=true;clearInterval(qTimerAnim);
    const correct=filled.every((f,i)=>f===q.blanks[i]);
    handleAnswer(correct,q.explain,qTimeLeft);
  };
  body.appendChild(submitBtn);
}

/* ─── ANSWER HANDLER ─── */
function handleAnswer(correct,explain,timeLeft){
  state.totalQ++;
  if(correct){
    state.correctQ++;
    const bonus=Math.max(0,Math.floor(timeLeft/3));
    const comboBonus=state.combo*10;
    const pts=50+bonus+comboBonus;
    state.score+=pts;
    state.combo=Math.min(state.combo+1,8);
    showFeedback(true,`+${pts}分 🎉`,explain,false);
    if(state.combo>=3) showComboPopup();
    // dot
    const d=el('pdot'+state.qIdx);if(d) d.className='pdot done';
    checkAchievements();
  } else {
    state.wrongQ++;
    state.lives--;
    state.combo=1;
    showFeedback(false,null,explain,false);
    const d=el('pdot'+state.qIdx);if(d) d.className='pdot wrong-dot';
  }
  updateHUD();
  playSound(correct);
  if(state.lives<=0){
    setTimeout(()=>gameOver(),2000);
  } else {
    setTimeout(()=>nextQuestion(),2500);
  }
}

function showFeedback(correct,bonus,explain,timeout){
  const fb=el('feedback');
  fb.className='show '+(correct?'correct-fb':'wrong-fb');
  fb.innerHTML=`<div class="fb-header"><div class="fb-icon">${correct?'✅':'❌'}</div><div>${correct?'回答正确！'+( bonus?'<span style="color:var(--accent);margin-left:6px;">'+bonus+'</span>':''):'回答错误'}</div></div><div class="fb-text">${explain||''}</div>`;
  fb.style.display='block';
}

function showComboPopup(){
  const p=el('comboPopup');
  p.textContent=state.combo+'连击！🔥';
  p.classList.add('show');
  setTimeout(()=>p.classList.remove('show'),900);
}

/* ─── NEXT Q / LEVEL ─── */
function nextQuestion(){
  el('feedback').style.display='none';
  state.qIdx++;
  if(state.qIdx>=LEVELS[state.level].questions.length){
    levelComplete();
  } else {
    loadQuestion();
  }
}

function levelComplete(){
  clearInterval(qTimerAnim);
  state.levelScores.push(state.score);
  const L=LEVELS[state.level];
  el('ltStar').textContent=state.lives===3?'⭐⭐⭐':state.lives===2?'⭐⭐':'⭐';
  el('ltTitle').textContent=L.tag+' 完成！';
  el('ltSub').textContent='当前分数：'+state.score+' 分';
  if(state.level<4){
    el('ltBtn').textContent='前往第'+(state.level+2)+'关 →';
    el('ltBtn').onclick=nextLevel;
  } else {
    el('ltTitle').textContent='🎉 全部关卡完成！';
    el('ltBtn').textContent='查看成绩 🏆';
    el('ltBtn').onclick=showEndScreen;
  }
  show('levelTransitionScreen');
}

function nextLevel(){
  if(state.level<4){
    state.level++;
    loadLevel(state.level);
    show('gameScreen');
  } else {
    showEndScreen();
  }
}

function gameOver(){
  state.totalTime=Math.floor((Date.now()-state.startTime)/1000);
  show('endScreen');
  el('endTrophy').textContent='💔';
  el('endTitle').textContent='挑战失败，再接再厉！';
  el('endGrade').textContent='加油！';
  el('endGrade').style.color='var(--danger)';
  el('finalScore').textContent=state.score;
  el('finalAcc').textContent=state.totalQ?Math.round(state.correctQ/state.totalQ*100)+'%':'0%';
  el('finalTime').textContent=fmt(Math.floor(state.totalTime/60))+':'+fmt(state.totalTime%60);
  el('certWrap').style.display='none';
  el('restartBtnTop').style.display='inline-flex';
}

function showEndScreen(){
  state.totalTime=Math.floor((Date.now()-state.startTime)/1000);
  const acc=state.totalQ?Math.round(state.correctQ/state.totalQ*100):0;
  let grade,trophy,title;
  if(acc>=90){grade='S';trophy='🏆';title='光学宗师！满分闯关！';}
  else if(acc>=80){grade='A';trophy='🥇';title='优秀！光学达人！';}
  else if(acc>=70){grade='B';trophy='🥈';title='良好！继续加油！';}
  else if(acc>=60){grade='C';trophy='🥉';title='及格！还需努力！';}
  else{grade='D';trophy='📚';title='需要复习！加油！';}

  el('endTrophy').textContent=trophy;
  el('endTitle').textContent=title;
  el('endGrade').textContent=grade;
  el('endGrade').style.color=acc>=80?'var(--accent)':acc>=60?'var(--accent2)':'var(--danger)';
  el('finalScore').textContent=state.score;
  el('finalAcc').textContent=acc+'%';
  el('finalTime').textContent=fmt(Math.floor(state.totalTime/60))+':'+fmt(state.totalTime%60);

  const achHtml=state.achievements.map(a=>`<span style="margin:0 6px;">${a.icon} ${a.name}</span>`).join('');
  el('achList').innerHTML=achHtml?'🏅 获得成就：'+achHtml:'';
  el('certWrap').style.display='none';
  el('restartBtnTop').style.display='inline-flex';
  show('endScreen');
}

/* ─── ACHIEVEMENTS ─── */
const ACHIEVEMENTS=[
  {id:'perfect5',name:'满分王者',icon:'👑',desc:'连续5题全对',check:()=>state.combo>=6},
  {id:'speed',name:'极速闪电',icon:'⚡',desc:'10秒内答对',check:()=>false},// triggered in handleAnswer
  {id:'noerror',name:'无伤通关',icon:'🛡️',desc:'保留全部3条生命',check:()=>state.lives===3},
];
function checkAchievements(){
  ACHIEVEMENTS.forEach(a=>{
    if(!state.achievements.find(x=>x.id===a.id)&&a.check()){
      state.achievements.push(a);
      showAchieve(a);
    }
  });
}
function showAchieve(a){
  el('achIcon').textContent=a.icon;
  el('achName').textContent=a.name;
  el('achDesc').textContent=a.desc;
  const p=el('achievePopup');p.style.display='block';
  setTimeout(()=>p.style.display='none',3500);
}

/* ─── SOUND ─── */
function playSound(correct){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    const o=ctx.createOscillator();const g=ctx.createGain();
    o.connect(g);g.connect(ctx.destination);
    if(correct){
      o.type='sine';
      o.frequency.setValueAtTime(523,ctx.currentTime);
      o.frequency.setValueAtTime(659,ctx.currentTime+.1);
      o.frequency.setValueAtTime(784,ctx.currentTime+.2);
    } else {
      o.type='sawtooth';
      o.frequency.setValueAtTime(220,ctx.currentTime);
      o.frequency.setValueAtTime(180,ctx.currentTime+.15);
    }
    g.gain.setValueAtTime(.18,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.5);
    o.start();o.stop(ctx.currentTime+.5);
  }catch(e){}
}
