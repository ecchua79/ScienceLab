<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

/*
════════════════════════════════════════════════════════════
  COORDINATE SYSTEM  (must be identical for geometry & rays)
════════════════════════════════════════════════════════════
  //峇株吧辖华仁中学蔡逸众制作
  • Light travels in the  +X  direction.
  • The optical element is centred at the origin.
  • Aperture radius (half-height of mirrors/lenses): APR = 1.8

  CONCAVE MIRROR
  ──────────────
  • Bowl opening faces  –X  (toward the incoming light).
  • Rim of the bowl at  x = 0.
  • Vertex (deepest point of bowl) at  x = –sag,
    where  sag = R – √(R²–APR²).
  • Sphere centre at  x = +(R – sag) = +√(R²–APR²)  ≡  +CX.

  CONVEX MIRROR
  ─────────────
  • Dome peak faces  –X  (toward the incoming light).
  • Rim at  x = 0.
  • Vertex (tip of dome) at  x = –sag  (same shape as concave!).
  • Sphere centre at  x = –(R – sag) = –CX.

  Both mirrors therefore share the SAME cap mesh (vertex at –sag, rim at 0).
  They differ only in which face is reflective and in the sphere-centre sign:
    – Concave: reflect off the inner face; outward normal (hit–centre) points –X  ✓
    – Convex:  reflect off the outer face; inward  normal (centre–hit) points –X  ✓
════════════════════════════════════════════════════════════
*/

// ─── STATE ───────────────────────────────────────────────
const S = {
  el:'rough', angle:0, spread:2.0,
  R:3.0, d:0.4, n:1.50,
  grid:true, focal:true, norm:false, axis:true
};
const NAMES = {
  rough:'粗糙表面', planar:'平面镜',
  'concave-mirror':'凹面镜', 'convex-mirror':'凸面镜',
  'concave-lens':'凹透镜', 'convex-lens':'凸透镜'
};
const APR = 1.8; // aperture radius

// ─── SCENE ───────────────────────────────────────────────
const container = document.getElementById('cv');
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x03040a, 0.026);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 200);
camera.position.set(5, 3.5, 10);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
container.appendChild(renderer.domElement);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.88, 0.4, 0.18));

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.minDistance = 3; controls.maxDistance = 30;

scene.add(new THREE.AmbientLight(0x4060a0, 0.5));
const kl = new THREE.DirectionalLight(0xffd9a0, 0.9); kl.position.set(4,8,5); scene.add(kl);
const rl = new THREE.DirectionalLight(0x6090ff, 0.4); rl.position.set(-5,2,-5); scene.add(rl);

// ─── GRID ────────────────────────────────────────────────
const gridGrp = new THREE.Group(); scene.add(gridGrp);

function mkSprite(txt, col='#e8f0fc', sz=28) {
  const cv = document.createElement('canvas'); cv.width=128; cv.height=64;
  const ctx = cv.getContext('2d');
  ctx.fillStyle=col; ctx.font=`600 ${sz}px monospace`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(txt, 64, 32);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({
    map: new THREE.CanvasTexture(cv), transparent:true, depthTest:false
  }));
  return sp;
}

function buildGrid() {
  gridGrp.clear();
  //Made by ecchua79
  const Y = -2.5;
  const grid = new THREE.GridHelper(14,28,0x1e2a42,0x111826);
  grid.position.y = Y;
  gridGrp.add(grid);

  for (let i=-6; i<=6; i++) {
    const len = i===0 ? 0.45 : i%2===0 ? 0.28 : 0.14;
    const col = i===0 ? 0xffb84d : 0x4a5a78;
    const pts = [new THREE.Vector3(i,Y,-0.05), new THREE.Vector3(i,Y,len-0.05)];
    gridGrp.add(new THREE.Line(
      new THREE.BufferGeometry().setFromPoints(pts),
      new THREE.LineBasicMaterial({color:col, transparent:true, opacity:i===0?1:0.6})
    ));
    if (i%2===0) {
      const sp = mkSprite(`${i}`, i===0?'#ffb84d':'#6a7a98', 26);
      sp.position.set(i, Y-0.01, 0.65); sp.scale.set(0.45,0.22,1);
      gridGrp.add(sp);
    }
  }
  const rl2 = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(-7,Y,-0.05), new THREE.Vector3(7,Y,-0.05)
  ]);
  gridGrp.add(new THREE.Line(rl2, new THREE.LineBasicMaterial({color:0x4a5a78, transparent:true, opacity:0.5})));

  if (S.axis) {
    const al = new THREE.Line(
      new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-7,0,0), new THREE.Vector3(7,0,0)]),
      new THREE.LineDashedMaterial({color:0xffb84d, dashSize:0.18, gapSize:0.1, transparent:true, opacity:0.35})
    );
    al.computeLineDistances();
    gridGrp.add(al);
  }
}

// ─── MIRROR / LENS GEOMETRY HELPERS ──────────────────────

// sag = sagitta of the aperture circle on a sphere of radius R
function sag(R) { return R - Math.sqrt(Math.max(0, R*R - APR*APR)); }

/*
  buildSphereMirror(R, isConcave)
  ────────────────────────────────
  Gemini-style approach: use SphereGeometry (a cap slice) + Raycaster for intersection.
  Light travels in +X direction. Mirror sits at origin.

  CONCAVE: bowl opens toward –X (toward light).
    • Use a sphere cap centred at x = +R (behind the mirror).
    • Rotate so the cap faces –X.
    • The THREE.Mesh is what Raycaster intersects — no manual math needed.

  CONVEX: dome protrudes toward –X (toward light).
    • Use a sphere cap centred at x = –R (behind the dome).
    • Rotate so the dome faces –X.

  Returns { mesh, raycasterMesh } — both the visible mesh and the invisible
  collision mesh (same geometry, but we need to call updateMatrixWorld after positioning).
*/
let mirrorRaycasterMesh = null;

function buildSphereMirror(R, isConcave) {
  const halfAngle = Math.asin(Math.min(APR / R, 0.999));
  const geo = new THREE.SphereGeometry(R, 64, 64, 0, Math.PI*2, 0, halfAngle);

  const mat = new THREE.MeshStandardMaterial({
    color: 0xbdd0e8, roughness: 0.03, metalness: 0.96, side: THREE.DoubleSide,
  });
  const hlMat = new THREE.MeshStandardMaterial({
    color: 0xeef4ff, roughness: 0.0, metalness: 1.0,
    emissive: 0x3355aa, emissiveIntensity: 0.35,
    transparent: true, opacity: 0.8,
    side: isConcave ? THREE.BackSide : THREE.FrontSide,
  });

  const mesh    = new THREE.Mesh(geo, mat);
  const hlMesh  = new THREE.Mesh(geo, hlMat);
  const colMesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ visible: false, side: THREE.DoubleSide }));

  /*
    SphereGeometry default: pole at +Y, cap fans away from pole.
    //华仁中学蔡逸众制作
    CONVEX (dome protrudes toward -X):
      rotation.z = -PI/2  →  pole (+Y) rotates to -X.
      Vertex (pole) sits at: centre + R*(-1,0,0).
      Set centre = +cx  →  vertex = cx - R = -sag  (at x = -sag, toward -X). ✓
      Rim at x = 0. Dome sticks out toward -X = toward incoming light. ✓

    CONCAVE (bowl opens toward -X, deepens toward +X):
      rotation.z = +PI/2  →  pole (+Y) rotates to +X.
      Vertex (pole) sits at: centre + R*(+1,0,0).
      Set centre = -cx  →  vertex = -cx + R = sag  (at x = +sag, deepest point). ✓
      Rim at x = 0. Bowl opens toward -X = toward incoming light. ✓
  */
  const sg  = sag(R);
  const cx  = R - sg;

  if (isConcave) {
    [mesh, hlMesh, colMesh].forEach(m => {
      m.rotation.z = -Math.PI / 2;  // pole → -X (dome tip toward -X) → concave bowl faces light
      m.position.x = cx;
    });
  } else {
    [mesh, hlMesh, colMesh].forEach(m => {
      m.rotation.z = Math.PI / 2;   // pole → +X (dome bottom toward +X) → convex dome faces light
      m.position.x = -cx;
    });
  }

  colGroup.clear();
  colGroup.add(colMesh);
  colMesh.updateMatrixWorld(true);

  return { mesh, hlMesh, colMesh };
}

const colGroup = new THREE.Group();
colGroup.visible = false;
scene.add(colGroup);

// focal-point marker
function addFocalMarker(x, label) {
  const m = new THREE.Mesh(
    new THREE.SphereGeometry(0.09,16,16),
    new THREE.MeshBasicMaterial({color:0xff4444})
  );
  m.position.set(x,0,0); elGrp.add(m);

  const halo = new THREE.Mesh(
    new THREE.SphereGeometry(0.22,16,16),
    new THREE.MeshBasicMaterial({color:0xff4444, transparent:true, opacity:0.18})
  );
  halo.position.set(x,0,0); elGrp.add(halo);

  const sp = mkSprite(label,'#ff8888');
  sp.position.set(x,0.48,0); sp.scale.set(0.52,0.26,1); elGrp.add(sp);

  const fg = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(x,-1.4,0), new THREE.Vector3(x,1.4,0)
  ]);
  const fl = new THREE.Line(fg, new THREE.LineDashedMaterial({
    color:0xff4444, dashSize:0.08, gapSize:0.06, transparent:true, opacity:0.28
  }));
  fl.computeLineDistances(); elGrp.add(fl);
}

// lens lathe geometry (both convex & concave)
function buildLensLathe(R, halfT, isConvex) {
  const sg = sag(R);
  const SEGS = 32;
  const pts = [];
  if (isConvex) {
    for (let i=0; i<=SEGS; i++) {
      const r = (i/SEGS)*APR;
      const depth = R - Math.sqrt(R*R - r*r);
      const x = (sg - depth) + halfT;
      pts.push(new THREE.Vector2(r, x));
    }
    for (let i=SEGS; i>=0; i--) {
      const r = (i/SEGS)*APR;
      const depth = R - Math.sqrt(R*R - r*r);
      const x = -((sg - depth) + halfT);
      pts.push(new THREE.Vector2(r, x));
    }
  } else {
    for (let i=0; i<=SEGS; i++) {
      const r = (i/SEGS)*APR;
      const depth = R - Math.sqrt(R*R - r*r);
      const x = halfT - (sg - depth);
      pts.push(new THREE.Vector2(r, x));
    }
    for (let i=SEGS; i>=0; i--) {
      const r = (i/SEGS)*APR;
      const depth = R - Math.sqrt(R*R - r*r);
      const x = -(halfT - (sg - depth));
      pts.push(new THREE.Vector2(r, x));
    }
  }
  const geo = new THREE.LatheGeometry(pts, 48);
  geo.rotateZ(-Math.PI / 2);
  return geo;
}

function computeFocalLength() {
  const { R, n, el } = S;
  if (el==='concave-mirror'||el==='convex-mirror') return R/2;
  if (el==='convex-lens'||el==='concave-lens')     return 1/((n-1)*(2/R));
  return 0;
}

// ─── BUILD ELEMENT ───────────────────────────────────────
const elGrp = new THREE.Group(); scene.add(elGrp);

function buildElement() {
  elGrp.clear();
  mirrorRaycasterMesh = null;
  const { R, d, n, el } = S;

  const rimMat = new THREE.MeshStandardMaterial({color:0x3a4a60, metalness:0.7, roughness:0.3});

  // ── ROUGH ──
  if (el==='rough') {
    // Face toward -X (toward incoming light). Bumps on the -X face.
    const geo = new THREE.BoxGeometry(0.28,4.2,4.2,1,20,20);
    const pos = geo.attributes.position;
    for (let i=0; i<pos.count; i++)
      if (pos.getX(i) < 0) pos.setX(i, pos.getX(i) - Math.abs((Math.random()-.5)*0.28));
    geo.computeVertexNormals();
    elGrp.add(new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
      color:0x6a7888, roughness:0.98, metalness:0.05, flatShading:true
    })));
    return;
  }

  // ── PLANAR MIRROR ──
  if (el==='planar') {
    // ── Layer 1: silver base with MeshPhysicalMaterial (clearcoat + high metalness) ──
    const fGeo = new THREE.PlaneGeometry(4.2, 4.2, 1, 1);
    const fMat = new THREE.MeshPhysicalMaterial({
      color: 0xd8e8f8,
      roughness: 0.0,
      metalness: 1.0,
      reflectivity: 1.0,
      clearcoat: 1.0,
      clearcoatRoughness: 0.0,
      envMapIntensity: 2.2,
      side: THREE.FrontSide
    });
    const front = new THREE.Mesh(fGeo, fMat);
    front.rotation.y = Math.PI / 2;
    elGrp.add(front);

    // ── Layer 2: streak highlight — canvas texture simulating polished-metal brushed lines ──
    const streakCv = document.createElement('canvas');
    streakCv.width = 256; streakCv.height = 256;
    const sCtx = streakCv.getContext('2d');
    // base silver gradient
    const baseGrad = sCtx.createLinearGradient(0, 0, 256, 256);
    baseGrad.addColorStop(0.00, 'rgba(255,255,255,0.00)');
    baseGrad.addColorStop(0.18, 'rgba(220,235,255,0.18)');
    baseGrad.addColorStop(0.35, 'rgba(255,255,255,0.38)');
    baseGrad.addColorStop(0.50, 'rgba(200,220,245,0.10)');
    baseGrad.addColorStop(0.68, 'rgba(255,255,255,0.32)');
    baseGrad.addColorStop(0.82, 'rgba(210,228,255,0.15)');
    baseGrad.addColorStop(1.00, 'rgba(255,255,255,0.00)');
    sCtx.fillStyle = baseGrad;
    sCtx.fillRect(0, 0, 256, 256);
    // fine horizontal streaks (polished metal grain)
    for (let i = 0; i < 48; i++) {
      const y = Math.random() * 256;
      const w = Math.random() * 1.2 + 0.2;
      const a = Math.random() * 0.18 + 0.04;
      sCtx.fillStyle = `rgba(255,255,255,${a.toFixed(3)})`;
      sCtx.fillRect(0, y, 256, w);
    }
    // a few bright specular flashes
    for (let i = 0; i < 5; i++) {
      const cx2 = Math.random() * 256, cy2 = Math.random() * 256;
      const gr = sCtx.createRadialGradient(cx2, cy2, 0, cx2, cy2, 18 + Math.random()*22);
      gr.addColorStop(0, 'rgba(255,255,255,0.55)');
      gr.addColorStop(1, 'rgba(255,255,255,0.00)');
      sCtx.fillStyle = gr;
      sCtx.fillRect(0, 0, 256, 256);
    }
    const streakTex = new THREE.CanvasTexture(streakCv);
    const hGeo = new THREE.PlaneGeometry(4.2, 4.2);
    const hl = new THREE.Mesh(hGeo, new THREE.MeshBasicMaterial({
      map: streakTex, transparent: true, opacity: 0.72,
      blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.FrontSide
    }));
    hl.rotation.y = Math.PI / 2; hl.position.x = 0.002;
    elGrp.add(hl);

    // ── Layer 3: edge glow / vignette to give depth ──
    const edgeCv = document.createElement('canvas');
    edgeCv.width = 128; edgeCv.height = 128;
    const eCtx = edgeCv.getContext('2d');
    const edgeGrad = eCtx.createRadialGradient(64, 64, 22, 64, 64, 64);
    edgeGrad.addColorStop(0, 'rgba(180,210,255,0.00)');
    edgeGrad.addColorStop(0.7, 'rgba(180,210,255,0.00)');
    edgeGrad.addColorStop(1.0, 'rgba(140,180,230,0.38)');
    eCtx.fillStyle = edgeGrad;
    eCtx.fillRect(0, 0, 128, 128);
    const edgeTex = new THREE.CanvasTexture(edgeCv);
    const eGeo = new THREE.PlaneGeometry(4.2, 4.2);
    const edgeMesh = new THREE.Mesh(eGeo, new THREE.MeshBasicMaterial({
      map: edgeTex, transparent: true, opacity: 0.9,
      blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.FrontSide
    }));
    edgeMesh.rotation.y = Math.PI / 2; edgeMesh.position.x = 0.003;
    elGrp.add(edgeMesh);

    // ── Layer 4: thin blue-tinted tint overlay (cold silver tone) ──
    const tintGeo = new THREE.PlaneGeometry(4.2, 4.2);
    const tintMesh = new THREE.Mesh(tintGeo, new THREE.MeshBasicMaterial({
      color: 0x99bbdd, transparent: true, opacity: 0.07,
      blending: THREE.NormalBlending, depthWrite: false, side: THREE.FrontSide
    }));
    tintMesh.rotation.y = Math.PI / 2; tintMesh.position.x = 0.004;
    elGrp.add(tintMesh);

    // ── Backing: dark frame body ──
    elGrp.add(new THREE.Mesh(
      new THREE.BoxGeometry(0.1, 4.2, 4.2),
      new THREE.MeshStandardMaterial({ color: 0x1a2535, roughness: 0.7 })
    ));
    return;
  }

  // ── CONCAVE MIRROR ──
  if (el==='concave-mirror') {
    const { mesh, hlMesh, colMesh } = buildSphereMirror(R, true);
    elGrp.add(mesh); elGrp.add(hlMesh);
    mirrorRaycasterMesh = colMesh; // not in scene, only for raycasting
    if (S.focal) addFocalMarker(-R/2, 'F');
    return;
  }

  // ── CONVEX MIRROR ──
  if (el==='convex-mirror') {
    const { mesh, hlMesh, colMesh } = buildSphereMirror(R, false);
    elGrp.add(mesh); elGrp.add(hlMesh);
    mirrorRaycasterMesh = colMesh;
    if (S.focal) addFocalMarker(R/2, 'F(虚)');
    return;
  }

  // ── LENSES ──
  if (el==='convex-lens'||el==='concave-lens') {
    const isConvex = el==='convex-lens';
    const lGeo = buildLensLathe(R, d/2, isConvex);
    elGrp.add(new THREE.Mesh(lGeo, new THREE.MeshPhysicalMaterial({
      color:0x88aaff, transparent:true, opacity:0.30,
      roughness:0.0, metalness:0.0,
      transmission:0.88, ior:n, thickness:d, side:THREE.DoubleSide
    })));
    const rim = new THREE.Mesh(new THREE.TorusGeometry(APR,0.055,8,48),
      new THREE.MeshStandardMaterial({color:0x445566, metalness:0.7, roughness:0.3}));
    rim.rotation.y = Math.PI/2; elGrp.add(rim);
    if (S.focal) {
      const f = computeFocalLength();
      if (isConvex) { addFocalMarker(f,'F');      addFocalMarker(-f,"F'"); }
      else          { addFocalMarker(-f,'F(虚)'); addFocalMarker(f,"F'(虚)"); }
    }
  }
}

// ─── RAY RENDERING ───────────────────────────────────────
const rayGrp = new THREE.Group(); scene.add(rayGrp);
const C_IN  = new THREE.Color(0xffe4a0);
const C_REF = new THREE.Color(0x55ccff);
const C_RFR = new THREE.Color(0xff9966);

function drawSeg(a, b, col, opacity=0.92, dashed=false) {
  //峇株吧辖蔡逸众制作
  if (a.distanceTo(b) < 0.005) return;
  const geo = new THREE.BufferGeometry().setFromPoints([a, b]);
  const mat = dashed
    ? new THREE.LineDashedMaterial({color:col.getHex(), transparent:true, opacity:opacity*0.5, dashSize:0.14, gapSize:0.09})
    : new THREE.LineBasicMaterial({color:col.getHex(), transparent:true, opacity});
  const ln = new THREE.Line(geo, mat);
  if (dashed) ln.computeLineDistances();
  rayGrp.add(ln);
}

function drawArrow(pos, dir, col, opacity=0.92) {
  const cone = new THREE.Mesh(
    new THREE.ConeGeometry(0.068, 0.20, 8),
    new THREE.MeshBasicMaterial({color:col.getHex(), transparent:true, opacity})
  );
  cone.position.copy(pos);
  cone.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir.clone().normalize());
  rayGrp.add(cone);
}

function drawRay(a, b, col, opacity=0.92, dashed=false) {
  drawSeg(a, b, col, opacity, dashed);
  const t  = 0.58;
  const mid = a.clone().lerp(b, t);
  const dir = b.clone().sub(a).normalize();
  drawArrow(mid, dir, col, opacity);
}

function drawNorm(pt, n) {
  const e = pt.clone().add(n.clone().multiplyScalar(0.75));
  const ln = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints([pt, e]),
    new THREE.LineDashedMaterial({color:0x44ff88, dashSize:0.08, gapSize:0.06, transparent:true, opacity:0.65})
  );
  ln.computeLineDistances(); rayGrp.add(ln);
}

// reflection: r = d – 2(d·n̂)n̂
function reflect(d, n) {
  const nd = n.clone().normalize();
  return d.clone().sub(nd.clone().multiplyScalar(2 * d.dot(nd))).normalize();
}

// Raycaster instance (reused)
const raycaster = new THREE.Raycaster();

// Intersect the sphere mirror mesh and return { hit, normal } or null
function mirrorIntersect(origin, dir) {
  if (!mirrorRaycasterMesh) return null;
  raycaster.set(origin, dir.clone().normalize());
  const hits = raycaster.intersectObject(mirrorRaycasterMesh);
  if (!hits.length) return null;
  const h = hits[0];
  // Get world-space normal from face normal
  const normal = h.face.normal.clone();
  const nm = new THREE.Matrix3().getNormalMatrix(mirrorRaycasterMesh.matrixWorld);
  normal.applyMatrix3(nm).normalize();
  // Ensure normal faces toward incoming ray (same side as origin)
  if (normal.dot(dir) > 0) normal.negate();
  return { point: h.point, normal };
}

// ─── TRACE ONE RAY (legacy stub — logic moved to traceColoured) ──────────
//峇株吧辖华仁中学蔡逸众制作
function trace(origin, dir) { traceColoured(origin, dir, C_IN, 0.92); }

// ─── BUILD RAYS ──────────────────────────────────────────
function buildRays() {
  //Made by ecchua79
  rayGrp.clear();
  const ang = S.angle * Math.PI / 180;
  const sp  = S.spread;

  // Base direction: tilted by 'angle' in the XY plane, then we rotate
  // the transverse offset around the X-axis for each ray.
  // dir is always the same for a parallel bundle — only origins differ.
  const cosA = Math.cos(ang), sinA = Math.sin(ang);

  // ── Layout: 1 axial + 2 rings (6 + 12 rays) around the optical axis ──
  // ring radii as fractions of spread
  const rings = [
    { r: 0,        n: 1,  alpha: 1.00 },   // axial ray
    { r: sp * 0.5, n: 6,  alpha: 0.85 },   // inner ring
    { r: sp,       n: 12, alpha: 0.65 },   // outer ring
  ];

  // Slight colour variation per azimuthal angle to distinguish planes
  // All still warm-white but with a faint hue shift
  const hueShift = (phi) => {
    // phi in [0, 2π] → gentle colour around C_IN
    const h = (phi / (Math.PI * 2));
    // interpolate between warm gold and cool blue-white
    const r = 1.00,
          g = 0.88 + 0.10 * Math.sin(phi),
          b = 0.60 + 0.38 * Math.abs(Math.sin(phi + Math.PI / 3));
    return new THREE.Color(r, g, b);
  };

  let totalRays = 0;
  rings.forEach(({ r, n, alpha }) => {
    for (let i = 0; i < n; i++) {
      const phi = (i / n) * Math.PI * 2;
      // Transverse offset in Y and Z (perpendicular to X axis)
      const yo = r * Math.cos(phi);
      const zo = r * Math.sin(phi);

      // Origin: behind the element, offset in YZ plane
      const origin = new THREE.Vector3(-7.8, yo, zo);

      // Direction: parallel bundle tilted by `ang` around Z-axis,
      // but the tilt is applied in the plane containing X and the offset direction.
      // For a true parallel beam, all rays share the same direction vector.
      // The angle slider tilts the whole bundle in XY; we keep that behaviour.
      const dir = new THREE.Vector3(cosA, sinA, 0).normalize();

      // Use per-plane colour for non-axial rays
      const col = r === 0 ? C_IN : hueShift(phi);

      traceColoured(origin, dir, col, alpha);
      totalRays++;
    }
  });

  document.getElementById('i-r').textContent = totalRays;
}

// ─── TRACE WITH EXPLICIT COLOUR (wraps trace logic, colour-aware) ──────────
function traceColoured(origin, dir, col, opacity) {
  const { el, R, n } = S;
  const REACH = 7.5;

  if (el === 'rough') {
    const t = -origin.x / dir.x;
    if (t <= 0.001) { drawRay(origin, origin.clone().addScaledVector(dir, REACH), col, opacity); return; }
    const hit = origin.clone().addScaledVector(dir, t);
    drawRay(origin, hit, col, opacity);
    for (let k = 0; k < 3; k++) {
      const rd = new THREE.Vector3(
        -Math.abs(Math.random() * 0.6 + 0.4),
        (Math.random() - .5) * 1.6,
        (Math.random() - .5) * 0.8
      ).normalize();
      drawRay(hit, hit.clone().addScaledVector(rd, 2.0 + Math.random() * 2), C_REF, opacity * 0.5);
    }
    return;
  }

  if (el === 'planar') {
    if (Math.abs(dir.x) < 1e-5) return;
    const t = -origin.x / dir.x; if (t <= 0.001) return;
    const hit = origin.clone().addScaledVector(dir, t);
    if (Math.abs(hit.y) > 2.1 || Math.abs(hit.z) > 2.1) return;
    drawRay(origin, hit, col, opacity);
    const nrm = new THREE.Vector3(-1, 0, 0);
    const refl = reflect(dir, nrm);
    drawRay(hit, hit.clone().addScaledVector(refl, REACH), C_REF, opacity);
    if (S.norm) drawNorm(hit, nrm);
    return;
  }

  if (el === 'concave-mirror' || el === 'convex-mirror') {
    const res = mirrorIntersect(origin, dir);
    if (!res) return;
    drawRay(origin, res.point, col, opacity);
    const refl = reflect(dir, res.normal);
    drawRay(res.point, res.point.clone().addScaledVector(refl, REACH), C_REF, opacity);
    if (S.norm) drawNorm(res.point, res.normal);
    return;
  }

  if (el === 'convex-lens' || el === 'concave-lens') {
    const isConvex = el === 'convex-lens';
    const f = computeFocalLength();
    if (Math.abs(dir.x) < 1e-5) return;
    const t = -origin.x / dir.x; if (t <= 0.001) return;
    const hit = origin.clone().addScaledVector(dir, t);
    if (Math.sqrt(hit.y * hit.y + hit.z * hit.z) > APR * 0.97) return;
    drawRay(origin, hit, col, opacity);
    let exitDir;
    if (isConvex) {
      const fp = new THREE.Vector3(f, f * (dir.y / dir.x), f * (dir.z / dir.x));
      exitDir = fp.clone().sub(hit).normalize();
    } else {
      const vf = new THREE.Vector3(-f, -f * (dir.y / dir.x), -f * (dir.z / dir.x));
      exitDir = hit.clone().sub(vf).normalize();
    }
    drawRay(hit, hit.clone().addScaledVector(exitDir, REACH), C_RFR, opacity);
  }
}

// ─── REBUILD ─────────────────────────────────────────────
function rebuild() {
  buildGrid();
  buildElement();
  buildRays();
  const f = computeFocalLength();
  document.getElementById('i-f').textContent = f>0 ? f.toFixed(2) : '—';
  document.getElementById('i-el').textContent = NAMES[S.el];
}

// ─── UI BINDINGS ─────────────────────────────────────────

// Section collapse/expand
//华仁中学蔡逸众制作
document.querySelectorAll('.sec-t').forEach(title => {
  title.addEventListener('click', () => {
    const id = title.dataset.sec;
    const body = document.getElementById(id);
    const isCollapsed = body.classList.contains('collapsed');
    body.classList.toggle('collapsed');
    title.classList.toggle('collapsed');

// Whole panel toggle
document.getElementById('ctrl-header').addEventListener('click', () => {
  document.getElementById('ctrl-body').classList.toggle('collapsed');
  document.getElementById('ctrl-toggle').classList.toggle('collapsed');
});

document.querySelectorAll('.eb').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.eb').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    S.el = b.dataset.el;
    rebuild();
  });
});

function bind(sid, vid, key, fmt=v=>v) {
  document.getElementById(sid).addEventListener('input', e => {
    S[key] = parseFloat(e.target.value);
    if (vid) document.getElementById(vid).textContent = fmt(S[key]);
    rebuild();
  });
}
bind('s-angle','v-angle','angle', v=>`${v}°`);
bind('s-spread','v-spread','spread', v=>v.toFixed(1));
bind('s-R','v-R','R', v=>v.toFixed(1));
bind('s-d','v-d','d', v=>v.toFixed(2));
bind('s-n','v-n','n', v=>v.toFixed(2));

[['c-grid','grid'],['c-focal','focal'],['c-norm','norm'],['c-axis','axis']].forEach(([id,k]) => {
  document.getElementById(id).addEventListener('change', e => {
    S[k] = e.target.checked;
    id==='c-grid' ? (gridGrp.visible=e.target.checked) : rebuild();
  });
});

document.querySelectorAll('.vbtn').forEach(b => {
  b.addEventListener('click', () => {
    const p = {front:[0,0,13], side:[13,0,0], top:[0,13,.01], iso:[5,3.5,10]};
    const tgt = new THREE.Vector3(...p[b.dataset.v]);
    const s = camera.position.clone(), t0 = performance.now();
    (function step() {
      const t=Math.min(1,(performance.now()-t0)/800), e=t<.5?2*t*t:-1+(4-2*t)*t;
      camera.position.lerpVectors(s,tgt,e); controls.update();
      if(t<1) requestAnimationFrame(step);
    })();
  });
});

window.addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  composer.setSize(innerWidth,innerHeight);
});

// ─── RENDER LOOP ─────────────────────────────────────────
//峇株吧辖蔡逸众制作
let ft=performance.now(), ff=0;
(function loop() {
  requestAnimationFrame(loop);
  controls.update();
  composer.render();
  if (++ff, performance.now()-ft > 600) {
    document.getElementById('fps').textContent=`${Math.round(ff*1e3/(performance.now()-ft))} FPS`;
    ft=performance.now(); ff=0;
  }
})();

rebuild();
